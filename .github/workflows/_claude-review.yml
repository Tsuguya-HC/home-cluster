name: AI review (reusable)

# The reviewer itself. Called only from claude-review.yml, which pins this file
# to @main — so everything below is read from the default branch regardless of
# what the PR under review contains. That is the point: the reviewer's model,
# tool allow-list, prompt and action version cannot be rewritten by the change
# it is reviewing, and bumping any of them does not make the caller (the file
# claude-code-action validates) differ from main.
#
# Renovate's action bumps land here. The caller stays frozen.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token used by claude-code-action"
        required: true

permissions: {}

jobs:
  review:
    # The caller job is already named "AI review"; a reusable check renders as
    # "<caller job> / <callee job>", so keep this one short.
    name: review
    # Not the whole gate: what this reviewer is for is narrowed again by the
    # first step below, which needs the PR's changed files — something no `if:`
    # expression can read.
    if: >-
      contains(fromJSON('["renovate[bot]", "tsuguya-home-cluster[bot]"]'),
               github.event.pull_request.user.login) &&
      !contains(github.event.pull_request.body, '**Automerge**: Enabled') &&
      !contains(github.event.pull_request.title, 'gateway-api')
    runs-on: ubuntu-latest
    # The wait below can idle for up to 20 minutes; this stops a hung review
    # from holding a runner for the default six hours on top of that.
    timeout-minutes: 40
    # These bound `${{ github.token }}` — the steps below that call gh with it,
    # and whatever claude-code-action itself does with it. They do NOT bound
    # the agent: src/entrypoints/run.ts overwrites GITHUB_TOKEN and GH_TOKEN
    # with the App installation token from the OIDC exchange, whose scopes come
    # from that action's DEFAULT_PERMISSIONS merged with `additional_permissions`
    # and nothing here. Narrowing this block does not narrow what Claude can do;
    # `additional_permissions` on the action step is the knob for that.
    permissions:
      contents: write # the reviewer merges the PR it approves
      pull-requests: write # approve and comment; and the gh pr checks call below
      issues: write # PR conversation comments go through the issues API
      id-token: write # mints the App token via OIDC; without it nothing runs at all
      checks: read # gh pr checks below reads the rollup through GraphQL, which
      # returns "Resource not accessible by integration" for a check the token
      # cannot see — and one unreadable check fails the whole query
    steps:
      # What this reviewer can actually do is `helm_values_diff`: render the
      # old and new chart, diff the values schema against ours, and report the
      # keys that disappeared under us. That is evidence the diff does not
      # already contain. Nothing else it is pointed at produces any.
      #
      # Steps 2 through 4 of the prompt below run only when update_type is
      # "helm" — the prompt says so in its own words. The release-notes
      # fallback does not fill the gap either: get_pr_summary resolves an
      # upstream through HELM_CHART_REPOS (.github/mcp/pr-review/src/lib/
      # github.ts), a hardcoded map of chart names, so an image reference never
      # matches it. And a digest bump has no version change, so Renovate writes
      # no release notes in the body to fall back on. What is left is the diff:
      # one line, one digest. SAFE comes back every time. #784 was approved and
      # auto-merge armed four minutes after it opened; #754 merged three Talos
      # extension digests with an approval that only restated the diff.
      #
      # The thing that decides whether those bumps were safe is not in the diff
      # at all — kustomize/taskflow has to name one commit across a remote base
      # `?ref=` and two images (#687), and a Talos extension has to match the
      # release it is installed into, which lives in home-infra. Neither is
      # visible from here, so a green review says nothing about either.
      #
      # The job-level `if:` used to be the only filter, and it selects on
      # "Renovate automerge is off" — a proxy for "a human should look", not
      # for "there is something here to read". So: gate on the chart bump
      # directly.
      #
      # `apps/` is where that lives. One ArgoCD Application per service, and
      # renovate.jsonc points the argocd manager at exactly `/apps/.+\.yaml$/`,
      # so a chart version moving is a change to a file under apps/ and nothing
      # else in the tree is one. Matching on files rather than on the title
      # also catches the grouped PRs whose title never says "Helm release"
      # (#769 and #561 bumped the seaweedfs chart alongside its image).
      #
      # Direction of failure: not reviewing. Every PR that reaches this job has
      # Renovate automerge off, so a skip leaves it open for a human rather
      # than merging it unread — which is what should have happened to #784.
      - name: Skip anything that is not a Helm chart update
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the files live, as dedupe and the CI wait below do. --paginate
          # because `gh pr view --json files` stops at 100.
          files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')
          # A here-string, not `... | grep -q`: grep exits on its first match,
          # which SIGPIPEs the left side, and under `pipefail` that failure
          # would read as "no chart change" and skip a PR that needed review.
          if grep -qE '^apps/.+\.yaml$' <<<"${files}"; then
            echo "::notice::chart version change under apps/ — reviewing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no chart version change under apps/; this reviewer has nothing to read here — leaving it to a human."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # Renovate rebases constantly, so the head SHA is not a stable identity
      # for "this PR was already judged" — PR #487 collected 28 approvals across
      # only 5 distinct SHAs before this guard existed. Auto-merge is the record
      # that survives a rebase: the first review enables it, and GitHub then
      # merges the PR by itself once the required checks are green. A second
      # review cannot make that happen sooner, and re-reviewing a PR that is
      # merely waiting out the 3-day digest cooldown burns a Claude session per
      # rebase for three days.
      #
      # This is deliberately not a correctness risk: auto-merge does not bypass
      # anything. CI Gate and digest-cooldown are re-evaluated against whatever
      # the branch looks like after each rebase, and GitHub refuses the merge
      # until both are green on the current head.
      - name: Skip if this PR has already been judged
        id: dedupe
        if: steps.scope.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          enabled=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
                      --jq '.autoMergeRequest.enabledAt // ""')
          if [ -n "${enabled}" ]; then
            echo "::notice::auto-merge was enabled at ${enabled} — the decision is already made."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Second gate, for the repeats that happen before any decision is
          # reached: 23 of those 28 runs fired against a head that had not moved.
          approved=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
                       --jq "[.[] | select(.user.login == \"claude[bot]\" and .state == \"APPROVED\" and .commit_id == \"${SHA}\")] | length")
          if [ "${approved}" -gt 0 ]; then
            echo "::notice::already approved at ${SHA} — not reviewing again."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Stands in for the `needs: [kubeconform, helm-template, image-existence]`
      # this job had while it lived in lint.yaml. A separate workflow cannot
      # depend on another one's jobs, and this reviewer approves and merges on
      # its own, so it waits for the aggregate gate instead — which is stricter
      # than the old three-job dependency, and is also the check the branch
      # ruleset requires.
      - name: Wait for CI Gate
        id: ci
        if: steps.dedupe.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CHECK: CI Gate
        run: |
          set -euo pipefail
          err="${RUNNER_TEMP}/gh-pr-checks.err"
          for _ in $(seq 1 40); do
            # `gh pr checks` exits non-zero whenever anything is pending or
            # red, which is most of this loop, so the exit status cannot tell
            # "CI is still running" apart from "gh could not reach GitHub".
            # Decide on the output instead: a JSON array means the call worked.
            # Folding both into one empty string is how an expired token used
            # to burn the full 20 minutes here and then report a CI timeout.
            checks=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket 2>"$err") || true
            if ! printf '%s' "${checks}" | jq -e 'type == "array"' >/dev/null 2>&1; then
              if grep -q 'no checks reported' "$err"; then
                sleep 30    # the check does not exist yet — keep waiting
                continue
              fi
              echo "::error::gh pr checks failed: $(tr '\n' ' ' < "$err")"
              exit 1
            fi
            # Every check reported under this name has to be green, not just
            # whichever one the API happened to list first.
            bucket=$(printf '%s' "${checks}" | jq -r --arg name "$CHECK" '
              [.[] | select(.name == $name) | .bucket] as $b
              | if ($b | length) == 0 then ""
                elif ($b | index("pending")) then "pending"
                elif ($b | all(. == "pass")) then "pass"
                else ($b | join(",")) end')
            case "${bucket}" in
              pass)
                echo "proceed=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ""|pending)
                sleep 30
                ;;
              *)
                echo "::notice::${CHECK} concluded '${bucket}' — nothing to review."
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          echo "::error::Timed out after 20 minutes waiting for ${CHECK}."
          exit 1
      # No credential is left behind, and claude-code-action does not want one.
      # Passing a prompt selects its agent mode, where configureGitAuth() runs
      # first and explicitly unsets the http.<server>/.extraheader that
      # actions/checkout installs, then puts its own token in the remote URL.
      #
      # Restore this if the job is ever switched to tag mode (the @claude
      # mention flow): there setupBranch() runs `git fetch` at modes/tag/index.ts
      # before the auth is configured, so it would fetch with no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ci.outputs.proceed == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ci.outputs.proceed == 'true'
        with:
          node-version: "24"
          # lint.yaml's `mcp` job installs the same lock file with this cache
          # on every push to main, and setup-node's key does not include the
          # job, so the entry is already there to be restored.
          cache: npm
          cache-dependency-path: .github/mcp/pr-review/package-lock.json

      - name: Install MCP server dependencies
        if: steps.ci.outputs.proceed == 'true'
        run: npm ci
        working-directory: .github/mcp/pr-review

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        if: steps.ci.outputs.proceed == 'true'
        with:
          aqua_version: v2.62.3

      # Pinned to v1.0.99 — v1.0.100+ has a regression where install.sh
      # silently fails and the SDK can't fall back to its bundled binary.
      # Unpin once anthropics/claude-code-action#1260 lands.
      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        if: steps.ci.outputs.proceed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "renovate[bot],tsuguya-home-cluster[bot]"
          claude_args: "--model claude-sonnet-5 --max-turns 30 --disallowedTools Edit,Write,NotebookEdit,WebFetch,WebSearch,Glob,Grep --allowedTools 'Bash(gh:*)' Read 'mcp__pr-review__*' --mcp-config .github/mcp/pr-review/mcp-config.json"
          prompt: |
            You are reviewing a Renovate dependency update PR for a Kubernetes homelab cluster managed by ArgoCD.

            You have MCP tools for efficient review. Follow this workflow:

            Step 1: Get PR summary
            Use `get_pr_summary` with pr_number=${{ github.event.pull_request.number }} to get structured PR info including update type, package versions, release notes, and affected files.

            Step 1.5: Read the change itself
            Run `gh pr diff ${{ github.event.pull_request.number }}` and say, in your review body, which files changed and what each hunk does.
            Steps 2 through 4 below only produce anything when update_type is "helm" — `app_version_change`, `removed_keys` and `impact_on_user_values` come from `helm_values_diff` and do not exist otherwise, and `release_notes_summary` is often "No release notes found" for a digest bump.
            So for anything that is not a helm update, this diff is the only evidence you have. Do not answer SAFE without quoting from it.

            Step 2: If update_type is "helm", run helm values diff
            Use `helm_values_diff` with the chart's repo_url, chart name, old/new versions (from step 1), and user_values_path (from affected_helm_values in step 1).
            This writes detailed diffs to /tmp/pr-review/diff/ — check the summary first.

            Step 3: Check app version change
            If `app_version_change` is present, the underlying application version also changed (e.g., ArgoCD chart bump includes ArgoCD server version bump).
            - Check `app_version_change.level` — major/minor upgrades need careful review
            - If `app_version_change.release_notes_file` exists, use `Read` on `/tmp/pr-review/app-release-notes.md` for upstream release notes
            - This is often where breaking changes actually live (chart changes are usually just values, app changes affect behavior)

            Step 4: Deep dive if needed
            - If removed_keys or impact_on_user_values has entries, use `Read` on the relevant section diff files in /tmp/pr-review/diff/sections/
            - If release_notes_summary mentions breaking/deprecated keywords, use `Read` on /tmp/pr-review/release-notes.md
            - Read the relevant helm-values/ files to verify your understanding

            Step 5: Evaluate
            - No breaking changes affecting our values configuration
            - No deprecated options we currently use
            - No removed keys that we depend on
            - No known critical bugs in the new version

            Decision:
            - SAFE: Run `gh pr review ${{ github.event.pull_request.number }} --approve -b "AI Review: <brief summary of what was checked>"` then `gh pr merge ${{ github.event.pull_request.number }} --squash`
            - CONCERNS: Run `gh pr comment ${{ github.event.pull_request.number }} -b "<your detailed concerns>"` — do NOT approve or merge

name: Digest cooldown

# Renovate's minimumReleaseAge cannot gate docker updates honestly: digests
# expose no releaseTimestamp at all (renovatebot/renovate#38656), and a tag
# bump's timestamp comes from org.opencontainers.image.created, which whoever
# pushed the image controls and can back-date. Both are delegated to this
# action's own clock instead (gate-version-bumps), so renovate.jsonc nulls
# minimumReleaseAge for the docker datasource.
#
# pull_request_target, not pull_request: the workflow definition then comes
# from main, so a PR cannot weaken the gate that is judging it. The action
# never checks out or runs head-side code — it reads the diff over the API.

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  # マージキューの一時 commit にも digest-cooldown を報告する。action は
  # merge_group では diff を再評価せず、PR head で確定済みの status を転記する
  # （キューに入れた時点で head は success 済み、group の digest はその head のもの）。
  merge_group:

permissions: {}

concurrency:
  group: digest-cooldown-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || 'scan' }}
  cancel-in-progress: false

jobs:
  cooldown:
    name: Digest cooldown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write        # post the digest-cooldown commit status
      pull-requests: write   # store first-seen instants in a PR comment
      contents: read         # read the diff
    steps:
      - uses: Tsuguya-HC/digest-cooldown@8cef1af948c0b09c5b1fd900deeb65bb3a7c8ba8 # v1.0.0
        with:
          cooldown-days: 3
          # First-party registries: their digests are built and signed by our
          # own pipeline, so the "detect an upstream compromise" premise the
          # cooldown exists for does not apply.
          skip-registries: registry.infra.tgy.io,ghcr.io/tsuguya
          # Gate tag bumps on our clock too, not just pure digest bumps.
          gate-version-bumps: true
          # The self-hosted Renovate runs as our own GitHub App, so its PRs are
          # NOT authored by renovate[bot]; the action's default would silently
          # degrade every PR to the pure-digest-bump baseline.
          gate-authors: tsuguya-home-cluster[bot]
          # Report success on PRs with nothing to gate so this status can be a
          # required check without deadlocking unrelated PRs.
          always-report: true
          # Escape hatch. Not a security boundary — anyone who can label a PR
          # can use it — but an auditable one: exactly one label designates a
          # bypass, so a label search finds every PR that took it, and each use
          # is logged as a notice in the run.
          #
          # The case it exists for is a pin whose digest is already what the
          # tag resolves to. Pinning it records what every new pull would fetch
          # anyway, so waiting out the cooldown buys nothing: the exposure is
          # identical pinned or not. A digest *bump* is the opposite and should
          # keep soaking.
          #
          # First-seen instants are never reset, so removing the label resumes
          # the original cooldown rather than restarting it. The triggers above
          # already include labeled/unlabeled, which is what makes the status
          # re-evaluate when the label goes on or off.
          #
          # bypass-requires-status is deliberately left unset: it gates the
          # bypass on a provenance-verify status, and nothing here posts one.
          bypass-label: digest-cooldown-bypass

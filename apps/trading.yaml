apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading
  namespace: argocd
  annotations:
    # Being handed over to another app-of-apps: keep the Application when this
    # file is removed, and do not hold app-of-apps OutOfSync over it meanwhile.
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  project: apps
  source:
    # マニフェストは private リポに置く。CNP の egress ルールが取引先と
    # データソースを列挙するため、ここには出さない。
    repoURL: https://github.com/Tsuguya-HC/home-trading.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

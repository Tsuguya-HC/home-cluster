global:
  logging:
    format: json
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # chart 10.0.0 flips this to true. This namespace is governed by the
  # CiliumNetworkPolicies in manifests/argocd/, and the chart's own policies
  # would layer a second, coarser deny on top of them.
  networkPolicy:
    create: false

controller:
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 3Gi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

configs:
  cm:
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    admin.enabled: "false"
    resource.customizations.health.postgresql.cnpg.io_Cluster: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase == "Cluster in healthy state" then
          hs.status = "Healthy"
          hs.message = obj.status.phase
          return hs
        end
        if obj.status.phase == "Cluster in degraded state" then
          hs.status = "Degraded"
          hs.message = obj.status.phase
          return hs
        end
        if obj.status.conditions ~= nil then
          for _, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.reason
                return hs
              elseif condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.reason
                return hs
              end
            end
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for cluster to be ready"
      return hs
    accounts.cluster-bot: apiKey
    url: https://argocd.infra.tgy.io
    oidc.config: |
      name: Kanidm
      issuer: https://idm.tgy.io/oauth2/openid/argocd
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
  rbac:
    policy.csv: |
      p, role:owner, applications, *, */*, allow
      p, role:owner, applicationsets, *, */*, allow
      p, role:owner, clusters, *, *, allow
      p, role:owner, repositories, *, *, allow
      p, role:owner, certificates, *, *, allow
      p, role:owner, accounts, *, *, allow
      p, role:owner, gpgkeys, *, *, allow
      p, role:owner, logs, get, */*, allow
      p, role:owner, exec, create, */*, allow
      p, role:owner, projects, *, *, allow
      p, role:owner, extensions, invoke, *, allow
      p, role:owner, applications, delete, storage/*, deny
      p, role:owner, applications, delete, platform/*, deny
      p, role:owner, applications, delete, security/*, deny
      p, role:readonly, applications, get, */*, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, logs, get, */*, allow
      p, role:readonly, exec, create, */*, deny
      p, role:cluster-bot, applications, get, */*, allow
      p, role:cluster-bot, applications, sync, */*, allow
      p, role:cluster-bot, applications, action/*, */*, allow
      p, role:cluster-bot, applications, delete, */*, deny
      p, role:cluster-bot, projects, get, *, allow
      p, role:cluster-bot, logs, get, */*, allow
      g, cluster-bot, role:cluster-bot
      g, tsuguya.toma@tgy.io, role:owner
    policy.default: ""
    scopes: "[email]"
  params:
    server.insecure: "false"

dex:
  enabled: false

repoServer:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 1Gi
  livenessProbe:
    enabled: false

redis:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

server:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  certificate:
    enabled: true
    domain: argocd.infra.tgy.io
    issuer:
      kind: ClusterIssuer
      name: letsencrypt-prod
  httproute:
    enabled: false
  grpcroute:
    enabled: false

notifications:
  context:
    argocdUrl: https://argocd.infra.tgy.io
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  secret:
    create: false
  notifiers:
    service.webhook.discord: |
      url: $url
      headers:
        - name: Content-Type
          value: application/json
    service.webhook.horenso: |
      url: http://horenso.horenso.svc.cluster.local:3000/events/argocd
      headers:
        - name: Content-Type
          value: application/json
    service.webhook.argo-events: |
      url: http://argocd-deployed-eventsource-svc.argo.svc.cluster.local:12003/deployed
      headers:
        - name: Content-Type
          value: application/json
  subscriptions:
    - recipients:
        - discord
        - horenso
      triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
  triggers:
    trigger.on-sync-succeeded: |
      - description: Application syncing has succeeded
        send:
          - app-sync-succeeded
        when: app.status.operationState.phase in ['Succeeded']
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send:
          - app-sync-failed
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: Application has degraded
        send:
          - app-health-degraded
        when: app.status.health.status == 'Degraded'
    trigger.on-deployed: |
      - description: Application is synced and healthy. Triggered once per commit.
        oncePer: app.status.operationState.syncResult.revision
        send:
          - app-deployed
        when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  templates:
    template.app-sync-succeeded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "embeds": [{
                "title": "{{.app.metadata.name}} synced",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                "color": 1620818,
                "fields": [
                  {"name": "Sync Status", "value": "{{.app.status.sync.status}}", "inline": true},
                  {"name": "Revision", "value": "{{.app.status.sync.revision | trunc 7 }}", "inline": true}
                ]
              }]
            }
        horenso:
          method: POST
          body: |
            {
              "app": "{{.app.metadata.name}}",
              "event": "sync-succeeded",
              "sync_status": "{{.app.status.sync.status}}",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
            }
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "embeds": [{
                "title": "{{.app.metadata.name}} sync failed",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true",
                "color": 15298678,
                "fields": [
                  {"name": "Error", "value": {{.app.status.operationState.message | trunc 500 | toJson}}, "inline": false}
                ]
              }]
            }
        horenso:
          method: POST
          body: |
            {
              "app": "{{.app.metadata.name}}",
              "event": "sync-failed",
              "sync_status": "Failed",
              "message": {{.app.status.operationState.message | trunc 500 | toJson}},
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true"
            }
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {
              "embeds": [{
                "title": "{{.app.metadata.name}} health degraded",
                "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
                "color": 16040976,
                "fields": [
                  {"name": "Health", "value": "{{.app.status.health.status}}", "inline": true}
                ]
              }]
            }
        horenso:
          method: POST
          body: |
            {
              "app": "{{.app.metadata.name}}",
              "event": "health-degraded",
              "health_status": "{{.app.status.health.status}}",
              "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
            }
    template.app-deployed: |
      webhook:
        argo-events:
          method: POST
          body: |
            {
              "app": "{{.app.metadata.name}}",
              "namespace": "{{.app.spec.destination.namespace}}",
              "revision": "{{.app.status.sync.revision}}",
              "syncStatus": "{{.app.status.sync.status}}"
            }

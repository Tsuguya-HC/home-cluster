crds:
  enabled: true
  keep: true

# chart 既定は prometheus.enabled: true だが servicemonitor/podmonitor はどちらも
# false なので、9402 が Service に出ているだけで誰もスクレイプしていなかった。
# 結果 certmanager_* が Prometheus に 1 つも存在せず、cluster-observe の証明書
# 期限チェックが書かれて以来ずっと空ベクタを受け取って発火し得なかった。
# キーは servicemonitor（小文字）で labels。tetragon の extraLabels とは別名。
prometheus:
  servicemonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true
  logging:
    format: json

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

ipam:
  mode: kubernetes

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 768Mi

operator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

envoy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

# 全エンドポイントを両方向 default deny にする。default モードでは「その方向の
# ルールを持つポリシーに選択されるまで全許可」なので、egress だけ書いた CNP の
# Pod は ingress が静かに開いたままだった（2026-08-29 cnp-check が argo/rss で検出）。
# always なら書き忘れは「開く」でなく「閉じる」側に倒れる。
# cilium-health の疎通は manifests/infra/ccnp-health.yaml で許可している。
policyEnforcementMode: always

extraConfig:
  tofqdns-min-ttl: "30"

encryption:
  enabled: true
  type: wireguard
  # 1.20 で strictMode の下が egress:/ingress: に分割された。旧構造
  # (strictMode.enabled / .cidr を直下) のままだったため、chart bump 以降
  # strict mode が黙って無効になっていた — WireGuard 自体は張れているので
  # `cilium-dbg status` は正常に見えるが、cilium-config に
  # enable-encryption-strict-mode が無く、未暗号化の pod-to-pod egress が
  # そのまま通っていた。
  strictMode:
    egress:
      enabled: true
      cidr: "10.244.0.0/16"
      # routing-mode=tunnel では必須（chart の values.yaml が明記）。
      # 無いと remote node identity を解決できず、正規のトラフィックまで落ちる。
      allowRemoteNodeIdentities: true

gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

hubble:
  enabled: true
  export:
    fileMaxSizeMb: 10
    fileMaxBackups: 5
    static:
      enabled: true
      filePath: /var/run/cilium/hubble/events.log
      allowList:
        - '{"verdict":["DROPPED"]}'
      denyList:
        - '{"ip_version":["IPv6"]}'
      fieldMask:
        - time
        - source
        - destination
        - verdict
        - drop_reason
        - drop_reason_desc
        - l4
        - IP
        - node_name
        - event_type
        - Summary
  metrics:
    enabled:
      - dns:query;ignoreAAAA;labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace,source_workload,destination_workload
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,destination_namespace,source_workload,destination_workload
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 192Mi
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

expose:
  type: clusterIP
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  clusterIP:
    name: harbor
    staticClusterIP: "10.107.133.63"

updateStrategy:
  type: Recreate

externalURL: https://registry.infra.tgy.io

caBundleSecretName: pg-ca-cert

existingSecretAdminPassword: harbor-admin-credentials
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-core-secret

database:
  type: external
  external:
    host: shared-pg-rw.database.svc
    port: "5432"
    username: harbor
    coreDatabase: harbor
    existingSecret: harbor-pg-credentials
    sslmode: verify-full

redis:
  type: internal

persistence:
  enabled: true
  imageChartStorage:
    type: s3
    s3:
      region: us-east-1
      bucket: harbor
      regionendpoint: http://seaweedfs-filer.seaweedfs.svc:8333
      secure: false
      v4auth: true
      existingSecret: harbor-s3-credentials
    disableredirect: true
  persistentVolumeClaim:
    registry:
      storageClass: "-"
    jobservice:
      jobLog:
        storageClass: "-"
    redis:
      storageClass: qnap-nfs
    trivy:
      storageClass: qnap-nfs

trivy:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

core:
  extraEnvVars:
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: harbor-kanidm-oauth
          key: clientSecret
    # CONFIG_OVERWRITE_JSON が入っている間、Harbor は /configurations への PUT を
    # admin にも 403 で拒否する（認証キーだけでなくエンドポイント全体）。この
    # エンドポイントの設定は home-harbor の tofu ではなくここが持ち場になる。
    - name: CONFIG_OVERWRITE_JSON
      value: '{"auth_mode":"oidc_auth","oidc_name":"Kanidm","oidc_endpoint":"https://idm.tgy.io/oauth2/openid/harbor","oidc_client_id":"harbor","oidc_client_secret":"$(OIDC_CLIENT_SECRET)","oidc_scope":"openid,profile,email","oidc_verify_cert":"true","oidc_auto_onboard":"true","oidc_user_claim":"preferred_username","project_creation_restriction":"adminonly"}'
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

portal:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

registry:
  # `registry.resources` はチャートが読まないため、registry / registryctl の
  # 両コンテナが resources: {} （requests も limits も無し）で動いていた。
  # このチャートはコンテナごとに registry.registry / registry.controller で
  # 受ける。実測 (2026-08-22) は registry 26Mi / 7m、registryctl 9Mi / 1m。
  registry:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  controller:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  # 起動から 0〜24h のジッタ後に走る upload purger が、SeaweedFS の S3 を
  # walk する途中で必ず panic してプロセスごと落ちる:
  #
  #   panic: runtime error: index out of range [0] with length 0
  #     storage.getOutstandingUploads.func1  purgeuploads.go:73
  #     ← s3-aws.(*driver).doWalk ← ListObjectsV2Pages
  #
  # exit 2 で死んで再起動、またジッタ後に同じ場所で死ぬ、の繰り返しで
  # 6日半に 339 回再起動していた。落ちるたびに registry.infra.tgy.io が
  # 5xx を返す窓が開き、Kyverno の verify-image-signatures が digest を
  # 解決できず Argo の Renovate ワークフローが弾かれていた。
  #
  # 上流のバグ（docker/distribution の S3 driver と SeaweedFS の
  # ListObjectsV2 レスポンスの相性）なので、こちら側では purger を止める
  # しかない。
  #
  # 代償として、中断したアップロードの断片が S3 の _upload/ に残り続ける。
  # home-harbor の GC は週次で回っている（system.tf, 土 18:00）が、それが
  # 参照されない blob ではなく _upload/ の一時ファイルまで回収するかは
  # 未確認。溜まるようなら別途始末する必要がある。
  upload_purging:
    enabled: false

jobservice:
  jobLoggers:
    - database
  loggerSweeperDuration: 14
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

nginx:
  # 全 push/pull の経路。大きい blob の並列アップロードでスパイクし、
  # 128Mi では OOMKilled した (2026-08-22)
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 512Mi

exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# KubeContainerWaiting は Failed / Succeeded で決着した Pod の中の「起動されなかった
# コンテナ」も waiting として数えるので、chart 同梱版を止めて
# manifests/monitoring/prometheusrule-container-waiting.yaml で置き換えている。
defaultRules:
  disabled:
    KubeContainerWaiting: true

kubeProxy:
  enabled: false

kubeEtcd:
  endpoints:
    - 192.168.10.230
    - 192.168.10.231
    - 192.168.10.232

nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

prometheusOperator:
  logFormat: json
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    # Alertmanager の通知に載る Source リンクは GeneratorURL =
    # externalUrl + /graph?g0.expr=... で組まれる。未設定だと
    # クラスタ内アドレス (svc:9090) になりブラウザから開けない。
    externalUrl: https://prometheus.infra.tgy.io
    externalLabels:
      cluster: home-cluster
    logFormat: json
    enableRemoteWriteReceiver: true
    retention: 14d
    retentionSize: 15GB
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: wn-02
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: qnap-nfs
          resources:
            requests:
              storage: 20Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  rbac:
    extraRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes"]
        verbs: ["list", "watch"]
  # HTTPRoute の status を出す。Gateway API のコントローラ（cilium-operator
  # 内）は起動に失敗しても通常運転に入り、既存の HTTPRoute は Envoy 設定が
  # 残っているので流れ続ける。壊れるのは新規に作った HTTPRoute だけで、
  # status が空になるだけでエラーは出ない。2026-09-14 はこれで 21 時間
  # 気づけなかった（docs/known-issues.md）。
  #
  # status.parents は配列だが、CustomResourceState のパスは [key=value] で
  # 要素を選べるので controllerName で引く（添字 "0" だと parentRef が
  # 増えたときに別のものを見る）。
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
            metricNamePrefix: gatewayapi_httproute
            labelsFromPath:
              namespace: [metadata, namespace]
              httproute: [metadata, name]
            metrics:
              # オブジェクトの存在。status の有無に関わらず必ず出るので、
              # 下の status_condition が「出ない」ことを検出する土台になる。
              #
              # KSM (v2.20.0) は type: Info でも labelsFromPath がリソース
              # レベルではなく each.info 側にないと eachValue を1件も返さない
              # （空の Labels map を len() != 0 で弾く実装のため）。resources
              # レベルの namespace/httproute は返った値に後付けされるだけなので、
              # ここが空だと httproute 名を使っても意味がない。namespace/httproute
              # と重複しない uid を使う。
              - name: info
                help: "HTTPRoute object exists"
                each:
                  type: Info
                  info:
                    path: [metadata]
                    labelsFromPath:
                      uid: [uid]
              - name: status_condition
                help: "HTTPRoute status conditions reported by the Cilium gateway controller"
                each:
                  type: Gauge
                  gauge:
                    path: [status, parents, "[controllerName=io.cilium/gateway-controller]", conditions]
                    labelsFromPath:
                      type: ["type"]
                    valueFrom: ["status"]

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

grafana:
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    dashboards:
      skipReload: true # no reload API call — Grafana's file provisioner polls the directory itself
      watchMethod: WATCH
    datasources:
      skipReload: true
      initDatasources: true
      watchMethod: LIST
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 1Gi
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    security:
      disable_gravatar: true
    log:
      mode: console
    log.console:
      format: json
    database:
      type: postgres
      host: shared-pg-rw.database.svc:5432
      name: grafana
      ssl_mode: verify-full
      ca_cert_path: /etc/ssl/certs/pg-ca.crt
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/pod-resources.json
    server:
      root_url: https://grafana.infra.tgy.io
    auth:
      disable_login_form: true
    auth.basic:
      enabled: false # SSO only; the sidecar reload API that needed this is no longer used
    auth.generic_oauth:
      enabled: true
      name: Kanidm
      scopes: openid profile email groups
      auth_url: https://idm.tgy.io/ui/oauth2
      token_url: https://idm.tgy.io/oauth2/token
      api_url: https://idm.tgy.io/oauth2/openid/grafana/userinfo
      use_pkce: true
      use_refresh_token: true
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      allow_sign_up: true
      auto_login: true
      role_attribute_path: grafana_role
  extraSecretMounts:
    - name: pg-ca-cert
      secretName: pg-ca-cert
      mountPath: /etc/ssl/certs/pg-ca.crt
      subPath: ca.crt
      readOnly: true
  envValueFrom:
    GF_DATABASE_USER:
      secretKeyRef:
        name: grafana-pg-credentials
        key: username
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-pg-credentials
        key: password
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: kanidm-grafana-oauth
        key: clientID
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: kanidm-grafana-oauth
        key: clientSecret
    GF_DISCORD_WEBHOOK_URL:
      secretKeyRef:
        name: discord-webhook-grafana
        key: url
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: discord
          receivers:
            - uid: discord
              type: discord
              settings:
                url: $__env{GF_DISCORD_WEBHOOK_URL}
                use_discord_username: true
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: discord
          group_by: ['grafana_folder', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki-gateway.monitoring.svc:80
      access: proxy
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: '"trace_id":"(\w+)"'
            name: TraceID
            url: ${__value.raw}
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc:3200
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          filterBySpanID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus

alertmanager:
  alertmanagerSpec:
    logFormat: json
    hostNetwork: false
    automountServiceAccountToken: false
    alertmanagerConfiguration:
      name: discord
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

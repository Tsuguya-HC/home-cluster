# KubeContainerWaiting は Failed / Succeeded で決着した Pod の中の「起動されなかった
# コンテナ」も waiting として数えるので、chart 同梱版を止めて
# manifests/monitoring/prometheusrule-container-waiting.yaml で置き換えている。
defaultRules:
  disabled:
    KubeContainerWaiting: true

kubeProxy:
  enabled: false

kubeEtcd:
  endpoints:
    - 192.168.10.230
    - 192.168.10.231
    - 192.168.10.232

nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

prometheusOperator:
  logFormat: json
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    # Alertmanager の通知に載る Source リンクは GeneratorURL =
    # externalUrl + /graph?g0.expr=... で組まれる。未設定だと
    # クラスタ内アドレス (svc:9090) になりブラウザから開けない。
    externalUrl: https://prometheus.infra.tgy.io
    externalLabels:
      cluster: home-cluster
    logFormat: json
    enableRemoteWriteReceiver: true
    retention: 14d
    retentionSize: 15GB
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 200m
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: wn-02
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: qnap-nfs
          resources:
            requests:
              storage: 20Gi

kube-state-metrics:
  # 2026-09-17 時点で 128Mi では足りず、OOMKilled で CrashLoopBackOff に入っていた
  # （3 日で 15 回。#952）。KSM が死ぬと kube_* を見ているアラートとダッシュボードが
  # まとめて無言になるので、落ちていること自体に気づきにくい。
  #
  # 上限を上げた後に実測して確定（2026-09-18、50 分ぶん、再起動 0）:
  # **定常は約 116MiB、周期的に約 136MiB まで跳ねる**
  # （114.8 → 114.8 → 133.5 → 135.8 → 118.9 → 118.1 → 116.5 と推移）。
  # リークではない（伸び続けない）。
  #
  # **古い上限 128Mi は、この定常値とバースト値のちょうど間にあった。** だから
  # 「しばらく動いてから落ちる」を繰り返していた（3 日で 15 回）。跳ねる幅まで含めて
  # 収まる値でないと同じことが起きる。
  #
  # 上げる前に観測できた「定常 15〜17MiB」は誤り — あれは CrashLoop 中の、初期同期が
  # 終わる前に殺された Pod のサンプルだった。**limit に切られていたのは値ではなく
  # 定常状態そのもの**で、上限を外すまで本当の必要量は見えなかった。
  #
  # requests は実測の定常値に合わせる（64Mi では scheduler が 116MiB 使う Pod を
  # 64Mi 扱いでノードに詰めることになる）。limit 512Mi は据え置き — 対象オブジェクト数
  # （replicasets 598 / pods 222 / secrets 199 / configmaps 153）に比例して伸びる性質で、
  # ここが死ぬと kube_* を見ているアラートが全部無言になる（#952）ので余裕を残す。
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  rbac:
    extraRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes"]
        verbs: ["list", "watch"]
  # HTTPRoute の status を出す。Gateway API のコントローラ（cilium-operator
  # 内）は起動に失敗しても通常運転に入り、既存の HTTPRoute は Envoy 設定が
  # 残っているので流れ続ける。壊れるのは新規に作った HTTPRoute だけで、
  # status が空になるだけでエラーは出ない。2026-09-14 はこれで 21 時間
  # 気づけなかった（docs/known-issues.md）。
  #
  # status.parents は配列。controllerName で決め打ちすると、その値を持たない
  # コントローラ（Envoy Gateway 等）の status を拾えない（経緯は
  # docs/known-issues.md の #952）。parents をそのまま展開して controllerName
  # をラベルに出し、条件の値は valueFrom で conditions の中から引く。
  # 2026-09-20 実測（upstream の pkg/customresourcestate を実クラスタの
  # HTTPRoute オブジェクトに対して compile → generate して確認）。多段
  # valueFrom は解決される。status 自体が無いオブジェクトは今までどおり
  # 0 件 + ログ 1 行で、そちらは info との引き算＝HTTPRouteNotAccepted が拾う。
  #
  # conditions は配列なので 1 メトリクスで type ラベルを回すことはできない。
  # 見たい条件ごとにメトリクスを分ける。
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: gateway.networking.k8s.io
              version: v1
              kind: HTTPRoute
            metricNamePrefix: gatewayapi_httproute
            labelsFromPath:
              namespace: [metadata, namespace]
              httproute: [metadata, name]
            metrics:
              # オブジェクトの存在。status の有無に関わらず必ず出るので、
              # 下の accepted が「出ない」ことを検出する土台になる。
              #
              # KSM (v2.20.0) は type: Info でも labelsFromPath がリソース
              # レベルではなく each.info 側にないと eachValue を1件も返さない
              # （空の Labels map を len() != 0 で弾く実装のため）。resources
              # レベルの namespace/httproute は返った値に後付けされるだけなので、
              # ここが空だと httproute 名を使っても意味がない。namespace/httproute
              # と重複しない uid を使う。
              - name: info
                help: "HTTPRoute object exists"
                each:
                  type: Info
                  info:
                    path: [metadata]
                    labelsFromPath:
                      uid: [uid]
              - name: accepted
                help: "HTTPRoute Accepted condition, per gateway controller"
                each:
                  type: Gauge
                  gauge:
                    path: [status, parents]
                    labelsFromPath:
                      controller: [controllerName]
                    valueFrom: [conditions, "[type=Accepted]", status]
              - name: resolvedrefs
                help: "HTTPRoute ResolvedRefs condition, per gateway controller"
                each:
                  type: Gauge
                  gauge:
                    path: [status, parents]
                    labelsFromPath:
                      controller: [controllerName]
                    valueFrom: [conditions, "[type=ResolvedRefs]", status]

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

grafana:
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    dashboards:
      skipReload: true # no reload API call — Grafana's file provisioner polls the directory itself
      watchMethod: WATCH
    datasources:
      skipReload: true
      initDatasources: true
      watchMethod: LIST
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 1Gi
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    security:
      disable_gravatar: true
    log:
      mode: console
    log.console:
      format: json
    database:
      type: postgres
      host: shared-pg-rw.database.svc:5432
      name: grafana
      ssl_mode: verify-full
      ca_cert_path: /etc/ssl/certs/pg-ca.crt
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/pod-resources.json
    server:
      root_url: https://grafana.infra.tgy.io
    auth:
      disable_login_form: true
    auth.basic:
      enabled: false # SSO only; the sidecar reload API that needed this is no longer used
    auth.generic_oauth:
      enabled: true
      name: Kanidm
      scopes: openid profile email groups
      auth_url: https://idm.tgy.io/ui/oauth2
      token_url: https://idm.tgy.io/oauth2/token
      api_url: https://idm.tgy.io/oauth2/openid/grafana/userinfo
      use_pkce: true
      use_refresh_token: true
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      allow_sign_up: true
      auto_login: true
      role_attribute_path: grafana_role
  extraSecretMounts:
    - name: pg-ca-cert
      secretName: pg-ca-cert
      mountPath: /etc/ssl/certs/pg-ca.crt
      subPath: ca.crt
      readOnly: true
  envValueFrom:
    GF_DATABASE_USER:
      secretKeyRef:
        name: grafana-pg-credentials
        key: username
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-pg-credentials
        key: password
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: kanidm-grafana-oauth
        key: clientID
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: kanidm-grafana-oauth
        key: clientSecret
    GF_DISCORD_WEBHOOK_URL:
      secretKeyRef:
        name: discord-webhook-grafana
        key: url
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: discord
          receivers:
            - uid: discord
              type: discord
              settings:
                url: $__env{GF_DISCORD_WEBHOOK_URL}
                use_discord_username: true
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: discord
          group_by: ['grafana_folder', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki-gateway.monitoring.svc:80
      access: proxy
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: '"trace_id":"(\w+)"'
            name: TraceID
            url: ${__value.raw}
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc:3200
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          filterBySpanID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus

alertmanager:
  alertmanagerSpec:
    logFormat: json
    hostNetwork: false
    automountServiceAccountToken: false
    alertmanagerConfiguration:
      name: discord
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

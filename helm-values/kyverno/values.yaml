admissionController:
  replicas: 1
  # このコンポーネントだけ resources をコンテナ単位で受ける
  # (backgroundController などは直下の resources が正しい)。直下にも同じ
  # ブロックが書かれていたがチャートは読んでおらず、container 側だけが
  # 効いていた。残しておくと container 側を消したときに気付かず
  # チャート既定の 256Mi に戻るので、読まれない方を削除する。
  container:
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 50m
        memory: 128Mi

backgroundController:
  enabled: true
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

reportsController:
  enabled: true
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

cleanupController:
  enabled: true
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

features:
  admissionReports:
    enabled: true
  aggregateReports:
    enabled: true
  policyReports:
    enabled: true

webhooksCleanup:
  enabled: true

# private プロジェクト（trading, agents）のタグを digest に解決する（mutateDigest）には
# 認証が要る。署名は public な tools/signatures に置くのでそちらには要らない
# （署名の取得には使われない、kyverno/kyverno#15120）。
# ポリシー側の imageRegistryCredentials ではレジストリクライアントに届かない
# （起動ログの `setup registry client... secrets=` が空のまま）。
# --imagePullSecrets に渡るのはこの値なので、ここで指定する。
# Harbor の system robot robot$verify（trading と agents の pull + read artifact）。
existingImagePullSecrets:
  - harbor-verify

admissionController:
  replicas: 1
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 128Mi
  container:
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 50m
        memory: 128Mi

backgroundController:
  enabled: true
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

reportsController:
  enabled: true
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

cleanupController:
  enabled: true
  replicas: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

features:
  admissionReports:
    enabled: true
  aggregateReports:
    enabled: true
  policyReports:
    enabled: true

webhooksCleanup:
  enabled: true

# 署名検証はレジストリから .sig を引くため、private プロジェクトには認証が要る。
# ポリシー側の imageRegistryCredentials ではレジストリクライアントに届かない
# （起動ログの `setup registry client... secrets=` が空のまま）。
# --imagePullSecrets に渡るのはこの値なので、ここで指定する。
existingImagePullSecrets:
  - harbor-trading-pull

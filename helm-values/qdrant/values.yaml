replicaCount: 1

image:
  useUnprivilegedImage: true

config:
  cluster:
    enabled: false

service:
  type: ClusterIP

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

# `serviceAccount.create: false` はここにあったが、このチャートに create の
# 概念は無く serviceaccount.yaml は無条件で ServiceAccount を作る。書いて
# あると「作っていない」と読めてしまうので消す（実際は作られている）。

# チャート側の条件は `updateVolumeFsOwnership and (not image.useUnprivilegedImage)`。
# 上で useUnprivilegedImage: true にしているので、この値に関わらず
# fsGroup 付け替えの initContainer は出ない。意図の記録として残す。
updateVolumeFsOwnership: false

persistence:
  size: 2Gi
  storageClassName: qnap-nfs

snapshotPersistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5

startupProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

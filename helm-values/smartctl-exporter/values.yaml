---
# SSD の SMART 監視。ASint AS606 (CP 3台の SATA M.2) が無名ブランドで耐久性のデータが無く、
# 寿命の予兆を見えるようにするために導入した。
# 背景: S100 の UFS は温度も寿命も一切測れず、壊れて初めて分かる状態だった。
# image は chart の appVersion に従う (helm-values は digest ピンの対象外。
# chart の targetRevision を Renovate が更新する運用)

# CP にも配置する (監視対象は CP の SATA SSD が主目的)
tolerations:
  - effect: NoSchedule
    operator: Exists

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Prometheus の serviceMonitorSelector / ruleSelector は release ラベルで絞っているため、
# extraLabels で付けないと作成されても一切拾われない。
serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack

# chart 同梱のアラート (キーは複数形の prometheusRules)。
# ただし media_errors / available_spare は NVMe 用メトリクスで SATA では発火しない。
# SATA 向けの寿命・故障予兆は manifests/monitoring/prometheusrule-ssd-health.yaml で補う。
prometheusRules:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack

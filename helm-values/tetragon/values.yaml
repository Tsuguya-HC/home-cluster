extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing

tetragon:
  # ノードごとに監視対象の pod 数が違うので、DaemonSet 共通の limit は一番重い
  # ノードに合わせる。wn-03 (64GB、pod 数最多) のピークが 431Mi で 512Mi の 84%
  # に達しており、実際に 2 回 OOMKilled されている。落ちている間はそのノードの
  # 観測に穴が開く。requests も実使用 136〜253Mi を下回っていた。
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  exportDenyList: |-
    {"health_check":true}
    {"namespace":["","cilium","kube-system"]}
  prometheus:
    serviceMonitor:
      enabled: true
      extraLabels:
        release: kube-prometheus-stack

export:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

tetragonOperator:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  prometheus:
    serviceMonitor:
      enabled: true
      extraLabels:
        release: kube-prometheus-stack

extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing

tetragon:
  # ノードごとに監視対象の pod 数が違うので、DaemonSet 共通の limit は一番重い
  # ノードに合わせる。wn-03 (64GB、pod 数最多) のピークが 431Mi で 512Mi の 84%
  # に達しており、実際に 2 回 OOMKilled されている。落ちている間はそのノードの
  # 観測に穴が開く。requests も実使用 136〜253Mi を下回っていた。
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  # export-stdout サイドカーは非 root (65532) で動くので、chart 既定の 600
  # (root:root) だと tetragon.log を開けない。エラーも再起動も出さずに黙って
  # 0 行を吐き続けるため、導入以来イベントが 1 件も Loki に届いていなかった。
  # ファイルは node ローカルの /var/run 配下で Talos にはユーザーシェルもない。
  exportFilePerm: "644"
  # health_check は Tetragon 自身の内部ヘルスチェック用で、Kubernetes の probe とは
  # 無関係。probe は素通りするので binary_regex で個別に落とす。実測 1,028 MiB/日
  # (raw, 6ノード計) のうち smartctl 50.5% / pg_isready 13.5% / runc init 1.6%。
  # いずれも定期的に機械的に起きるものだけで、人間や侵入者の行為は含まれない。
  # postgres 本体や argocd の git は実活動なので残す。
  exportDenyList: |-
    {"health_check":true}
    {"namespace":["","cilium","kube-system"]}
    {"binary_regex":["^/usr/sbin/smartctl$"]}
    {"binary_regex":["/pg_isready$"]}
    {"parent_binary_regex":["/runc$"],"binary_regex":["^/proc/self/fd/"]}
  # 1イベント 3,733 バイトのうち process.pod 823B + parent.pod 約800B が pod
  # メタデータの重複。parent.pod は process.pod とほぼ常に同一なので落とす。
  # イベント自体は捨てないので検知能力は変わらない。
  # node_labels (390B) も冗長だが chart に knob がないため残る。
  fieldFilters: |-
    {"fields":"parent.pod","action":"EXCLUDE"}
  prometheus:
    serviceMonitor:
      enabled: true
      extraLabels:
        release: kube-prometheus-stack

export:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

tetragonOperator:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  prometheus:
    serviceMonitor:
      enabled: true
      extraLabels:
        release: kube-prometheus-stack

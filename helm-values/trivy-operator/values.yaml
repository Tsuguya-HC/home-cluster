operator:
  # `scanJobNamespace: trivy-system` がここにあったが、このチャート
  # (0.35.0) の values にもテンプレートにもそのキーは存在せず、operator の
  # env にも対応するものが無い。scan job は対象 workload と同じ namespace で
  # 走る仕様で、集約する設定は用意されていない。
  # SBOMReport が 491件/246MB で etcd の大半を占めていたため無効化 (2026-08-08)
  # ClusterVulnerabilityReport も併せて無効になるが、workload 単位の
  # VulnerabilityReport は影響なし。SBOM が必要なら Harbor 側で保管する
  sbomGenerationEnabled: false
  # チャートが読むのはここ。以前はトップレベルに書かれていて黙って無視され、
  # 既定の 10 で動いていた（2026-08-22 に wn-03 の NVMe が飽和して発覚。
  # Renovate の Argo Workflow Pod が大量に立ち、その 1.96GB のイメージを
  # 同時 7 本がスキャンのために引いていた）。
  #
  #   $ helm template ... -f helm-values/trivy-operator/values.yaml \
  #       | grep OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT
  #   OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT: "10"   ← 3 が届いていなかった
  scanJobsConcurrentLimit: 3

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 768Mi


trivy:
  ignoreUnfixed: true
  configFile:
    cache:
      backend: memory

nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: var-lib-kubelet
      hostPath:
        path: /var/lib/kubelet
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
    - name: etc-cni-netd
      hostPath:
        path: /etc/cni/net.d/
    - name: lib-systemd
      hostPath:
        path: /lib/systemd
  volumeMounts:
    - name: var-lib-kubelet
      mountPath: /var/lib/kubelet
      readOnly: true
    - name: etc-kubernetes
      mountPath: /etc/kubernetes
      readOnly: true
    - name: etc-cni-netd
      mountPath: /etc/cni/net.d/
      readOnly: true
    - name: lib-systemd
      mountPath: /lib/systemd/
      readOnly: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

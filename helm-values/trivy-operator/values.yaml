operator:
  scanJobNamespace: trivy-system
  # SBOMReport が 491件/246MB で etcd の大半を占めていたため無効化 (2026-08-08)
  # ClusterVulnerabilityReport も併せて無効になるが、workload 単位の
  # VulnerabilityReport は影響なし。SBOM が必要なら Harbor 側で保管する
  sbomGenerationEnabled: false

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 768Mi

scanJobsConcurrentLimit: 3

trivy:
  ignoreUnfixed: true
  configFile:
    cache:
      backend: memory

nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: var-lib-kubelet
      hostPath:
        path: /var/lib/kubelet
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
    - name: etc-cni-netd
      hostPath:
        path: /etc/cni/net.d/
    - name: lib-systemd
      hostPath:
        path: /lib/systemd
  volumeMounts:
    - name: var-lib-kubelet
      mountPath: /var/lib/kubelet
      readOnly: true
    - name: etc-kubernetes
      mountPath: /etc/kubernetes
      readOnly: true
    - name: etc-cni-netd
      mountPath: /etc/cni/net.d/
      readOnly: true
    - name: lib-systemd
      mountPath: /lib/systemd/
      readOnly: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

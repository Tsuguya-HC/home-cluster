# 既定は pod,job も対象で、Argo Workflow / CronJob の使い捨て Pod が Pod ごとに
# スキャンされていた（同じイメージでも Pod が別なら別 Job）。24h で 1,091 Job、
# 各 Job がイメージ層と DB を /tmp に落として捨てるので wn-03 の NVMe に
# 約 3 TB/日の書き込み（2026-08-23、NodeDiskIOSaturation 再発で発覚）。
# replicationcontroller は使っていない。Workflow 用イメージは Harbor 側の
# Trivy でスキャンされるので pod,job を外してもカバレッジは落ちない。
targetWorkloads: "replicaset,statefulset,daemonset,cronjob"

operator:
  # `scanJobNamespace: trivy-system` がここにあったが、このチャート
  # (0.35.0) の values にもテンプレートにもそのキーは存在せず、operator の
  # env にも対応するものが無い。scan job は対象 workload と同じ namespace で
  # 走る仕様で、集約する設定は用意されていない。
  # SBOMReport が 491件/246MB で etcd の大半を占めていたため無効化 (2026-08-08)
  # ClusterVulnerabilityReport も併せて無効になるが、workload 単位の
  # VulnerabilityReport は影響なし。SBOM が必要なら Harbor 側で保管する
  sbomGenerationEnabled: false
  # チャートが読むのはここ。以前はトップレベルに書かれていて黙って無視され、
  # 既定の 10 で動いていた（2026-08-22 に wn-03 の NVMe が飽和して発覚。
  # Renovate の Argo Workflow Pod が大量に立ち、その 1.96GB のイメージを
  # 同時 7 本がスキャンのために引いていた）。
  #
  #   $ helm template ... -f helm-values/trivy-operator/values.yaml \
  #       | grep OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT
  #   OPERATOR_CONCURRENT_SCAN_JOBS_LIMIT: "10"   ← 3 が届いていなかった
  scanJobsConcurrentLimit: 3
  # 脆弱性 DB を持つ trivy server を常駐させ、scan job は client として問い合わせる。
  # Standalone では job ごとに DB (+ Java DB) をダウンロードして捨てていたので、
  # job が増えるほど wn-03 の NVMe 書き込みとレジストリ往復が比例して増えていた。
  # trivy.mode / trivy.serverURL はこのフラグが上書きする（values に書いても無視）。
  # trivy.clientServerSkipUpdate もこの分岐では出力されない (0.35.0 の templates/configmaps/trivy.yaml)
  builtInTrivyServer: true

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 768Mi


trivy:
  ignoreUnfixed: true
  # server の DB キャッシュは再起動時に落とせばよいので emptyDir。
  # PVC にすると既定の qnap-nfs に bbolt (trivy-db) を置くことになる
  storageClassEnabled: false
  server:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: null
        memory: 1Gi
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  configFile:
    cache:
      backend: memory

nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: var-lib-kubelet
      hostPath:
        path: /var/lib/kubelet
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
    - name: etc-cni-netd
      hostPath:
        path: /etc/cni/net.d/
    - name: lib-systemd
      hostPath:
        path: /lib/systemd
  volumeMounts:
    - name: var-lib-kubelet
      mountPath: /var/lib/kubelet
      readOnly: true
    - name: etc-kubernetes
      mountPath: /etc/kubernetes
      readOnly: true
    - name: etc-cni-netd
      mountPath: /etc/cni/net.d/
      readOnly: true
    - name: lib-systemd
      mountPath: /lib/systemd/
      readOnly: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trident-operator
subjects:
  - kind: ServiceAccount
    name: trident-operator
    namespace: trident
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: operator.trident.qnap.io
  name: trident-operator
  namespace: trident
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: operator.trident.qnap.io
      name: trident-operator
  template:
    metadata:
      labels:
        app: operator.trident.qnap.io
        name: trident-operator
    spec:
      containers:
        - command:
            - /trident-operator
            - --log-level=info
            - --qts-cgi-image=qnapsystem/qnap-csi-backend-qts-sidecar:v1.6.2@sha256:bf3b861cc49c72f25c5f39f7e750687d4886bee99f643e1401cd8bd119357aef
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: trident-operator
          image: qnapsystem/qnap-csi-operator:v1.6.2@sha256:1269a7bf04496f2eb0f99662e3028bf9acba48f24d82f60370b22a0e7691b147
          imagePullPolicy: IfNotPresent
          name: trident-operator
          resources:
            requests:
              cpu: "10m"
              memory: "40Mi"
            limits:
              cpu: "20m"
              memory: "80Mi"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
                      - amd64
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      serviceAccountName: trident-operator
---
apiVersion: trident.qnap.io/v1
kind: TridentOrchestrator
metadata:

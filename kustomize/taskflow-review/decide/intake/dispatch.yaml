# Task の spec.flow と名前は RBAC では絞れない。flow decide と intake- の名前に限る admission の検査が
# この SA 名で照合しているので、SA 名を変えるときは揃える。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decide-intake
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: decide-intake
rules:
  - apiGroups: ["flow.tgy.io"]
    resources: ["tasks"]
    verbs: ["list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: decide-intake
subjects:
  - kind: ServiceAccount
    name: decide-intake
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: decide-intake
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: decide-intake
spec:
  schedule: "5-59/10 * * * *"
  # 止めるときはここを true にして push する（kubectl patch は selfHeal が戻す）。
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            decide-intake: "true"
        spec:
          serviceAccountName: decide-intake
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: decide-intake
            - name: lib
              configMap:
                name: decide-lib
            - name: github-gateway-key
              secret:
                secretName: github-gateway-client-keys
                items:
                  - key: taskflow-decide-intake
                    path: key
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
          containers:
            - name: dispatch
              image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:aaf50f2677b5089678e8633d7f749f9d1009321fdc1fa9ae9fb9bceaed7a6bbd
              command: [sh, /script/dispatch.sh]
              env:
                - {name: HOME, value: /tmp}
                # 前へ動かすと、それまでに作られた issue に遡って作る。
                - {name: NOT_BEFORE, value: "2026-10-19T05:00:00Z"}
                # decide の Task の TTL（成功・失敗とも）より短く。長いと Task が消えた issue にもう一度作る。
                - {name: WINDOW_SECONDS, value: "86400"}
                - {name: MAX_PER_RUN, value: "2"}
                - {name: MAX_PER_DAY, value: "60"}
                # flow の起票 App の bot ユーザーの id（App ID ではない）。
                - {name: ISSUER_USER_ID, value: "334165112"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: script, mountPath: /script, readOnly: true}
                - {name: lib, mountPath: /decide-lib, readOnly: true}
                - {name: github-gateway-key, mountPath: /github-gateway-key, readOnly: true}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: decide-intake
spec:
  endpointSelector:
    matchLabels:
      decide-intake: "true"
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            io.kubernetes.pod.namespace: llm-gateway
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP

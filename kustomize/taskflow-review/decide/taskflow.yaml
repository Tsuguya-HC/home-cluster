apiVersion: flow.tgy.io/v1alpha1
kind: TaskFlow
metadata:
  name: decide
spec:
  profile: investigate
  start: 判断
  workspace: {}
  ttl:
    succeeded: 168h
  bindings:
    判断:
      handler: decide
      next:
        完了: decided
        # ディレクトリは判断役のランナーが、名前とディレクトリは判断から implement の Task を作るスクリプトが
        # 照合している。変えるときは揃える（ずれると黙って flow に流れなくなる）。
        流す: flow
        TaskFailed: fail
  terminals:
    完了: Success
    流す: Success
---
apiVersion: flow.tgy.io/v1alpha1
kind: TaskFlow
metadata:
  name: eval
spec:
  profile: investigate
  start: 評価
  workspace: {}
  ttl:
    succeeded: 168h
  bindings:
    評価:
      handler: decide-eval
      next:
        完了: evaluated
        TaskFailed: fail
  terminals:
    完了: Success

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Kata を使わない版（implement-fast）。VM の中の特権（mkfs / mount）が使えないので、
# スクラッチは emptyDir にし、root に残すのは 65533 へ降りるのと所有者を渡すのに要る
# capability だけにする。それ以外の作業が 65533 で動くのは Kata 版と同じ。
# limits.cpu は全コンテナから外す — base の値は Kata の VM サイズを決めるためのもので、
# runc ではそのままホストの CFS quota になる。
patches:
  - target:
      kind: TaskHandler
    patch: |-
      - op: remove
        path: /spec/jobTemplate/template/spec/runtimeClassName
      - op: test
        path: /spec/jobTemplate/template/spec/volumes/4/name
        value: scratch
      - op: replace
        path: /spec/jobTemplate/template/spec/volumes/4
        value:
          name: scratch
          # ノードのディスクを使うので上限を付ける。
          emptyDir: {sizeLimit: 20Gi}
      - op: test
        path: /spec/jobTemplate/template/spec/initContainers/0/name
        value: parts
      - op: remove
        path: /spec/jobTemplate/template/spec/initContainers/0/resources/limits/cpu
      - op: test
        path: /spec/jobTemplate/template/spec/initContainers/1/name
        value: github-key
      - op: remove
        path: /spec/jobTemplate/template/spec/initContainers/1/resources/limits/cpu
      - op: test
        path: /spec/jobTemplate/template/spec/initContainers/2/name
        value: postgres
      - op: remove
        path: /spec/jobTemplate/template/spec/initContainers/2/resources/limits/cpu
      - op: test
        path: /spec/jobTemplate/template/spec/containers/0/name
        value: agent
      - op: remove
        path: /spec/jobTemplate/template/spec/containers/0/volumeDevices
      - op: add
        path: /spec/jobTemplate/template/spec/containers/0/volumeMounts/-
        value: {name: scratch, mountPath: /scratch}
      - op: replace
        path: /spec/jobTemplate/template/spec/containers/0/securityContext
        value:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
      - op: remove
        path: /spec/jobTemplate/template/spec/containers/0/resources/limits/cpu

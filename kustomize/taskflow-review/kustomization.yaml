apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claude-code-build

# implement flow の実装とレビュー（#1081）。観点ごとの枝は base の 1 つの形をフェーズ違いで並べる。
# 実行して判定する仕分けと検証は judge の形、実装と修正は implement の形を、それぞれフェーズ違いで
# 並べる。flow の配線は manifests/claude-code-build の TaskFlow implement。
resources:
  - common.yaml
  - planner/handler.yaml
  - roles/general
  - roles/documented
  - roles/tests
  - roles/failpath
  - roles/boundary
  - roles/runtime
  - roles/states
  - roles/precedent
  - roles/ui
  - judge/triage
  - judge/verify
  - implement/writer
  - implement/fixer
  - filer/handler.yaml

# TaskHandler は CRD なので、kustomize は中の ConfigMap 参照を書き換えない。
# ハッシュを付けると参照が切れる。
configMapGenerator:
  - name: review-planner
    files:
      - planner/plan.py
      - planner/roles.json
    options:
      disableNameSuffixHash: true
  - name: review-scripts
    files:
      - scripts/fetch-pr.sh
    options:
      disableNameSuffixHash: true

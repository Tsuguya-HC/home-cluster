# レビューの仕分け（#1081）。観点ごとの報告を読み、指摘ごとに前提を確かめ、実行して再現できた
# ものだけを実装フェーズへ差し戻す。レビュアーは読むだけなので、ここが唯一の実測の場になる。
# だから観点の枝と違い、ビルドとテストを回せる実行環境（Block スクラッチ・依存の取得・PG）を持つ。
#
# **agent コンテナに GitHub の鍵を渡さないこと。** clone と PR・issue の取得は fetch init が済ませ、
# agent はそれを Block スクラッチへ写して使う。作業ツリーの変更は PR に載らない（push しない）。
apiVersion: flow.tgy.io/v1alpha1
kind: TaskHandler
metadata:
  name: review-triage
spec:
  phase: 仕分け
  runner:
    type: Job
  # 指摘ごとに再現のビルドとテストを回す。Rust のフルビルドだけで 20 分前後かかる。
  timeout: 60m
  maxInfraRetries: 1
  workspace:
    volume: flow-workspace
    mountPath: /workspace
  jobTemplate:
    template:
      metadata:
        labels:
          taskflow-review-triage: "true"
      spec:
        restartPolicy: Never
        runtimeClassName: kata
        serviceAccountName: agent-reviewer
        automountServiceAccountToken: false
        # TERM 後の sync（NFS 越し）に猶予を残す。
        terminationGracePeriodSeconds: 60
        # runAsUser は必須（taskflow のコントローラが Job 構築時に検査する）。agent は Block
        # スクラッチの mkfs と mount のために root で起動し、作業は 65533 に降りて行う。
        securityContext:
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
        # ビルドで CPU を使い切るので、LLM バッチの Pod と同居しない。
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      workload-class: cpu-saturating
                  namespaceSelector: {}
                  topologyKey: kubernetes.io/hostname
        volumes:
          - name: tmp
            emptyDir: {}
          - name: pgdata
            emptyDir: {}
          - name: parts
            emptyDir: {}
          - name: scripts
            configMap:
              name: review-scripts
          # Block スクラッチ。virtiofs を通らない唯一の経路で、FS はゲスト内にある。
          # Pod と同じ寿命（消えるときに PVC ごと消える）。
          - name: scratch
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  storageClassName: qnap-iscsi
                  volumeMode: Block
                  resources:
                    requests:
                      storage: 20Gi
          # 呼び出し元鍵。**GitHub の資格情報ではない** — gateway が installation token に
          # 付け替える。init にだけマウントする。
          - name: github-gateway-key
            secret:
              secretName: github-gateway-client-keys
              defaultMode: 0444
              items:
                - key: taskflow-review
                  path: key
        initContainers:
          - name: parts
            image: registry.infra.tgy.io/tools/claude-code:latest@sha256:960f3d3e88c28add4d14787303df9a78936fe75128c8e88c0aad1b3078e0f546
            command: [sh, -c]
            args:
              - GH_ENTERPRISE_TOKEN=$(cat /github-gateway-key/key) exec parts -s review-triage -c verdict-protocol -c untrusted-input -c build-sandbox
            env:
              - name: HOME
                value: /tmp
              - name: PARTS_REF
                valueFrom:
                  configMapKeyRef:
                    name: parts-ref
                    key: sha
              - {name: GH_HOST, value: gh-ro.infra.tgy.io}
            securityContext:
              runAsUser: 65533
              runAsGroup: 65533
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            volumeMounts:
              - {name: parts, mountPath: /parts}
              - {name: tmp, mountPath: /tmp}
              - {name: github-gateway-key, mountPath: /github-gateway-key, readOnly: true}
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              # Kata では全コンテナに limits.cpu が無いと、agent の cpu limit が VM サイズに
              # 伝わらない。
              limits: {cpu: 500m, memory: 256Mi}
          - name: fetch
            image: registry.infra.tgy.io/tools/claude-code:latest@sha256:960f3d3e88c28add4d14787303df9a78936fe75128c8e88c0aad1b3078e0f546
            command: [sh, /etc/review-scripts/fetch-pr.sh]
            env:
              - name: HOME
                value: /tmp
            securityContext:
              runAsUser: 65533
              runAsGroup: 65533
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            volumeMounts:
              - {name: tmp, mountPath: /tmp}
              - {name: scripts, mountPath: /etc/review-scripts, readOnly: true}
              - {name: github-gateway-key, mountPath: /github-gateway-key, readOnly: true}
              # 過去の全 run の棚（taskflow ADR-0003）。PR の URL と前の仕分けを読む。
              - {name: flow-workspace, mountPath: /results, subPath: results, readOnly: true}
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: "1", memory: 512Mi}
          # 対象リポの e2e（e2e/run.sh）が使う使い捨ての PostgreSQL。127.0.0.1 だけで待ち受け、
          # 認証は trust。5432 から動かさないこと: 対象リポの component は postgres://*:5432 にしか
          # 繋げない。
          - name: postgres
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            restartPolicy: Always
            command: [docker-entrypoint.sh]
            args: [postgres, -c, listen_addresses=127.0.0.1, -c, fsync=off]
            env:
              - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
              - {name: PGDATA, value: /pgdata/db}
            startupProbe:
              exec:
                command: [pg_isready, -h, 127.0.0.1, -U, postgres]
              periodSeconds: 2
              failureThreshold: 60
            securityContext:
              runAsUser: 70
              runAsGroup: 70
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            volumeMounts:
              - {name: pgdata, mountPath: /pgdata}
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: "1", memory: 512Mi}
        containers:
          - name: agent
            image: registry.infra.tgy.io/tools/claude-code:latest@sha256:960f3d3e88c28add4d14787303df9a78936fe75128c8e88c0aad1b3078e0f546
            workingDir: /workspace
            securityContext:
              # VM の中の特権。ホストには及ばない（containerd が
              # privileged_without_host_devices = true）。mkfs と mount に要る。
              # 作業本体は下で 65533 に降りる。
              privileged: true
              runAsUser: 0
            volumeDevices:
              - name: scratch
                devicePath: /dev/scratch
            volumeMounts:
              - {name: flow-workspace, mountPath: /workspace}
              # この run に至った答え（taskflow ADR-0013 決定6）。合流先なので観点ごとの報告が並ぶ。
              - {name: flow-workspace, mountPath: /inputs, subPath: inputs, readOnly: true}
              - {name: tmp, mountPath: /tmp}
              - {name: parts, mountPath: /parts, readOnly: true}
            command: [bash, -c]
            args:
              - |
                set -eu
                ESCALATE=/workspace/escalate
                # sync は Kata + NFS の workspace PVC に要る。書き戻しを残して exit すると
                # Pod 内の全コンテナが 255 になる。
                give_up() { printf '%s\n' "$1" > "$ESCALATE/report.md"; sync; exit 0; }

                if [ -f /tmp/fetch-error ]; then
                  give_up "$(cat /tmp/fetch-error)"
                fi
                if [ ! -d /tmp/src/.git ] || [ ! -s /tmp/pr.diff ] || [ ! -s /tmp/repo ] || [ ! -s /tmp/pr-number ]; then
                  give_up "取り込み（fetch init）が完了していないか、PR の diff が空。仕分けは行っていない。"
                fi
                REPO=$(cat /tmp/repo)
                PR=$(cat /tmp/pr-number)

                # --- Block スクラッチに作業ツリーを写す -----------------------------
                mkfs.ext4 -q -F -E lazy_itable_init=0,lazy_journal_init=0,root_owner=65533:65533 /dev/scratch \
                  || give_up "Block スクラッチの mkfs に失敗した。仕分けは行っていない。"
                mkdir -p /scratch && mount -o noatime /dev/scratch /scratch \
                  || give_up "Block スクラッチの mount に失敗した。仕分けは行っていない。"
                cp -a /tmp/src /scratch/src \
                  || give_up "作業ツリーを Block スクラッチに写せなかった。仕分けは行っていない。"
                # CARGO_HOME・pnpm store も Block スクラッチに寄せる。イメージの既定の
                # CARGO_HOME は root 所有で 65533 から書けない。
                mkdir -p /scratch/cargo /scratch/xdg-data \
                  && chown -R 65533:65533 /scratch \
                  || give_up "Block スクラッチの準備（所有者の変更）に失敗した。仕分けは行っていない。"
                # 宣言ディレクトリは prepare が敷く。降りた先から書けるように所有者を渡す。
                for d in /workspace/*/; do chown 65533:65533 "$d" 2>/dev/null || true; done

                E2E_DATABASE_URL=
                as_agent() {
                  setpriv --reuid 65533 --regid 65533 --clear-groups --inh-caps=-all --no-new-privs -- \
                    env HOME=/tmp CARGO_HOME=/scratch/cargo XDG_DATA_HOME=/scratch/xdg-data \
                        E2E_DATABASE_URL="$E2E_DATABASE_URL" "$@"
                }
                # setpriv が黙って降格に失敗すると、この後の再現が全部 root で走る。
                ACTUAL_UID=$(as_agent id -u 2>&1) || true
                [ "$ACTUAL_UID" = 65533 ] \
                  || give_up "65533 への降格に失敗した（setpriv が返した uid: ${ACTUAL_UID}）。仕分けは行っていない。"
                as_agent git -C /scratch/src checkout --quiet pr \
                  || give_up "作業ツリーを PR の head に切り替えられなかった。仕分けは行っていない。"

                # e2e/run.sh の有無は PR の head で判定する（checkout の前は base のツリー）。
                if [ -f /scratch/src/e2e/run.sh ]; then
                  E2E_DATABASE_URL="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable"
                fi

                # 404 = 認証が通り、パスにルートが無い（正常）。401 / 500 は配線の問題で、
                # claude を走らせても打ち切りまで何も進まない。
                code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer $ANTHROPIC_AUTH_TOKEN" \
                  "${ANTHROPIC_BASE_URL}/" || true)
                [ "$code" = 404 ] \
                  || give_up "llm-gateway に接続できない（HTTP ${code:-なし}）。仕分けは行っていない。401 はクライアントキー、500 は llm-gateway の SecurityPolicy を確認すること。"

                cd /scratch/src
                # setpriv と env は exec するので、$! は timeout を指す。TERM は timeout 経由で
                # claude に届く。50m は Job の timeout（60m）より短くして、打ち切り後に理由を書く時間を残す。
                as_agent timeout -k 10 50m claude -p "/review-triage ${REPO} の PR #${PR}" \
                  --plugin-dir /parts \
                  --append-system-prompt-file /parts/CLAUDE.md \
                  --verbose \
                  --output-format stream-json \
                  --dangerously-skip-permissions \
                  --allowedTools "Bash,Read,Write,Edit,Grep,Glob" \
                  --model review \
                  --max-turns 200 < /dev/null &
                pid=$!
                # 前面で待つと bash は TERM の trap を claude の終了まで遅らせる。
                # `|| true` は set -e の下で trap を最後まで走らせるのに要る。
                trap 'kill -TERM $pid 2>/dev/null || true
                      i=0
                      while kill -0 $pid 2>/dev/null && [ $i -lt 10 ]; do sleep 1; i=$((i+1)); done
                      kill -KILL $pid 2>/dev/null || true
                      sync || true
                      exit 143' TERM INT
                rc=0
                wait $pid || rc=$?
                echo "claude exited with $rc"
                # 判定はディレクトリで出る。打ち切り（124/137/143）で escalate 以外が全部空の
                # ときだけ、理由を残す。
                case "$rc" in
                  124 | 137 | 143)
                    wrote=
                    for d in /workspace/*/; do
                      [ "$d" = "$ESCALATE/" ] && continue
                      [ -n "$(ls -A "$d" 2>/dev/null)" ] && wrote=1
                    done
                    if [ -z "$wrote" ]; then
                      give_up "claude が 50m で打ち切られた。仕分けの報告は書かれていない。"
                    fi
                    ;;
                esac
                sync
            env:
              - name: ANTHROPIC_BASE_URL
                value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
              # 3 本とも外さないこと。ANTHROPIC_BASE_URL を向けても api.anthropic.com へ
              # 直行する通信がある（#998）。
              - name: DISABLE_TELEMETRY
                value: "1"
              - name: DISABLE_ERROR_REPORTING
                value: "1"
              - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
                value: "1"
              # gateway のクライアントキー。**LLM の資格情報ではない。**
              - name: ANTHROPIC_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-gateway-client-keys
                    key: taskflow-review
              # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
              - name: ANTHROPIC_API_KEY
                value: ""
              - name: ANTHROPIC_CUSTOM_HEADERS
                value: "x-tf-handler: taskflow-review-triage"
              # サブエージェントは親のモデルを継がない。固定しないと gateway にルートが無い。
              - name: CLAUDE_CODE_SUBAGENT_MODEL
                value: review
              # go のモジュール取得先は開けていない。取りに行くと失敗ではなくハングする。
              - name: GOPROXY
                value: "off"
              - name: GOTOOLCHAIN
                value: local
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                # Kata では limits がそのまま VM のサイズ。
                cpu: "4"
                memory: 8Gi

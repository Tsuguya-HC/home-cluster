apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# taskflow のコントローラ本体は Tsuguya-HC/taskflow リポの config/default（CRD・RBAC・
# Deployment）をそのまま remote base として取り込む。home-cluster 側が持つのは
# イメージの差し替えとクラスタ固有の patch だけ（設計 §14: 「どう動くか」は taskflow、
# 「何ができるか」は home-cluster）。
#
# ref は commit SHA でのピン。git-refs で main の HEAD を追わせると CRD だけがイメージより
# 先に進む（ビルド完了前に digest が動く）ため、CRD / RBAC が変わったときに、下の images の
# digest と同じ commit へ人が揃えて上げる。両者が同じ commit を指しているかの検証は #687。
#
# **この ref を上げるときは .github/schemas/flow.tgy.io/*.json も同じ commit から再生成する。**
#
#   for c in tasks taskflows taskhandlers; do
#     python3 scripts/crd2schema.py ../taskflow/config/crd/bases/flow.tgy.io_$c.yaml .github/schemas/flow.tgy.io
#   done
#
# あれは飾りではなく、_kubeconform.yml が -schema-location で読み込んで manifests/ と apps/ を
# -strict で検査している（manifests/claude-code/ の TaskFlow / Task がこれに掛かる）。再生成を
# 強制する仕組みは無いので、忘れるとミラーだけが古い CRD を語り続ける — 2026-09-05 に実際
# 2 週間ずれており（最後の再生成が #733）、消えたフィールドを使った manifest を -strict が
# 誤って通す状態だった。忘れても CI は緑のままなので、気づく手段はこの行しかない。
#
# 逆方向（イメージが CRD/RBAC より先に進む）のドリフトも構造的に起こりうる。Argo のビルドは
# *.go 等の変更でのみ発火し config/ 単独では発火しないが、kubebuilder では CRD/RBAC が Go の
# マーカーから make manifests で生成されるため、Go 変更と config/default 変更は同一コミットに
# 同居しやすい。つまりコードが変わってイメージだけ自動マージされると、新しいコントローラ
# バイナリが古い CRD/RBAC のまま動く（forbidden エラーに直結する）。対策として renovate.jsonc
# で controller / agent-sidecar の両イメージも automerge: false にし、?ref= と一緒に人が
# 上げる運用にしている（検証は #687）。
#
# この ref は Renovate の kustomize manager に github-tags dep として抽出される（commit SHA
# でも currentValue にそのまま入る＝manager が見ていないから安全、ではない）。GITHUB_COM_TOKEN
# 付きで lookup まで走らせても updates: [] にはなる（実測済み）が、その理由は確定していない —
# 実測時点で upstream (Tsuguya-HC/taskflow) に tag/release が 0 件であることと、versioning が
# semver-coerced で 40 桁の生 SHA を比較可能なバージョンとして解釈できないこと、両方の観測が
# ある。どちらの条件が崩れたとき（タグが増えた時／versioning が変わった時）に何が起きるかは
# 実測していない。この不確実性に賭けず、renovate.jsonc の packageRules で明示的に
# enabled: false にして止めている。
resources:
  - https://github.com/Tsuguya-HC/taskflow//config/default?ref=70f34e22dd47e0d03227f05c6d8cde84679ab7ff

# newTag と digest を分けて併記すると、Renovate の kustomize manager が
# invalid-dependency-specification で抽出を捨て、digest が自動更新されなくなる
# （2026-08-30 のビルドに 3 日間据え置かれた実例あり）。newTag: tag@digest の
# 1 フィールド形式は Renovate 自身が warning で案内している書き方で、レンダリング
# 結果は併記時と同一。
images:
  - name: controller
    newName: registry.infra.tgy.io/tools/taskflow
    newTag: latest@sha256:858f3f85ef320158784925c17a169ef0baf70e48bb7adbd4605b4604cce4c085

patches:
  # 全 namespace restricted 運用に合わせる（config/default の Namespace にはラベルが無い）
  - target:
      kind: Namespace
      name: taskflow-system
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: restricted
  # CPU limit は付けない（CFS throttling 回避、このリポの規約）。memory は scaffold の
  # 128Mi のままで、CRD 3 つを watch するだけのコントローラには足りる。
  - target:
      kind: Deployment
      name: taskflow-controller-manager
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
  # コントローラが全 Job に注入する prepare / publish のイメージ（taskflow #73）。
  # config/default は env SIDECAR_IMAGE を --sidecar-image に渡す形なので、名前で差し替える。
  # digest は renovate.jsonc の regex manager が追う（args 内なので kubernetes manager は見ない）。
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: taskflow-controller-manager
        namespace: taskflow-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: SIDECAR_IMAGE
                    value: registry.infra.tgy.io/tools/agent-sidecar:latest@sha256:7fb0b8c4e74fbdeb576a1bc83be0b4a8ae2cc661fcdecd3ae9efc15a0e59ca0b

  # TaskFlow の構造検査 webhook（taskflow #17 / ADR-0006）。taskflow 側は caBundle を
  # 持たない ValidatingWebhookConfiguration を配るだけなので、埋めるのはこちら —
  # cainjector が manifests/taskflow-system/webhook-cert.yaml の Certificate から
  # CA を読んで caBundle に書き込む。home-cluster で inject-ca-from を使うのはここが
  # 初めてで、cainjector 自体は cert-manager 同梱で既に動いている。
  #
  # sync-wave 1: caBundle が空のまま webhook が有効になると、apiserver が証明書を
  # 検証できず failurePolicy: Fail で TaskFlow の書き込みが全部落ちる。Certificate
  # （wave -4）と Deployment（wave 0）の後に出す。
  - target:
      kind: ValidatingWebhookConfiguration
      name: taskflow-validating-webhook-configuration
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/inject-ca-from: taskflow-system/taskflow-serving-cert
          argocd.argoproj.io/sync-wave: "1"

  # webhook が failurePolicy: Fail になった (taskflow #17 / ADR-0006) ことで、コントローラが
  # 落ちている間は reconcile が遅れるだけでなく TaskFlow の CREATE/UPDATE が拒否される。
  # Deployment には既に --leader-elect が付いており HA 化前提の作りなので replicas を
  # 2 に上げる。メモリは 29Mi/128Mi と余裕があり、ワーカーは 3 台あるので podAntiAffinity
  # (required) で 2 replica を別ノードに分散できる。
  #
  # rollout 戦略も明示する。既定の maxSurge: 25% は replicas 2 では 1 に切り上がり、
  # required な podAntiAffinity と合わさると rollout 中に旧2 + 新1 = 3 Pod が同時に
  # 別ホストを要求する瞬間ができる。ワーカーは 3 台しかないので、Talos のノード drain と
  # rollout が重なると surge Pod が 0/3 nodes are available で Pending になり rollout が
  # 止まる（サービス断ではない — maxUnavailable: 0 なので旧 Pod は残り、PDB が守る
  # 最低 1 replica が webhook に応答し続ける）。maxSurge: 0 にすれば要求は常に既存
  # replica 数（2 台）以下に収まり、3 台目を要求する場面自体が無くなる。
  - target:
      kind: Deployment
      name: taskflow-controller-manager
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: taskflow
                    control-plane: controller-manager
                topologyKey: kubernetes.io/hostname
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

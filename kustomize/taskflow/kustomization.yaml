apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# taskflow のコントローラ本体は Tsuguya-HC/taskflow リポの config/default（CRD・RBAC・
# Deployment）をそのまま remote base として取り込む。home-cluster 側が持つのは
# イメージの差し替えとクラスタ固有の patch だけ（設計 §14: 「どう動くか」は taskflow、
# 「何ができるか」は home-cluster）。ref は commit SHA で固定し Renovate が追う。
resources:
  - https://github.com/Tsuguya-HC/taskflow//config/default?ref=187f5adbd2bcf9e0adfe2f1cb0ffb27b745011ec

images:
  - name: controller
    newName: registry.infra.tgy.io/tools/taskflow
    newTag: latest
    digest: sha256:25b531d9e9dcef30a08fde9e52c34df0cf4b3ef6284ac2fb452f8a91c3105d83

patches:
  # 全 namespace restricted 運用に合わせる（config/default の Namespace にはラベルが無い）
  - target:
      kind: Namespace
      name: taskflow-system
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: restricted
  # CPU limit は付けない（CFS throttling 回避、このリポの規約）。memory は scaffold の
  # 128Mi のままで、CRD 3 つを watch するだけのコントローラには足りる。
  - target:
      kind: Deployment
      name: taskflow-controller-manager
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
  # コントローラが全 Job に注入する prepare / publish のイメージ（taskflow #73）。
  # config/default は env SIDECAR_IMAGE を --sidecar-image に渡す形なので、名前で差し替える。
  # digest は renovate.jsonc の regex manager が追う（args 内なので kubernetes manager は見ない）。
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: taskflow-controller-manager
        namespace: taskflow-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: SIDECAR_IMAGE
                    value: registry.infra.tgy.io/tools/agent-sidecar:latest@sha256:3399fa13ec9be5f8541a5387e005c16b1fe4518ae2c22f8d2d3d640a0686630c

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnp-pair-auditor
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnp-pair-auditor-executor
  namespace: argo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnp-pair-auditor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnp-pair-auditor-executor
subjects:
  - kind: ServiceAccount
    name: cnp-pair-auditor
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnp-pair-auditor
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnp-pair-auditor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnp-pair-auditor
subjects:
  - kind: ServiceAccount
    name: cnp-pair-auditor
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cnp-pair-audit
  namespace: argo
spec:
  activeDeadlineSeconds: 600
  serviceAccountName: cnp-pair-auditor
  entrypoint: main
  templates:
    - name: main
      retryStrategy:
        limit: 2
      metadata:
        labels:
          cnp-pair-audit: "true"
      script:
        image: python:3.14-alpine@sha256:eb2c62658b8d51bff0acc408504b76521d02030de56a8a3c1e830083e89b89d2
        command: [python3]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        source: |
          #!/usr/bin/env python3
          import json, ssl, sys, urllib.request
          from collections import defaultdict

          NSK = 'io.kubernetes.pod.namespace'
          SAK = 'io.cilium.k8s.policy.serviceaccount'
          CLK = 'io.cilium.k8s.policy.cluster'
          BROAD = {'all', 'cluster'}


          SA = '/var/run/secrets/kubernetes.io/serviceaccount'
          CTX = ssl.create_default_context(cafile=f'{SA}/ca.crt')


          def kget(path):
              token = open(f'{SA}/token').read()
              items, cont = [], ''
              while True:
                  req = urllib.request.Request(f'https://kubernetes.default.svc{path}?limit=500&continue={cont}',
                                               headers={'Authorization': f'Bearer {token}'})
                  body = json.load(urllib.request.urlopen(req, context=CTX, timeout=30))
                  items += body['items']
                  cont = body['metadata'].get('continue', '')
                  if not cont:
                      return items


          def match(sel, labels):
              for k, v in (sel.get('matchLabels') or {}).items():
                  if labels.get(k) != v:
                      return False
              for e in sel.get('matchExpressions') or []:
                  k, op, vals = e['key'], e['operator'], e.get('values') or []
                  if op == 'In' and labels.get(k) not in vals: return False
                  if op == 'NotIn' and labels.get(k) in vals: return False
                  if op == 'Exists' and k not in labels: return False
                  if op == 'DoesNotExist' and k in labels: return False
              return True


          def peer_sel(sel, polns):
              # a peer without a namespace key is the policy's own namespace
              if polns is None:
                  return sel
              keys = set((sel.get('matchLabels') or {})) | {e['key'] for e in sel.get('matchExpressions') or []}
              if NSK in keys:
                  return sel
              s = dict(sel); s['matchLabels'] = {**(sel.get('matchLabels') or {}), NSK: polns}
              return s


          PEER_KEYS = {'toEndpoints', 'toEntities', 'toFQDNs', 'toCIDR', 'toCIDRSet', 'toServices', 'toGroups', 'toNodes', 'toRequires',
                       'fromEndpoints', 'fromEntities', 'fromCIDR', 'fromCIDRSet', 'fromGroups', 'fromNodes', 'fromRequires'}


          def ns_admitted(sel, ns):
              if ns is None:
                  return True
              v = (sel.get('matchLabels') or {}).get(NSK)
              if v is not None:
                  return v == ns
              for e in sel.get('matchExpressions') or []:
                  if e['key'] != NSK:
                      continue
                  if e['operator'] == 'In' and ns not in e.get('values', []): return False
                  if e['operator'] == 'NotIn' and ns in e.get('values', []): return False
                  if e['operator'] == 'DoesNotExist': return False
              return True


          def may_overlap(rule, sel, pods):
              # A cluster-wide policy counts only through a running pod it shares with the grant.
              if rule['ns'] is None:
                  return any(match(rule['subj'], p['labels']) and match(sel, p['labels']) for p in pods)
              if not ns_admitted(sel, rule['ns']):
                  return False
              a, b = rule['subj'].get('matchLabels') or {}, sel.get('matchLabels') or {}
              return all(a[k] == b[k] for k in a.keys() & b.keys())

          def ns_values(sel):
              v = (sel.get('matchLabels') or {}).get(NSK)
              if v is not None:
                  return [v]
              for e in sel.get('matchExpressions') or []:
                  if e['key'] == NSK and e['operator'] == 'In':
                      return list(e.get('values') or [])
              return None


          def only_own_ns(sel, ns):
              return ns_values(sel) == [ns]


          def ns_label(sel):
              v = ns_values(sel)
              return ','.join(v) if v else 'any namespace'


          def ports_of(rule):
              out = []
              if rule.get('icmps') and not rule.get('toPorts'):
                  return [('0', None, 'ICMP')]
              for tp in rule.get('toPorts') or []:
                  for p in tp.get('ports') or []:
                      out.append((str(p.get('port', '0')), p.get('endPort'), (p.get('protocol') or 'ANY').upper()))
              return out


          def port_ok(rule_ports, port, name, proto):
              if not rule_ports:
                  return True
              for p, end, pr in rule_ports:
                  if pr not in ('ANY', proto):
                      continue
                  if p == '0' or p == str(port) or (name and p == name):
                      return True
                  if end and p.isdigit() and int(p) <= port <= int(end):
                      return True
              return False


          def main():
              pods = []
              for p in kget('/api/v1/pods'):
                  if p['status'].get('phase') != 'Running' or p['spec'].get('hostNetwork'):
                      continue
                  ns = p['metadata']['namespace']
                  labels = {**(p['metadata'].get('labels') or {}), NSK: ns, CLK: 'default', SAK: p['spec'].get('serviceAccountName', 'default')}
                  cports = [(c['containerPort'], c.get('name'), c.get('protocol', 'TCP'))
                            for ct in p['spec']['containers'] for c in ct.get('ports') or []]
                  pods.append({'ns': ns, 'name': p['metadata']['name'], 'labels': labels, 'ports': cports})
              if not pods:
                  sys.exit('ERROR: no pods listed')

              pols = [(p['metadata']['namespace'], p) for p in kget('/apis/cilium.io/v2/ciliumnetworkpolicies')] + [(None, p) for p in kget('/apis/cilium.io/v2/ciliumclusterwidenetworkpolicies')]
              rules = {'egress': [], 'ingress': []}
              for ns, p in pols:
                  sp = p.get('spec') or {}
                  subj = sp.get('endpointSelector') or {}
                  if ns is not None:
                      subj = peer_sel(subj, ns)
                  name = f"{ns + '/' if ns else 'ccnp/'}{p['metadata']['name']}"
                  for d, pk, ek in (('egress', 'toEndpoints', 'toEntities'), ('ingress', 'fromEndpoints', 'fromEntities')):
                      for r in sp.get(d) or []:
                          rules[d].append({'pol': name, 'ns': ns, 'subj': subj,
                                           'broad': bool(BROAD & set(r.get(ek) or [])) or not PEER_KEYS & set(r),
                                           'peers': [peer_sel(s, ns) for s in r.get(pk) or []], 'ports': ports_of(r)})

              for r in rules['ingress']:
                  for pod in pods:
                      if not match(r['subj'], pod['labels']):
                          continue
                      for p, end, pr in r['ports']:
                          if not p.isdigit() or int(p) == 0:
                              continue
                          hi = int(end) if end and int(end) - int(p) <= 1024 else int(p)
                          for n in range(int(p), hi + 1):
                              cand = (n, None, 'TCP' if pr == 'ANY' else pr)
                              if not any(c[0] == n and c[2] == cand[2] for c in pod['ports']):
                                  pod['ports'].append(cand)

              def allowed(direction, subj_pod, peer_pod, port, pname, proto):
                  for r in rules[direction]:
                      if not match(r['subj'], subj_pod['labels']) or not port_ok(r['ports'], port, pname, proto):
                          continue
                      if r['broad'] or any(match(s, peer_pod['labels']) for s in r['peers']):
                          return True
                  return False

              findings = defaultdict(set)
              checked = 0
              for r in rules['egress']:
                  if not r['peers']:
                      continue
                  clients = [p for p in pods if match(r['subj'], p['labels'])]
                  servers = [p for p in pods if any(match(s, p['labels']) for s in r['peers'])]
                  for client in clients:
                      for server in servers:
                          if client['ns'] == server['ns']:
                              continue
                          for port, pname, proto in server['ports']:
                              if not port_ok(r['ports'], port, pname, proto):
                                  continue
                              checked += 1
                              if not allowed('ingress', server, client, port, pname, proto):
                                  findings[('egress', r['pol'])].add(f"{client['ns']}/{client['name']} -> {server['ns']}/{server['name']}:{port}")
              # Judged from policies, not pods: the clients may not be running at audit time.
              for r in rules['ingress']:
                  servers = [p for p in pods if match(r['subj'], p['labels'])]
                  for sel in r['peers']:
                      for server in servers:
                          for port, pname, proto in server['ports']:
                              if not port_ok(r['ports'], port, pname, proto):
                                  continue
                              if only_own_ns(sel, server['ns']):
                                  continue
                              users = [e for e in rules['egress']
                                       if e['ns'] != server['ns'] and may_overlap(e, sel, pods)
                                       and port_ok(e['ports'], port, pname, proto)
                                       and (e['broad'] or any(match(t, server['labels']) for t in e['peers']))]
                              checked += 1
                              if not users:
                                  findings[('ingress', r['pol'])].add(f"{ns_label(sel)} -> {server['ns']}/{server['name']}:{port}")
              print(f"checked {checked} client/server/port pairs from {len(rules['egress'])} egress and {len(rules['ingress'])} ingress rules")
              if checked == 0:
                  sys.exit('ERROR: nothing checked')
              if not findings:
                  print('no one-sided allows')
                  return
              for (d, pol), pairs in sorted(findings.items()):
                  side = 'egress without server ingress' if d == 'egress' else 'ingress no admitted client uses'
                  print(f"\n{pol}: {side} ({len(pairs)})")
                  for x in sorted(pairs)[:10]:
                      print(f"  {x}")
                  if len(pairs) > 10:
                      print(f"  ... {len(pairs) - 10} more")
              sys.exit(1)


          if __name__ == '__main__':
              main()
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: cnp-pair-audit
  namespace: argo
spec:
  schedules:
    - "30 10 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: cnp-pair-audit

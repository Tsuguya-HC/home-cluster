apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo
spec:
  template:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    metadata:
      labels:
        webhook-receiver: "true"
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    talos-build:
      owner: Tsuguya-HC
      repository: talos-custom-build
      webhook:
        endpoint: /talos-build
        port: "12000"
        method: POST
      events:
        - release
      webhookSecret:
        name: talos-custom-build-github-webhook
        key: credential
      active: false
      contentType: json
    home-infra:
      owner: Tsuguya-HC
      repository: home-infra
      webhook:
        endpoint: /home-infra
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: home-infra-github-webhook
        key: credential
      active: false
      contentType: json
    images:
      owner: Tsuguya-HC
      repository: images
      webhook:
        endpoint: /images
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: images-github-webhook
        key: credential
      active: false
      contentType: json
    memory:
      owner: Tsuguya-HC
      repository: memory
      webhook:
        endpoint: /memory
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: memory-github-webhook
        key: credential
      active: false
      contentType: json
    horenso:
      owner: Tsuguya-HC
      repository: horenso
      webhook:
        endpoint: /horenso
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: horenso-github-webhook
        key: credential
      active: false
      contentType: json
    home-rss:
      owner: Tsuguya-HC
      repository: home-rss
      webhook:
        endpoint: /home-rss
        port: "12000"
        method: POST
      events:
        - pull_request
      webhookSecret:
        name: home-rss-github-webhook
        key: credential
      active: false
      contentType: json
    home-actions:
      owner: Tsuguya-HC
      repository: home-actions
      webhook:
        endpoint: /home-actions
        port: "12000"
        method: POST
      events:
        - pull_request
      webhookSecret:
        name: home-actions-github-webhook
        key: credential
      active: false
      contentType: json
    taskflow:
      owner: Tsuguya-HC
      repository: taskflow
      webhook:
        endpoint: /taskflow
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: taskflow-github-webhook
        key: credential
      active: false
      contentType: json
    renovate-home-cluster:
      owner: Tsuguya-HC
      repository: home-cluster
      webhook:
        endpoint: /renovate-home-cluster
        port: "12000"
        method: POST
      events:
        - push
        - issues
        - pull_request
      webhookSecret:
        name: renovate-home-cluster-webhook
        key: credential
      active: false
      contentType: json
    renovate-home-infra:
      owner: Tsuguya-HC
      repository: home-infra

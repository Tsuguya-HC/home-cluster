apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-digest-auditor
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-digest-auditor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: image-digest-auditor
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-digest-auditor
rules:
  # イメージ参照を読むだけ。Pod だけでは足りない — CronJob は普段 Pod を持たず、
  # 起動が日に一度なら digest が腐っても次の発火まで誰も気付かない。
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [workflowtemplates, clusterworkflowtemplates]
    verbs: [get, list]
  # 検証鍵と署名リポジトリの対応表をポリシーから引くため。鍵をこの監査に
  # 複製すると、片方だけ回した瞬間に「Kyverno は落とすがここは通す」嘘の
  # 監査になる。出所はポリシーひとつに保つ。
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-digest-auditor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-digest-auditor
subjects:
  - kind: ServiceAccount
    name: image-digest-auditor
    namespace: argo
---
# Kyverno の mutateDigest は admission 時に :latest を digest へ解決して Pod spec
# に焼き込む。その artifact を Harbor の retention が消すと、Pod は既存レイヤの
# まま動き続けるが、死んだ瞬間に存在しない digest を要求して復帰不能になる
# (しかも verifyDigest が digest なしの Deployment 更新を拒むので rollout も
# 効かない)。2026-08-19 の memory がこれで 4 時間停止した。
#
# retention を「直近 push 15 件 OR 30 日」に広げ、Renovate に digest をピンさせる
# ようにしたので通常は起きない。ただしどちらも Renovate が回り続けている前提に
# 乗っている。Renovate が 30 日止まれば爆弾は再武装するし、それは PR が出ない
# という「何も起きない」形で進むので気付けない。この監査はその前提が崩れたことを
# 毎日確かめるためにある。
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-digest-audit
  namespace: argo
spec:
  # 到達性プローブは接続不能を確定させるまでに retry を使い切る (実測 110 秒)。
  # 監査そのものは 40 秒程度なので、揺れている側に倒れても収まる余裕を持たせる。
  activeDeadlineSeconds: 900
  serviceAccountName: image-digest-auditor
  entrypoint: main
  templates:
    - name: main
      metadata:
        labels:
          image-digest-audit: "true"
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: HOME
            value: /tmp
          - name: DOCKER_CONFIG
            value: /tmp/docker
          - name: HARBOR_USER
            valueFrom:
              secretKeyRef:
                name: harbor-pull-robot
                key: username
          - name: HARBOR_PASS
            valueFrom:
              secretKeyRef:
                name: harbor-pull-robot
                key: password
        command: [sh, -c]
        args:
          - |
            set -eu

            POLICY=$(kubectl get clusterpolicy verify-image-signatures -o json)

            printf '%s' "$POLICY" | jq -r '
              [.spec.rules[].verifyImages[].attestors[].entries[].keys.publicKeys] | unique
              | if length == 1 then .[0]
                else error("policy carries \(length) distinct public keys; this audit assumes one")
                end
            ' > /tmp/cosign.pub

            # trading はイメージが private なので署名だけ tools/signatures に出して
            # いる (Kyverno が imagePullSecrets を署名取得に使わない kyverno#15120 の
            # 回避)。どのイメージの署名がどこにあるかはルールごとに違うので、対応表も
            # ポリシーから引く。
            printf '%s' "$POLICY" | jq -r '
              .spec.rules[].verifyImages[]
              | [(.imageReferences | join(" ")),
                 ((.skipImageReferences // []) | join(" ")),
                 (.repository // "")] | @tsv
            ' > /tmp/rules.tsv

            # レジストリに届かないことと digest が消えたことは、呼び出し側から
            # 見ると同じ「200 ではない」でしかない。区別せずに報告すると、
            # 数十秒の再起動が「稼働中の全イメージが消えた」という一番強い
            # アラートに化ける。導入時に ingress 許可を入れ忘れていたときが
            # まさにそれで、実在する 3 件が MISSING として報告された。
            #
            # そこで到達性は独立に確かめる。/v2/ はレジストリ API の入口で、
            # 生きていれば 200 か 401 を返す。接続レベルで落ちるなら、その回の
            # 監査は「イメージが消えた」ではなく「何も分からなかった」。
            reachable() {
              probe=$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 10 --max-time 30 \
                --retry 5 --retry-delay 10 --retry-connrefused \
                -u "$HARBOR_USER:$HARBOR_PASS" \
                "https://registry.infra.tgy.io/v2/") || probe="000"
              [ "$probe" = "200" ] || [ "$probe" = "401" ]
            }

            if ! reachable; then
              echo "UNREACHABLE registry.infra.tgy.io does not answer /v2/ after retries."
              echo "            This run proves nothing about any digest — it did not get to ask."
              echo "            Look at harbor before reading anything into it."
              exit 1
            fi

            mkdir -p /tmp/docker
            printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"}}}' \
              "$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)" > /tmp/docker/config.json

            # Pod は status ではなく spec を見る。Kyverno が焼き込んだ digest —
            # kubelet が次に pull しようとする参照 — はそこにあるため。
            #
            # そして Pod だけでは足りない。CronJob は発火の合間 Pod を持たないし、
            # WorkflowTemplate はそもそも Pod を「これから」作る側で、どちらも
            # 参照している digest が消えても、次に動こうとするまで沈黙する。
            {
              kubectl get pods -A --field-selector=status.phase=Running -o json \
                | jq -r '.items[].spec | (.containers + (.initContainers // []))[] | .image'

              kubectl get deployments,statefulsets,daemonsets -A -o json \
                | jq -r '.items[].spec.template.spec | (.containers + (.initContainers // []))[] | .image'

              kubectl get cronjobs -A -o json \
                | jq -r '.items[].spec.jobTemplate.spec.template.spec | (.containers + (.initContainers // []))[] | .image'

              kubectl get workflowtemplates,clusterworkflowtemplates -A -o json \
                | jq -r '.items[].spec.templates[]? | [.container.image?, .script.image?] | .[] | select(. != null)'
            } | { grep '^registry\.infra\.tgy\.io/' || true; } | sort -u > /tmp/images.txt

            echo "auditing $(wc -l < /tmp/images.txt) distinct first-party image reference(s)"
            echo

            FAILED=0
            # タグ判定が何件成立したか。0 件のまま終わるなら、この監査は
            # 「孤児はいない」ではなく「孤児を見る目を失っている」。
            TAGSEEN=0
            TAGBLIND=0
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue

              repo=${ref#registry.infra.tgy.io/}
              repo=${repo%%@*}
              repo=${repo%%:*}
              digest=${ref##*@}

              if [ "$digest" = "$ref" ]; then
                echo "UNPINNED  $ref"
                echo "          no digest in the manifest — Kyverno resolves the tag at admission and"
                echo "          the Pod outlives whatever it resolved to. Pin it, or let Renovate."
                FAILED=1
                continue
              fi

              # 404 は retry されない (curl が再試行するのは接続失敗・タイムアウト・
              # 5xx だけ)。消えた digest は速く落ち、揺れているレジストリだけが粘る。
              code=$(curl -sS -o /dev/null -w '%{http_code}' -I \
                --connect-timeout 10 --max-time 30 \
                --retry 3 --retry-delay 5 --retry-connrefused \
                -u "$HARBOR_USER:$HARBOR_PASS" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://registry.infra.tgy.io/v2/${repo}/manifests/${digest}") || code="000"

              if [ "$code" = "000" ]; then
                # 接続そのものが落ちた。途中でレジストリが落ちた可能性があるので、
                # 残りを MISSING として並べる前に確かめ直す。
                if ! reachable; then
                  echo "UNREACHABLE registry.infra.tgy.io stopped answering partway through."
                  echo "            Findings above this line stand; everything after is unknown."
                  exit 1
                fi
                echo "MISSING   $ref"
                echo "          the registry is up but this request failed at the connection level."
                FAILED=1
                continue
              fi

              if [ "$code" != "200" ]; then
                echo "MISSING   $ref"
                echo "          registry answers ${code}. This Pod is running on cached layers and"
                echo "          cannot restart. Roll it forward before something kills it."
                FAILED=1
                continue
              fi

              # digest が在ることと、消されずに在り続けることは別の話。タグを
              # 失った artifact は retention の件数ルールの保護外で、週次 GC が
              # 消す。参照している側から見れば「今日は引けるが来週引けない」で、
              # MISSING と同じ故障を、起きる前の姿で見ていることになる。
              #
              # 2026-08-19 の memory も 2026-08-22 の trading も、気付いたのは
              # 消えた後だった。ここで見えていれば GC までの最大 7 日が猶予になる。
              proj=${repo%%/*}
              name=$(printf '%s' "${repo#*/}" | sed 's#/#%2F#g')
              meta=$(curl -sS --connect-timeout 10 --max-time 30 \
                --retry 3 --retry-delay 5 --retry-connrefused \
                -u "$HARBOR_USER:$HARBOR_PASS" \
                "https://registry.infra.tgy.io/api/v2.0/projects/${proj}/repositories/${name}/artifacts/${digest}?with_tag=true") || meta=""

              # 読めなかったときは黙る。タグが無いことと、権限が無くて分からない
              # ことを混同すると、この監査が二度目に信用されなくなる。
              #
              # 既定を unknown 側に置いているのは、空の応答に jq をかけると何も
              # 出力されず、それは「タグが空」と見分けが付かないため。curl が
              # 落ちた回を孤児として報告するのは、直したばかりの誤報と同じ形。
              tags="unknown"
              if [ -n "$meta" ]; then
                tags=$(printf '%s' "$meta" | jq -r 'if type=="object" and has("digest") then ([.tags[]?.name] | join(",")) else "unknown" end' 2>/dev/null) || tags="unknown"
              fi

              if [ "$tags" = "unknown" ]; then
                TAGBLIND=$((TAGBLIND + 1))
              else
                TAGSEEN=$((TAGSEEN + 1))
              fi

              if [ -z "$tags" ]; then
                echo "ORPHANED  $ref"
                echo "          the artifact is still here, but nothing tags it any more. The count"
                echo "          rule cannot retain an untagged artifact and the weekly GC deletes it."
                echo "          Roll this reference forward before Sunday."
                FAILED=1
              fi

              # Kyverno と同じ順序で、最初にマッチしたルールが署名の置き場を決める。
              # 行ごとに cut で切り出す。read の IFS をタブにすると、その IFS が
              # ループ本体の $refs の単語分割にも効いてしまい、空白区切りの
              # パターン列が 1 語に潰れる。
              sigrepo=""
              matched=0
              n=1
              total=$(wc -l < /tmp/rules.tsv)
              while [ "$n" -le "$total" ]; do
                line=$(sed -n "${n}p" /tmp/rules.tsv)
                n=$((n + 1))

                skipped=0
                for p in $(printf '%s\n' "$line" | cut -f2); do
                  case "$ref" in $p) skipped=1 ;; esac
                done
                [ "$skipped" = 0 ] || continue

                for p in $(printf '%s\n' "$line" | cut -f1); do
                  case "$ref" in
                    $p)
                      sigrepo=$(printf '%s\n' "$line" | cut -f3)
                      matched=1
                      break
                      ;;
                  esac
                done
                [ "$matched" = 0 ] || break
              done

              if [ "$matched" = 0 ]; then
                echo "UNCOVERED $ref"
                echo "          no verifyImages rule matches it — Kyverno is not checking this image"
                echo "          at all, so nothing would notice if it were replaced."
                FAILED=1
                continue
              fi

              if [ -n "$sigrepo" ]; then
                export COSIGN_REPOSITORY="$sigrepo"
              else
                unset COSIGN_REPOSITORY
              fi

              if cosign verify --key /tmp/cosign.pub --insecure-ignore-tlog=true "$ref" >/dev/null 2>/tmp/cosign.err; then
                echo "ok        $ref"
              else
                echo "UNSIGNED  $ref"
                echo "          signature not verifiable${sigrepo:+ in $sigrepo}. The image survives but its"
                echo "          signature does not, so admission fails the next time a Pod is created:"
                sed 's/^/            /' /tmp/cosign.err | head -5
                FAILED=1
              fi
            done < /tmp/images.txt

            echo
            # 一件も読めなかったなら、ORPHANED は一度も判定されていない。
            # 権限を失った監査は「孤児 0 件」を静かに報告し続けるので、
            # 見えていないこと自体を失敗として言う。個別の unknown は
            # 一過性でありうるので、全滅したときだけ。
            if [ "$TAGSEEN" = 0 ] && [ "$TAGBLIND" -gt 0 ]; then
              echo "TAGBLIND  could not read tag state for any of the $TAGBLIND reference(s)."
              echo "          ORPHANED was never evaluated, so nothing above rules out an orphan."
              echo "          Check that the robot still has artifact:read on these projects."
              FAILED=1
            elif [ "$TAGBLIND" -gt 0 ]; then
              echo "note: tag state unreadable for $TAGBLIND of $((TAGSEEN + TAGBLIND)) reference(s)."
            fi

            if [ "$FAILED" = 0 ]; then
              echo "everything that could start right now can still pull and verify what it references"
            else
              echo "findings above — the exit hook posts this workflow to Discord"
            fi
            exit "$FAILED"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: image-digest-audit
  namespace: argo
spec:
  # Harbor の retention は Daily (00:00 UTC)。その後に走らせて、消えた直後の
  # 状態を見る。
  schedules:
    - "0 10 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: image-digest-audit

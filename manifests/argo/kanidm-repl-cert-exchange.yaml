apiVersion: v1
kind: ServiceAccount
metadata:
  name: kanidm-repl-cert-exchanger
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kanidm-repl-cert-exchanger
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: kanidm-repl-cert-exchanger
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: kanidm-repl-cert-exchange
  namespace: argo
spec:
  activeDeadlineSeconds: 120
  serviceAccountName: kanidm-repl-cert-exchanger
  entrypoint: main
  templates:
    - name: main
      metadata:
        labels:
          kanidm-repl-exchange: "true"
      container:
        image: registry.suse.com/suse/kubectl:1.35@sha256:8003cb3db46b41bc67075cf6528983dbdae9f0bb1cce504825752af7e231ecd6
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            NS="kanidm"
            SECRET="kanidm-repl-certs"

            for i in 0 1; do
              PHASE=$(kubectl get pod -n "$NS" "kanidm-${i}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
              if [ "$PHASE" != "Running" ]; then
                echo "ERROR: kanidm-${i} is ${PHASE}"
                exit 1
              fi
            done

            for i in 0 1; do
              echo "Extracting cert from kanidm-${i}..."
              OUTPUT=$(kubectl exec -n "$NS" "kanidm-${i}" -c kanidm -- \
                kanidmd show-replication-certificate -c /config/server.toml 2>&1)
              CERT="${OUTPUT#*certificate: \"}"
              CERT="${CERT%%\"*}"
              if [ -z "$CERT" ] || [ "$CERT" = "$OUTPUT" ]; then
                echo "ERROR: Failed to extract cert from kanidm-${i}"
                echo "Output was: $OUTPUT"
                exit 1
              fi
              echo "$CERT" > "/tmp/cert-${i}"
              echo "OK"
            done

            CERT_0=$(cat /tmp/cert-0)
            CERT_1=$(cat /tmp/cert-1)
            # kanidm-0 が primary、kanidm-1 が secondary。
            #
            # automatic_refresh は「分岐したとき自分を相手の内容で作り直す」設定
            # で、**片側にだけ**付ける。両側に付けると双方が consumer 役を要求し
            # 合い、どちらも supplier を引き受けないので永久にデッドロックする。
            # 上流ドキュメントもそう書いている:
            #
            #   The secondary can have automatic_refresh = true ... while the
            #   primary should not have this setting. This means that if
            #   database issues occur the content of the primary will take
            #   precedence over the secondary.
            #
            # 実際、両側に付けていたせいで RUV 分岐が自動回復せず、2026-07-03 と
            # 2026-08-22 の 2 回、手動の refresh-replication-consumer が必要に
            # なった。2 回目は 7 時間以上デッドロックしたままだった。
            #
            # primary を ordinal 0 にしているのは、StatefulSet が 0 から順に
            # 起動するため。分岐時は kanidm-0 の内容が残る。
            cat > /tmp/partner-0.toml << EOF
            [replication."repl://kanidm-1.kanidm-headless.kanidm.svc.cluster.local:8444"]
            type = "mutual-pull"
            partner_cert = "${CERT_1}"
            EOF

            cat > /tmp/partner-1.toml << EOF
            [replication."repl://kanidm-0.kanidm-headless.kanidm.svc.cluster.local:8444"]
            type = "mutual-pull"
            partner_cert = "${CERT_0}"
            automatic_refresh = true
            EOF

            kubectl create secret generic "$SECRET" \
              --namespace="$NS" \
              --from-file=partner-0.toml=/tmp/partner-0.toml \
              --from-file=partner-1.toml=/tmp/partner-1.toml \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "Done"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: kanidm-repl-cert-exchange
  namespace: argo
spec:
  schedules:
    - "0 5 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: Replace
  workflowSpec:
    workflowTemplateRef:
      name: kanidm-repl-cert-exchange

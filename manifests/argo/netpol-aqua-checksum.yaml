apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aqua-checksum
  namespace: argo
# The workflow clones a branch, downloads every package aqua.yaml names so it
# can hash them, and commits the result back through the API — so it needs
# github.com for the clone, api.github.com for the commit, and the release
# CDN for the artifacts themselves.
#
# It also needs the Kubernetes API, which the first version of this policy
# missed. Argo's `wait` sidecar posts each step's outcome to
# workflowtaskresults, and with that blocked the container retries until the
# workflow times out — so every run since this policy was introduced failed,
# 33 Error and 4 Failed with no successes at all. The pod never reaches the
# service VIP either: kube-proxy replacement translates 10.96.0.1:443 to the
# control plane's own address, which is what Hubble records being dropped.
#
#   argo/aqua-checksum-… <> 192.168.10.231:6443 (kube-apiserver)
#     Policy denied DROPPED (TCP Flags: SYN)
#
# The artifact repository is the other one. Argo's `wait` uploads each step's
# log to SeaweedFS, so a workflow pod needs the filer on 8333 regardless of what
# the workflow itself talks to. Adding only the API left these pods dropping on
# seaweedfs instead:
#
#   argo/aqua-checksum-6mwhw <> seaweedfs/seaweedfs-filer-…:8333
#     Policy denied DROPPED (TCP Flags: SYN)
#
# netpol-workflow-pods excludes these pods by label, so nothing else grants
# either of them. What is deliberately *not* copied from that policy: its
# blanket toCIDR 0.0.0.0/0 on 443, which the FQDN list below replaces on
# purpose, and Talos apid on 50000, which this workflow has no talosctl to use.
spec:
  endpointSelector:
    matchLabels:
      aqua-checksum: "true"
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - toFQDNs:
        - matchName: "github.com"
        - matchName: "api.github.com"
        - matchPattern: "*.githubusercontent.com"
        # podMetadata.labels lands on the onExit pod too, so the Discord notify
        # that every workflow runs is selected by this policy rather than by
        # netpol-workflow-pods' blanket 443 — and without this it times out.
        - matchName: "discord.com"
        # aqua は checksum を記録する前に、上流の署名を cosign で検証する。
        # bundle 検証自体はオフラインで完結するが、信頼のルートだけは Sigstore
        # の TUF から取りに行くので、ここが塞がると全パッケージが落ちる:
        #
        #   Get "https://tuf-repo-cdn.sigstore.dev/15.root.json": i/o timeout
        #   → Verification by Cosign failed temporarily, retrying (×5)
        #   → aqua failed: it failed to update some packages' checksums
        #
        # 接続先は strace で実測した。外部に出るのは github.com /
        # *.githubusercontent.com / このホストの 3 つだけで、rekor と fulcio
        # には接続しない（bundle に必要な材料が入っているため）。
        - matchName: "tuf-repo-cdn.sigstore.dev"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

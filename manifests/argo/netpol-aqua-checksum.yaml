apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aqua-checksum
  namespace: argo
# The workflow clones a branch, downloads every package aqua.yaml names so it
# can hash them, and commits the result back through the API — so it needs
# github.com for the clone, api.github.com for the commit, and the release
# CDN for the artifacts themselves. Nothing else.
spec:
  endpointSelector:
    matchLabels:
      aqua-checksum: "true"
  egress:
    - toFQDNs:
        - matchName: "github.com"
        - matchName: "api.github.com"
        - matchPattern: "*.githubusercontent.com"
        # podMetadata.labels lands on the onExit pod too, so the Discord notify
        # that every workflow runs is selected by this policy rather than by
        # netpol-workflow-pods' blanket 443 — and without this it times out.
        - matchName: "discord.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

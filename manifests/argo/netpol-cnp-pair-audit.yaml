apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnp-pair-audit
  namespace: argo
spec:
  endpointSelector:
    matchLabels:
      cnp-pair-audit: "true"
  ingressDeny:
    - fromEntities:
        - world
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 消すとこのワークフローが終わらない。
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP

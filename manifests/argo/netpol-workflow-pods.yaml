apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: workflow-pods
  namespace: argo
spec:
  endpointSelector:
    matchExpressions:
      - key: workflows.argoproj.io/workflow
        operator: Exists
      - key: backup-workflow
        operator: DoesNotExist
      - key: pxe-sync
        operator: DoesNotExist
      - key: talos-build
        operator: DoesNotExist
      - key: kanidm-repl-exchange
        operator: DoesNotExist
      - key: kanidm-backup
        operator: DoesNotExist
      - key: aqua-checksum
        operator: DoesNotExist
  ingressDeny:
    - fromEntities:
        - world
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    # Talos apid. A node's IP carries a node identity in Cilium
    # (kube-apiserver for control planes, remote-node for workers, host for the
    # node the pod runs on), and CIDR rules are never evaluated against those
    # identities — so the toCIDR list this replaces silently matched nothing and
    # every talosctl call from a workflow pod timed out. etcd-backup has always
    # used toEntities, which is why it worked and upgrade-k8s did not.
    - toEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
---
# pluto-check の推論だけが llm-gateway を通る（#942）。**上の workflow-pods に足さない** —
# あちらは `workflows.argoproj.io/workflow` Exists で選ぶので、renovate / tofu-harbor まで
# Max の alias への出口を持ってしまう（除外リストに入っていない）。Cilium の identity は
# ServiceAccount を持つので、pluto-check の SA だけを選ぶ。
# CNP は加算なので、これは workflow-pods が与える egress に足されるだけ（何も塞がない）。
# 対向の ingress も manifests/llm-gateway/netpol.yaml 側で同じ SA に絞ってある。
#
# in-cluster 宛なので toFQDNs でも toCIDR でもなく toEndpoints。workflow-pods の
# `toCIDR: 0.0.0.0/0`:443 は Pod の identity には評価されないため、あれでは届かない。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pluto-check-llm-gateway
  namespace: argo
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: pluto-checker
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            io.kubernetes.pod.namespace: llm-gateway
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pluto-checker
  namespace: argo
---
# ai-fix 専用。**Secret を読む権限を持たない。**
#
# pluto-checker はクラスタ全体の `secrets` に get/list を持っている（detect-helm が
# Helm のリリースを Secret から読むため必要）。あれを継いだまま claude を走らせると、
# エージェントは `kubectl get secret github-app-private-key -n argo -o yaml` で
# init に隔離したはずの鍵に戻れるし、`llm-gateway/claude-max-apikey`（#942 が
# 守ろうとしている Max の OAuth トークン）も 1Password Connect の資格情報も読める。
# **RBAC を分けないと、env や /proc を塞いでも API 経由で全部やり直せる。**
#
# ここにあるのは wait サイドカーが workflowtaskresults を書くための権限だけ
# （argo-workflows-edit は argoproj.io のリソースしか含まない。実測で確認）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pluto-fixer
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pluto-fixer
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: pluto-fixer
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pluto-checker
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: pluto-checker
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pluto-checker
rules:
  - apiGroups: [""]
    resources: [configmaps, endpoints, events, limitranges, namespaces, nodes, persistentvolumeclaims, persistentvolumes, pods, podtemplates, replicationcontrollers, resourcequotas, secrets, serviceaccounts, services]
    verbs: [get, list]
  # Built-in API groups
  - apiGroups: [apps, batch, autoscaling, policy, networking.k8s.io, rbac.authorization.k8s.io, storage.k8s.io, apiextensions.k8s.io, admissionregistration.k8s.io, apiregistration.k8s.io, authentication.k8s.io, authorization.k8s.io, certificates.k8s.io, coordination.k8s.io, discovery.k8s.io, events.k8s.io, flowcontrol.apiserver.k8s.io, node.k8s.io, resource.k8s.io, scheduling.k8s.io, snapshot.storage.k8s.io, groupsnapshot.storage.k8s.io, metrics.k8s.io]
    resources: ["*"]
    verbs: [get, list]
  # CRD API groups
  - apiGroups: [cilium.io, argoproj.io, cert-manager.io, acme.cert-manager.io, postgresql.cnpg.io, onepassword.com, gateway.networking.k8s.io, externaldns.k8s.io, monitoring.coreos.com, monitoring.grafana.com, aquasecurity.github.io, objectbucket.io, trident.qnap.io]
    resources: ["*"]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pluto-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pluto-checker
subjects:
  - kind: ServiceAccount
    name: pluto-checker
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pluto-check
  namespace: argo
spec:
  activeDeadlineSeconds: 2400
  serviceAccountName: pluto-checker
  # netpol-pluto-check.yaml がこのラベルで選ぶ。付けると workflow-pods の
  # `toCIDR: 0.0.0.0/0`:443 から外れるので、env が壊れて外部 LLM へ直行したら
  # drop されて落ちる（claude-code / claude-code-build と同じ検出）。
  podMetadata:
    labels:
      pluto-check: "true"
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: detect-in-cluster
            template: detect-in-cluster
            continueOn:
              failed: true
          - name: detect-helm
            template: detect-helm
            continueOn:
              failed: true
        - - name: ai-fix
            template: ai-fix
            when: "{{steps.detect-in-cluster.status}} == Failed || {{steps.detect-helm.status}} == Failed"
            arguments:
              artifacts:
                - name: pluto-cluster
                  from: "{{steps.detect-in-cluster.outputs.artifacts.result}}"
                - name: pluto-helm
                  from: "{{steps.detect-helm.outputs.artifacts.result}}"
        - - name: fail-if-deprecated
            template: fail-if-deprecated
            when: "{{steps.detect-in-cluster.status}} == Failed || {{steps.detect-helm.status}} == Failed"

    - name: detect-in-cluster
      script:
        image: us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5.24.4@sha256:0b058f9f27f05fef92a3a4325a5c02b1c250095fba360ed87c7734ea11f1d188
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi
        command: [sh]
        source: |
          /pluto detect-all-in-cluster --target-versions k8s=v1.36.0 -o wide > /tmp/result.txt 2>&1
          code=$?
          cat /tmp/result.txt
          exit $code
      outputs:
        artifacts:
          - name: result
            path: /tmp/result.txt
            archive:
              none: {}

    - name: detect-helm
      script:
        image: us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5.24.4@sha256:0b058f9f27f05fef92a3a4325a5c02b1c250095fba360ed87c7734ea11f1d188
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        command: [sh]
        source: |
          /pluto detect-helm --target-versions k8s=v1.36.0 -o wide > /tmp/result.txt 2>&1
          code=$?
          cat /tmp/result.txt
          exit $code
      outputs:
        artifacts:
          - name: result
            path: /tmp/result.txt
            archive:
              none: {}

    - name: ai-fix
      timeout: "30m"
      # **Workflow spec の pluto-checker を継がない。** あれは全 Secret を読めるので、
      # claude を走らせるこのステップだけ権限の無い SA に落とす（上の定義を参照）。
      # pluto 本体（detect-*）は固定のバイナリなので pluto-checker のままでよい。
      serviceAccountName: pluto-fixer
      # App の秘密鍵は **init だけ** が持つ。JWT に署名して installation token を
      # ファイルに落とし、main はそれを読む。env から unset するだけでは足りない —
      # `unset` はシェルの環境配列しか消さず、exec 時のスタックは書き換わらないので、
      # 同じ UID の子プロセスが `/proc/<ppid>/environ` から元の値を読める（実測）。
      # init のプロセスは agent 起動時にはもう存在しないので、その経路ごと消える。
      # Pod に残るのは 1 時間・1 installation スコープの token だけ。
      # taskflow-pr-review.yaml が parts の clone 用に同じ形を使っている。
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/claude-code:latest@sha256:f4bf69bfa990c3ebfbcc23fe666005a56377b5dc2a2ee1919dca5e54e31f174e
          command: [sh, -c]
          env:
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app-private-key
                  key: private-key
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/home-cluster"
          args:
            - |
              set -euo pipefail
              echo "=== Generating GitHub App installation token ==="
              echo "$GITHUB_APP_PRIVATE_KEY" > /tmp/app-key.pem
              NOW=$(date +%s)
              HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 -w 0 | tr '+/' '-_' | tr -d '=')
              PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW - 60))" "$((NOW + 600))" "$GITHUB_APP_ID" | base64 -w 0 | tr '+/' '-_' | tr -d '=')
              SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign /tmp/app-key.pem -binary | base64 -w 0 | tr '+/' '-_' | tr -d '=')
              JWT="${HEADER}.${PAYLOAD}.${SIGNATURE}"
              rm -f /tmp/app-key.pem
              INSTALLATION_ID=$(curl -sf \
                -H "Authorization: Bearer ${JWT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPO}/installation" \
                | jq -r '.id')
              curl -sf -X POST \
                -H "Authorization: Bearer ${JWT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens" \
                | jq -r '.token' > /github-token/token
              # 形を見る。`test -s` は改行 1 バイトでも真、`grep -qv '^null$'` は
              # 空行を「null でない行」として通すので、どちらも空トークンを素通しする
              # （実測）。main へ持ち越すと 2 ステップ先の「clone できない」に化ける。
              #
              # **文字クラスは実物で確かめること。** installation token は `ghs_` の後ろが
              # 英数だけではなく、`.` `-` `_` を含む 383 文字（2026-09-18 に実測）。
              # `[A-Za-z0-9]` だけにすると本物が必ず落ちる。
              grep -qE '^ghs_[A-Za-z0-9._-]{20,}$' /github-token/token
              # 0400 だと init と main の UID が一致し続けることに依存する。
              # workflowDefaults の fsGroup: 65532 で emptyDir が setgid になり、
              # 中のファイルはグループを継ぐので、0440 なら UID がずれても読める。
              chmod 0440 /github-token/token
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-token, mountPath: /github-token}
            - {name: auth-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: github-token
          emptyDir: {}
        # 秘密鍵を書く先を main の /tmp と分ける。main からは見えない。
        - name: auth-tmp
          emptyDir: {}
      inputs:
        artifacts:
          - name: pluto-cluster
            path: /tmp/pluto-cluster.txt
          - name: pluto-helm
            path: /tmp/pluto-helm.txt
      script:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:f4bf69bfa990c3ebfbcc23fe666005a56377b5dc2a2ee1919dca5e54e31f174e
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        command: [sh]
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
        env:
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が
          # Authorization を付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # api.anthropic.com 直行を止める 3 本。根拠は manifests/claude-code/taskflow-common.yaml。
          # parts-ref と違い ConfigMap を複製しない — 値が "1" 固定で Renovate のバンプが
          # 無いため、複製 + sha 同期と同じコストを払う理由がない。
          - name: DISABLE_TELEMETRY
            value: "1"
          - name: DISABLE_ERROR_REPORTING
            value: "1"
          - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
            value: "1"
          # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
          # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
          # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
          # 外では使えない（CNP の内側）。handler 単位で revoke できる。
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-gateway-client-keys
                key: pluto-check
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの呼び出し元かを gateway に名乗る。アクセスログの tf.handler に出る。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: pluto-check"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
          # claude CLI の自動更新チェックを止める。これが走ると registry.npmjs.org を
          # 引きにいくが、この CNP は開けていない（claude-code / claude-code-build は
          # 開けている）。要らないものを開けるより、要らないと言う方を選ぶ。
          - name: DISABLE_AUTOUPDATER
            value: "1"
          - name: GITHUB_REPO
            value: "Tsuguya-HC/home-cluster"
        source: |
          set -euo pipefail

          # init が作った installation token を読む。**App の秘密鍵はこのコンテナに
          # 無い** — env にも /proc にも無いので、この先で起動する claude からも辿れない。
          GITHUB_TOKEN=$(cat /github-token/token)
          export GITHUB_TOKEN

          echo "=== Cloning home-cluster ==="
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Tsuguya-HC/home-cluster.git" /tmp/workspace
          cd /tmp/workspace

          echo "[detect-all-in-cluster]"
          cat /tmp/pluto-cluster.txt
          echo "[detect-helm]"
          cat /tmp/pluto-helm.txt

          cat > /tmp/prompt.txt << 'PROMPT_EOF'
          Kubernetes クラスターで deprecated API が検出されました（対象: k8s v1.36.0）。

          この home-cluster リポジトリの manifests/ と helm-values/ を調査して、
          deprecated/removed な apiVersion を新しい apiVersion に更新してください。

          git 操作は行わないでください（スクリプトが処理します）。

          ## Pluto detect-all-in-cluster
          PROMPT_EOF

          cat /tmp/pluto-cluster.txt >> /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "## Pluto detect-helm" >> /tmp/prompt.txt
          cat /tmp/pluto-helm.txt >> /tmp/prompt.txt

          echo "=== Running Claude Code ==="
          claude --print "$(cat /tmp/prompt.txt)" \
            --model review \
            --allowedTools Edit,Read,Bash,Glob,Grep,Write

          if ! git diff --quiet HEAD || git ls-files --others --exclude-standard | grep -q .; then
            :
          else
            echo "No changes made by Claude"
            exit 1
          fi

          echo "=== Creating signed commit via GitHub GraphQL API ==="
          REPO="Tsuguya-HC/home-cluster"
          BRANCH="fix/deprecated-api-$(date +%Y%m%d-%H%M%S)"
          BASE_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
          gh api "repos/${REPO}/git/refs" --method POST --input - <<JEOF
          {"ref":"refs/heads/${BRANCH}","sha":"${BASE_SHA}"}
          JEOF
          echo "Branch created: ${BRANCH}"

          ADDITIONS="[]"
          for f in $(git diff --name-only HEAD) $(git ls-files --others --exclude-standard); do
            [ -z "$f" ] && continue
            CONTENT=$(base64 -w 0 < "$f")
            ADDITIONS=$(echo "$ADDITIONS" | jq --arg p "$f" --arg c "$CONTENT" '. + [{"path":$p,"contents":$c}]')
          done
          DELETIONS="[]"
          for f in $(git diff --name-only --diff-filter=D HEAD); do
            [ -z "$f" ] && continue
            DELETIONS=$(echo "$DELETIONS" | jq --arg p "$f" '. + [{"path":$p}]')
          done
          echo "Additions: $(echo "$ADDITIONS" | jq '[.[].path]'), Deletions: $DELETIONS"

          GRAPHQL_PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$BASE_SHA" \
            --argjson additions "$ADDITIONS" \
            --argjson deletions "$DELETIONS" \
            '{
              query: "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables: {
                input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                  message: {
                    headline: "fix: update deprecated Kubernetes API versions for k8s v1.36.0",
                    body: "Auto-fixed by Claude Code (triggered by Pluto check).\nReview before merging."
                  },
                  fileChanges: {additions: $additions, deletions: $deletions},
                  expectedHeadOid: $oid
                }
              }
            }')
          COMMIT_OID=$(echo "$GRAPHQL_PAYLOAD" | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          echo "Signed commit: ${COMMIT_OID}"

          cat > /tmp/pr-body.txt << 'BODY_EOF'
          ## Summary

          Pluto が k8s v1.36.0 で deprecated/removed となる API を検出したため、Claude Code が自動修正しました。

          ## Pluto 検出結果

          ```
          BODY_EOF

          cat /tmp/pluto-cluster.txt >> /tmp/pr-body.txt
          cat /tmp/pluto-helm.txt >> /tmp/pr-body.txt
          printf '```\n\n---\n> 自動生成された PR です。マージ前に変更内容を必ず確認してください。\n' >> /tmp/pr-body.txt

          gh pr create \
            --repo "$REPO" \
            --title "fix: update deprecated Kubernetes API versions (k8s v1.36.0)" \
            --body-file /tmp/pr-body.txt \
            --head "$BRANCH" \
            --base main

          echo "PR created for branch: $BRANCH"

    - name: fail-if-deprecated
      container:
        image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        command: [sh, -c]
        args:
          - |
            echo "Deprecated APIs found. PR has been created for review."
            exit 1
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: pluto-check
  namespace: argo
spec:
  schedules:
    - "0 10 * * 0"
  timezone: Asia/Tokyo
  concurrencyPolicy: Replace
  workflowSpec:
    workflowTemplateRef:
      name: pluto-check

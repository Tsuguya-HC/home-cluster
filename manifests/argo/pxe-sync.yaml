apiVersion: v1
kind: ServiceAccount
metadata:
  name: pxe-sync-executor
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pxe-sync-executor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: pxe-sync-executor
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pxe-sync
  namespace: argo
spec:
  activeDeadlineSeconds: 600
  serviceAccountName: pxe-sync-executor
  entrypoint: main
  # NFS 上の /pxe は uid 1000:gid 100 所有。workflowDefaults の 65532 では書けない
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
    seccompProfile:
      type: RuntimeDefault
  arguments:
    parameters:
      - name: mode
        default: both
        enum:
          - update-assets
          - sync-configs
          - both
  volumes:
    - name: pxe
      persistentVolumeClaim:
        claimName: pxe-nfs
  templates:
    - name: main
      steps:
        # サーバ設定は mode に関係なく毎回 reconcile する（ドリフト自動修正）
        - - name: sync-server-files
            template: sync-server-files
        - - name: update-assets
            template: update-assets
            when: "'{{workflow.parameters.mode}}' == 'update-assets' || '{{workflow.parameters.mode}}' == 'both'"
        - - name: sync-configs
            template: sync-configs
            when: "'{{workflow.parameters.mode}}' == 'sync-configs' || '{{workflow.parameters.mode}}' == 'both'"

    - name: sync-server-files
      metadata:
        labels:
          pxe-sync: "true"
      volumes:
        - name: server-files
          configMap:
            name: pxe-server-files
      container:
        image: alpine:3.24
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            echo "=== Reconciling PXE server config ==="
            # boot.ipxe は nginx が静的配信するだけなので再起動不要。
            # dnsmasq.conf / nginx.conf は起動時にしか読まれない
            NEEDS_RESTART=""
            for f in boot.ipxe dnsmasq.conf nginx.conf; do
              if cmp -s "/src/${f}" "/pxe/${f}"; then
                echo "  unchanged: ${f}"
              else
                cp "/src/${f}" "/pxe/${f}"
                chmod 644 "/pxe/${f}"
                echo "  UPDATED:   ${f}"
                case "${f}" in
                  dnsmasq.conf) NEEDS_RESTART="${NEEDS_RESTART} pxe-dnsmasq-1" ;;
                  nginx.conf)   NEEDS_RESTART="${NEEDS_RESTART} pxe-nginx-1" ;;
                esac
              fi
            done

            if [ -n "${NEEDS_RESTART}" ]; then
              echo
              echo "################################################################"
              echo "# 起動時にしか設定を読まないコンテナが変更された。NAS 側で再起動が必要:"
              echo "#   ssh tsuguya@192.168.10.2 \\"
              echo "#     /share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker \\"
              echo "#     restart${NEEDS_RESTART}"
              echo "################################################################"
            fi
        volumeMounts:
          - name: server-files
            mountPath: /src
          - name: pxe
            mountPath: /pxe

    - name: update-assets
      metadata:
        labels:
          pxe-sync: "true"
      container:
        image: alpine:3.24
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            echo "=== Fetching latest release from Tsuguya/talos-custom-build ==="
            TAG=$(wget -qO- https://api.github.com/repos/Tsuguya/talos-custom-build/releases/latest | grep -o '"tag_name":[^,]*' | grep -o '"[^"]*"$' | tr -d '"')
            echo "Latest release: ${TAG}"

            ASSETS_DIR=/pxe/assets
            echo "=== Downloading vmlinuz-amd64 ==="
            wget -qO "${ASSETS_DIR}/vmlinuz.tmp" "https://github.com/Tsuguya/talos-custom-build/releases/download/${TAG}/vmlinuz-amd64"

            echo "=== Downloading initramfs-amd64.xz ==="
            wget -qO "${ASSETS_DIR}/initramfs.xz.tmp" "https://github.com/Tsuguya/talos-custom-build/releases/download/${TAG}/initramfs-amd64.xz"

            echo "=== Atomic replace ==="
            mv "${ASSETS_DIR}/vmlinuz.tmp" "${ASSETS_DIR}/vmlinuz"
            mv "${ASSETS_DIR}/initramfs.xz.tmp" "${ASSETS_DIR}/initramfs.xz"
            chmod 644 "${ASSETS_DIR}/vmlinuz" "${ASSETS_DIR}/initramfs.xz"

            echo "=== Done: assets updated to ${TAG} ==="
            ls -lh "${ASSETS_DIR}/"
        volumeMounts:
          - name: pxe
            mountPath: /pxe

    - name: sync-configs
      metadata:
        labels:
          pxe-sync: "true"
      volumes:
        - name: workspace
          emptyDir: {}
      initContainers:
        - name: git-clone
          image: alpine/git:v2.54.0
          command: [git, clone, --depth, "1"]
          args: ["https://github.com/Tsuguya/home-infra.git", /workspace]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      container:
        image: alpine:3.24
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            # renovate: datasource=github-releases depName=budimanjojo/talhelper
            TALHELPER_VERSION="v3.1.16"
            # renovate: datasource=github-releases depName=getsops/sops
            SOPS_VERSION="v3.13.3"

            echo "=== Installing talhelper ${TALHELPER_VERSION} ==="
            wget -qO- "https://github.com/budimanjojo/talhelper/releases/download/${TALHELPER_VERSION}/talhelper_linux_amd64.tar.gz" | tar xz -C /tmp
            chmod +x /tmp/talhelper

            echo "=== Installing sops ${SOPS_VERSION} ==="
            wget -qO /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
            chmod +x /tmp/sops

            export PATH="/tmp:${PATH}"

            cd /workspace

            echo "=== Running talhelper genconfig ==="
            talhelper genconfig --no-gitignore

            echo "=== Mapping configs to MAC addresses ==="
            CONFIG_DIR=/pxe/config
            CLUSTER_DIR=/workspace/clusterconfig

            map_config() {
              mac="$1"
              hostname="$2"
              src="${CLUSTER_DIR}/home-cluster-${hostname}.yaml"
              dst="${CONFIG_DIR}/${mac}.yaml"
              if [ -f "$src" ]; then
                cp "$src" "$dst"
                # talhelper は 0600 で書くが PXE の nginx ワーカーが読めず 403 になる。
                # nginx は group users で動かすので group 読みだけ許可する
                chmod 640 "$dst"
                echo "Synced: ${hostname} -> ${mac}.yaml"
              else
                echo "WARNING: $src not found" >&2
              fi
            }

            # CP は Gen2 (AOOSTAR/TianBei N1 Pro)。MAC は enp3s0 側 (I226-V ×2 のうち LAN を挿す方)
            map_config "c8-ff-bf-05-ec-b7" "cp-11.cluster.internal"
            map_config "c8-ff-bf-05-ea-9b" "cp-12.cluster.internal"
            map_config "c8-ff-bf-05-e9-8f" "cp-13.cluster.internal"
            map_config "7c-83-34-be-c0-b4" "wn-01.cluster.internal"
            map_config "68-1d-ef-36-c6-e3" "wn-02.cluster.internal"
            map_config "58-47-ca-73-ce-2a" "wn-03.cluster.internal"

            echo "=== Done ==="
            ls -lh "${CONFIG_DIR}/"
        env:
          - name: SOPS_AGE_KEY
            valueFrom:
              secretKeyRef:
                name: sops-age-key
                key: credential
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: pxe
            mountPath: /pxe

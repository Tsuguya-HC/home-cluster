apiVersion: v1
kind: ServiceAccount
metadata:
  name: pxe-sync-executor
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pxe-sync-executor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: pxe-sync-executor
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pxe-sync
  namespace: argo
spec:
  activeDeadlineSeconds: 600
  serviceAccountName: pxe-sync-executor
  entrypoint: main
  # NFS 上の /pxe は uid 1000:gid 100 所有。workflowDefaults の 65532 では書けない
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
    seccompProfile:
      type: RuntimeDefault
  arguments:
    parameters:
      - name: mode
        default: both
        enum:
          - update-assets
          - sync-configs
          - both
  volumes:
    - name: pxe
      persistentVolumeClaim:
        claimName: pxe-nfs
  templates:
    - name: main
      steps:
        # サーバ設定は mode に関係なく毎回 reconcile する（ドリフト自動修正）
        - - name: sync-server-files
            template: sync-server-files
        - - name: update-assets
            template: update-assets
            when: "'{{workflow.parameters.mode}}' == 'update-assets' || '{{workflow.parameters.mode}}' == 'both'"
        - - name: sync-configs
            template: sync-configs
            when: "'{{workflow.parameters.mode}}' == 'sync-configs' || '{{workflow.parameters.mode}}' == 'both'"

    - name: sync-server-files
      metadata:
        labels:
          pxe-sync: "true"
      volumes:
        - name: server-files
          configMap:
            name: pxe-server-files
      container:
        image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            echo "=== Reconciling PXE server config ==="
            # boot.ipxe は nginx が静的配信するだけなので再起動不要。
            # dnsmasq.conf / nginx.conf は起動時にしか読まれない
            NEEDS_RESTART=""
            for f in boot.ipxe dnsmasq.conf nginx.conf; do
              if cmp -s "/src/${f}" "/pxe/${f}"; then
                echo "  unchanged: ${f}"
              else
                cp "/src/${f}" "/pxe/${f}"
                chmod 644 "/pxe/${f}"
                echo "  UPDATED:   ${f}"
                case "${f}" in
                  dnsmasq.conf) NEEDS_RESTART="${NEEDS_RESTART} pxe-dnsmasq-1" ;;
                  nginx.conf)   NEEDS_RESTART="${NEEDS_RESTART} pxe-nginx-1" ;;
                esac
              fi
            done

            if [ -n "${NEEDS_RESTART}" ]; then
              echo
              echo "################################################################"
              echo "# 起動時にしか設定を読まないコンテナが変更された。NAS 側で再起動が必要:"
              echo "#   ssh tsuguya@192.168.10.2 \\"
              echo "#     /share/CACHEDEV1_DATA/.qpkg/container-station/bin/docker \\"
              echo "#     restart${NEEDS_RESTART}"
              echo "################################################################"
            fi
        volumeMounts:
          - name: server-files
            mountPath: /src
          - name: pxe
            mountPath: /pxe

    - name: update-assets
      metadata:
        labels:
          pxe-sync: "true"
      container:
        image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            echo "=== Fetching latest release from Tsuguya-HC/talos-custom-build ==="
            TAG=$(wget -qO- https://api.github.com/repos/Tsuguya-HC/talos-custom-build/releases/latest | grep -o '"tag_name":[^,]*' | grep -o '"[^"]*"$' | tr -d '"')
            echo "Latest release: ${TAG}"

            ASSETS_DIR=/pxe/assets
            echo "=== Downloading vmlinuz-amd64 ==="
            wget -qO "${ASSETS_DIR}/vmlinuz.tmp" "https://github.com/Tsuguya-HC/talos-custom-build/releases/download/${TAG}/vmlinuz-amd64"

            echo "=== Downloading initramfs-amd64.xz ==="
            wget -qO "${ASSETS_DIR}/initramfs.xz.tmp" "https://github.com/Tsuguya-HC/talos-custom-build/releases/download/${TAG}/initramfs-amd64.xz"

            echo "=== Atomic replace ==="
            mv "${ASSETS_DIR}/vmlinuz.tmp" "${ASSETS_DIR}/vmlinuz"
            mv "${ASSETS_DIR}/initramfs.xz.tmp" "${ASSETS_DIR}/initramfs.xz"
            chmod 644 "${ASSETS_DIR}/vmlinuz" "${ASSETS_DIR}/initramfs.xz"

            echo "=== Done: assets updated to ${TAG} ==="
            ls -lh "${ASSETS_DIR}/"
        volumeMounts:
          - name: pxe
            mountPath: /pxe

    - name: sync-configs
      metadata:
        labels:
          pxe-sync: "true"
      volumes:
        - name: workspace
          emptyDir: {}
        # talosctl comes from the talos-tools image; the render step itself runs in
        # argo-tools (yq, git). Neither image has both, so the binary is handed over
        # through an emptyDir instead of downloading an unpinned release at run time.
        - name: tools
          emptyDir: {}
        - name: talos-secrets
          secret:
            secretName: talos-secrets
            defaultMode: 0440
      initContainers:
        - name: git-clone
          image: alpine/git:v2.54.0@sha256:0b5f57d22181e8b8fbe8ac5ca8754faa0d577f101b9857418f1acc43955ad464
          command: [git, clone, --depth, "1"]
          args: ["https://github.com/Tsuguya-HC/home-infra.git", /workspace]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: talosctl
          image: registry.infra.tgy.io/tools/talos-tools:latest@sha256:d0a393a948cad4d983172534ed19424ab9bfa5edcce4e8a90fec951a29bb2da8
          command: [cp, /usr/local/bin/talosctl, /tools/talosctl]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # limit はコピーする talosctl バイナリのサイズ級（dirty page cache が cgroup memory に乗る）
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail
            export PATH="/tools:${PATH}"
            cd /workspace

            echo "=== Rendering machine configs (home-infra scripts/genconfig.sh) ==="
            # The talos-tools talosctl is newer than cluster.yaml's version contract and
            # warns about fields the contract still uses; validation stays non-strict here
            # (home-infra's CI runs the strict pass with the pinned client).
            TALOS_SECRETS=/secrets/secrets.yaml TALOS_VALIDATE_ARGS="" sh scripts/genconfig.sh

            echo "=== Mapping configs to MAC addresses (nodes.yaml) ==="
            CONFIG_DIR=/pxe/config
            yq -r '.nodes[] | select(.mac != null) | .host + " " + .mac' nodes.yaml \
            | while read -r host mac; do
              src="clusterconfig/${host}.yaml"
              dst="${CONFIG_DIR}/${mac}.yaml"
              if [ -f "$src" ]; then
                cp "$src" "$dst"
                # genconfig.sh は 0600 で書くが PXE の nginx ワーカーが読めず 403 になる。
                # nginx は group users で動かすので group 読みだけ許可する
                chmod 640 "$dst"
                echo "Synced: ${host} -> ${mac}.yaml"
              else
                echo "WARNING: $src not found" >&2
              fi
            done

            echo "=== Done ==="
            ls -lh "${CONFIG_DIR}/"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: tools
            mountPath: /tools
          - name: talos-secrets
            mountPath: /secrets
            readOnly: true
          - name: pxe
            mountPath: /pxe

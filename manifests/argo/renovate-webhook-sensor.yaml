apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: renovate-webhook
  namespace: argo
spec:
  template:
    serviceAccountName: workflow-executor
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  dependencies:
    - name: home-cluster
      eventSourceName: github-webhook
      eventName: renovate-home-cluster
      filters:
        script: &renovateFilter |-
          if event.body == nil then return false end
          if event.body.ref ~= nil then
            return event.body.ref == "refs/heads/main"
          end
          -- checkbox clicks arrive as a body edit; ignore renovate's own edits
          -- (bot unchecking the box) to avoid a self-trigger loop
          if event.body.action ~= "edited" then return false end
          -- public repos: anyone can open an issue/PR and edit its own body, so
          -- the edit must come from a sender allowed to trigger a run and the
          -- issue/PR itself must have been authored by the renovate app.
          -- The repos are owned by the Tsuguya-HC org, so repo.owner no longer
          -- names a person and cannot be compared against the sender.
          -- Matched on the sender's immutable numeric id, not the login: a
          -- login can be renamed and the old one reclaimed by someone else.
          -- This filter is shared via the anchor below, so it also applies to
          -- the private home-trading dependency -- stricter than necessary
          -- there, but harmless.
          -- To allow another sender, chain another `and sender.id ~= <id>`
          -- (not `or`, which would always be true and lock everyone out).
          -- Do not turn this into a numeric-keyed table: gopher-lua's
          -- LTable.RawSet puts keys in [0, 2^26) into the array part and
          -- pads it with nils up to that index, blowing past this pod's
          -- 64Mi memory limit.
          --   6055622  Tsuguya
          local sender = event.body.sender
          if sender == nil or sender.type ~= "User" then return false end
          if sender.id ~= 6055622 then return false end
          local function checked(body)
            return body ~= nil and string.find(body, "%[[xX]%]") ~= nil
          end
          -- Both first-party Renovate bot ids (Mend-hosted and self-hosted
          -- App) are accepted so a Mend <-> self-host move cannot silently
          -- disarm this filter again -- a login check already did once.
          -- See tofu-cloudflare-plan for why the author is matched on
          -- numeric user id rather than login.
          local function byRenovate(u)
            return u ~= nil and u.type == "Bot"
              and (u.id == 29139614 or u.id == 265309552)
          end
          if event.body.issue ~= nil then
            local issue = event.body.issue
            return issue.title == "Dependency Dashboard"
              and byRenovate(issue.user)
              and checked(issue.body)
          end
          if event.body.pull_request ~= nil then
            local pr = event.body.pull_request
            return pr.head ~= nil
              and string.sub(pr.head.ref, 1, 9) == "renovate/"
              and byRenovate(pr.user)
              and checked(pr.body)
          end
          return false
    - name: home-infra
      eventSourceName: github-webhook
      eventName: renovate-home-infra
      filters:
        script: *renovateFilter
    - name: home-cloudflare
      eventSourceName: github-webhook
      eventName: renovate-home-cloudflare
      filters:
        script: *renovateFilter
    # Reuses the endpoint the build and aqua-checksum sensors already consume,
    # rather than a renovate-* one of its own: the webhook and its secret exist,
    # and one more consumer of the same event costs nothing.
    - name: home-trading
      eventSourceName: github-webhook
      eventName: home-trading
      filters:
        script: *renovateFilter
  triggers:
    - template:
        name: renovate-home-cluster
        conditions: "home-cluster"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: renovate-home-cluster-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: renovate
                arguments:
                  parameters:
                    - name: repositories
                      value: '["Tsuguya-HC/home-cluster"]'
    - template:
        name: renovate-home-infra
        conditions: "home-infra"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: renovate-home-infra-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: renovate
                arguments:
                  parameters:
                    - name: repositories
                      value: '["Tsuguya-HC/home-infra"]'
    - template:
        name: renovate-home-cloudflare
        conditions: "home-cloudflare"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: renovate-home-cloudflare-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: renovate
                arguments:
                  parameters:
                    - name: repositories
                      value: '["Tsuguya-HC/home-cloudflare"]'
    - template:
        name: renovate-home-trading
        conditions: "home-trading"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: renovate-home-trading-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: renovate
                arguments:
                  parameters:
                    - name: repositories
                      value: '["Tsuguya-HC/home-trading"]'

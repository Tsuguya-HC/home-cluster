apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-executor
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-executor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: renovate-executor
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: renovate
  namespace: argo
spec:
  arguments:
    parameters:
      - name: repositories
        value: '["Tsuguya-HC/home-cluster","Tsuguya-HC/home-infra"]'
  synchronization:
    mutexes:
      - name: renovate
  activeDeadlineSeconds: 3600
  # The renovate image installs node/npm on demand through containerbase, whose
  # tool tree under /opt/containerbase is root-group-writable and owned by the
  # image's own user (uid 12021, gid 0). argo's workflowDefaults run every pod
  # as 65532:65532, which loses that group write, so every tool install died in
  # ~12ms and with it every npm lock-file update — silently, as an artifactError
  # with an empty stderr. Overriding the default here restores the image's own
  # ids; the uid is still non-root, so restricted PSA is satisfied.
  securityContext:
    runAsNonRoot: true
    runAsUser: 12021
    runAsGroup: 0
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: renovate-executor
  entrypoint: main
  podMetadata:
    labels:
      renovate: "true"
  templates:
    - name: main
      volumes:
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
        - name: workdir
          emptyDir: {}
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d5db59cac14b23a4ef85a456754522463267324e8ed3a84e795a2eba829c8f05
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "{{=jsonpath(workflow.parameters.repositories, '$[0]')}}"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: ghcr.io/renovatebot/renovate:44.39.3@sha256:27f008cc48b952dff1fdceed42ef91f243f31e64596dc7f5a8754467961243ad
        command: [sh, -c]
        args:
          - |
            set -e
            export RENOVATE_TOKEN=$(cat /github-token/token)
            export RENOVATE_HOST_RULES=$(node -e "console.log(JSON.stringify([{matchHost:'registry.infra.tgy.io',username:process.env.HARBOR_USER,password:process.env.HARBOR_PASS,hostType:'docker'}]))")
            exec renovate
        env:
          - name: HARBOR_USER
            valueFrom:
              secretKeyRef:
                name: renovate-harbor-robot
                key: username
          - name: HARBOR_PASS
            valueFrom:
              secretKeyRef:
                name: renovate-harbor-robot
                key: password
          - name: RENOVATE_PLATFORM
            value: github
          - name: RENOVATE_REPOSITORIES
            value: "{{workflow.parameters.repositories}}"
          - name: RENOVATE_AUTODISCOVER
            value: "false"
          - name: RENOVATE_ONBOARDING
            value: "false"
          - name: LOG_LEVEL
            value: info
          # keep the clones and the containerbase tool cache on the emptyDir
          # rather than the container's own layer
          - name: HOME
            value: /tmp
          - name: RENOVATE_BASE_DIR
            value: /tmp/renovate
        volumeMounts:
          - name: github-token
            mountPath: /github-token
            readOnly: true
          - name: workdir
            mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: renovate-periodic
  namespace: argo
spec:
  schedules:
    - "0 */4 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: renovate
---
# One installation token covers one account, so repositories under the
# personal account run separately from the organization's. The mutex on the
# template serialises the two runs.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: renovate-periodic-personal
  namespace: argo
spec:
  schedules:
    - "30 */4 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: renovate
    arguments:
      parameters:
        - name: repositories
          value: '["Tsuguya/home-cloudflare","Tsuguya/home-trading"]'

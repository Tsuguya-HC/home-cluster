apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo
spec:
  template:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
    metadata:
      labels:
        webhook-receiver: "true"
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    push:
      owner: Tsuguya-HC
      repository: home-cloudflare
      webhook:
        endpoint: /push
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: home-cloudflare-github-webhook
        key: credential
      active: false
      contentType: json
    talos-build:
      owner: Tsuguya-HC
      repository: talos-custom-build
      webhook:
        endpoint: /talos-build
        port: "12000"
        method: POST
      events:
        - release
      webhookSecret:
        name: talos-custom-build-github-webhook
        key: credential
      active: false
      contentType: json
    home-infra:
      owner: Tsuguya-HC
      repository: home-infra
      webhook:
        endpoint: /home-infra
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: home-infra-github-webhook
        key: credential
      active: false
      contentType: json
    images:
      owner: Tsuguya-HC
      repository: images
      webhook:
        endpoint: /images
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: images-github-webhook
        key: credential
      active: false
      contentType: json
    memory:
      owner: Tsuguya-HC
      repository: memory
      webhook:
        endpoint: /memory
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: memory-github-webhook
        key: credential
      active: false
      contentType: json
    horenso:
      owner: Tsuguya-HC
      repository: horenso
      webhook:
        endpoint: /horenso
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: horenso-github-webhook
        key: credential
      active: false
      contentType: json
    home-trading:
      owner: Tsuguya-HC
      repository: home-trading
      webhook:
        endpoint: /home-trading
        port: "12000"
        method: POST
      events:
        - push
        # pull_request is here for aqua-checksum, which needs the head branch of
        # a Renovate PR; the existing push consumer ignores it.
        - pull_request
        # issues is here for renovate-webhook: ticking a box on the Dependency
        # Dashboard arrives as an issue body edit, and without it the only way
        # to start a run is to wait out the four-hour cron.
        - issues
      webhookSecret:
        name: home-trading-github-webhook
        key: credential
      active: false
      contentType: json
    home-rss:
      owner: Tsuguya-HC
      repository: home-rss
      webhook:

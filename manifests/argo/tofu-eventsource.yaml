apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo
spec:
  template:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    push:
      owner: Tsuguya-HC
      repository: home-cloudflare
      webhook:
        endpoint: /push
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: home-cloudflare-github-webhook
        key: credential
      active: false
      contentType: json
    talos-build:
      owner: Tsuguya-HC
      repository: talos-custom-build
      webhook:
        endpoint: /talos-build
        port: "12000"
        method: POST
      events:
        - release
      webhookSecret:
        name: talos-custom-build-github-webhook
        key: credential
      active: false
      contentType: json
    home-infra:
      owner: Tsuguya-HC
      repository: home-infra
      webhook:
        endpoint: /home-infra
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: home-infra-github-webhook
        key: credential
      active: false
      contentType: json
    images:
      owner: Tsuguya-HC
      repository: images
      webhook:
        endpoint: /images
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: images-github-webhook
        key: credential
      active: false
      contentType: json
    memory:
      owner: Tsuguya-HC
      repository: memory
      webhook:
        endpoint: /memory
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: memory-github-webhook
        key: credential
      active: false
      contentType: json
    horenso:
      owner: Tsuguya-HC
      repository: horenso
      webhook:
        endpoint: /horenso
        port: "12000"
        method: POST
      events:
        - push
      webhookSecret:
        name: horenso-github-webhook
        key: credential
      active: false
      contentType: json
    home-trading:
      owner: Tsuguya-HC
      repository: home-trading
      webhook:
        endpoint: /home-trading
        port: "12000"
        method: POST
      events:
        - push
        # pull_request is here for aqua-checksum, which needs the head branch of
        # a Renovate PR; the existing push consumer ignores it.
        - pull_request
        # issues is here for renovate-webhook: ticking a box on the Dependency
        # Dashboard arrives as an issue body edit, and without it the only way
        # to start a run is to wait out the four-hour cron.
        - issues
      webhookSecret:
        name: home-trading-github-webhook
        key: credential
      active: false
      contentType: json
    home-rss:
      owner: Tsuguya-HC
      repository: home-rss
      webhook:
        endpoint: /home-rss
        port: "12000"
        method: POST
      events:
        - pull_request
      webhookSecret:
        name: home-rss-github-webhook
        key: credential
      active: false
      contentType: json
    home-actions:
      owner: Tsuguya-HC
      repository: home-actions
      webhook:
        endpoint: /home-actions
        port: "12000"
        method: POST
      events:
        - pull_request
      webhookSecret:
        name: home-actions-github-webhook
        key: credential
      active: false
      contentType: json
    taskflow:
      owner: Tsuguya-HC
      repository: taskflow
      webhook:
        endpoint: /taskflow
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: taskflow-github-webhook
        key: credential
      active: false
      contentType: json
    renovate-home-cluster:
      owner: Tsuguya-HC
      repository: home-cluster
      webhook:
        endpoint: /renovate-home-cluster
        port: "12000"
        method: POST
      events:
        - push
        - issues
        - pull_request
      webhookSecret:
        name: renovate-home-cluster-webhook
        key: credential
      active: false
      contentType: json
    renovate-home-infra:
      owner: Tsuguya-HC
      repository: home-infra
      webhook:
        endpoint: /renovate-home-infra
        port: "12000"
        method: POST
      events:
        - push
        - issues
        - pull_request
      webhookSecret:
        name: renovate-home-infra-webhook
        key: credential
      active: false
      contentType: json
    renovate-home-cloudflare:
      owner: Tsuguya-HC
      repository: home-cloudflare
      webhook:
        endpoint: /renovate-home-cloudflare
        port: "12000"
        method: POST
      events:
        - push
        - issues
        - pull_request
      webhookSecret:
        name: renovate-home-cloudflare-webhook
        key: credential
      active: false
      contentType: json
    harbor:
      owner: Tsuguya-HC
      repository: home-harbor
      webhook:
        endpoint: /harbor
        port: "12000"
        method: POST
      events:
        - push
        - pull_request
      webhookSecret:
        name: home-harbor-github-webhook
        key: credential
      active: false
      contentType: json
    unifi:
      owner: Tsuguya-HC
      repository: home-unifi
      webhook:
        endpoint: /unifi
        port: "12000"
        method: POST
      events:
        - pull_request
      webhookSecret:
        name: home-unifi-github-webhook
        key: credential
      active: false
      contentType: json
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: tofu-cloudflare
  namespace: argo
spec:
  template:
    serviceAccountName: workflow-executor
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  dependencies:
    - name: push
      eventSourceName: github-webhook
      eventName: push
      filters:
        script: |-
          if event.body == nil or event.body.ref ~= "refs/heads/main" or event.body.commits == nil then
            return false
          end
          for _, c in ipairs(event.body.commits) do
            for _, list in ipairs({c.added or {}, c.modified or {}, c.removed or {}}) do
              for _, f in ipairs(list) do
                if string.find(f, ".tf", 1, true) then
                  return true
                end
              end
            end
          end
          return false
    - name: pull-request
      eventSourceName: github-webhook
      eventName: push
      filters:
        script: |-
          if event.body == nil or event.body.action == nil then
            return false
          end
          local action = event.body.action
          return action == "opened" or action == "synchronize" or action == "reopened"
  triggers:
    - template:
        name: tofu-apply
        conditions: "push"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: tofu-cloudflare-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: tofu-cloudflare
                arguments:
                  parameters:
                    - name: command
                      value: apply
    - template:
        name: tofu-plan
        conditions: "pull-request"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: tofu-plan-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: tofu-cloudflare-plan
                arguments:
                  parameters:
                    - name: pr-number
                      value: ""
                    - name: branch
                      value: ""
                    - name: author-id
                      value: ""
          parameters:
            - src:
                dependencyName: pull-request
                dataKey: body.number
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: pull-request
                dataKey: body.pull_request.head.ref
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: pull-request
                dataKey: body.pull_request.user.id
              dest: spec.arguments.parameters.2.value
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: tofu-unifi
  namespace: argo
spec:
  template:
    serviceAccountName: workflow-executor
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  dependencies:
    # No push trigger: home-unifi is applied by hand from the workstation
    # (`make apply`), because a bad apply takes the whole house off the
    # network. This sensor only ever plans.
    - name: pull-request
      eventSourceName: github-webhook
      eventName: unifi
      filters:
        script: |-
          if event.body == nil or event.body.pull_request == nil or event.body.action == nil then
            return false
          end
          local action = event.body.action
          return action == "opened" or action == "synchronize" or action == "reopened"
  triggers:
    - template:
        name: tofu-plan
        conditions: "pull-request"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: tofu-unifi-plan-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: tofu-unifi-plan
                arguments:
                  parameters:
                    - name: pr-number
                      value: ""
                    - name: branch
                      value: ""
                    - name: sha
                      value: ""
                    - name: author-id
                      value: ""
          parameters:
            - src:
                dependencyName: pull-request
                dataKey: body.number
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: pull-request
                dataKey: body.pull_request.head.ref
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: pull-request
                dataKey: body.pull_request.head.sha
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: pull-request
                dataKey: body.pull_request.user.id
              dest: spec.arguments.parameters.3.value
---

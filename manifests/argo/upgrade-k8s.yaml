apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-k8s-executor
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-k8s-executor
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upgrade-k8s-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-k8s-executor
subjects:
  - kind: ServiceAccount
    name: upgrade-k8s-executor
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upgrade-k8s-executor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: upgrade-k8s-executor
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: upgrade-k8s
  namespace: argo
spec:
  activeDeadlineSeconds: 3600
  synchronization:
    mutexes:
      - name: upgrade-k8s
  serviceAccountName: upgrade-k8s-executor
  entrypoint: main
  arguments:
    parameters:
      - name: before-sha
      - name: after-sha
  volumes:
    - name: talosconfig
      secret:
        secretName: talosconfig
        defaultMode: 0444
  templates:
    - name: main
      steps:
        - - name: validate
            template: validate
        - - name: upgrade
            template: upgrade
            when: "{{steps.validate.outputs.parameters.should-upgrade}} == true"
            arguments:
              parameters:
                - name: old-version
                  value: "{{steps.validate.outputs.parameters.old-version}}"
                - name: new-version
                  value: "{{steps.validate.outputs.parameters.new-version}}"
                - name: talos-version
                  value: "{{steps.validate.outputs.parameters.talos-version}}"
                - name: nodes-json
                  value: "{{steps.validate.outputs.parameters.nodes-json}}"
                - name: cp-ips
                  value: "{{steps.validate.outputs.parameters.cp-ips}}"
                - name: worker-ips
                  value: "{{steps.validate.outputs.parameters.worker-ips}}"
        - - name: upgrade-remaining
            template: upgrade-remaining
            when: "{{steps.validate.outputs.parameters.should-upgrade}} == true"
            arguments:
              parameters:
                - name: self-node
                  value: "{{steps.upgrade.outputs.parameters.self-node}}"
                - name: safe-node
                  value: "{{steps.upgrade.outputs.parameters.safe-node}}"
                - name: new-version
                  value: "{{steps.validate.outputs.parameters.new-version}}"
                - name: talos-version
                  value: "{{steps.validate.outputs.parameters.talos-version}}"
                - name: nodes-json
                  value: "{{steps.validate.outputs.parameters.nodes-json}}"
        - - name: verify
            template: verify
            when: "{{steps.validate.outputs.parameters.should-upgrade}} == true"
            arguments:
              parameters:
                - name: new-version
                  value: "{{steps.validate.outputs.parameters.new-version}}"
                - name: talos-version
                  value: "{{steps.validate.outputs.parameters.talos-version}}"
                - name: nodes-json
                  value: "{{steps.validate.outputs.parameters.nodes-json}}"
                - name: cp-ips
                  value: "{{steps.validate.outputs.parameters.cp-ips}}"
                - name: worker-ips
                  value: "{{steps.validate.outputs.parameters.worker-ips}}"

    - name: validate
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:b7d1229a8b93c40b7cf10e760b0b113d826febdea2004e59911224262954c719
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            BEFORE="{{workflow.parameters.before-sha}}"
            AFTER="{{workflow.parameters.after-sha}}"

            echo "=== Fetching diff ${BEFORE}...${AFTER} ==="
            DIFF=$(curl -fsSL -H "Accept: application/vnd.github.v3.diff" \
              "https://api.github.com/repos/Tsuguya/home-infra/compare/${BEFORE}...${AFTER}")

            OLD_VER=$(echo "$DIFF" | grep '^-kubernetesVersion:' | sed 's/^-kubernetesVersion: *//' | tr -d '"v' | head -1 || true)
            NEW_VER=$(echo "$DIFF" | grep '^+kubernetesVersion:' | sed 's/^+kubernetesVersion: *//' | tr -d '"v' | head -1 || true)

            if [ -z "$OLD_VER" ] || [ -z "$NEW_VER" ]; then
              echo "No kubernetesVersion change detected."
              echo "false" > /tmp/should-upgrade
              echo "" > /tmp/old-version
              echo "" > /tmp/new-version
              echo "" > /tmp/talos-version
              echo "[]" > /tmp/nodes-json
              echo "" > /tmp/cp-ips
              echo "" > /tmp/worker-ips
              exit 0
            fi

            echo "Version change: ${OLD_VER} -> ${NEW_VER}"

            if echo "$DIFF" | grep -q '^[+-]talosVersion:'; then
              echo "ERROR: talosVersion changed simultaneously. Separate upgrade required."
              exit 1
            fi

            OLD_MM=$(echo "$OLD_VER" | cut -d. -f1,2)
            NEW_MM=$(echo "$NEW_VER" | cut -d. -f1,2)
            if [ "$OLD_MM" != "$NEW_MM" ]; then
              echo "ERROR: Major/minor version change (${OLD_MM} -> ${NEW_MM}). Only patch upgrades are automated."
              exit 1
            fi

            echo "=== Fetching talconfig.yaml at ${AFTER} ==="
            TALCONFIG=$(curl -fsSL "https://api.github.com/repos/Tsuguya/home-infra/contents/talconfig.yaml?ref=${AFTER}" \
              | jq -r '.content' | base64 -d)

            TALOS_VER=$(echo "$TALCONFIG" | yq '.talosVersion')
            echo "Talos version: ${TALOS_VER}"

            NODES_JSON=$(echo "$TALCONFIG" | yq -o=json '[.nodes[] | {"hostname": .hostname, "ip": .ipAddress, "controlPlane": .controlPlane}]')
            echo "Nodes: ${NODES_JSON}"

            CP_IPS=$(echo "$NODES_JSON" | jq -r '[.[] | select(.controlPlane == true) | .ip] | join(",")')
            WORKER_IPS=$(echo "$NODES_JSON" | jq -r '[.[] | select(.controlPlane == false or .controlPlane == null) | .ip] | join(",")')
            echo "CP IPs: ${CP_IPS}"
            echo "Worker IPs: ${WORKER_IPS}"

            echo "true" > /tmp/should-upgrade
            echo "$OLD_VER" > /tmp/old-version
            echo "$NEW_VER" > /tmp/new-version
            echo "$TALOS_VER" > /tmp/talos-version
            echo "$NODES_JSON" > /tmp/nodes-json
            echo "$CP_IPS" > /tmp/cp-ips
            echo "$WORKER_IPS" > /tmp/worker-ips
      outputs:
        parameters:
          - name: should-upgrade
            valueFrom:
              path: /tmp/should-upgrade
          - name: old-version
            valueFrom:
              path: /tmp/old-version
          - name: new-version
            valueFrom:
              path: /tmp/new-version
          - name: talos-version
            valueFrom:
              path: /tmp/talos-version
          - name: nodes-json
            valueFrom:
              path: /tmp/nodes-json
          - name: cp-ips
            valueFrom:
              path: /tmp/cp-ips
          - name: worker-ips
            valueFrom:
              path: /tmp/worker-ips

    - name: upgrade
      inputs:
        parameters:
          - name: old-version
          - name: new-version
          - name: talos-version
          - name: nodes-json
          - name: cp-ips
          - name: worker-ips
      container:
        image: registry.infra.tgy.io/tools/talos-tools:latest@sha256:db5a7dc5af4b49a486c84c1360c9ebb8b54c0cfebd40645957fa0efb81015f45
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            OLD_VER="{{inputs.parameters.old-version}}"
            NEW_VER="{{inputs.parameters.new-version}}"
            TALOS_VER="{{inputs.parameters.talos-version}}"
            NODES_JSON='{{inputs.parameters.nodes-json}}'
            CP_IPS="{{inputs.parameters.cp-ips}}"
            WORKER_IPS="{{inputs.parameters.worker-ips}}"

            LAST_CP=$(echo "$CP_IPS" | tr ',' '\n' | tail -1)

            echo "=== Pre-flight: talosctl health ==="
            talosctl health \
              --talosconfig /etc/talos/config \
              -n "${LAST_CP}" \
              --control-plane-nodes "${CP_IPS}" \
              --worker-nodes "${WORKER_IPS}" \
              --wait-timeout 1m

            echo "=== Verifying current cluster version ==="
            ACTUAL_VER=$(kubectl version -o json | jq -r '.serverVersion.gitVersion' | sed 's/^v//')
            if [ "${ACTUAL_VER}" != "${OLD_VER}" ] && [ "${ACTUAL_VER}" != "${NEW_VER}" ]; then
              echo "ERROR: Unexpected cluster version. expected=${OLD_VER} or ${NEW_VER}, actual=${ACTUAL_VER}"
              exit 1
            fi

            echo "=== Upgrading CP components to v${NEW_VER} (kubelet skipped) ==="
            talosctl upgrade-k8s \
              --talosconfig /etc/talos/config \
              -n "${LAST_CP}" \
              --to "${NEW_VER}" \
              --upgrade-kubelet=false \
              --endpoint "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

            echo "=== Upgrading kubelets (skipping self: ${MY_NODE_NAME}) ==="
            echo "$NODES_JSON" | jq -c '.[]' | while IFS= read -r node; do
              HOSTNAME=$(echo "$node" | jq -r '.hostname')
              SHORT_NAME=$(echo "$HOSTNAME" | cut -d. -f1)
              IP=$(echo "$node" | jq -r '.ip')

              if [ "$SHORT_NAME" = "$MY_NODE_NAME" ]; then
                echo "Skipping self (${SHORT_NAME}), will upgrade in next step"
                continue
              fi

              STATUS=$(kubectl get node "$SHORT_NAME" -o jsonpath='{.status.nodeInfo.kubeletVersion}' 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "v${NEW_VER}" ]; then
                echo "Node ${SHORT_NAME} already at v${NEW_VER}, skipping"
                continue
              fi

              echo "Upgrading kubelet on ${SHORT_NAME} (${IP})"
              # No drain: patching the kubelet image restarts kubelet in place
              # and the containers on the node keep running, so a patch bump
              # needs no eviction. Draining also could not succeed here —
              # single-replica workloads (tempo, rss-pg) carry minAvailable=1
              # PDBs, so their eviction is unsatisfiable by construction and the
              # drain timed out, leaving the node cordoned. If a drain is ever
              # reintroduced, uncordon from a trap so a failure cannot strand a
              # node in SchedulingDisabled.
              talosctl -n "$IP" --talosconfig /etc/talos/config \
                patch machineconfig \
                -p "{\"machine\":{\"kubelet\":{\"image\":\"ghcr.io/siderolabs/kubelet:v${NEW_VER}\"}}}"
              kubectl wait --for=condition=Ready "node/${SHORT_NAME}" --timeout=300s
              echo "Node ${SHORT_NAME} upgraded to v${NEW_VER}"
            done

            echo "$MY_NODE_NAME" > /tmp/self-node
            SAFE_NODE=$(echo "$NODES_JSON" | jq -r --arg self "$MY_NODE_NAME" \
              '[.[] | select(.controlPlane != true) | .hostname | split(".")[0]] | map(select(. != $self)) | .[0]')
            if [ "$SAFE_NODE" = "null" ] || [ -z "$SAFE_NODE" ]; then
              echo "ERROR: No safe worker node found for next step"
              exit 1
            fi
            echo "Safe node for next step: ${SAFE_NODE}"
            echo "$SAFE_NODE" > /tmp/safe-node
        env:
          - name: TALOSCONFIG
            value: /etc/talos/config
          - name: MY_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
          - name: talosconfig
            mountPath: /etc/talos
            readOnly: true
      outputs:
        parameters:
          - name: self-node
            valueFrom:
              path: /tmp/self-node
          - name: safe-node
            valueFrom:
              path: /tmp/safe-node

    - name: upgrade-remaining
      inputs:
        parameters:
          - name: self-node
          - name: safe-node
          - name: new-version
          - name: talos-version
          - name: nodes-json
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.safe-node}}"
      container:
        image: registry.infra.tgy.io/tools/talos-tools:latest@sha256:db5a7dc5af4b49a486c84c1360c9ebb8b54c0cfebd40645957fa0efb81015f45
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            NEW_VER="{{inputs.parameters.new-version}}"
            TALOS_VER="{{inputs.parameters.talos-version}}"
            NODES_JSON='{{inputs.parameters.nodes-json}}'
            SELF_NODE="{{inputs.parameters.self-node}}"

            echo "=== Upgrading last node: ${SELF_NODE} ==="
            IP=$(echo "$NODES_JSON" | jq -r --arg h "$SELF_NODE" \
              '.[] | select((.hostname | split(".")[0]) == $h) | .ip')

            STATUS=$(kubectl get node "$SELF_NODE" -o jsonpath='{.status.nodeInfo.kubeletVersion}' 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "v${NEW_VER}" ]; then
              echo "Node ${SELF_NODE} already at v${NEW_VER}, skipping"
              exit 0
            fi

            echo "Upgrading kubelet on ${SELF_NODE} (${IP})"
            # No drain — see the note in the previous step.
            talosctl -n "$IP" --talosconfig /etc/talos/config \
              patch machineconfig \
              -p "{\"machine\":{\"kubelet\":{\"image\":\"ghcr.io/siderolabs/kubelet:v${NEW_VER}\"}}}"
            kubectl wait --for=condition=Ready "node/${SELF_NODE}" --timeout=300s
            echo "Node ${SELF_NODE} upgraded to v${NEW_VER}"

            echo "=== All nodes upgraded ==="
        env:
          - name: TALOSCONFIG
            value: /etc/talos/config
        volumeMounts:
          - name: talosconfig
            mountPath: /etc/talos
            readOnly: true

    - name: verify
      inputs:
        parameters:
          - name: new-version
          - name: talos-version
          - name: nodes-json
          - name: cp-ips
          - name: worker-ips
      container:
        image: registry.infra.tgy.io/tools/talos-tools:latest@sha256:db5a7dc5af4b49a486c84c1360c9ebb8b54c0cfebd40645957fa0efb81015f45
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        command: [sh, -c]
        args:
          - |
            set -euo pipefail

            NEW_VER="{{inputs.parameters.new-version}}"
            TALOS_VER="{{inputs.parameters.talos-version}}"
            CP_IPS="{{inputs.parameters.cp-ips}}"
            WORKER_IPS="{{inputs.parameters.worker-ips}}"
            NODES_JSON='{{inputs.parameters.nodes-json}}'

            LAST_CP=$(echo "$CP_IPS" | tr ',' '\n' | tail -1)

            echo "=== Post-upgrade: talosctl health ==="
            talosctl health \
              --talosconfig /etc/talos/config \
              -n "${LAST_CP}" \
              --control-plane-nodes "${CP_IPS}" \
              --worker-nodes "${WORKER_IPS}" \
              --wait-timeout 2m

            echo "=== Verifying all nodes ==="
            NODE_COUNT=$(echo "$NODES_JSON" | jq length)
            kubectl get nodes -o json | jq -r '.items[] | "\(.metadata.name) \(.status.nodeInfo.kubeletVersion)"' | while read -r name ver; do
              echo "  ${name}: ${ver}"
            done
            UPGRADED_COUNT=$(kubectl get nodes -o json | jq "[.items[] | select(.status.nodeInfo.kubeletVersion == \"v${NEW_VER}\")] | length")
            echo "Upgraded: ${UPGRADED_COUNT}/${NODE_COUNT}"
        env:
          - name: TALOSCONFIG
            value: /etc/talos/config
        volumeMounts:
          - name: talosconfig
            mountPath: /etc/talos
            readOnly: true

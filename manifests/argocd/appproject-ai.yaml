apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai
  namespace: argocd
spec:
  description: AI/ML infrastructure (Qdrant, Ollama, taskflow, LLM gateway)
  sourceRepos:
    - https://qdrant.github.io/qdrant-helm
    - https://helm.otwld.com/
    - https://github.com/Tsuguya-HC/home-cluster.git
    # Agent Router / Envoy Gateway の OCI chart（oci:// は付けない書き方が ArgoCD の規約）
    - docker.io/envoyproxy
  destinations:
    - server: https://kubernetes.default.svc
      namespace: qdrant
    - server: https://kubernetes.default.svc
      namespace: ollama
    - server: https://kubernetes.default.svc
      namespace: taskflow-system
    - server: https://kubernetes.default.svc
      namespace: llm-gateway
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: envoy-ai-gateway-system
  clusterResourceWhitelist:
    - group: '*'
      kind: CustomResourceDefinition
    # TaskFlow の構造検査 webhook（taskflow #17 / ADR-0006）。cluster-scoped なので
    # ここに無いと ArgoCD が「resource not permitted in project」で apply を拒む。
    # group を '*' にせず絞れるのは、これを出す chart / base が 1 つしかないため。
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    # Agent Router の Pod mutator（extproc 注入）と Envoy Gateway の topologyInjector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    # llm-gateway 用の GatewayClass（Cilium のものとは controllerName が別）
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: '*'
      kind: ClusterRole
    - group: '*'
      kind: ClusterRoleBinding
    - group: ''
      kind: Namespace

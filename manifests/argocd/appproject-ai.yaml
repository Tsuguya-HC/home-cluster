apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai
  namespace: argocd
spec:
  description: AI/ML infrastructure (Qdrant, Ollama, taskflow)
  sourceRepos:
    - https://qdrant.github.io/qdrant-helm
    - https://helm.otwld.com/
    - https://github.com/Tsuguya-HC/home-cluster.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: qdrant
    - server: https://kubernetes.default.svc
      namespace: ollama
    - server: https://kubernetes.default.svc
      namespace: taskflow-system
  clusterResourceWhitelist:
    - group: '*'
      kind: CustomResourceDefinition
    # TaskFlow の構造検査 webhook（taskflow #17 / ADR-0006）。cluster-scoped なので
    # ここに無いと ArgoCD が「resource not permitted in project」で apply を拒む。
    # group を '*' にせず絞れるのは、これを出す chart / base が 1 つしかないため。
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: '*'
      kind: ClusterRole
    - group: '*'
      kind: ClusterRoleBinding
    - group: ''
      kind: Namespace

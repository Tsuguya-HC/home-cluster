apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: User-facing applications
  sourceRepos:
    - https://nextcloud.github.io/helm/
    - https://valkey.io/valkey-helm/
    - https://helm.goharbor.io
    - https://github.com/Tsuguya-HC/home-cluster.git
    # trading のマニフェストは private リポに置く
    # （CNP の egress ルールが取引先とデータソースを列挙するため）
    - https://github.com/Tsuguya/home-trading.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: nextcloud
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: rss
    - server: https://kubernetes.default.svc
      namespace: horenso
    - server: https://kubernetes.default.svc
      namespace: memory
    - server: https://kubernetes.default.svc
      namespace: trading
  clusterResourceWhitelist:
    - group: '*'
      kind: CustomResourceDefinition
    - group: '*'
      kind: ClusterRole
    - group: '*'
      kind: ClusterRoleBinding
    - group: ''
      kind: Namespace

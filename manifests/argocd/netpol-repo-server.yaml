apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            app.kubernetes.io/name: argocd-application-controller
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toFQDNs:
        # GitHub Pages（*.github.io とカスタムドメイン）は IP を共有するので、ここに無い名前も、他の名前を
        # 引いた直後だけは通ってしまう。chart の repo を足したら必ずここにも足す（漏れは数日おきの
        # ComparisonError としてしか出ない）。
        - matchName: "github.com"
        - matchName: "api.github.com"
        - matchName: "argoproj.github.io"
        - matchName: "grafana.github.io"
        - matchName: "grafana-community.github.io"
        - matchName: "oauth2-proxy.github.io"
        - matchName: "aquasecurity.github.io"
        - matchName: "kyverno.github.io"
        - matchName: "cloudnative-pg.github.io"
        - matchName: "kubernetes-sigs.github.io"
        - matchName: "prometheus-community.github.io"
        - matchName: "seaweedfs.github.io"
        - matchName: "stakater.github.io"
        - matchName: "ghcr.io"
        - matchPattern: "*.githubusercontent.com"
        - matchName: "charts.jetstack.io"
        - matchName: "helm.cilium.io"
        - matchName: "helm.goharbor.io"
        - matchName: "charts.external-secrets.io"
        - matchName: "external-secrets.io"
        - matchName: "qdrant.github.io"
        - matchName: "nextcloud.github.io"
        - matchName: "valkey.io"
        - matchName: "1password.github.io"
        - matchName: "helm.otwld.com"
        # Agent Router / Envoy Gateway の OCI チャート（oci://docker.io/envoyproxy）。
        # Docker Hub は 3 ホストに割れる: API は registry-1、トークンは auth、
        # blob は 307 で cloudfront へ飛ぶ（2026-09-17 実測）。どれか 1 つ欠けると
        # チャートを引けず、Application が一度もレンダリングされない。
        - matchName: "registry-1.docker.io"
        - matchName: "auth.docker.io"
        - matchName: "production.cloudfront.docker.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP

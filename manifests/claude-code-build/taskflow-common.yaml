# taskflow-implement 用の parts-ref。同じ ConfigMap を manifests/claude-code/taskflow-common.yaml
# にも置いてあるのは、configMapKeyRef が namespace ローカルだから — claude-code-build は
# privileged PSA のために別 namespace に分けてある（manifests/claude-code-build/namespace.yaml）。
# 経緯とこの ConfigMap の設計判断は manifests/claude-code/taskflow-common.yaml のコメントを参照。
# sha は必ずそちらと同じ値にする（renovate.jsonc の customManager が両方を書き換える）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: parts-ref
  namespace: claude-code-build
data:
  # renovate: datasource=git-refs depName=https://github.com/Tsuguya-HC/parts
  branch: main
  sha: 7a3ad935ce3c5f83c071612b2428a0f94aa3f36b

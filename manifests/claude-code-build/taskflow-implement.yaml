apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-implementer
  namespace: claude-code-build
automountServiceAccountToken: false
---
# 出口は llm-gateway・GitHub gateway・依存の取得先だけ。**api.anthropic.com も openrouter.ai も
# 書かない** — env が効かずに外部 LLM へ直行する取り違えを、緑で通さないため。上流の選択は
# gateway の仕事で、この Pod は alias しか知らない（#942）。ただし正しく設定されていても
# 直行しうるため、下の DISABLE_TELEMETRY 等 3 本で止めてある
# （根拠は manifests/claude-code/taskflow-common.yaml）。
# DNS は CCNP allow-dns で全 Pod に共通適用済み。ingress は書かないので全 deny。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: taskflow-implement
  namespace: claude-code-build
spec:
  endpointSelector:
    matchLabels:
      taskflow-implement: "true"
  egress:
    # 推論は llm-gateway 経由。in-cluster なので toFQDNs ではなく toEndpoints。
    # 対向の ingress は manifests/llm-gateway/netpol.yaml 側が claude-code-build を含む。
    # 10080 は LLM（#942）、10443 は GitHub（#1038）。どちらも llm-gateway namespace の
    # Envoy で、この 1 本が両方に当たる（manifests/claude-code/netpol.yaml と同じ形）。
    # **api.github.com は書かない** — この Pod は GitHub の資格情報を持たず、gateway を
    # 通さない API 呼び出しは設定の取り違えなので、緑で通さず drop させる。
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            io.kubernetes.pod.namespace: llm-gateway
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    - toFQDNs:
        - matchPattern: "*.githubusercontent.com"
        # 依存の取得。ここに無い宛先は失敗ではなくハングするので、対応する言語を
        # 足すときはここも足す（claude-md/build-sandbox.md にその前提を書いてある）
        - matchName: "index.crates.io"
        - matchName: "static.crates.io"
        - matchName: "registry.npmjs.org"
        - matchName: "proxy.golang.org"
        - matchName: "sum.golang.org"
        # Go toolchain の配布物の取得先。
        - matchName: "storage.googleapis.com"
        # Releases の配布物の入口。実体は *.githubusercontent.com へのリダイレクト。
        # 資格情報が無いので、届くのは公開リポの読み取りだけ。
        - matchName: "github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

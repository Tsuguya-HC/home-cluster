apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: claude-code-generic
  namespace: claude-code
spec:
  activeDeadlineSeconds: 3600
  serviceAccountName: claude-code-executor
  entrypoint: main
  onExit: notify
  arguments:
    parameters:
      - name: repo
      - name: branch
      - name: prompt
      - name: skip-if-pr-exists
        default: "true"
      - name: signed-commit
        default: "false"
      - name: pr-title
        default: ""
      - name: pr-labels
        default: ""
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: check-existing-pr
            template: check-existing-pr
            when: "{{workflow.parameters.skip-if-pr-exists}} == true"
        - - name: run-audit
            template: claude-code
            when: "'{{workflow.parameters.skip-if-pr-exists}}' != 'true' || '{{steps.check-existing-pr.outputs.result}}' == 'no-pr'"
        - - name: create-signed-pr
            template: create-signed-pr
            when: "'{{workflow.parameters.signed-commit}}' == 'true' && '{{steps.run-audit.status}}' == 'Succeeded'"

    - name: check-existing-pr
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
        env:
          # GitHub は gateway 経由（#1038）。この Pod は GitHub の資格情報を持たない。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。**
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: claude-code-generic
          - name: HOME
            value: /tmp
        command: [sh]
        source: |
          REPO="{{workflow.parameters.repo}}"
          BRANCH="{{workflow.parameters.branch}}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          # wget で api.github.com を直接叩いていたのをやめる（#1038）。gh は GH_HOST を
          # 見るので、同じ問い合わせが gateway 経由になる。
          OPEN_PRS=$(gh api "repos/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}" \
            --jq 'length')
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "has-pr"
          else
            echo "no-pr"
          fi
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    - name: claude-code
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
          command: [sh, -c]
          args:
            - |
              REPO="{{workflow.parameters.repo}}"
              BRANCH="{{workflow.parameters.branch}}"
              git config --global --add safe.directory /workspace
              # 呼び出し元鍵を載せる。gateway が実 installation token に付け替える。
              git config --global "http.https://${GH_HOST}/.extraHeader" \
                "Authorization: token ${GH_ENTERPRISE_TOKEN}"
              git clone "https://${GH_HOST}/${REPO}.git" /workspace
              cd /workspace
              git checkout -b "${BRANCH}"
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
              mkdir -p /workspace/.bin
          env:
            # GitHub は gateway 経由（#1038）。この Pod は GitHub の資格情報を持たない。
            - name: GH_HOST
              value: gh-rw.infra.tgy.io
            # gateway のクライアントキー。**GitHub の資格情報ではない。**
            - name: GH_ENTERPRISE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-gateway-client-keys
                  key: claude-code-generic
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: claude-home
              mountPath: /claude-home
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:f9975ee734aff717fc5ed3422c48bb19cf69b9ae783a85a7ebe361a1cc802095
        command: [sh, -c]
        args:
          - |
            cd /workspace
            SIGNING_INSTRUCTION="

            ## Git コミット（署名付き）
            git commit + git push の代わりに、github-signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /usr/local/bin/github-signed-commit.sh -r {{workflow.parameters.repo}} -m 'コミットメッセージ' を実行
            これにより GitHub API 経由で署名付きコミットが作成され、ローカルも同期される。"
            claude --model review -p "${PROMPT}${SIGNING_INSTRUCTION}" --verbose --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent"
        env:
          # GitHub は gateway 経由（#1038）。この Pod は GitHub の資格情報を持たない。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。**
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: claude-code-generic
          - name: HOME
            value: /claude-home
          - name: PROMPT
            value: "{{workflow.parameters.prompt}}"
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
          # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
          # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
          # 外では使えない（CNP の内側）。handler 単位で revoke できる。
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-gateway-client-keys
                key: claude-code-generic
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの handler からの呼び出しかを gateway に名乗る（アクセスログの tf.handler）。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: claude-code-generic"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。親と同じ alias に括り付ける。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
        # api.anthropic.com への直行を止める 3 本。根拠は taskflow-common.yaml 参照。
        envFrom:
          - configMapRef:
              name: claude-code-disable-nonessential-traffic
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

    - name: create-signed-pr
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
        env:
          # GitHub は gateway 経由（#1038）。この Pod は GitHub の資格情報を持たない。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。**
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: claude-code-generic
          - name: HOME
            value: /tmp
        command: [sh]
        source: |
          set -eu

          REPO="{{workflow.parameters.repo}}"
          BRANCH="{{workflow.parameters.branch}}"
          PR_TITLE="{{workflow.parameters.pr-title}}"
          PR_LABELS="{{workflow.parameters.pr-labels}}"

          BRANCH_REF=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" 2>/dev/null) || {
            echo "Branch ${BRANCH} not found, no changes to process"
            exit 0
          }
          UNSIGNED_SHA=$(echo "$BRANCH_REF" | jq -r '.object.sha')

          COMMIT_INFO=$(gh api "repos/${REPO}/git/commits/${UNSIGNED_SHA}")
          TREE_SHA=$(echo "$COMMIT_INFO" | jq -r '.tree.sha')
          PARENT_SHA=$(echo "$COMMIT_INFO" | jq -r '.parents[0].sha')
          ORIGINAL_MSG=$(echo "$COMMIT_INFO" | jq -r '.message')

          PARENT_TREE=$(gh api "repos/${REPO}/git/commits/${PARENT_SHA}" -q '.tree.sha')
          if [ "$TREE_SHA" = "$PARENT_TREE" ]; then
            echo "No changes in branch, skipping"
            gh api "repos/${REPO}/git/refs/heads/${BRANCH}" --method DELETE || true
            exit 0
          fi

          COMMIT_MSG="${PR_TITLE}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="$ORIGINAL_MSG"
          fi
          jq -n --arg msg "$COMMIT_MSG" --arg tree "$TREE_SHA" --arg parent "$PARENT_SHA" \
            '{"message":$msg,"tree":$tree,"parents":[$parent]}' > /tmp/create_commit.json
          SIGNED_SHA=$(gh api "repos/${REPO}/git/commits" \
            --method POST --input /tmp/create_commit.json -q '.sha')
          echo "Created signed commit: $SIGNED_SHA (replacing unsigned ${UNSIGNED_SHA})"

          jq -n --arg sha "$SIGNED_SHA" '{"sha":$sha,"force":true}' | \
            gh api "repos/${REPO}/git/refs/heads/${BRANCH}" --method PATCH --input -
          echo "Updated branch: $BRANCH"

          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          EXISTING=$(gh api "repos/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}" -q 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR already exists on branch ${BRANCH}"
            exit 0
          fi

          PR_BODY=$(echo "$ORIGINAL_MSG" | tail -n +2 | sed '1{/^$/d}')
          if [ -z "$PR_BODY" ]; then
            PR_BODY="Automated update by Claude"
          fi

          jq -n --arg title "$PR_TITLE" --arg head "$BRANCH" --arg body "$PR_BODY" \
            '{"title":$title,"head":$head,"base":"main","body":$body}' > /tmp/create_pr.json
          PR_URL=$(gh api "repos/${REPO}/pulls" \
            --method POST --input /tmp/create_pr.json -q '.html_url')
          echo "Created PR: $PR_URL"

          if [ -n "$PR_LABELS" ]; then
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "$PR_LABELS" | tr ',' '\n' | jq -R . | jq -s '{"labels":.}' | \
              gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --method POST --input -
            echo "Added labels: $PR_LABELS"
          fi
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

    - name: notify
      steps:
        - - name: send
            templateRef:
              name: discord-notify
              template: send
              clusterScope: true

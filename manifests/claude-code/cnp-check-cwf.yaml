# CNP カバレッジ点検。判定を散文ではなくディレクトリで受け取る実験を兼ねる。
#
# エージェントは out/{pass,attention,escalate} のいずれかにレポートを置く。out/ 自体は
# 別 uid の所有で 0555 なので、語彙の外にディレクトリを作ることが mkdir の時点でできない。
# 判定は Argo の output parameter で持ち出す（workflow の emptyDir はステップ間で共有されない）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-cnp-reader
  namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-cnp-reader
rules:
  # 点検に要るものだけ。claude-code-sre と違い pods/exec は持たない。
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-cnp-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-cnp-reader
subjects:
  - kind: ServiceAccount
    name: agent-cnp-reader
    namespace: claude-code
---
# Argo の executor は自分の結果を workflowtaskresults に書く。これが無いと
# コンテナが何をしたかに関わらず exit 64 で落ちる。既存の SA は ClusterRole
# argo-workflows-edit に縛られているが、あれは workflow の create/delete まで
# 含むので、読むだけの点検には過大。executor が要る最小だけを与える。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-executor
  namespace: claude-code
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-cnp-reader-executor
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-executor
subjects:
  - kind: ServiceAccount
    name: agent-cnp-reader
    namespace: claude-code
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: cnp-check
  namespace: claude-code
spec:
  schedules:
    - "0 3 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    entrypoint: main
    onExit: notify
    serviceAccountName: agent-cnp-reader
    activeDeadlineSeconds: 1500
    podMetadata:
      labels:
        claude-code: "true"
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    volumes:
      - name: work
        emptyDir: {}
      - name: prompt
        projected:
          sources:
            - configMap:
                name: agent-verdict-protocol
            - configMap:
                name: cnp-check-prompt
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [wn-03]
    templates:
      - name: main
        steps:
          - - name: analyze
              template: analyze

      - name: analyze
        securityContext:
          # エージェントは 65533。ディレクトリを作る init は 65532。所有者が違うので
          # エージェントは out/ を chmod し直すことも、新しい分類を生やすこともできない。
          runAsUser: 65533
          runAsNonRoot: true
          runAsGroup: 65532
          fsGroup: 65532
        initContainers:
          - name: prepare
            image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
            command: [sh, -c]
            args:
              - |
                set -eu
                mkdir -p /work/out/pass /work/out/attention /work/out/escalate
                chmod 0775 /work/out/pass /work/out/attention /work/out/escalate
                chmod 0555 /work/out
                ls -la /work/out
            securityContext:
              runAsUser: 65532
              runAsGroup: 65532
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
        container:
          image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d18dbca36308e573509c2617ab6c57e050facfb0723ed29386101117408c0b1f
          command: [sh, -c]
          workingDir: /work
          args:
            - |
              # 指示は ConfigMap から読む。ここでは組み立てない。
              PROMPT="$(cat /prompt/cnp-check.md; echo; cat /prompt/verdict-protocol.md)"

              claude -p \
                --verbose \
                --output-format stream-json \
                --dangerously-skip-permissions \
                --allowedTools "Bash,Read,Write,Grep,Glob" \
                --model sonnet \
                --max-turns 40 \
                "$PROMPT" || true

              # ---- 判定の回収。ここから先はエージェントの発話を一切読まない ----
              FOUND=""
              COUNT=0
              for v in pass attention escalate; do
                if [ -n "$(ls -A "/work/out/$v" 2>/dev/null)" ]; then
                  FOUND="$v"
                  COUNT=$((COUNT + 1))
                fi
              done

              if [ "$COUNT" = "1" ]; then
                VERDICT="$FOUND"
                head -c 3500 "/work/out/$FOUND/report.md" > /work/report.md 2>/dev/null || true
              else
                VERDICT=indeterminate
                echo "非空のディレクトリが $COUNT 個ありました（ちょうど 1 個であるべき）。" > /work/report.md
                ls -laR /work/out >> /work/report.md 2>&1 || true
              fi

              if [ ! -s /work/report.md ]; then
                echo "レポートが空でした。" > /work/report.md
              fi

              printf '%s' "$VERDICT" > /work/verdict.txt
              echo "verdict: $VERDICT"
          env:
            - name: HOME
              value: /tmp
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-code-token
                  key: credential
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: prompt
              mountPath: /prompt
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
        outputs:
          parameters:
            - name: verdict
              valueFrom:
                path: /work/verdict.txt
                default: indeterminate
              globalName: cnp-check-verdict
            - name: report
              valueFrom:
                path: /work/report.md
                default: "レポートを取得できませんでした。Argo UI でログを確認してください。"
              globalName: cnp-check-report

      - name: notify
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
        container:
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [sh, -c]
          args:
            - |
              VERDICT='{{workflow.outputs.parameters.cnp-check-verdict}}'
              REPORT=$(printf '%s' '{{workflow.outputs.parameters.cnp-check-report}}' | head -c 3800)
              WF_NAME="{{workflow.name}}"
              NS="{{workflow.namespace}}"
              URL="https://argo.infra.tgy.io/workflows/${NS}/${WF_NAME}"
              TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

              case "$VERDICT" in
                pass)      COLOR=65280 ;;
                attention) COLOR=16776960 ;;
                *)         COLOR=16711680 ;;
              esac

              PAYLOAD=$(jq -n \
                --arg title "CNP check: ${VERDICT}" \
                --arg url "$URL" \
                --argjson color "$COLOR" \
                --arg report "$REPORT" \
                --arg ts "$TIMESTAMP" \
                '{embeds: [{title: $title, url: $url, color: $color, description: $report, timestamp: $ts}]}')

              wget -qO /dev/null --header="Content-Type: application/json" \
                --post-data="$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: discord-webhook-argo
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

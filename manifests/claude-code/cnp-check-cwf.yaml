# CNP カバレッジ点検の定期投入。
#
# 点検の本体は taskflow-cnp-check.yaml の TaskHandler / TaskFlow で、ここは毎日 Task を
# 1 つ作るだけ（設計 §14「生成元はグラフを知らない」）。Step 0 で Argo Workflow として
# 動かしていた本体は Task に移り、この cron は起票に縮んだ。
#
# 前半の SA / RBAC は TaskHandler の Pod（agent-cnp-reader）のもの。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-cnp-reader
  namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-cnp-reader
rules:
  # 点検に要るものだけ。claude-code-sre と違い pods/exec は持たない。
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-cnp-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-cnp-reader
subjects:
  - kind: ServiceAccount
    name: agent-cnp-reader
    namespace: claude-code
---
# Argo の executor は自分の結果を workflowtaskresults に書く。これが無いと
# コンテナが何をしたかに関わらず exit 64 で落ちる。既存の SA は ClusterRole
# argo-workflows-edit に縛られているが、あれは workflow の create/delete まで
# 含むので、読むだけの点検には過大。executor が要る最小だけを与える。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-executor
  namespace: claude-code
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-cnp-reader-executor
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-executor
subjects:
  - kind: ServiceAccount
    name: agent-cnp-reader
    namespace: claude-code
---
# 起票用。tasks の create しか持たない（handler の SA とは別に切る: 起票する側が
# 点検する権限を持つ必要はない）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-submitter
  namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-submitter
  namespace: claude-code
rules:
  - apiGroups: [flow.tgy.io]
    resources: [tasks]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-submitter
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-submitter
subjects:
  - kind: ServiceAccount
    name: task-submitter
    namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-submitter-executor
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-executor
subjects:
  - kind: ServiceAccount
    name: task-submitter
    namespace: claude-code
---
# 起票 Pod は argoexec が apiserver に Task を POST するだけ。claude-code=true の CNP は
# api.anthropic.com や Loki まで開くので使わず、apiserver だけの専用 CNP にする。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: task-submitter
  namespace: claude-code
spec:
  endpointSelector:
    matchLabels:
      task-submitter: "true"
  ingressDeny:
    - fromEntities:
        - world
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: cnp-check
  namespace: claude-code
spec:
  schedules:
    - "0 3 * * *"
  timezone: Asia/Tokyo
  # 前日の Task が残っていても起票は止めない。同時実行の上限は flow 側
  # （TaskFlow.spec.maxInFlight / dedupKey、taskflow #17）の仕事で、cron 1 本の
  # concurrencyPolicy では守れない（設計 §18）。ここでは起票 Workflow 同士の重複だけ防ぐ。
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    entrypoint: create
    serviceAccountName: task-submitter
    activeDeadlineSeconds: 300
    podMetadata:
      labels:
        task-submitter: "true"
    # 走るのは argoexec だけ（イメージの USER 8737）。
    securityContext:
      runAsNonRoot: true
      runAsUser: 8737
      seccompProfile:
        type: RuntimeDefault
    templates:
      - name: create
        resource:
          action: create
          manifest: |
            apiVersion: flow.tgy.io/v1alpha1
            kind: Task
            metadata:
              generateName: cnp-check-
              namespace: claude-code
            spec:
              flow: cnp-check

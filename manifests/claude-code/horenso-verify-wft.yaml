# horenso の変更を、実際に動かして確かめる。
#
# CI が緑でも「意図した状態変化が起きた」ことは証明されない。ここでやるのは
# 使い捨ての PostgreSQL を横に立て、ブランチのコードをそのまま起動し、
# 書き込みパスを通して保存先で読み戻すこと。
#
# 検証内容は #76（result が 3800 バイトで切り詰められ UTF-8 が壊れる）の型に合わせてある。
# 読み取り系が 200 を返すこと、workflow が Succeeded になることは、
# あのバグを 7 週間見逃した理由そのものだった。
# 検証実行専用の ServiceAccount。クラスタ上の何も読まない。
# 必要なのは argoexec が自分の結果を報告する権限だけで、GitHub の資格情報は
# volume 経由で渡るので RBAC は要らない。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-verify
  namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-verify-executor
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-executor
subjects:
  - kind: ServiceAccount
    name: agent-verify
    namespace: claude-code
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: horenso-verify
  namespace: claude-code
spec:
  # templateRef で呼ばれるほか、単体でも起動できるようにしておく。
  # entrypoint と arguments が無いと `argo submit --from` が
  # `spec.entrypoint is required` で落ちる
  entrypoint: verify
  # 単体起動では呼び出し元がいないので、ここで指定しないと `default` が使われ、
  # argoexec が workflowtaskresults を作れず exit 64 になる
  serviceAccountName: agent-verify
  # namespace の CNP はこのラベルで選択する。template 側の
  # `metadata.labels` だけでは、単体起動したとき（呼び出し元の
  # podMetadata が無いとき）にベースラインのカバレッジから静かに外れ、
  # github-auth が GitHub に届かず exit 28 で落ちる。
  podMetadata:
    labels:
      claude-code: "true"
  arguments:
    parameters:
      - name: repo
      - name: branch
  templates:
    - name: verify
      inputs:
        parameters:
          - name: repo
          - name: branch
      metadata:
        labels:
          agent.tgy.io/phase: verifying
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      # 呼び出し元の workflow が宣言した volume に依存しない。
      # templateRef で他所から呼ばれる前提なので、名前の一致を規約に頼らない
      volumes:
        - name: work
          emptyDir: {}
        - name: pgdata
          emptyDir: {}
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
        - name: scripts
          configMap:
            name: horenso-verify-scripts
      # 使い捨ての PostgreSQL。本番 DB には一切触れない
      sidecars:
        - name: postgres
          # 本番（CNPG）は PostgreSQL 18。メジャーを揃えてある。
          # Kyverno の署名検証は registry.infra.tgy.io/* のみが対象なので上流イメージで通る
          image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          # emissary executor はイメージの entrypoint を知る必要があり、
          # 自分の index に無いものは registry へ問い合わせに行く。argo から
          # docker.io への egress は無いので、そこで Pod が Pending のまま止まる。
          # crane config で読んだ値をそのまま明示して問い合わせを不要にする
          command: [docker-entrypoint.sh]
          args: [postgres]
          env:
            - {name: POSTGRES_USER, value: horenso}
            - {name: POSTGRES_PASSWORD, value: horenso}
            - {name: POSTGRES_DB, value: horenso}
            - {name: PGDATA, value: /pgdata/db}
          securityContext:
            # イメージ既定は root。非 root で動かすので、PGDATA は
            # 自分で mkdir できる場所（/pgdata/db）に置く。親は fsGroup で g+w
            runAsUser: 70
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: pgdata, mountPath: /pgdata}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5e9b27dfa5042f7d9a3518c305283c1e665ebca44645d740fb592b48fedca627
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_REPO, value: "{{inputs.parameters.repo}}"}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:3e95cb84f1deb993199f220d9b4083ab7202d8c6e1278fbe4ae802dfc343df06
        command: [sh, /scripts/verify.sh]
        env:
          - {name: HOME, value: /tmp}
          - {name: REPO, value: "{{inputs.parameters.repo}}"}
          - {name: BRANCH, value: "{{inputs.parameters.branch}}"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: work, mountPath: /work}
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: scripts, mountPath: /scripts, readOnly: true}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 2Gi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /work/verdict.txt, default: indeterminate}
          - name: report
            valueFrom: {path: /work/report.md, default: "検証結果を取得できませんでした。"}

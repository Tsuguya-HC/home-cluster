# implement フロー用の指示。ワークフローのヒアドキュメントから出して、
# プロンプトだけを単独で直せるようにする。判定プロトコルは全タスク共通の
# agent-verdict-protocol にあり、ここには置かない。
apiVersion: v1
kind: ConfigMap
metadata:
  name: implement-prompts
  namespace: claude-code
data:
  implement.md: |
    # 実装

    依頼された変更を `/workspace` に対して行う。

    ## 目的と重要度

    目的は **依頼された変更を、壊さずに、最小の差分で入れること**。
    重要度はクラスタ運用者の判断基準であり、データから導出できるものではない:

    | 重要度 | 該当するもの |
    |---|---|
    | **最優先** | 依頼された変更が実際に効くこと |
    | **次** | 既存の挙動を壊さないこと。関係ない箇所を触らない |
    | **禁止** | 到達範囲・権限・依存の広がる変更（依頼に含まれていない限り） |

    ## 制約

    - **依頼された範囲の外を触らない。** ついでの整理・リネーム・書式変更をしない
    - 既存のコードのスタイル（命名・コメント密度・イディオム）に合わせる
    - 秘密情報をコミットしない
    - コミットは自動で行われるので、あなたは**ファイルを変更するだけ**でよい

    ## 差し戻された場合

    このフローは差し戻しで再実行される。**ブランチには前回の変更が既に入っている**ので、
    やり直しではなく**指摘された点の修正**を行う。前回の変更を消さないこと。

    ## 報告

    何をどう変えたかを簡潔に述べる。**確かめていないことは「未確認」と明記する**。
    「動くはず」と「動かした」を区別すること。

  review.md: |
    # 変更のレビュー

    ブランチの diff を読み、この変更を PR として出してよいかを判定する。

    ## 目的と重要度

    目的は **壊れた変更・範囲外の変更を止めること**。網羅的な指摘ではない。

    | 重要度 | 該当するもの |
    |---|---|
    | **高（差し戻す）** | 依頼された変更が実現されていない / 既存の挙動を壊す / 依頼の範囲外の変更が混ざっている |
    | **中（差し戻す）** | 秘密情報の混入、到達範囲や権限の拡大 |
    | **低（通す。指摘だけ残す）** | 好みの問題、より良い書き方の提案 |

    **低しかないなら通すこと。** 完璧を求めて差し戻さない。

    ## 手順

    1. `gh api repos/<repo>/compare/main...<branch>` で diff を取得する
    2. 依頼された内容と照合する
    3. 依頼に含まれない変更が混ざっていないか確認する
    4. 決定論的な検証の結果（プロンプトに含まれている）と矛盾しないか確認する

    ## 主張ごとに要求される裏取り

    | 主張 | 併記する根拠 |
    |---|---|
    | 依頼された変更が実現されていない | diff のどの部分を見てそう判断したか |
    | 既存の挙動を壊す | 壊れる経路（どの呼び出しがどう変わるか）。**推測なら「未確認の推測」と明記** |
    | 範囲外の変更が混ざっている | 該当するファイルと行 |

    裏が取れなかった主張は、書かないか「未確認の推測」と明記する。

    ## 判断できない場合

    diff が取得できない、依頼の意図が読み取れない、影響範囲が判断できない — これらは
    **失敗ではない**。無理に pass / rework を選ばず escalate を選ぶこと。

# Issue を受けて実装し、自分の変更を検証し、判定に応じて PR を出すか差し戻すか決める。
#
# 構造の意図:
#   - 判定は文章ではなく「どこに置いたか」で表す。回収側は ls するだけで発話を読まない
#   - out/ は別 uid の所有で 0555 なので、エージェントは語彙の外を表現できない
#   - 安いゲート（ビルド）を先に置き、落ちたらレビューを回さない
#   - 差し戻しは再帰。予算は減るだけで、尽きたら人間に上げる
#   - 非空ディレクトリがちょうど 1 つでなければ indeterminate。判定不能は承認ではない
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: implement
  namespace: claude-code
spec:
  activeDeadlineSeconds: 5400
  serviceAccountName: claude-code-executor
  entrypoint: main
  # onExit は書かない。argo-workflows の workflowDefaults が
  # discord-notify を全ワークフローに付けるので、書くと通知が二重になる
  arguments:
    parameters:
      - name: repo
      - name: branch
      - name: task            # 何をするか。原因や方針は書かない
      - name: pr-title
      - name: pr-labels
        default: ""
      - name: build-cmd       # check フェーズが走らせる決定論的な検証
        default: "pnpm install --frozen-lockfile && pnpm build"
      - name: workdir
        default: "."
      - name: rework-budget
        default: "2"
  # namespace の CNP はこのラベルで選択する。フェーズ別ラベルだけにすると
  # ベースラインのカバレッジから静かに外れ、argoexec が API server に届かない
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
    - name: github-token
      emptyDir: {}
    - name: github-app-secret
      secret:
        secretName: github-app-private-key
    - name: verdict
      emptyDir: {}
    - name: prompt
      projected:
        sources:
          - configMap:
              name: agent-verdict-protocol
          - configMap:
              name: implement-prompts
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [wn-03]
  templates:
    - name: main
      steps:
        - - name: cycle
            template: implement-cycle
            arguments:
              parameters:
                - name: budget
                  value: "{{workflow.parameters.rework-budget}}"

    # implement -> check -> review -> 判定に応じて PR / 再帰 / エスカレーション
    - name: implement-cycle
      inputs:
        parameters:
          - name: budget
      steps:
        - - name: implement
            template: implement
        # 安いゲートを先に。落ちたらレビューにトークンを使わない
        - - name: check
            template: check
        - - name: review
            template: review
            when: "{{steps.check.outputs.parameters.verdict}} == pass"
            arguments:
              parameters:
                - name: check-report
                  value: "{{steps.check.outputs.parameters.report}}"
        # 合成規則は固定: 最も不利な verdict が勝つ
        - - name: combine
            template: combine
            arguments:
              parameters:
                - name: check
                  value: "{{steps.check.outputs.parameters.verdict}}"
                - name: review
                  value: "{{steps.review.outputs.parameters.verdict}}"
        - - name: create-pr
            template: create-pr
            when: "{{steps.combine.outputs.parameters.verdict}} == pass"
          - name: again
            template: implement-cycle
            when: "{{steps.combine.outputs.parameters.verdict}} == rework && {{inputs.parameters.budget}} > 0"
            arguments:
              parameters:
                - name: budget
                  value: "{{=asInt(inputs.parameters.budget) - 1}}"
          # 予算切れの rework と、明示的な escalate / indeterminate は同じ扱い
          - name: escalate
            template: escalate
            when: "({{steps.combine.outputs.parameters.verdict}} == rework && {{inputs.parameters.budget}} <= 0) || {{steps.combine.outputs.parameters.verdict}} != pass && {{steps.combine.outputs.parameters.verdict}} != rework"
            arguments:
              parameters:
                - name: verdict
                  value: "{{steps.combine.outputs.parameters.verdict}}"

    # ---- Implementing: エージェントが変更してブランチに push する ----
    - name: implement
      metadata:
        labels:
          agent.tgy.io/phase: implementing
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "113765957"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [sh, -c]
          args:
            - |
              set -eu
              GITHUB_TOKEN=$(cat /github-token/token)
              REPO="{{workflow.parameters.repo}}"
              BRANCH="{{workflow.parameters.branch}}"
              git config --global --add safe.directory /workspace
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" /workspace
              cd /workspace
              # 差し戻しで 2 周目以降はブランチが既にある
              git checkout "${BRANCH}" 2>/dev/null || git checkout -b "${BRANCH}"
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: github-token, mountPath: /github-token, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d18dbca36308e573509c2617ab6c57e050facfb0723ed29386101117408c0b1f
        command: [sh, -c]
        workingDir: /workspace
        args:
          - |
            export GITHUB_TOKEN=$(cat /github-token/token)
            PROMPT="$(cat /prompt/implement.md)

            ## このタスク

            {{workflow.parameters.task}}

            ## 対象

            リポジトリ: {{workflow.parameters.repo}}（/workspace に clone 済み、ブランチ {{workflow.parameters.branch}}）
            作業ディレクトリ: {{workflow.parameters.workdir}}"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Grep,Glob" \
              --model sonnet \
              --max-turns 60 \
              "$PROMPT" || true

            cd /workspace
            if git diff --quiet && git diff --cached --quiet; then
              echo "変更なし"
              exit 0
            fi
            # 署名コミットは staged changes から GitHub API 経由で作る。
            # ローカルの git commit + push では署名が付かず ruleset に弾かれる
            git add -A
            export GH_TOKEN="$GITHUB_TOKEN"
            github-signed-commit.sh \
              -r "{{workflow.parameters.repo}}" \
              -b "{{workflow.parameters.branch}}" \
              -m "{{workflow.parameters.pr-title}}"
        env:
          - {name: HOME, value: /tmp}
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef: {name: claude-code-token, key: credential}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: claude-home, mountPath: /claude-home}
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: prompt, mountPath: /prompt, readOnly: true}
        resources:
          requests: {cpu: 200m, memory: 1Gi}
          limits: {memory: 6Gi}

    # ---- Checks: 決定論的な検証。LLM を使わないので語彙の強制は不要 ----
    # ビルドの exit 0 は「プロセスが 0 で終了した」ことしか証明しない。
    # 成果物が整合しているか（index.html が参照する資産が実在するか）まで見る。
    - name: check
      metadata:
        labels:
          agent.tgy.io/phase: checks
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d18dbca36308e573509c2617ab6c57e050facfb0723ed29386101117408c0b1f
        command: [sh, -c]
        args:
          - |
            set -u
            GITHUB_TOKEN=$(cat /github-token/token)
            git config --global --add safe.directory /workspace
            git clone --depth 1 --branch "{{workflow.parameters.branch}}" \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/{{workflow.parameters.repo}}.git" \
              /workspace 2>&1 | tail -2 || {
                printf '%s' rework > /verdict/verdict.txt
                echo "ブランチを clone できませんでした" > /verdict/report.md
                exit 0
              }
            cd "/workspace/{{workflow.parameters.workdir}}"

            LOG=/tmp/build.log
            if ! sh -c "{{workflow.parameters.build-cmd}}" > "$LOG" 2>&1; then
              printf '%s' rework > /verdict/verdict.txt
              { echo "## ビルド失敗"; echo; echo '```'; tail -c 3000 "$LOG"; echo '```'; } > /verdict/report.md
              exit 0
            fi

            # exit 0 は成果物の整合を保証しない。index.html が参照する資産の実在まで確認する
            OUT=""
            for d in dist build out; do [ -d "$d" ] && OUT="$d" && break; done
            if [ -z "$OUT" ] || [ ! -f "$OUT/index.html" ]; then
              printf '%s' rework > /verdict/verdict.txt
              echo "ビルドは成功したが成果物（dist/build/out の index.html）が見つかりません" > /verdict/report.md
              exit 0
            fi
            MISSING=""
            for ref in $(grep -oE '(src|href)="[^"]+"' "$OUT/index.html" | sed 's/.*"\(.*\)"/\1/'); do
              case "$ref" in http*|//*|\#*|data:*) continue ;; esac
              p="$OUT/${ref#/}"
              [ -f "$p" ] || MISSING="$MISSING $ref"
            done
            if [ -n "$MISSING" ]; then
              printf '%s' rework > /verdict/verdict.txt
              { echo "## 成果物が不整合"; echo "index.html が参照する以下が存在しません:"; echo "$MISSING"; } > /verdict/report.md
              exit 0
            fi

            printf '%s' pass > /verdict/verdict.txt
            { echo "## ビルド成功"; echo "成果物: $OUT（index.html の参照はすべて実在）"; } > /verdict/report.md
        env:
          - {name: HOME, value: /tmp}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: verdict, mountPath: /verdict}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {memory: 4Gi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /verdict/verdict.txt, default: indeterminate}
          - name: report
            valueFrom: {path: /verdict/report.md, default: "検証結果を取得できませんでした。"}

    # ---- Review: エージェントが diff を読む。判定はディレクトリで受ける ----
    - name: review
      inputs:
        parameters:
          - name: check-report
      metadata:
        labels:
          agent.tgy.io/phase: review
      securityContext:
        # out/ を作る init は 65532、エージェントは 65533。所有者が違うので
        # エージェントは out/ を chmod し直すことも新しい分類を生やすこともできない
        runAsUser: 65533
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: prepare
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [sh, -c]
          args:
            - |
              set -eu
              mkdir -p /verdict/out/pass /verdict/out/rework /verdict/out/escalate
              chmod 0775 /verdict/out/pass /verdict/out/rework /verdict/out/escalate
              chmod 0555 /verdict/out
              ls -la /verdict/out
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: verdict, mountPath: /verdict}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d18dbca36308e573509c2617ab6c57e050facfb0723ed29386101117408c0b1f
        command: [sh, -c]
        args:
          - |
            export GITHUB_TOKEN=$(cat /github-token/token)
            PROMPT="$(cat /prompt/review.md; echo; cat /prompt/verdict-protocol.md)

            ## 対象

            リポジトリ: {{workflow.parameters.repo}}
            ブランチ: {{workflow.parameters.branch}}
            依頼された内容: {{workflow.parameters.task}}

            diff は次で取得する:
            gh api repos/{{workflow.parameters.repo}}/compare/main...{{workflow.parameters.branch}}

            ## 決定論的な検証の結果（既に実行済み）

            {{inputs.parameters.check-report}}"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Grep,Glob,Write" \
              --model sonnet \
              --max-turns 40 \
              "$PROMPT" || true

            # ---- 判定の回収。ここから先はエージェントの発話を一切読まない ----
            FOUND=""; COUNT=0
            for v in pass rework escalate; do
              if [ -n "$(ls -A "/verdict/out/$v" 2>/dev/null)" ]; then
                FOUND="$v"; COUNT=$((COUNT + 1))
              fi
            done
            if [ "$COUNT" = "1" ]; then
              VERDICT="$FOUND"
              jq -Rsr --argjson max 3000 \
                'if length > $max then .[0:$max] + "\n\n_（以降を省略）_" else . end' \
                < "/verdict/out/$FOUND/report.md" > /verdict/report.md 2>/dev/null || true
            else
              VERDICT=indeterminate
              { echo "非空のディレクトリが $COUNT 個ありました（ちょうど 1 個であるべき）。"; ls -laR /verdict/out; } > /verdict/report.md 2>&1
            fi
            [ -s /verdict/report.md ] || echo "レポートが空でした。" > /verdict/report.md
            printf '%s' "$VERDICT" > /verdict/verdict.txt
            echo "verdict: $VERDICT"
        env:
          - {name: HOME, value: /tmp}
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef: {name: claude-code-token, key: credential}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: verdict, mountPath: /verdict}
          - {name: prompt, mountPath: /prompt, readOnly: true}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 4Gi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /verdict/verdict.txt, default: indeterminate}
          - name: report
            valueFrom: {path: /verdict/report.md, default: "レビュー結果を取得できませんでした。"}

    # ---- 合成: 最も不利な verdict が勝つ。設定可能にしない ----
    # review は check が pass のときだけ走るので、未実行なら空文字で渡る。
    - name: combine
      inputs:
        parameters:
          - {name: check}
          - {name: review}
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
        command: [sh]
        source: |
          set -u
          rank() {
            case "$1" in
              pass) echo 0 ;;
              rework) echo 1 ;;
              escalate) echo 2 ;;
              "") echo -1 ;;          # 未実行。順位に影響させない
              *) echo 3 ;;            # 語彙の外はすべて indeterminate 扱い
            esac
          }
          C='{{inputs.parameters.check}}'
          R='{{inputs.parameters.review}}'
          WORST=-1; VERDICT=indeterminate
          for v in "$C" "$R"; do
            r=$(rank "$v")
            if [ "$r" -gt "$WORST" ]; then
              WORST=$r
              case "$r" in 0) VERDICT=pass ;; 1) VERDICT=rework ;; 2) VERDICT=escalate ;; 3) VERDICT=indeterminate ;; esac
            fi
          done
          # どちらも未実行なら判定不能。承認に倒さない
          [ "$WORST" -lt 0 ] && VERDICT=indeterminate
          printf '%s' "$VERDICT" > /tmp/verdict.txt
          echo "check=$C review=$R -> $VERDICT"
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /tmp/verdict.txt, default: indeterminate}

    # ---- PR 作成。署名コミットに置き換えてから出す ----
    - name: create-pr
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
        command: [sh]
        source: |
          set -eu
          export GH_TOKEN=$(cat /github-token/token)
          export HOME=/tmp
          REPO="{{workflow.parameters.repo}}"
          BRANCH="{{workflow.parameters.branch}}"
          # 署名コミットは implement 側で作成済み。ここは PR を出すだけ
          if gh pr list --repo "$REPO" --head "$BRANCH" --json number -q '.[0].number' | grep -q .; then
            echo "PR は既に存在します"
            exit 0
          fi
          LABELS="{{workflow.parameters.pr-labels}}"
          if [ -n "$LABELS" ]; then
            gh pr create --repo "$REPO" --head "$BRANCH" --base main \
              --title "{{workflow.parameters.pr-title}}" --body-file /dev/stdin --label "$LABELS" <<'BODY'
          自律実装フローによる変更。ビルド検証とレビューを通過しています。
          BODY
          else
            gh pr create --repo "$REPO" --head "$BRANCH" --base main \
              --title "{{workflow.parameters.pr-title}}" --body-file /dev/stdin <<'BODY'
          自律実装フローによる変更。ビルド検証とレビューを通過しています。
          BODY
          fi
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}

    # ---- 人間に上げる。予算切れ / escalate / 判定不能 ----
    - name: escalate
      inputs:
        parameters: [{name: verdict}]
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
        command: [sh]
        source: |
          echo "escalated: verdict={{inputs.parameters.verdict}}"
          echo "ブランチ {{workflow.parameters.branch}} は人間の判断が要ります"
          exit 1
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:

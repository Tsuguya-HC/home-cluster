# Issue を受けて実装し、自分の変更を検証し、判定に応じて PR を出すか差し戻すか決める。
#
# 構造の意図:
#   - 判定は文章ではなく「どこに置いたか」で表す。回収側は ls するだけで発話を読まない
#   - out/ は別 uid の所有で 0555 なので、エージェントは語彙の外を表現できない
#   - 安いゲート（ビルド）を先に置き、落ちたらレビューを回さない
#   - 差し戻しは再帰。予算は減るだけで、尽きたら人間に上げる
#   - 非空ディレクトリがちょうど 1 つでなければ indeterminate。判定不能は承認ではない
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: implement
  namespace: claude-code
spec:
  activeDeadlineSeconds: 5400
  serviceAccountName: claude-code-executor
  entrypoint: main
  # onExit は書かない。argo-workflows の workflowDefaults が
  # discord-notify を全ワークフローに付けるので、書くと通知が二重になる
  arguments:
    parameters:
      - name: repo
      - name: branch
      - name: task            # 何をするか。原因や方針は書かない
      - name: pr-title
      - name: pr-labels
        default: ""
      - name: workdir
        default: "."
      - name: rework-budget
        default: "2"
  # namespace の CNP はこのラベルで選択する。フェーズ別ラベルだけにすると
  # ベースラインのカバレッジから静かに外れ、argoexec が API server に届かない
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
    - name: github-token
      emptyDir: {}
    - name: github-app-secret
      secret:
        secretName: github-app-private-key
    - name: verdict
      emptyDir: {}
    - name: helpers
      emptyDir: {}
    - name: diagnose
      configMap:
        name: agent-diagnose
    - name: prompt
      projected:
        sources:
          - configMap:
              name: agent-verdict-protocol
          - configMap:
              name: implement-prompts
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [wn-03]
  templates:
    - name: main
      steps:
        - - name: cycle
            template: implement-cycle
            arguments:
              parameters:
                - name: budget
                  value: "{{workflow.parameters.rework-budget}}"
                - name: round
                  value: "1"

    # implement -> check -> review -> 判定に応じて PR / 再帰 / エスカレーション
    - name: implement-cycle
      inputs:
        parameters:
          - name: budget
          - name: round
      steps:
        - - name: implement
            template: implement
            arguments:
              parameters:
                - name: round
                  value: "{{inputs.parameters.round}}"
                - name: budget
                  value: "{{inputs.parameters.budget}}"
        # 安いゲートを先に。落ちたらレビューにトークンを使わない
        - - name: check
            template: check
        - - name: review
            template: review
            when: "{{steps.check.outputs.parameters.verdict}} == pass"
            arguments:
              parameters:
                - name: check-report
                  value: "{{steps.check.outputs.parameters.report}}"
        # 合成規則は固定: 最も不利な verdict が勝つ
        - - name: combine
            template: combine
            arguments:
              parameters:
                - name: check
                  value: "{{steps.check.outputs.parameters.verdict}}"
                - name: review
                  value: "{{steps.review.outputs.parameters.verdict}}"
        - - name: ready-for-review
            template: ready-for-review
            when: "{{steps.combine.outputs.parameters.verdict}} == pass"
          - name: again
            template: implement-cycle
            when: "{{steps.combine.outputs.parameters.verdict}} == rework && {{inputs.parameters.budget}} > 0"
            arguments:
              parameters:
                - name: budget
                  value: "{{=asInt(inputs.parameters.budget) - 1}}"
                - name: round
                  value: "{{=asInt(inputs.parameters.round) + 1}}"
          # 予算切れの rework と、明示的な escalate / indeterminate は同じ扱い
          - name: escalate
            template: escalate
            when: "({{steps.combine.outputs.parameters.verdict}} == rework && {{inputs.parameters.budget}} <= 0) || {{steps.combine.outputs.parameters.verdict}} != pass && {{steps.combine.outputs.parameters.verdict}} != rework"
            arguments:
              parameters:
                - name: verdict
                  value: "{{steps.combine.outputs.parameters.verdict}}"

    # ---- Implementing: エージェントが変更してブランチに push する ----
    - name: implement
      inputs:
        parameters:
          - name: round
          - name: budget
      metadata:
        labels:
          agent.tgy.io/phase: implementing
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "113765957"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [sh, -c]
          args:
            - |
              set -eu
              GITHUB_TOKEN=$(cat /github-token/token)
              REPO="{{workflow.parameters.repo}}"
              BRANCH="{{workflow.parameters.branch}}"
              git config --global --add safe.directory /workspace
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" /workspace
              cd /workspace
              # 差し戻しで 2 周目以降はブランチが既にある
              git checkout "${BRANCH}" 2>/dev/null || git checkout -b "${BRANCH}"
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
              # 署名コミットのスクリプトは argo-tools イメージにあり、main の
              # claude-code イメージには無い。専用ボリューム経由で渡す。
              # 作業ツリーの中に置くと git add -A が拾って PR に混入する
              cp /usr/local/bin/github-signed-commit.sh /helpers/
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: github-token, mountPath: /github-token, readOnly: true}
            - {name: helpers, mountPath: /helpers}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d17af43d38f328323b115bf56d58479ac87f06088358d089a009388a1558419c
        command: [sh, -c]
        workingDir: /workspace
        args:
          - |
            export GITHUB_TOKEN=$(cat /github-token/token)
            # init が書いた ~/.gitconfig は別コンテナなので届かない。ここで設定し直す
            git config --global --add safe.directory /workspace
            PROMPT="$(cat /prompt/implement.md)

            ## このタスク

            {{workflow.parameters.task}}

            ## 対象

            リポジトリ: {{workflow.parameters.repo}}（/workspace に clone 済み、ブランチ {{workflow.parameters.branch}}）
            作業ディレクトリ: {{workflow.parameters.workdir}}

            ## 今の状態

            - **{{inputs.parameters.round}} 周目**（1 周目なら新規、2 周目以降は差し戻し）
            - 残りの差し戻し回数: **{{inputs.parameters.budget}}**
            - これが尽きた状態でさらに差し戻されると、自動では進まず人間に渡る"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Grep,Glob" \
              --model sonnet \
              --max-turns 60 \
              "$PROMPT" > /tmp/claude.jsonl 2>/tmp/claude.err
            CLAUDE_RC=$?
            # ログは捨てない。判定不能になった理由は後から追えなければ意味がない
            cat /tmp/claude.jsonl
            [ -s /tmp/claude.err ] && cat /tmp/claude.err >&2

            # エラーのときは、まず claude 自身が動けていたのかを見る。
            # API 認証切れもレート制限も、放っておくと「PR が見つかりません」に
            # 化けて、エージェントが実装に失敗したかのように見える
            if [ "$CLAUDE_RC" != "0" ]; then
              sh /diagnose/claude-diagnose.sh /tmp/claude.jsonl "$CLAUDE_RC" /tmp/claude.err > /tmp/diag.md
              DIAG_RC=$?
              echo "## 実装フェーズが完走しませんでした"
              cat /tmp/diag.md
              # 基盤側の失敗はエージェントの判断ではない。差し戻し予算を
              # 消費させず、ワークフローとして失敗させて人間に渡す
              [ "$DIAG_RC" = "10" ] && exit 1
            fi

            cd /workspace
            if git diff --quiet && git diff --cached --quiet; then
              echo "変更なし"
              exit 0
            fi
            # 署名コミットは staged changes から GitHub API 経由で作る。
            # ローカルの git commit + push では署名が付かず ruleset に弾かれる
            git add -A
            export GH_TOKEN="$GITHUB_TOKEN"
            REPO="{{workflow.parameters.repo}}"
            BRANCH="{{workflow.parameters.branch}}"

            # github-signed-commit.sh は **既存 ref を PATCH するだけ**で ref を作らない。
            # ローカルの checkout -b はリモートに存在しないので、先に main から生やす。
            # 差し戻しの 2 周目以降は既にあるので 422 になるが、それでよい。
            if ! gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
              BASE_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" -q '.object.sha')
              gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$BASE_SHA" >/dev/null
              echo "ブランチ ${BRANCH} を作成しました"
            fi

            /helpers/github-signed-commit.sh \
              -r "$REPO" \
              -b "$BRANCH" \
              -m "{{workflow.parameters.pr-title}}"

            # ドラフト PR を先に作る。以降の CI はリポジトリ側の定義が走るので
            # ビルド検証をこのワークフローに再実装しない（drift の元になる）
            if ! gh pr list --repo "$REPO" --head "$BRANCH" --json number -q '.[0].number' | grep -q .; then
              gh pr create --repo "$REPO" --head "$BRANCH" --base main --draft \
                --title "{{workflow.parameters.pr-title}}" \
                --body "自律実装フローによる変更。検証とレビューを通過するまでドラフトのままです。" 2>&1 | tail -2
            fi

            # 記録は PR コメントに積む。人間が見る場所と次周が読む場所を同じにする
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number -q '.[0].number')
            if [ -n "$PR" ] && [ -s /tmp/report.md ]; then
              { echo "### implement"; echo; jq -Rsr --argjson max 3000 \
                  'if length > $max then .[0:$max] + "\n\n_（以降を省略）_" else . end' < /tmp/report.md; } \
                | gh pr comment "$PR" --repo "$REPO" --body-file - || true
            fi
        env:
          - {name: HOME, value: /tmp}
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef: {name: claude-code-token, key: credential}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: workspace, mountPath: /workspace}
          - {name: claude-home, mountPath: /claude-home}
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: helpers, mountPath: /helpers, readOnly: true}
          - {name: prompt, mountPath: /prompt, readOnly: true}
          - {name: diagnose, mountPath: /diagnose, readOnly: true}
        resources:
          requests: {cpu: 200m, memory: 1Gi}
          limits: {memory: 6Gi}

    # ---- Checks: リポジトリ側の CI を待ち、その結果を verdict に変換する ----
    # ビルドをこのワークフローに再実装しない。同じことを 2 箇所に書くと必ず drift する。
    # 外部で起きた結果を「自分が回収した verdict」に落とすのがこのステップの役目で、
    # 制御フローが GitHub の状態を直接読むことはない。
    - name: check
      metadata:
        labels:
          agent.tgy.io/phase: checks
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
        command: [sh]
        source: |
          set -u
          export GH_TOKEN=$(cat /github-token/token)
          export HOME=/tmp
          REPO="{{workflow.parameters.repo}}"
          BRANCH="{{workflow.parameters.branch}}"

          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            printf '%s' escalate > /work/verdict.txt
            echo "ドラフト PR が見つかりません。実装フェーズが変更を出せていない可能性があります。" > /work/report.md
            exit 0
          fi

          # CI が出そろうまで待つ。出そろわないまま時間切れなら判定不能。
          #
          # `gh pr checks` は使わない。GraphQL の statusCheckRollup を引くが、
          # この GitHub App のトークンではそこが 403 になる:
          #   GraphQL: Resource not accessible by integration (node.statusCheckRollup...)
          # REST の check-runs は同じトークンで読める（実測）。
          #
          # 毎回ログを出す。出さないと、時間切れになった理由が実行後に分からない。
          SHA=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" -q '.object.sha' 2>/dev/null)
          if [ -z "$SHA" ]; then
            printf '%s' escalate > /work/verdict.txt
            echo "ブランチ ${BRANCH} の head を取得できませんでした。" > /work/report.md
            exit 0
          fi

          # 見るのは **CI Gate 一本だけ**。
          #
          # 個々の check run を数えると「まだ始まっていない」と「対象外で走らない」が
          # 区別できず、後者を pass 扱いする気持ちの悪い判定になる。Gate はリポジトリ
          # 自身が定義した「CI が通った」の表明であり、`if: !cancelled()` で必ず報告する。
          # 対象ジョブが無い変更なら、全ジョブ skipped の Gate が success で返る。
          #
          # Gate が現れないのは「CI がまだ」か「そのリポジトリに Gate が無い」のどちらか。
          # 前者は待てばよく、後者は待っても来ないので判定不能として人間に渡す。
          GATE="CI Gate"
          DONE=0
          for i in $(seq 1 40); do
            RAW=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" 2>/tmp/gh.err)
            RC=$?
            if ! printf '%s' "$RAW" | jq -e 'has("check_runs")' >/dev/null 2>&1; then
              echo "poll $i: rc=$RC 応答が想定外: $(printf '%s' "$RAW" | head -c 120) / err=$(head -c 160 /tmp/gh.err)"
              sleep 15
              continue
            fi
            G=$(printf '%s' "$RAW" | jq -r --arg g "$GATE" '[.check_runs[] | select(.name == $g)] | .[0] // empty | "\(.status) \(.conclusion // "")"')
            echo "poll $i: rc=$RC gate=${G:-未出現} total=$(printf '%s' "$RAW" | jq '.check_runs | length')"
            case "$G" in
              "completed "*) DONE=1; break ;;
            esac
            sleep 15
          done

          if [ "$DONE" != "1" ]; then
            printf '%s' indeterminate > /work/verdict.txt
            { echo "## CI Gate が完了しませんでした（判定不能）"; echo;
              echo "\`${GATE}\` を 10 分待って完了を確認できませんでした。";
              echo "リポジトリに Gate が無いか、CI が起動していない可能性があります。"; echo;
              echo "最後に観測した check run:"; echo '```';
              printf '%s' "$RAW" | jq -r '.check_runs[]? | "\(.name): \(.status) \(.conclusion // "")"' 2>/dev/null | head -20;
              echo '```'; } > /work/report.md
            { echo "### check"; echo; cat /work/report.md; } \
              | gh pr comment "$PR" --repo "$REPO" --body-file - || true
            exit 0
          fi

          # 取り直す。ループ内の $RAW は Gate が完了した瞬間のもので、
          # reusable workflow の leaf はまだ起動前のプレースホルダ名
          # （`argo-lint`）で並んでいる。起動後は `argo-lint / argo lint` という
          # 別エントリになるので、そのまま出すと落ちた job を取り違える
          FRESH=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" 2>/dev/null)
          printf '%s' "$FRESH" | jq -e 'has("check_runs")' >/dev/null 2>&1 && RAW="$FRESH"

          GATE_CONCLUSION=$(printf '%s' "$RAW" | jq -r --arg g "$GATE" '[.check_runs[] | select(.name == $g)] | .[0].conclusion')

          # Gate の結論をそのまま採る。個別ジョブは Gate が既に集約している
          if [ "$GATE_CONCLUSION" = "success" ]; then
            printf '%s' pass > /work/verdict.txt
            { echo "## CI 通過（${GATE}: success）"; echo;
              printf '%s' "$RAW" | jq -r '.check_runs[] | "- \(.name): \(.conclusion // .status)"'; } > /work/report.md
          else
            printf '%s' rework > /work/verdict.txt
            { echo "## CI 失敗（${GATE}: ${GATE_CONCLUSION}）"; echo;
              printf '%s' "$RAW" | jq -r '[.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | .[] | "- \(.name): \(.conclusion // .status)"'; } > /work/report.md
          fi

          # 記録を PR コメントに積む
          { echo "### check"; echo; cat /work/report.md; } \
            | gh pr comment "$PR" --repo "$REPO" --body-file - || true
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: verdict, mountPath: /work}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /work/verdict.txt, default: indeterminate}
          - name: report
            valueFrom: {path: /work/report.md, default: "検証結果を取得できませんでした。"}

    # ---- Review: エージェントが diff を読む。判定はディレクトリで受ける ----
    - name: review
      inputs:
        parameters:
          - name: check-report
      metadata:
        labels:
          agent.tgy.io/phase: review
      securityContext:
        # out/ を作る init は 65532、エージェントは 65533。所有者が違うので
        # エージェントは out/ を chmod し直すことも新しい分類を生やすこともできない
        runAsUser: 65533
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: prepare
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [sh, -c]
          args:
            - |
              set -eu
              mkdir -p /work/out/pass /work/out/rework /work/out/escalate
              chmod 0775 /work/out/pass /work/out/rework /work/out/escalate
              chmod 0555 /work/out
              ls -la /work/out
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: verdict, mountPath: /work}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d17af43d38f328323b115bf56d58479ac87f06088358d089a009388a1558419c
        command: [sh, -c]
        args:
          - |
            export GITHUB_TOKEN=$(cat /github-token/token)
            PROMPT="$(cat /prompt/review.md; echo; cat /prompt/verdict-protocol.md)

            ## 対象

            リポジトリ: {{workflow.parameters.repo}}
            ブランチ: {{workflow.parameters.branch}}
            依頼された内容: {{workflow.parameters.task}}

            diff は次で取得する:
            gh api repos/{{workflow.parameters.repo}}/compare/main...{{workflow.parameters.branch}}

            ## 決定論的な検証の結果（既に実行済み）

            {{inputs.parameters.check-report}}"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Grep,Glob,Write" \
              --model sonnet \
              --max-turns 40 \
              "$PROMPT" > /tmp/claude.jsonl 2>/tmp/claude.err
            CLAUDE_RC=$?
            cat /tmp/claude.jsonl
            [ -s /tmp/claude.err ] && cat /tmp/claude.err >&2

            # ---- 判定の回収。ここから先はエージェントの発話を一切読まない ----
            FOUND=""; COUNT=0
            for v in pass rework escalate; do
              if [ -n "$(ls -A "/work/out/$v" 2>/dev/null)" ]; then
                FOUND="$v"; COUNT=$((COUNT + 1))
              fi
            done
            if [ "$COUNT" = "1" ]; then
              VERDICT="$FOUND"
              jq -Rsr --argjson max 3000 \
                'if length > $max then .[0:$max] + "\n\n_（以降を省略）_" else . end' \
                < "/work/out/$FOUND/report.md" > /work/report.md 2>/dev/null || true
            else
              VERDICT=indeterminate
              # 判定が無いときは、まずレビュアーが動けていたのかを見る。
              # API 側の失敗とエージェントの判断放棄は、人間の次の一手が違う
              { echo "非空のディレクトリが $COUNT 個ありました（ちょうど 1 個であるべき）。"; echo;
                sh /diagnose/claude-diagnose.sh /tmp/claude.jsonl "$CLAUDE_RC" /tmp/claude.err;
                echo; ls -laR /work/out; } > /work/report.md 2>&1
            fi
            [ -s /work/report.md ] || echo "レポートが空でした。" > /work/report.md
            printf '%s' "$VERDICT" > /work/verdict.txt
            echo "verdict: $VERDICT"
        env:
          - {name: HOME, value: /tmp}
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef: {name: claude-code-token, key: credential}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
          - {name: verdict, mountPath: /work}
          - {name: prompt, mountPath: /prompt, readOnly: true}
          - {name: diagnose, mountPath: /diagnose, readOnly: true}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 4Gi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /work/verdict.txt, default: indeterminate}
          - name: report
            valueFrom: {path: /work/report.md, default: "レビュー結果を取得できませんでした。"}

    # ---- 合成: 最も不利な verdict が勝つ。設定可能にしない ----
    # review は check が pass のときだけ走るので、未実行なら空文字で渡る。
    - name: combine
      inputs:
        parameters:
          - {name: check}
          - {name: review}
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
        command: [sh]
        source: |
          set -u
          # フェーズは逐次で、review は check が pass のときだけ走る。
          # よって「最も不利が勝つ」は「check が pass でなければ check の判定」に
          # 帰着する。スキップされたステップの output は空文字ではなく
          # 宣言した default を返すので、値の有無では実行有無を判定できない。
          C='{{inputs.parameters.check}}'
          R='{{inputs.parameters.review}}'
          normalize() {
            case "$1" in
              pass|rework|escalate) printf '%s' "$1" ;;
              *) printf '%s' indeterminate ;;   # 語彙の外はすべて判定不能
            esac
          }
          if [ "$(normalize "$C")" != "pass" ]; then
            VERDICT=$(normalize "$C")
          else
            VERDICT=$(normalize "$R")
          fi
          printf '%s' "$VERDICT" > /tmp/verdict.txt
          echo "check=$C review=$R -> $VERDICT"
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
      outputs:
        parameters:
          - name: verdict
            valueFrom: {path: /tmp/verdict.txt, default: indeterminate}

    # ---- 判定が pass のとき、ドラフトを ready-for-review にする ----
    # PR は implement がドラフトで作成済み。ここでやるのは状態の遷移だけで、
    # PR の状態は判定の「結果」であって判定そのものではない。
    - name: ready-for-review
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
        command: [sh]
        source: |
          set -eu
          export GH_TOKEN=$(cat /github-token/token)
          export HOME=/tmp
          REPO="{{workflow.parameters.repo}}"
          PR=$(gh pr list --repo "$REPO" --head "{{workflow.parameters.branch}}" --json number -q '.[0].number')
          [ -n "$PR" ] || { echo "PR が見つかりません"; exit 1; }
          gh pr ready "$PR" --repo "$REPO"
          LABELS="{{workflow.parameters.pr-labels}}"
          [ -n "$LABELS" ] && gh pr edit "$PR" --repo "$REPO" --add-label "$LABELS" || true
          echo "PR #$PR を ready-for-review にしました"
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}

    # ---- 人間に上げる。予算切れ / escalate / 判定不能 ----
    - name: escalate
      inputs:
        parameters: [{name: verdict}]
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
          command: [github-auth.sh]
          env:
            - {name: GITHUB_APP_ID, value: "2998228"}
            - {name: GITHUB_APP_INSTALLATION_ID, value: "113765957"}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: github-app-secret, mountPath: /github-app, readOnly: true}
            - {name: github-token, mountPath: /github-token}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      script:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:5309221e4c5721f9b7c091195db1a592320b88390734bb745f8eb69041ddf3ed
        command: [sh]
        source: |
          set -u
          export GH_TOKEN=$(cat /github-token/token)
          export HOME=/tmp
          REPO="{{workflow.parameters.repo}}"
          PR=$(gh pr list --repo "$REPO" --head "{{workflow.parameters.branch}}" --json number -q '.[0].number' 2>/dev/null || true)
          # ドラフトのまま残す。人間が見に行く場所と、経緯が積まれている場所を同じにする
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "needs-human" || true
            printf '%s\n' "### escalate" "" "判定: {{inputs.parameters.verdict}}" "" \
              "自動では進められませんでした。ドラフトのまま人間の判断を待ちます。" \
              | gh pr comment "$PR" --repo "$REPO" --body-file - || true
          fi
          echo "escalated: verdict={{inputs.parameters.verdict}} pr=${PR:-none}"
          exit 1
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: github-token, mountPath: /github-token, readOnly: true}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-code
  namespace: claude-code
spec:
  endpointSelector:
    matchLabels:
      claude-code: "true"
  ingressDeny:
    - fromEntities:
        - world
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        - matchName: "github.com"
        - matchName: "api.github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchName: "index.crates.io"
        - matchName: "static.crates.io"
        - matchName: "registry.npmjs.org"
        - matchName: "discord.com"
        - matchName: "gitmcp.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # 推論は llm-gateway 経由（#942）。**api.anthropic.com は書かない** — env が効かず
    # Anthropic へ直行する取り違えを drop で検出するため。claude-code: "true" の Pod は
    # 全て gateway 経由に切り替え済み。
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            io.kubernetes.pod.namespace: llm-gateway
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: horenso
            io.kubernetes.pod.namespace: horenso
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            eventsource-name: task-dispatch
            io.kubernetes.pod.namespace: argo
      toPorts:
        - ports:
            - port: "12002"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-server
            io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

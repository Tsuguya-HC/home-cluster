apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: task-executor-write
  namespace: claude-code
spec:
  activeDeadlineSeconds: 10800
  serviceAccountName: claude-code-executor
  entrypoint: main
  arguments:
    parameters:
      - name: task-id
      - name: task-title
      - name: task-description
      - name: task-category
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
    - name: github-token
      emptyDir: {}
    - name: github-app-secret
      secret:
        secretName: github-app-private-key
    - name: argocd-token
      secret:
        secretName: argocd-cluster-bot-token
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: execute
            template: execute

    - name: execute
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:2b6e5cbfa1a7158a7086f5d7673c33eceb5c9767a4b2968997c35fc78c6c10c5
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "113765957"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:2b6e5cbfa1a7158a7086f5d7673c33eceb5c9767a4b2968997c35fc78c6c10c5
          command: [sh, -c]
          args:
            - |
              mkdir -p /workspace/.bin
              cp /usr/local/bin/github-signed-commit.sh /workspace/.bin/
              cp /usr/local/bin/argocd /workspace/.bin/
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:d18dbca36308e573509c2617ab6c57e050facfb0723ed29386101117408c0b1f
        command: [sh, -c]
        args:
          - |
            TASK_ID='{{workflow.parameters.task-id}}'
            TASK_TITLE='{{workflow.parameters.task-title}}'
            TASK_DESC='{{workflow.parameters.task-description}}'
            TASK_CAT='{{workflow.parameters.task-category}}'
            HORENSO="http://horenso.horenso.svc.cluster.local:3000"
            export GITHUB_TOKEN=$(cat /github-token/token)
            export GH_TOKEN=$GITHUB_TOKEN

            curl -s -X PATCH \
              -H "Content-Type: application/json" \
              -d '{"status":"running"}' \
              "$HORENSO/tasks/$TASK_ID" > /dev/null 2>&1 || true

            cd /workspace
            git config --global --add safe.directory /workspace

            PROMPT="あなたは Kubernetes クラスタの運用エージェントです。以下のタスクを実行してください。

            ## タスク情報
            - ID: ${TASK_ID}
            - タイトル: ${TASK_TITLE}
            - カテゴリ: ${TASK_CAT}
            - 説明:
            ${TASK_DESC}

            ## クラスタ情報
            - CNI: Cilium（全 Pod にデフォルト deny の CiliumNetworkPolicy 適用）
            - GitOps: ArgoCD（home-cluster リポジトリ、selfHeal: true, prune: true）
            - Observability: Prometheus + Loki + Hubble
            - ノード: cp-11/12/13 (control plane), wn-01/02/03 (worker)
            - PUBLIC リポジトリ — 機密値を絶対にコミットしない

            ## 使えるツール
            - kubectl, helm, gh（GitHub CLI）
            - git clone/checkout/commit/push
            - ファイル編集
            - argocd CLI（/workspace/.bin/argocd）— ArgoCD API 経由でアプリ操作

            ## ArgoCD CLI
            export ARGOCD_AUTH_TOKEN=\$(cat /argocd-token/token)
            /workspace/.bin/argocd app get <app-name> --server argocd-server.argocd.svc:443 --grpc-web
            /workspace/.bin/argocd app sync <app-name> --server argocd-server.argocd.svc:443 --grpc-web

            ## ルール
            - タスク説明にリポジトリとブランチがあればそれを clone して作業する
            - 変更したら commit して push する
            - PR がある場合は PR ブランチに push する（新しい PR は作らない）
            - 最後に結果のサマリーを /tmp/result.txt にテキストで書き出す（Write ツール使用）

            ## 権限不足・ブロッカー発生時
            RBAC 権限不足、CNP による通信ブロック、ツール不足などでタスクを達成できないと判断した場合:
            1. 無理に回避策を試し続けない（curl で代替する等の迂回は禁止）
            2. 何の権限/リソースが不足しているかを具体的に特定する
            3. /tmp/result.txt に「不足している権限」「必要な修正」を明記して早期終了する

            ## Git コミット（署名付き）
            git commit + git push の代わりに、github-signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /workspace/.bin/github-signed-commit.sh -r OWNER/REPO -m 'コミットメッセージ' を実行（リポジトリ名はタスク説明から判断）
            これにより GitHub API 経由で署名付きコミットが作成され、ローカルも同期される。"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
              --model sonnet \
              "$PROMPT" || true

            RESULT=""
            if [ -f /tmp/result.txt ]; then
              RESULT=$(head -c 3800 /tmp/result.txt)
            fi
            if [ -z "$RESULT" ]; then
              RESULT="結果ファイルが生成されませんでした。Argo UI でログを確認してください。"
            fi

            PAYLOAD=$(jq -n \
              --arg status "completed" \
              --arg result "$RESULT" \
              '{status:$status,result:$result}')
            curl -s -X PATCH \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$HORENSO/tasks/$TASK_ID" || true
        env:
          - name: HOME
            value: /claude-home
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: claude-code-token
                key: credential
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
          - name: github-token
            mountPath: /github-token
            readOnly: true
          - name: argocd-token
            mountPath: /argocd-token
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

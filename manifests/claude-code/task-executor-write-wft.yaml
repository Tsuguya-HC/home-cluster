apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: task-executor-write
  namespace: claude-code
spec:
  activeDeadlineSeconds: 10800
  serviceAccountName: claude-code-executor
  entrypoint: main
  arguments:
    parameters:
      - name: repo
        value: Tsuguya-HC/home-cluster
      - name: task-id
      - name: task-title
      - name: task-description
      - name: task-category
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
    - name: signed-commit
      configMap:
        name: signed-commit
        defaultMode: 0555
    - name: argocd-token
      secret:
        secretName: argocd-cluster-bot-token
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: execute
            template: execute

    - name: execute
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [sh, -c]
          args:
            - |
              mkdir -p /workspace/.bin
              cp /usr/local/bin/argocd /workspace/.bin/
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:a1a12fe81f5ab7ad1335bbd10d2faa2e152332d0185a93d348552e616760fc5f
        command: [sh, -c]
        args:
          - |
            TASK_ID='{{workflow.parameters.task-id}}'
            TASK_TITLE='{{workflow.parameters.task-title}}'
            TASK_DESC='{{workflow.parameters.task-description}}'
            TASK_CAT='{{workflow.parameters.task-category}}'
            HORENSO="http://horenso.horenso.svc.cluster.local:3000"

            curl -s -X PATCH \
              -H "Content-Type: application/json" \
              -d '{"status":"running"}' \
              "$HORENSO/tasks/$TASK_ID" > /dev/null 2>&1 || true

            cd /workspace
            git config --global --add safe.directory /workspace
            # clone も gateway を通す。**ここに入るのは呼び出し元鍵**で、GitHub の
            # 資格情報ではない —— gateway が Authorization を実 installation token に
            # 付け替える。`token ` の形にするのは、Envoy の apiKeyAuth が明示的に
            # 剥がすのが `Bearer ` だけで、こちらは文字列そのものが照合対象になるため。
            git config --global "http.https://${GH_HOST}/.extraHeader" \
              "Authorization: token ${GH_ENTERPRISE_TOKEN}"

            PROMPT="あなたは Kubernetes クラスタの運用エージェントです。以下のタスクを実行してください。

            ## タスク情報
            - ID: ${TASK_ID}
            - タイトル: ${TASK_TITLE}
            - カテゴリ: ${TASK_CAT}
            - 説明:
            ${TASK_DESC}

            ## クラスタ情報
            - CNI: Cilium（全 Pod にデフォルト deny の CiliumNetworkPolicy 適用）
            - GitOps: ArgoCD（home-cluster リポジトリ、selfHeal: true, prune: true）
            - Observability: Prometheus + Loki + Hubble
            - ノード: cp-11/12/13 (control plane), wn-01/02/03 (worker)
            - PUBLIC リポジトリ — 機密値を絶対にコミットしない

            ## 使えるツール
            - kubectl, helm, gh（GitHub CLI）
            - git clone/checkout/commit（push は使わない。下の「Git コミット」を読むこと）
            - ファイル編集
            - argocd CLI（/workspace/.bin/argocd）— ArgoCD API 経由でアプリ操作

            ## ArgoCD CLI
            export ARGOCD_AUTH_TOKEN=\$(cat /argocd-token/token)
            /workspace/.bin/argocd app get <app-name> --server argocd-server.argocd.svc:443 --grpc-web
            /workspace/.bin/argocd app sync <app-name> --server argocd-server.argocd.svc:443 --grpc-web

            ## ルール
            - タスク説明にリポジトリとブランチがあればそれを clone して作業する
            - clone は必ず https://gh-rw.infra.tgy.io/OWNER/REPO.git から行う。github.com へは出られない
            - 変更したら commit し、下の「Git コミット」の手順で GitHub 側へ載せる
            - PR がある場合はその PR のブランチへ載せる（新しい PR は作らない）
            - 最後に結果のサマリーを /tmp/result.txt にテキストで書き出す（Write ツール使用）

            ## 権限不足・ブロッカー発生時
            RBAC 権限不足、CNP による通信ブロック、ツール不足などでタスクを達成できないと判断した場合:
            1. 無理に回避策を試し続けない（curl で代替する等の迂回は禁止）
            2. 何の権限/リソースが不足しているかを具体的に特定する
            3. /tmp/result.txt に「不足している権限」「必要な修正」を明記して早期終了する

            ## Git コミット（署名付き）
            git commit + git push の代わりに、signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /scripts/signed-commit.sh -r OWNER/REPO -m 'コミットメッセージ' を実行（リポジトリ名はタスク説明から判断）
            これにより GitHub API 経由で署名付きコミットが作成される。
            **git push は使えない**（この Pod は GitHub の資格情報を持たない）。"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
              --model review \
              "$PROMPT" || true

            # horenso の result は TEXT で上限が無い。ここで切る理由は無いので、
            # 暴走時の保険としての上限だけ残す。jq の文字列スライスは文字単位なので
            # UTF-8 のコードポイントを割らない。
            if [ ! -s /tmp/result.txt ]; then
              printf '%s' "結果ファイルが生成されませんでした。Argo UI でログを確認してください。" \
                > /tmp/result.txt
            fi

            PAYLOAD=$(jq -Rs --arg status "completed" --argjson max 65536 \
              '{status: $status,
                result: (if length > $max
                         then .[0:$max] + "\n\n_(結果が長いため以降を省略。Argo UI のログに全文があります)_"
                         else . end)}' \
              < /tmp/result.txt)
            curl -s -X PATCH \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$HORENSO/tasks/$TASK_ID" || true
        env:
          # GitHub は gateway 経由（#1038）。**この Pod は GitHub の資格情報を持たない** ——
          # installation token は gateway 側にしかなく、gateway が Authorization を
          # 付け直す。GH_HOST を渡すと `gh` は GHES 扱いになり、REST を /api/v3、
          # GraphQL を /api/graphql に送る。ロールはホスト名で決まる。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。** この鍵が示すのは
          # 「どのロールを呼んでよいか」だけで、gateway に届く Pod の外では使えない。
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: task-executor-write
          - name: HOME
            value: /claude-home
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
          # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
          # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
          # 外では使えない（CNP の内側）。handler 単位で revoke できる。
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-gateway-client-keys
                key: task-executor-write
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの handler からの呼び出しかを gateway に名乗る（アクセスログの tf.handler）。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: task-executor-write"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。親と同じ alias に括り付ける。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
        # api.anthropic.com への直行を止める 3 本。根拠は taskflow-common.yaml 参照。
        envFrom:
          - configMapRef:
              name: claude-code-disable-nonessential-traffic
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
          - name: signed-commit
            mountPath: /scripts
            readOnly: true
          - name: argocd-token
            mountPath: /argocd-token
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

# taskflow に載せる最初の Task: CNP カバレッジ点検（Step 0 の cnp-check-cwf.yaml を
# TaskFlow / TaskHandler に移したもの）。
#
# 初回は 調査 の 1 フェーズだけ。設計 §16 の 調査 → 報告 の 2 フェーズは、前フェーズの
# report を次フェーズへ渡す store 封印（results/<runID>/）がまだ無いので載せられない。
# 人間への報告は 調査 Pod 内の notify サイドカーが担う（設計 §7: publish は利用側の
# サイドカーの仕事。framework は判定ディレクトリしか見ない）。
#
# 語彙は next の宣言から来る。{完了: ok, Escalated: escalate} なので、エージェントが書けるのは
# /workspace/out/ 下の ok/ と escalate/ の 2 つだけ。「判定できない」は escalate/ に理由を書いて
# 明示する（taskflow #63）。何も書かなければ従来どおり Escalated だが、そちらは沈黙 — 途中で
# 死んだのか意図して降りたのかが history から区別できない。
# terminals で終端の意味も宣言する（taskflow #64）。宣言しないと metric 上は Undeclared のまま。
#
# taskflow-verdict-protocol ConfigMap（プロンプトの一部）は複数 flow で共有するため
# manifests/claude-code/taskflow-common.yaml に置いてある。ここの projected volume はそこを参照する。
apiVersion: flow.tgy.io/v1alpha1
kind: TaskHandler
metadata:
  name: cnp-planner
  namespace: claude-code
spec:
  phase: 調査
  runner:
    type: Job
  timeout: 25m
  maxInfraRetries: 1
  jobTemplate:
    template:
      metadata:
        labels:
          # 既存の CNP（manifests/claude-code/netpol.yaml）がこのラベルで選ぶ:
          # apiserver / api.anthropic.com / Loki / Prometheus / discord.com
          claude-code: "true"
      spec:
        restartPolicy: Never
        runtimeClassName: kata
        serviceAccountName: agent-cnp-reader
        # prepare (65532) が out/ を作って 0555 に閉じ、エージェント (65533) は
        # 同じ group で宣言ディレクトリにだけ書ける。uid が違うので out/ を開け直せない。
        securityContext:
          runAsUser: 65533
          runAsGroup: 65532
          fsGroup: 65532
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: workspace
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: prompt
            projected:
              sources:
                # taskflow-common.yaml にある共有 ConfigMap。
                - configMap:
                    name: taskflow-verdict-protocol
                - configMap:
                    name: cnp-check-prompt
        initContainers:
          - name: prepare
            image: registry.infra.tgy.io/tools/agent-sidecar:latest@sha256:462d79d9a1354d3a1208a773a3adce390bab751b5e28d19b7e666aeb955ac561
            args: ["prepare", "--out", "/workspace/out"]
            securityContext:
              runAsUser: 65532
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: workspace
                mountPath: /workspace
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          # ネイティブサイドカー。main 終了後の SIGTERM で out/ を見て、非空の宣言
          # ディレクトリがちょうど 1 つならその名前を termination log に書く。
          - name: publish
            image: registry.infra.tgy.io/tools/agent-sidecar:latest@sha256:462d79d9a1354d3a1208a773a3adce390bab751b5e28d19b7e666aeb955ac561
            args: ["publish", "--out", "/workspace/out"]
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: workspace
                mountPath: /workspace
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          # 人間への報告。framework の関心事ではない（設計 §7 / §9）。SIGTERM で
          # どのディレクトリに report.md があるかを見て、ok / escalate / 沈黙 の
          # 3 通りを撃ち分ける。escalate と沈黙はどちらも Escalated だが、人間から見ると
          # 「理由がある差し戻し」と「途中で落ちた疑い」で次の一手が違う。
          - name: notify
            image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d5db59cac14b23a4ef85a456754522463267324e8ed3a84e795a2eba829c8f05
            restartPolicy: Always
            command: [sh, -c]
            args:
              - |
                # 判定そのものは framework が出す。ここは同じ規則で読み直すだけで、
                # 別の規則を持たない — 持つと Discord と Task の status が食い違う。
                # 規則は「非空の宣言ディレクトリがちょうど 1 つ」。report.md の有無では
                # なくディレクトリが空かどうかで見るのは、回収側がそう見ているから。
                nonempty() { [ -d "$1" ] && [ -n "$(ls -A "$1" 2>/dev/null)" ]; }
                notify() {
                  OK=/workspace/out/ok
                  ESC=/workspace/out/escalate
                  REPORT_FILE=""
                  if nonempty "$OK" && nonempty "$ESC"; then
                    TITLE="CNP check (taskflow): ambiguous"; COLOR=16711680
                    REPORT="ok/ と escalate/ の両方に書かれた。非空がちょうど 1 つでないので判定不能（→ Escalated）。kubectl -n claude-code get task で確認。"
                  elif nonempty "$OK"; then
                    TITLE="CNP check (taskflow): ok"; COLOR=65280
                    REPORT_FILE="$OK/report.md"
                  elif nonempty "$ESC"; then
                    TITLE="CNP check (taskflow): escalated"; COLOR=16753920
                    REPORT_FILE="$ESC/report.md"
                  else
                    TITLE="CNP check (taskflow): no verdict"; COLOR=16711680
                    REPORT="エージェントは何も書かずに終わった（沈黙 → Escalated）。意図的な差し戻しなら escalate/ に理由が残るので、これは途中で落ちたか時間切れの疑いが濃い。kubectl -n claude-code get task で確認。"
                  fi
                  # ディレクトリは非空でも report.md が無いことはある（framework は
                  # エントリの存在しか見ない）。その場合も判定は変えず、本文だけ断る。
                  if [ -n "$REPORT_FILE" ]; then
                    if [ -s "$REPORT_FILE" ]; then
                      REPORT=$(jq -Rsr --argjson max 3900 \
                        'if length > $max then .[0:$max] + "\n\n_(以降を省略)_" else . end' < "$REPORT_FILE")
                    else
                      REPORT="判定は出ているが report.md が無い（他のファイルだけが置かれた）。kubectl -n claude-code get task で確認。"
                    fi
                  fi
                  PAYLOAD=$(jq -n --arg title "$TITLE" --argjson color "$COLOR" --arg report "$REPORT" \
                    --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                    '{embeds: [{title: $title, color: $color, description: $report, timestamp: $ts}]}')
                  wget -qO /dev/null --header="Content-Type: application/json" \
                    --post-data="$PAYLOAD" "$DISCORD_WEBHOOK_URL" || echo "discord post failed"
                }
                trap 'notify; exit 0' TERM INT
                while :; do sleep 1; done
            env:
              - name: DISCORD_WEBHOOK_URL
                valueFrom:
                  secretKeyRef:
                    name: discord-webhook-argo
                    key: url
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: workspace
                mountPath: /workspace
                readOnly: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          - name: agent
            image: registry.infra.tgy.io/tools/claude-code:latest@sha256:3e95cb84f1deb993199f220d9b4083ab7202d8c6e1278fbe4ae802dfc343df06
            workingDir: /workspace
            command: [sh, -c]
            args:
              - |
                PROMPT="$(cat /prompt/cnp-check.md; echo; cat /prompt/verdict-protocol.md)"
                claude -p \
                  --verbose \
                  --output-format stream-json \
                  --dangerously-skip-permissions \
                  --allowedTools "Bash,Read,Write,Grep,Glob" \
                  --model sonnet \
                  --max-turns 80 \
                  "$PROMPT" || true
                # 判定はディレクトリで出る。ここから先は何もしない（回収は publish サイドカー）。
            env:
              - name: HOME
                value: /tmp
              - name: CLAUDE_CODE_OAUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: claude-code-token
                    key: credential
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: workspace
                mountPath: /workspace
              - name: tmp
                mountPath: /tmp
              - name: prompt
                mountPath: /prompt
                readOnly: true
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                # Kata では memory limit が VM のサイズ
                memory: 4Gi
---
apiVersion: flow.tgy.io/v1alpha1
kind: TaskFlow
metadata:
  name: cnp-check
  namespace: claude-code
spec:
  profile: investigate
  start: 調査
  bindings:
    調査:
      handler: cnp-planner
      next:
        完了: ok
        # 「判定できない」を書いて表明する出口（taskflow #63）。宣言すると escalate/ が
        # 敷かれ、そこに書いた run は outcome Declined として記録される。宣言しなければ
        # 「何も書かない」= NoAnswer しか無く、途中で死んだのと区別が付かない。
        Escalated: escalate
  # 終端の意味は flow が言う（taskflow #64）。framework は 完了 が良い知らせだと知らない。
  # 宣言しない終端は metric 上 Undeclared のままになる。
  terminals:
    完了: Success
  reworkBudget: 0

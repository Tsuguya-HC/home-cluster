# taskflow に載せる最初の Task: CNP カバレッジ点検（Step 0 の cnp-check-cwf.yaml を
# TaskFlow / TaskHandler に移したもの）。
#
# 初回は 調査 の 1 フェーズだけ。設計 §16 の 調査 → 報告 の 2 フェーズは、前フェーズの
# report を次フェーズへ渡す store 封印（results/<runID>/）がまだ無いので載せられない。
#
# 語彙は next の宣言から来る。{完了: ok, Escalated: escalate} なので、エージェントが書けるのは
# /workspace/ 直下の ok/ と escalate/ の 2 つだけ。「判定できない」は escalate/ に理由を書いて
# 明示する（taskflow #63）。何も書かなければ従来どおり Escalated だが、そちらは沈黙 — 途中で
# 死んだのか意図して降りたのかが history から区別できない。
# terminals で終端の意味も宣言する（taskflow #64）。宣言しないと metric 上は Undeclared のまま。
#
# 人間への報告は 完了（Success）だけ 調査 Pod 内の notify サイドカーが担う（設計 §7: publish は
# 利用側のサイドカーの仕事。framework は判定ディレクトリしか見ない）。escalate / ambiguous /
# no-verdict（＝いずれも Escalated）はここでは通知しない — manifests/monitoring/
# prometheusrule-taskflow.yaml が taskflow_task_outcomes_total から Escalated を検知して
# 既存の Alertmanager Discord 受け口に出すので、ここでも出すと同じ Escalated に対して
# Discord が 2 通鳴る（home-cluster #743 が pr-review で決めた「通知は framework の信号に乗せる」
# を cnp-check にも揃える）。完了だけ残しているのは日次 cron が実際に走って判定を出せたことの
# ハートビートとしての価値のためで、Success はそちらの PrometheusRule の対象外なので重複しない。
#
# taskflow-verdict-protocol ConfigMap（プロンプトの一部）は複数 flow で共有するため
# manifests/claude-code/taskflow-common.yaml に置いてある。ここの projected volume はそこを参照する。
apiVersion: flow.tgy.io/v1alpha1
kind: TaskHandler
metadata:
  name: cnp-planner
  namespace: claude-code
spec:
  phase: 調査
  runner:
    type: Job
  timeout: 25m
  maxInfraRetries: 1
  # prepare / publish はコントローラが Job 生成時に注入する（taskflow #73）。
  workspace:
    volume: workspace
    mountPath: /workspace
  jobTemplate:
    template:
      metadata:
        labels:
          # 既存の CNP（manifests/claude-code/netpol.yaml）がこのラベルで選ぶ:
          # apiserver / api.anthropic.com / Loki / Prometheus / discord.com
          claude-code: "true"
      spec:
        restartPolicy: Never
        runtimeClassName: kata
        serviceAccountName: agent-cnp-reader
        # runAsUser は必須。コントローラはこれと違う uid で /workspace 直下を 0555 に閉じるので、
        # エージェントは宣言ディレクトリにだけ書ける。
        securityContext:
          runAsUser: 65533
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: workspace
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: prompt
            projected:
              sources:
                # taskflow-common.yaml にある共有 ConfigMap。
                - configMap:
                    name: taskflow-verdict-protocol
                - configMap:
                    name: cnp-check-prompt
        initContainers:
          # 人間への報告のうち 完了（Success）だけをここで扱う（設計 §7 / §9）。SIGTERM で
          # ok/ が非空かどうかを見る。escalate / ambiguous（ok と escalate 両方が非空）/
          # 沈黙（どちらも空）はいずれも Escalated 終端で、そちらは
          # manifests/monitoring/prometheusrule-taskflow.yaml が taskflow_task_outcomes_total
          # から検知して Discord に出す。ここでも出すと同じ Escalated に対して Discord が
          # 2 通鳴るので、この sidecar は完了の 1 パターンしか報告しない。
          - name: notify
            image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d5db59cac14b23a4ef85a456754522463267324e8ed3a84e795a2eba829c8f05
            restartPolicy: Always
            command: [sh, -c]
            args:
              - |
                # 判定そのものは framework が出す。ここは同じ規則で読み直すだけで、
                # 別の規則を持たない — 持つと Discord と Task の status が食い違う。
                # 規則は「非空の宣言ディレクトリがちょうど 1 つ」。report.md の有無では
                # なくディレクトリが空かどうかで見るのは、回収側がそう見ているから。
                nonempty() { [ -d "$1" ] && [ -n "$(ls -A "$1" 2>/dev/null)" ]; }
                notify() {
                  OK=/workspace/ok
                  ESC=/workspace/escalate
                  # 完了（ok だけが非空）以外は Escalated 終端で PrometheusRule 側の担当。
                  # ここで抜けると Discord には投げない。
                  nonempty "$OK" && ! nonempty "$ESC" || return 0
                  TITLE="CNP check (taskflow): ok"; COLOR=65280
                  REPORT_FILE="$OK/report.md"
                  # ディレクトリは非空でも report.md が無いことはある（framework は
                  # エントリの存在しか見ない）。その場合も判定は変えず、本文だけ断る。
                  if [ -s "$REPORT_FILE" ]; then
                    REPORT=$(jq -Rsr --argjson max 3900 \
                      'if length > $max then .[0:$max] + "\n\n_(以降を省略)_" else . end' < "$REPORT_FILE")
                  else
                    REPORT="判定は出ているが report.md が無い（他のファイルだけが置かれた）。kubectl -n claude-code get task で確認。"
                  fi
                  PAYLOAD=$(jq -n --arg title "$TITLE" --argjson color "$COLOR" --arg report "$REPORT" \
                    --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                    '{embeds: [{title: $title, color: $color, description: $report, timestamp: $ts}]}')
                  wget -qO /dev/null --header="Content-Type: application/json" \
                    --post-data="$PAYLOAD" "$DISCORD_WEBHOOK_URL" || echo "discord post failed"
                }
                trap 'notify; exit 0' TERM INT
                while :; do sleep 1; done
            env:
              - name: DISCORD_WEBHOOK_URL
                valueFrom:
                  secretKeyRef:
                    name: discord-webhook-argo
                    key: url
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: workspace
                mountPath: /workspace
                readOnly: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          - name: agent
            image: registry.infra.tgy.io/tools/claude-code:latest@sha256:43735b8c019ed5d68edc935b6c068f2ef30c223ec8b1e4fa336ae268af5e06aa
            workingDir: /workspace
            command: [sh, -c]
            args:
              - |
                PROMPT="$(cat /prompt/cnp-check.md; echo; cat /prompt/verdict-protocol.md)"
                claude -p \
                  --verbose \
                  --output-format stream-json \
                  --dangerously-skip-permissions \
                  --allowedTools "Bash,Read,Write,Grep,Glob" \
                  --model sonnet \
                  --max-turns 80 \
                  "$PROMPT" || true
                # 判定はディレクトリで出る。ここから先は何もしない（回収は publish サイドカー）。
            env:
              - name: HOME
                value: /tmp
              - name: CLAUDE_CODE_OAUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: claude-code-token
                    key: credential
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: workspace
                mountPath: /workspace
              - name: tmp
                mountPath: /tmp
              - name: prompt
                mountPath: /prompt
                readOnly: true
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                # Kata では memory limit が VM のサイズ
                memory: 4Gi
---
apiVersion: flow.tgy.io/v1alpha1
kind: TaskFlow
metadata:
  name: cnp-check
  namespace: claude-code
spec:
  profile: investigate
  start: 調査
  bindings:
    調査:
      handler: cnp-planner
      next:
        完了: ok
        # 「判定できない」を書いて表明する出口（taskflow #63）。宣言すると escalate/ が
        # 敷かれ、そこに書いた run は outcome Declined として記録される。宣言しなければ
        # 「何も書かない」= NoAnswer しか無く、途中で死んだのと区別が付かない。
        Escalated: escalate
  # 終端の意味は flow が言う（taskflow #64）。framework は 完了 が良い知らせだと知らない。
  # 宣言しない終端は metric 上 Undeclared のままになる。
  terminals:
    完了: Success
  reworkBudget: 0

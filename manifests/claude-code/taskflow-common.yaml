# taskflow の handler が複数で共有する部品を置く場所。
#
# **プロンプトは ConfigMap で持たない。** 手順（skill）と常時効く前提（claude-md）は private の
# parts リポ（Tsuguya-HC/parts）にあり、各 handler の initContainer `parts` が必要な分だけ引く。
# 版は各 handler の env PARTS_REF に commit SHA を直接書き、全 handler で同じ値にする（役割ごとに
# 版を割らない）。ConfigMap 参照にしないのは、Task が開始時に写し取るのは TaskHandler だけで、
# ConfigMap だと実行中の Task の途中の段から版が変わるため。値の置き場所と Renovate の追い方は
# renovate.jsonc の git-refs customManager を参照。
#
# プロンプトをかつて ConfigMap で持っていた頃、handler と別ファイルにあって片方だけ直る事故が
# あった（cnp-check、ADR-0005 の out/ 撤去時）。共有の判定プロトコルも parts の
# claude-md/verdict-protocol に移した（#866）。
#
# **これは実際に起きた（当時の形での話）。** cnp-check のプロンプトだけは taskflow 以前の慣習で
# manifests/claude-code/agent-prompts.yaml に離して置いてあり、ADR-0005 で out/ 層を撤去した
# とき（home-cluster #797）に handler 側だけが直り、プロンプトの `/workspace/out/ok/report.md`
# が取り残された。マウント直下は 0555 なので、エージェントは書けないまま黙って
# NoAnswer になった。当時は ConfigMap を handler と同じファイルに同居させて揃えたが、
# その形も #866 で終わり、今は全 handler が parts 経由（プロンプトは home-cluster に無い）。
#
# **判定を読み直して人間に通知する部品はここに置かない。** 通知は Pod の中の仕事ではなく、
# framework が終端で出すもの（Warning Event / Ready=False / metric、design.md §5 / §9）から
# 引くのが正。pr-review はサイドカーを持たない。

# 開始済みの Task が固定した handler 定義だけが configMapKeyRef で参照する。そうした Task が
# 残っている間は消さない。新しい handler は参照しないので、値は変えない（Renovate の対象外）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: parts-ref
  namespace: claude-code
data:
  branch: main
  sha: 171653bdcf08f13ba21fbfa3cbca2c2db748dd58
---
# Claude Code は ANTHROPIC_BASE_URL を向けても api.anthropic.com へ直行する経路を持つ
# （feature flag fetch / telemetry event logging / fast mode の可否チェック、
# code.claude.com/docs/en/network-config）。claude-code 系の CNP はどれも api.anthropic.com を
# 書いていない（env 取り違えを drop で検出するため）ので、この 3 本を入れないと正常時にも
# drop が出て、検出器として意味を失う。
# 2026-09-19 実測: 付けた側は Policy denied 0、付けない側は起動直後に 2 件。どちらも推論は正常
# （同じ prompt に同じ応答）。
#
# **この根拠の本文はここだけに置く。** 他の manifests / docs から参照する側はポインタ
# （「根拠は taskflow-common.yaml 参照」）だけにして、コピーを増やさないこと。
#
# **ここに無関係なキーを足さない。** envFrom は ConfigMap の全キーを無差別に注入するので、
# 追加したキーは確認なしに全 handler へ伝播する。別の共通 env が要るときは目的別に
# 別 ConfigMap を切ること。
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-disable-nonessential-traffic
  namespace: claude-code
data:
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

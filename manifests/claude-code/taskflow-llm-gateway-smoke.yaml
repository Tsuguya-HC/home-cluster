# Agent Router（llm-gateway）を経由して claude が動くかだけを確かめるスモーク flow（#942）。
#
# `taskflow-openrouter-smoke` の gateway 版。あちらは Pod から openrouter.ai へ直接出る形で、
# こちらは **Pod を外に出さず gateway だけに出す**。確かめるのは 3 つ:
#
#   1. handler の namespace から gateway の ClusterIP に届くこと（両端の CNP が噛み合っている）
#   2. 指定された alias（既定 implement）が AIGatewayRoute にマッチし、実モデルへ解決されること
#   3. **外に出ているのが gateway だけであること** — この CNP は openrouter.ai を**書かない**ので、
#      env が効かず Pod が直接出ようとしたら drop されて失敗する。取り違えが緑で通らない
#
# handler 側は LLM の資格情報を持たない。ANTHROPIC_AUTH_TOKEN に入るのは gateway の
# クライアントキーで、実キー（Max の OAuth トークン）は BackendSecurityPolicy 側にしか
# なく、gateway が Authorization を付け直す。これが #942 の「集約」の実物。
#
# この smoke は alias を入力で変えられる唯一の handler なので、**1 本の鍵で両階層に
# 入れるよう許可してある**（認証は Gateway 単位で 1 本、階層の分離はルートのマッチ側）。
#
# 投げ方（alias 省略時は implement）:
#   kubectl -n claude-code create -f - <<EOF
#   apiVersion: flow.tgy.io/v1alpha1
#   kind: Task
#   metadata: {generateName: llm-gateway-smoke-, namespace: claude-code}
#   spec:
#     flow: llm-gateway-smoke
#     input: {alias: review}
#   EOF
#
# alias を Task の input から取るのは、上流ごとに flow を複製しないため。CNP は gateway しか
# 開けていないので、どの alias を指定しても**出口は変わらない**（上流の選択は gateway 側の仕事）。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-llm-gateway-smoke
  namespace: claude-code
automountServiceAccountToken: false
---
# 出口は gateway だけ。**openrouter.ai を書かない**のがこの CNP の主眼。
# 10080 は listener 80 に対して Envoy が実際に listen する port（Service の port は 80 だが、
# CNP は変換後の backend port で当たる）。DNS は CCNP allow-dns で共通適用済み。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: taskflow-llm-gateway-smoke
  namespace: claude-code
spec:
  endpointSelector:
    matchLabels:
      taskflow-llm-gateway-smoke: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            io.kubernetes.pod.namespace: llm-gateway
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
---
apiVersion: flow.tgy.io/v1alpha1
kind: TaskHandler
metadata:
  name: llm-gateway-smoke
  namespace: claude-code
spec:
  phase: 確認
  runner:
    type: Job
  timeout: 10m
  maxInfraRetries: 1
  workspace:
    volume: flow-workspace
    mountPath: /workspace
  jobTemplate:
    template:
      metadata:
        labels:
          taskflow-llm-gateway-smoke: "true"
      spec:
        restartPolicy: Never
        runtimeClassName: kata
        serviceAccountName: agent-llm-gateway-smoke
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 60
        securityContext:
          runAsUser: 65533
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: tmp
            emptyDir: {}
        containers:
          - name: agent
            image: registry.infra.tgy.io/tools/claude-code:latest@sha256:b9c60a7cd7918baea7d43482752833ad2c269cef2e3179c79e2307a02815cd25
            workingDir: /workspace
            command: [sh, -c]
            args:
              - |
                set -eu

                # alias は Task の spec.input.alias から取る。値は gateway のルートに直接効くので、
                # pr-review と同じく**形を確かめてからしか使わない**（未知の alias は gateway 側で
                # 404 になるだけだが、それを「モデルが答えなかった」と読み違えないため）。
                # siblings は give_up() という名前だが、ここは next の
                # `Escalated: escalate` が選ぶ終端と名前を合わせている。
                escalate() {
                  mkdir -p /workspace/escalate
                  printf '%s\n' "$1" > /workspace/escalate/report.md
                  sync
                  exit 0
                }

                ALIAS=$(printf '%s' "${FLOW_INPUT:-}" | jq -r '.alias // empty' 2>/dev/null || true)
                if [ -z "$ALIAS" ]; then
                  # **input が非空なのに .alias を取れないなら、未指定と区別せず黙って流さない。**
                  # ここを既定に落とすと、`{alais: review}` のような typo や壊れた JSON が
                  # **証明済みの alias（implement）で成功して緑になる** — 確かめたいのは
                  # まだ通したことのない経路の方なので、それでは何も証明していない。
                  # taskflow-implement.yaml が同じ形を名指しで拒否しているのと同じ理由。
                  [ -z "${FLOW_INPUT:-}" ] || escalate "spec.input が JSON として読めないか .alias を持たない（キーの typo・空文字・null も含む）。alias の取り違えを既定で握り潰さないため止めた。gateway 経路は一切確かめていない。"
                  ALIAS="$LLM_ALIAS_DEFAULT"
                fi
                case "$ALIAS" in
                  implement|review|investigate) ;;
                  # 違反値そのものは返さない（taskflow-pr-review と同じ idiom）。
                  *) escalate "spec.input.alias が未知の値（implement / review / investigate のみ）。gateway 経路は一切確かめていない。" ;;
                esac
                echo "alias=$ALIAS"

                # 鍵が空のまま走ると 401 になり、claude は 10 回リトライしてから
                # 「認証に失敗」で落ちる（約 3 分、2026-09-18 実測）。ここで止めた方が速いし、
                # 「gateway に繋がらない」と区別がつく。
                # この smoke は alias を入力で変えられる唯一の handler なので、鍵 1 本で
                # 両階層に入れるよう許可してある（他の handler は alias が固定）。
                [ -n "$ANTHROPIC_AUTH_TOKEN" ] || escalate "クライアントキーが空。llm-gateway-client-keys Secret を確認すること。gateway 経路は一切確かめていない。"

                # --- 否定側の見張り -------------------------------------------------
                # **SecurityPolicy が外れていても、この下の happy path は緑のまま通る。**
                # Secret 側の事故は 500 で fail-closed だが、targetRefs が外れる・2 本目が
                # Conflicted で黙って無視される、は fail-open で、アクセスログの
                # 「tf.handler あり / llm.client 空」以外に兆候が無い。だから毎回
                # 「鍵が無ければ拒まれる」ことを確かめる。これが無いと、認証が丸ごと
                # 効かなくなった状態で smoke だけ緑になる。
                #
                # 401 は apiKeyAuth が sendLocalReply + StopIteration で返すのでルーティング
                # 前に止まり、**上流に行かない＝トークンを消費しない**（Max の枠も食わない）。
                # 逆に 200 が返ったら認証が効いていない証拠で、そのときだけ 1 トークン払う。
                BAD=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer this-key-is-deliberately-invalid" \
                  -H 'content-type: application/json' \
                  -H 'anthropic-version: 2023-06-01' \
                  --data '{"model":"'"$ALIAS"'","max_tokens":1,"messages":[{"role":"user","content":"x"}]}' \
                  "${ANTHROPIC_BASE_URL}/v1/messages" || true)
                case "$BAD" in
                  401) echo "否定側 OK: 無効な鍵は 401（alias=$ALIAS）" ;;
                  000|"") escalate "gateway に接続できない（否定側の確認が届かなかった）。CNP と Envoy を確認すること。alias=$ALIAS の確認はしていない。" ;;
                  500) escalate "gateway が 500 を返した。SecurityPolicy の翻訳エラー（Secret の参照ミス・鍵の値の重複・Secret 消失）が疑われる。alias=$ALIAS の確認はしていない。" ;;
                  *) escalate "無効な鍵が 401 以外（HTTP $BAD）で通った。**呼び出し側の認証が効いていない** — SecurityPolicy の付け忘れ、targetRefs の外れ、2 本目が Conflicted で無視された等。alias=$ALIAS。" ;;
                esac

                # --- 階層分離の見張り ---------------------------------------------
                # 上の否定側は「鍵が無ければ拒まれる」までしか見ない。**鍵さえあれば
                # どの階層でも通る**状態（Gateway 単位の認証だけで、ルートのクライアント
                # 条件が外れている状態）はそれでは検出できない。
                # tier-probe は従量課金ルートにだけ許可してあるクライアントなので、
                # これで Max（review）を要求して 404 になることを確かめる。
                # ルートに当たらない＝上流に行かないのでトークンは消費しない。
                TIER=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer $LLM_KEY_TIER_PROBE" \
                  -H 'content-type: application/json' \
                  -H 'anthropic-version: 2023-06-01' \
                  --data '{"model":"review","max_tokens":1,"messages":[{"role":"user","content":"x"}]}' \
                  "${ANTHROPIC_BASE_URL}/v1/messages" || true)
                case "$TIER" in
                  404) echo "階層分離 OK: 従量課金のクライアントは Max ルートに入れない（404）" ;;
                  401) escalate "tier-probe の鍵が認証を通らない（401）。llm-gateway 側の llm-gateway-client-keys Secret に tier-probe があるか確認すること。階層分離は確かめられていない。" ;;
                  000|"") escalate "gateway に接続できない（階層分離の確認が届かなかった）。alias=$ALIAS の確認はしていない。" ;;
                  *) escalate "**階層分離が効いていない** — 従量課金だけ許可したクライアントが Max ルートに HTTP $TIER で入れた。AIGatewayRoute の x-llm-client 条件が外れている疑い（manifests/llm-gateway/anthropic.yaml）。" ;;
                esac

                # activeDeadlineSeconds の TERM は PID1 に飛ぶ。前面で待つと POSIX sh は
                # 前面コマンドの終了まで trap を実行しないので、background + wait にする。
                claude -p "/workspace/ok/report.md に、いま応答しているモデル名だけを 1 行で書いて終了してください。他のファイルは作らないこと。" \
                  --verbose \
                  --output-format stream-json \
                  --dangerously-skip-permissions \
                  --allowedTools "Write" \
                  --model "$ALIAS" \
                  --max-turns 5 < /dev/null &
                pid=$!
                # `|| true` は省けない。このスクリプトは `set -e` で走り、trap の中も同じなので、
                # claude が既に終わっていると kill は 1 を返し、そこで trap が打ち切られて
                # sync に届かない（終了コードも 143 でなく 1 になる）。
                # taskflow-pr-review.yaml / taskflow-cnp-check.yaml に実測付きの記録がある。
                trap 'kill -TERM $pid 2>/dev/null || true
                      i=0
                      while kill -0 $pid 2>/dev/null && [ $i -lt 10 ]; do sleep 1; i=$((i+1)); done
                      kill -KILL $pid 2>/dev/null || true
                      sync || true
                      exit 143' TERM INT
                rc=0
                wait $pid || rc=$?
                echo "claude exited with $rc"
                # 判定はディレクトリで出る。終了コードは当てにしない（認証エラーでも
                # stream-json の result は subtype=success を返す）。
                sync
            env:
              - name: HOME
                value: /tmp
              # どの handler からの呼び出しかを gateway に名乗る（#942）。
              # 書式は `Name: Value`、複数なら改行区切り。gateway 側の
              # requestHeaderAttributes がこれを拾ってアクセスログに出す。
              - name: ANTHROPIC_CUSTOM_HEADERS
                value: "x-tf-handler: llm-gateway-smoke"
              # gateway 宛。Anthropic 入力は /anthropic 配下にあるので、claude が足す
              # /v1/messages と合わせて /anthropic/v1/messages になる。
              - name: ANTHROPIC_BASE_URL
                value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
              # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
              # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
              # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
              # 外では使えない（CNP の内側）。handler 単位で revoke できる。
              # 実キーは gateway の BackendSecurityPolicy が持っており、ここに何が入っていても
              # OpenRouter には届かない。
              - name: ANTHROPIC_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: llm-gateway-client-keys
                    key: llm-gateway-smoke
              # 階層分離の見張り用。従量課金ルートにだけ許可されたクライアント。
              - name: LLM_KEY_TIER_PROBE
                valueFrom:
                  secretKeyRef:
                    name: llm-gateway-client-keys
                    key: tier-probe
              # 空にしないと OAuth 側が優先されて Anthropic に飛ぶ（そちらは CNP で落ちる）。
              - name: ANTHROPIC_API_KEY
                value: ""
              # 実モデル名ではなく alias。どのモデルに解決されるかは
              # manifests/llm-gateway/ の AIGatewayRoute が決める。
              # spec.input.alias が無いときの既定。
              - name: LLM_ALIAS_DEFAULT
                value: implement
              # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
              # gateway にマッチするルートが無くなる。
              #
              # **ここは入力で動かさない。** 親が review / investigate のとき、子だけが
              # implement のままになる = **親子で上流も課金主体も割れる**
              # （親 → api.anthropic.com / 個人の Max、子 → openrouter.ai / 従量課金）。
              # この smoke は Agent を許可していないので今は起きないが、これをテンプレにして
              # 本番 handler を切り替えるときは、親に括り付けること
              # （taskflow-implement.yaml は CLAUDE_CODE_SUBAGENT_MODEL="$LLM_ALIAS" で
              # そうしている）。
              - name: CLAUDE_CODE_SUBAGENT_MODEL
                value: implement
            # api.anthropic.com への直行を止める 3 本。根拠は taskflow-common.yaml 参照。
            envFrom:
              - configMapRef:
                  name: claude-code-disable-nonessential-traffic
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: flow-workspace
                mountPath: /workspace
              - name: tmp
                mountPath: /tmp
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                # Kata では limit がそのまま VM のサイズ。cpu limit を書かないと 1 vCPU になる。
                cpu: "1"
                memory: 1Gi
---
apiVersion: flow.tgy.io/v1alpha1
kind: TaskFlow
metadata:
  name: llm-gateway-smoke
  namespace: claude-code
spec:
  profile: investigate
  start: 確認
  workspace: {}
  bindings:
    確認:
      handler: llm-gateway-smoke
      next:
        完了: ok
        Escalated: escalate
  terminals:
    完了: Success
  reworkBudget: 0

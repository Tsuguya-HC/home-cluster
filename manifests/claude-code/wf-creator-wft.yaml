apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: wf-creator
  namespace: claude-code
spec:
  activeDeadlineSeconds: 3600
  serviceAccountName: claude-code-executor
  entrypoint: main
  onExit: notify
  arguments:
    parameters:
      - name: description
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: create
            template: create

    - name: create
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [sh, -c]
          args:
            - |
              git config --global --add safe.directory /workspace
              # **ここに入るのは呼び出し元鍵**で、GitHub の資格情報ではない ——
              # gateway が Authorization を実 installation token に付け替える。
              # `token ` の形にするのは、Envoy の apiKeyAuth が明示的に剥がすのが
              # `Bearer ` だけで、こちらは文字列そのものが照合対象になるため。
              git config --global "http.https://${GH_HOST}/.extraHeader" \
                "Authorization: token ${GH_ENTERPRISE_TOKEN}"
              git clone "https://${GH_HOST}/Tsuguya-HC/home-cluster.git" /workspace
              cd /workspace
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
              mkdir -p /workspace/.bin
          env:
            # GitHub は gateway 経由（#1038）。**この Pod は GitHub の資格情報を持たない**
            # —— installation token は gateway 側にしかなく、gateway が Authorization を
            # 付け直す。GH_HOST を渡すと `gh` は GHES 扱いになり、REST を /api/v3、
            # GraphQL を /api/graphql に送る。ロールはホスト名で決まる。
            - name: GH_HOST
              value: gh-rw.infra.tgy.io
            # gateway のクライアントキー。**GitHub の資格情報ではない。**
            - name: GH_ENTERPRISE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-gateway-client-keys
                  key: wf-creator
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:0ceee9710c8107be0200d63c676514c8aaa2a0e9d453a5fd3f4e07a055e8dc43
        command: [sh, -c]
        args:
          - |
            DESCRIPTION='{{workflow.parameters.description}}'

            cd /workspace

            PROMPT="あなたは Kubernetes クラスタの Argo Workflows 設計エージェントです。
            依頼に基づいて新しい WorkflowTemplate を作成し、PR を出してください。

            ## 依頼内容
            ${DESCRIPTION}

            ## 作業手順
            1. 既存の WFT を読んでパターンを把握する（manifests/claude-code/ 配下）
            2. 必要なファイルを作成する
            3. docs/network-policies.md を更新する（CNP 変更がある場合）
            4. ブランチを切って commit → push → PR 作成

            ## WorkflowTemplate 規約（必ず守ること）

            ### セキュリティ
            - securityContext (pod): runAsUser: 65532, runAsNonRoot: true, runAsGroup: 65532, fsGroup: 65532
            - securityContext (container): allowPrivilegeEscalation: false, capabilities.drop: [ALL]
            - seccompProfile: RuntimeDefault（spec.securityContext に設定）
            - 機密値は Secret 経由（ハードコード禁止）
            - PUBLIC リポジトリ — 機密値を絶対にコミットしない

            ### Pod 設定
            - podMetadata.labels: claude-code: 'true'（CNP のセレクタに必要）
            - affinity: wn-03 を preferredScheduling
            - resources: requests (cpu: 100m, memory: 512Mi), limits (memory: 4Gi) が Claude 用の目安
            - activeDeadlineSeconds: 用途に応じて設定（調査: 900, 作業: 1800-3600）

            ### ServiceAccount
            - claude-code-sre: 読み取り専用（kubectl get/list/watch + pods/exec）
            - claude-code-executor: 書き込み可能（argo-workflows-edit + GitHub auth）

            ### Discord 通知（onExit パターン）
            onExit で結果を Discord に送信。argo-tools イメージ + discord-webhook-argo Secret を使用。
            emptyDir volume を report として共有し、メインステップが /report/result.txt に書き出す。

            ### CNP (CiliumNetworkPolicy)
            - 全 Pod にデフォルト deny。新しい通信が必要なら CNP を作成
            - DNS は CCNP で共通適用済み — 個別 CNP には不要
            - 外部 HTTPS は toFQDNs（toCIDR 0.0.0.0/0 は原則禁止、ビルドジョブ等のみ例外）
            - ファイル名: manifests/<namespace>/netpol-<name>.yaml
            - docs/network-policies.md も同時更新

            ### EventSource / Sensor（トリガーが必要な場合）
            - EventSource: manifests/argo/ に webhook 定義
            - Sensor: 同じく manifests/argo/ に dependency + trigger 定義
            - 既存の EventSource にエンドポイント追加 or 新規作成

            ### ArgoCD Application（新しい namespace の場合）
            - apps/ に Application YAML を作成
            - 既存の namespace (claude-code 等) なら不要

            ## Claude 実行パターン
            claude -p で実行する場合:
            - --verbose --output-format stream-json は必ずセット（Argo UI でログ確認用）
            - --dangerously-skip-permissions で権限プロンプトをスキップ
            - --allowedTools で必要なツールだけ許可
            - --model は llm-gateway の alias を指定する。review（レビュー・実装系）か
              investigate（調査系）のどちらか。**sonnet のような実モデル名は使わない** —
              gateway に一致するルートが無く 404 になる
            - --max-turns で暴走防止

            ## 推論の経路（新しい handler には必須）
            LLM の資格情報は Pod に置かない。実キー（Max の OAuth トークン / OpenRouter の
            API キー）は gateway が持つ。Pod に CLAUDE_CODE_OAUTH_TOKEN を渡してはいけない。
            env は次の 5 本:
            - ANTHROPIC_BASE_URL: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
            - ANTHROPIC_AUTH_TOKEN: **リテラルを書かない。** llm-gateway-client-keys Secret の
              secretKeyRef で、キー名は handler 名（= x-tf-handler に書く値と同じ）にする。
              固定値を書くと gateway の SecurityPolicy に弾かれて 401 になる
            - ANTHROPIC_API_KEY: 空文字（空にしないと OAuth 側が優先されて Anthropic 直行になる）
            - ANTHROPIC_CUSTOM_HEADERS: x-tf-handler に handler 名（アクセスログの帰属に使う）
            - CLAUDE_CODE_SUBAGENT_MODEL: --model と同じ alias（サブエージェントは親のモデルを継がない）

            ANTHROPIC_BASE_URL を正しく設定していても、Claude Code は feature flag fetch /
            telemetry event logging / fast mode の可否チェックで gateway を経由せず
            api.anthropic.com に直行する経路を持つ（code.claude.com/docs/en/network-config）。
            外すと CNP の drop が正常時にも出続け、検出器として機能しなくなるので、これを止める
            env 3 本（CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC / DISABLE_TELEMETRY /
            DISABLE_ERROR_REPORTING、いずれも \"1\"）も要る。渡し方は namespace で分岐する:
            - **claude-code namespace の handler**: 3 本を個別に書かず、コンテナに
              envFrom: [{configMapRef: {name: claude-code-disable-nonessential-traffic}}] を
              足す（このファイルの Pod spec が実例。ConfigMap は
              manifests/claude-code/taskflow-common.yaml）
            - **claude-code 以外の namespace（argo / claude-code-build 等）の handler**:
              configMapRef は同一 namespace しか解決できないので、3 本をリテラル env で書く
              （manifests/argo/pluto-check.yaml、
              manifests/claude-code-build/taskflow-implement.yaml が実例）

            ## クライアントキーの用意（env を書く前に必要）
            上の secretKeyRef が指すキーは自動では生えない。**先に 3 箇所に足すこと。**
            足さないと Pod が CreateContainerConfigError で起動しない。
            1. 1Password の item `llm-gateway-client-keys`（vault home-cluster）に、
               handler 名のラベルで新しいフィールドを作る（48 文字程度のランダム英数）
            2. manifests/secrets/claude-code-llm-gateway-client-keys.yaml の data に
               `secretKey: <handler 名>` / `property: <handler 名>` を追加
            3. manifests/secrets/llm-gateway-client-keys.yaml にも同じ handler 名で追加。
               **gateway 側に無い鍵は 401 になる。** 階層（Max / 従量課金）でこの Secret は
               分けない。階層は AIGatewayRoute のルールが x-llm-client をマッチして決まる。
               鍵の値は階層ごとに別のものを使う — 同じ Secret の中で値が重複すると
               SecurityPolicy 全体が翻訳エラーになる
            人手が要るのは 1 だけなので、そこは escalate して人に頼むこと。

            CNP は api.anthropic.com ではなく gateway 宛に開ける。
            toEndpoints で app.kubernetes.io/managed-by: envoy-gateway かつ
            io.kubernetes.pod.namespace: llm-gateway、ポートは 10080/TCP。
            **新しい namespace に置く場合は両端が要る** — manifests/llm-gateway/netpol.yaml の
            ingress fromEndpoints は namespace を列挙しているので、そこにも足す。
            片側だけだとエラーは出ず、接続がただ失敗する。

            ## Git 操作
            - ブランチ名: wf/<workflow-name>
            - commit メッセージは英語
            - PR は gh pr create で作成
            - PR タイトルは 70 文字以内

            ## Git コミット（署名付き）
            git commit + git push の代わりに、github-signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /usr/local/bin/github-signed-commit.sh -r Tsuguya-HC/home-cluster -m 'コミットメッセージ' を実行
            これにより GitHub API 経由で署名付きコミットが作成され、ローカルも同期される。
            PR 作成は署名コミット後に gh pr create で行う。"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent" \
              --model review \
              "$PROMPT" || true
        env:
          # GitHub は gateway 経由（#1038）。**この Pod は GitHub の資格情報を持たない**
          # —— installation token は gateway 側にしかなく、gateway が Authorization を
          # 付け直す。GH_HOST を渡すと `gh` は GHES 扱いになり、REST を /api/v3、
          # GraphQL を /api/graphql に送る。ロールはホスト名で決まる。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。**
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: wf-creator
          - name: HOME
            value: /claude-home
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
          # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
          # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
          # 外では使えない（CNP の内側）。handler 単位で revoke できる。
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-gateway-client-keys
                key: wf-creator
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの handler からの呼び出しかを gateway に名乗る（アクセスログの tf.handler）。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: wf-creator"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。親と同じ alias に括り付ける。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
        # api.anthropic.com への直行を止める 3 本。根拠は taskflow-common.yaml 参照。
        envFrom:
          - configMapRef:
              name: claude-code-disable-nonessential-traffic
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

    - name: notify
      steps:
        - - name: send
            templateRef:
              name: discord-notify
              template: send
              clusterScope: true

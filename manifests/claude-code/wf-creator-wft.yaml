apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: wf-creator
  namespace: claude-code
spec:
  activeDeadlineSeconds: 3600
  serviceAccountName: claude-code-executor
  entrypoint: main
  onExit: notify
  arguments:
    parameters:
      - name: description
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
    - name: github-token
      emptyDir: {}
    - name: github-app-secret
      secret:
        secretName: github-app-private-key
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: create
            template: create

    - name: create
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/home-cluster"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [sh, -c]
          args:
            - |
              export GITHUB_TOKEN=$(cat /github-token/token)
              git config --global --add safe.directory /workspace
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Tsuguya-HC/home-cluster.git" /workspace
              cd /workspace
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
              mkdir -p /workspace/.bin
              cp /usr/local/bin/github-signed-commit.sh /workspace/.bin/
          env:
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: github-token
              mountPath: /github-token
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:f4bf69bfa990c3ebfbcc23fe666005a56377b5dc2a2ee1919dca5e54e31f174e
        command: [sh, -c]
        args:
          - |
            export GITHUB_TOKEN=$(cat /github-token/token)
            export GH_TOKEN=$GITHUB_TOKEN
            DESCRIPTION='{{workflow.parameters.description}}'

            cd /workspace

            PROMPT="あなたは Kubernetes クラスタの Argo Workflows 設計エージェントです。
            依頼に基づいて新しい WorkflowTemplate を作成し、PR を出してください。

            ## 依頼内容
            ${DESCRIPTION}

            ## 作業手順
            1. 既存の WFT を読んでパターンを把握する（manifests/claude-code/ 配下）
            2. 必要なファイルを作成する
            3. docs/network-policies.md を更新する（CNP 変更がある場合）
            4. ブランチを切って commit → push → PR 作成

            ## WorkflowTemplate 規約（必ず守ること）

            ### セキュリティ
            - securityContext (pod): runAsUser: 65532, runAsNonRoot: true, runAsGroup: 65532, fsGroup: 65532
            - securityContext (container): allowPrivilegeEscalation: false, capabilities.drop: [ALL]
            - seccompProfile: RuntimeDefault（spec.securityContext に設定）
            - 機密値は Secret 経由（ハードコード禁止）
            - PUBLIC リポジトリ — 機密値を絶対にコミットしない

            ### Pod 設定
            - podMetadata.labels: claude-code: 'true'（CNP のセレクタに必要）
            - affinity: wn-03 を preferredScheduling
            - resources: requests (cpu: 100m, memory: 512Mi), limits (memory: 4Gi) が Claude 用の目安
            - activeDeadlineSeconds: 用途に応じて設定（調査: 900, 作業: 1800-3600）

            ### ServiceAccount
            - claude-code-sre: 読み取り専用（kubectl get/list/watch + pods/exec）
            - claude-code-executor: 書き込み可能（argo-workflows-edit + GitHub auth）

            ### Discord 通知（onExit パターン）
            onExit で結果を Discord に送信。argo-tools イメージ + discord-webhook-argo Secret を使用。
            emptyDir volume を report として共有し、メインステップが /report/result.txt に書き出す。

            ### CNP (CiliumNetworkPolicy)
            - 全 Pod にデフォルト deny。新しい通信が必要なら CNP を作成
            - DNS は CCNP で共通適用済み — 個別 CNP には不要
            - 外部 HTTPS は toFQDNs（toCIDR 0.0.0.0/0 は原則禁止、ビルドジョブ等のみ例外）
            - ファイル名: manifests/<namespace>/netpol-<name>.yaml
            - docs/network-policies.md も同時更新

            ### EventSource / Sensor（トリガーが必要な場合）
            - EventSource: manifests/argo/ に webhook 定義
            - Sensor: 同じく manifests/argo/ に dependency + trigger 定義
            - 既存の EventSource にエンドポイント追加 or 新規作成

            ### ArgoCD Application（新しい namespace の場合）
            - apps/ に Application YAML を作成
            - 既存の namespace (claude-code 等) なら不要

            ## Claude 実行パターン
            claude -p で実行する場合:
            - --verbose --output-format stream-json は必ずセット（Argo UI でログ確認用）
            - --dangerously-skip-permissions で権限プロンプトをスキップ
            - --allowedTools で必要なツールだけ許可
            - --model は llm-gateway の alias を指定する。review（レビュー・実装系）か
              investigate（調査系）のどちらか。**sonnet のような実モデル名は使わない** —
              gateway に一致するルートが無く 404 になる
            - --max-turns で暴走防止

            ## 推論の経路（新しい handler には必須）
            LLM の資格情報は Pod に置かない。gateway が持ち、Pod は alias で呼ぶだけ。
            Pod に CLAUDE_CODE_OAUTH_TOKEN を渡してはいけない。env は次の 5 本:
            - ANTHROPIC_BASE_URL: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
            - ANTHROPIC_AUTH_TOKEN: handled-by-llm-gateway（資格情報ではない。空だと claude が起動しない）
            - ANTHROPIC_API_KEY: 空文字（空にしないと OAuth 側が優先されて Anthropic 直行になる）
            - ANTHROPIC_CUSTOM_HEADERS: x-tf-handler に handler 名（アクセスログの帰属に使う）
            - CLAUDE_CODE_SUBAGENT_MODEL: --model と同じ alias（サブエージェントは親のモデルを継がない）

            CNP は api.anthropic.com ではなく gateway 宛に開ける。
            toEndpoints で app.kubernetes.io/managed-by: envoy-gateway かつ
            io.kubernetes.pod.namespace: llm-gateway、ポートは 10080/TCP。
            **新しい namespace に置く場合は両端が要る** — manifests/llm-gateway/netpol.yaml の
            ingress fromEndpoints は namespace を列挙しているので、そこにも足す。
            片側だけだとエラーは出ず、接続がただ失敗する。

            ## Git 操作
            - ブランチ名: wf/<workflow-name>
            - commit メッセージは英語
            - PR は gh pr create で作成
            - PR タイトルは 70 文字以内

            ## Git コミット（署名付き）
            git commit + git push の代わりに、github-signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /workspace/.bin/github-signed-commit.sh -r Tsuguya-HC/home-cluster -m 'コミットメッセージ' を実行
            これにより GitHub API 経由で署名付きコミットが作成され、ローカルも同期される。
            PR 作成は署名コミット後に gh pr create で行う。"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent" \
              --model review \
              "$PROMPT" || true
        env:
          - name: HOME
            value: /claude-home
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # claude は空だと起動しないので置くが、**これは資格情報ではない**。
          - name: ANTHROPIC_AUTH_TOKEN
            value: handled-by-llm-gateway
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの handler からの呼び出しかを gateway に名乗る（アクセスログの tf.handler）。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: wf-creator"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。親と同じ alias に括り付ける。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
          - name: github-token
            mountPath: /github-token
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

    - name: notify
      steps:
        - - name: send
            templateRef:
              name: discord-notify
              template: send
              clusterScope: true

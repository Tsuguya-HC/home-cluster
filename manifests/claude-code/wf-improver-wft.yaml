apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: wf-improver
  namespace: claude-code
spec:
  activeDeadlineSeconds: 3600
  serviceAccountName: claude-code-executor
  entrypoint: main
  onExit: notify
  arguments:
    parameters:
      - name: target
      - name: context
        default: ""
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: improve
            template: improve

    - name: improve
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
          command: [sh, -c]
          args:
            - |
              git config --global --add safe.directory /workspace
              # **ここに入るのは呼び出し元鍵**で、GitHub の資格情報ではない ——
              # gateway が Authorization を実 installation token に付け替える。
              # `token ` の形にするのは、Envoy の apiKeyAuth が明示的に剥がすのが
              # `Bearer ` だけで、こちらは文字列そのものが照合対象になるため。
              git config --global "http.https://${GH_HOST}/.extraHeader" \
                "Authorization: token ${GH_ENTERPRISE_TOKEN}"
              git clone "https://${GH_HOST}/Tsuguya-HC/home-cluster.git" /workspace
              cd /workspace
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
              mkdir -p /workspace/.bin
          env:
            # GitHub は gateway 経由（#1038）。**この Pod は GitHub の資格情報を持たない**
            # —— installation token は gateway 側にしかなく、gateway が Authorization を
            # 付け直す。GH_HOST を渡すと `gh` は GHES 扱いになり、REST を /api/v3、
            # GraphQL を /api/graphql に送る。ロールはホスト名で決まる。
            - name: GH_HOST
              value: gh-rw.infra.tgy.io
            # gateway のクライアントキー。**GitHub の資格情報ではない。**
            - name: GH_ENTERPRISE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-gateway-client-keys
                  key: wf-improver
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:039c07017273b014bed37709888c3e22d74532894d02c9758377d2a0d702eede
        command: [sh, -c]
        args:
          - |
            TARGET='{{workflow.parameters.target}}'
            CONTEXT='{{workflow.parameters.context}}'

            cd /workspace

            PROMPT="あなたは Kubernetes クラスタの Argo Workflows 改善エージェントです。
            指定された WorkflowTemplate を分析し、改善点があれば PR を出してください。

            ## 対象
            ${TARGET}

            ## 追加コンテキスト
            ${CONTEXT}

            ## 分析手順
            1. 対象 WFT の YAML を読む（manifests/ 配下を検索）
            2. 関連ファイルも確認（CNP, EventSource, Sensor, ArgoCD App）
            3. 他の WFT と比較してパターンの一貫性を確認
            4. 問題点・改善点を特定
            5. 改善がある場合のみブランチを切って commit → push → PR

            ## 分析観点

            ### セキュリティ
            - securityContext が規約通りか（runAsUser: 65532, runAsNonRoot, capabilities drop ALL, seccompProfile）
            - 機密値がハードコードされていないか
            - allowedTools が最小限か（不要な権限を与えていないか）
            - CNP が存在し、最小権限になっているか

            ### 信頼性
            - activeDeadlineSeconds が適切か（短すぎて失敗 / 長すぎてリソース浪費）
            - エラーハンドリング（|| true の適切な使用、fallback 処理）
            - max-turns が設定されているか（Claude の暴走防止）
            - リソース requests/limits が適切か

            ### 効率
            - 不要なステップがないか
            - 並列化できるステップがないか
            - イメージサイズやリソースの無駄がないか

            ### 一貫性
            - 他の WFT と同じパターンに従っているか
            - ラベル、アノテーション、命名規約の統一
            - Discord 通知パターンの統一（onExit + discord-notify templateRef）

            ### ドキュメント
            - docs/network-policies.md に CNP が反映されているか
            - 新しい通信パスが文書化されているか

            ## 規約（改善時に適用）
            - --verbose --output-format stream-json は必ずセット（Argo UI ログ確認用）
            - podMetadata.labels: claude-code: 'true'
            - affinity: wn-03 を preferredScheduling
            - PUBLIC リポジトリ — 機密値を絶対にコミットしない

            ## Git 操作
            - ブランチ名: improve/<workflow-name>
            - commit メッセージは英語
            - PR は gh pr create で作成、改善内容を明記
            - 改善点がなければ PR を作らず、分析結果だけ報告する

            ## Git コミット（署名付き）
            git commit + git push の代わりに、github-signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /usr/local/bin/github-signed-commit.sh -r Tsuguya-HC/home-cluster -m 'コミットメッセージ' を実行
            これにより GitHub API 経由で署名付きコミットが作成され、ローカルも同期される。
            PR 作成は署名コミット後に gh pr create で行う。"

            claude -p \
              --verbose \
              --output-format stream-json \
              --dangerously-skip-permissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent" \
              --model review \
              "$PROMPT" || true
        env:
          # GitHub は gateway 経由（#1038）。**この Pod は GitHub の資格情報を持たない**
          # —— installation token は gateway 側にしかなく、gateway が Authorization を
          # 付け直す。GH_HOST を渡すと `gh` は GHES 扱いになり、REST を /api/v3、
          # GraphQL を /api/graphql に送る。ロールはホスト名で決まる。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。**
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: wf-improver
          - name: HOME
            value: /claude-home
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
          # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
          # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
          # 外では使えない（CNP の内側）。handler 単位で revoke できる。
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-gateway-client-keys
                key: wf-improver
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの handler からの呼び出しかを gateway に名乗る（アクセスログの tf.handler）。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: wf-improver"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。親と同じ alias に括り付ける。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
        # api.anthropic.com への直行を止める 3 本。根拠は taskflow-common.yaml 参照。
        envFrom:
          - configMapRef:
              name: claude-code-disable-nonessential-traffic
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

    - name: notify
      steps:
        - - name: send
            templateRef:
              name: discord-notify
              template: send
              clusterScope: true

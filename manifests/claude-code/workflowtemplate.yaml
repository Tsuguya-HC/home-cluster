apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-code-executor
  namespace: claude-code
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-executor
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: claude-code-executor
    namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-executor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-code-sre-reader
subjects:
  - kind: ServiceAccount
    name: claude-code-executor
    namespace: claude-code
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-sso-admin-extras
  namespace: claude-code
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["argo-artifacts"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-sso-admin-extras
  namespace: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-sso-admin-extras
subjects:
  - kind: ServiceAccount
    name: argo-workflows-sso-admin
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: claude-code
  namespace: claude-code
spec:
  activeDeadlineSeconds: 3600
  serviceAccountName: claude-code-executor
  entrypoint: main
  arguments:
    parameters:
      - name: issue-number
      - name: prompt
        default: "none"
  podMetadata:
    labels:
      claude-code: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: workspace
      emptyDir: {}
    - name: claude-home
      emptyDir: {}
    - name: mcp-config
      configMap:
        name: claude-code-mcp
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: run
            template: claude-code
    - name: claude-code
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: setup
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
          command: [sh, -c]
          args:
            - |
              git config --global --add safe.directory /workspace
              # 呼び出し元鍵を載せる。gateway が実 installation token に付け替える。
              git config --global "http.https://${GH_HOST}/.extraHeader" \
                "Authorization: token ${GH_ENTERPRISE_TOKEN}"
              git clone "https://${GH_HOST}/Tsuguya-HC/home-rss.git" /workspace
              cd /workspace
              git checkout -b "issue-${ISSUE_NUMBER}"
              git config user.name "tgy-cluster-bot[bot]"
              git config user.email "tgy-cluster-bot[bot]@users.noreply.github.com"
              mkdir -p /workspace/.bin
              curl -sf -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/Tsuguya-HC/home-rss/issues/${ISSUE_NUMBER}" | jq -r '"# Issue #\(.number): \(.title)\n\n\(.body)"' > /workspace/ISSUE.md
              cp -R /workspace/k8s/.claude /claude-home/
          env:
            # GitHub は gateway 経由（#1038）。この Pod は GitHub の資格情報を持たない。
            - name: GH_HOST
              value: gh-rw.infra.tgy.io
            # gateway のクライアントキー。**GitHub の資格情報ではない。**
            - name: GH_ENTERPRISE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-gateway-client-keys
                  key: claude-code-generic
            - name: HOME
              value: /tmp
            - name: ISSUE_NUMBER
              value: "{{workflow.parameters.issue-number}}"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: claude-home
              mountPath: /claude-home
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      container:
        image: registry.infra.tgy.io/tools/claude-code:latest@sha256:b9c60a7cd7918baea7d43482752833ad2c269cef2e3179c79e2307a02815cd25
        command: [sh, -c]
        args:
          - |
            if [ "$CUSTOM_PROMPT" != "none" ] && [ -n "$CUSTOM_PROMPT" ]; then
              PROMPT="$CUSTOM_PROMPT"
            else
              PROMPT="/workspace/ISSUE.md に対象 Issue の内容があります。これを読んで要件を理解し、実装してください。完了したらコミット・プッシュして PR を作成してください。Closes は ISSUE.md 冒頭の Issue 番号を使うこと。

            ## Git コミット（署名付き）
            git commit + git push の代わりに、github-signed-commit.sh を使うこと。
            1. git add でファイルをステージ
            2. /usr/local/bin/github-signed-commit.sh -r Tsuguya-HC/home-rss -m 'コミットメッセージ' を実行
            これにより GitHub API 経由で署名付きコミットが作成され、ローカルも同期される。
            PR 作成は署名コミット後に gh pr create で行う。"
            fi
            cd /workspace
            claude -p "$PROMPT" --model review --verbose --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Agent" --mcp-config /mcp-config/mcp.json
        env:
          # GitHub は gateway 経由（#1038）。この Pod は GitHub の資格情報を持たない。
          - name: GH_HOST
            value: gh-rw.infra.tgy.io
          # gateway のクライアントキー。**GitHub の資格情報ではない。**
          - name: GH_ENTERPRISE_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-gateway-client-keys
                key: claude-code-generic
          - name: HOME
            value: /claude-home
          - name: ISSUE_NUMBER
            value: "{{workflow.parameters.issue-number}}"
          - name: CUSTOM_PROMPT
            value: "{{workflow.parameters.prompt}}"
          # 推論は llm-gateway 経由（#942）。**この Pod は LLM の資格情報を持たない** —
          # 実キーは gateway の BackendSecurityPolicy 側にしかなく、gateway が付け直す。
          - name: ANTHROPIC_BASE_URL
            value: http://llm-gateway.llm-gateway.svc.cluster.local/anthropic
          # gateway のクライアントキー。**LLM の資格情報ではない** — Max の OAuth トークンも
          # OpenRouter の API キーも gateway 側にしかなく、gateway が Authorization を付け直す。
          # この鍵が示すのは「どの階層を呼んでよいか」だけで、llm-gateway に届く Pod の
          # 外では使えない（CNP の内側）。handler 単位で revoke できる。
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: llm-gateway-client-keys
                key: claude-code-agent
          # 空にしないと OAuth 側が優先されて Anthropic 直行になる（CNP で落ちる）。
          - name: ANTHROPIC_API_KEY
            value: ""
          # どの handler からの呼び出しかを gateway に名乗る（アクセスログの tf.handler）。
          - name: ANTHROPIC_CUSTOM_HEADERS
            value: "x-tf-handler: claude-code-agent"
          # サブエージェントは親のモデルを継がない。固定しないと既定（sonnet）に落ち、
          # gateway にマッチするルートが無くなる。親と同じ alias に括り付ける。
          - name: CLAUDE_CODE_SUBAGENT_MODEL
            value: review
        # api.anthropic.com への直行を止める 3 本。根拠は taskflow-common.yaml 参照。
        envFrom:
          - configMapRef:
              name: claude-code-disable-nonessential-traffic
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: claude-home
            mountPath: /claude-home
          - name: mcp-config
            mountPath: /mcp-config
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-pg
  namespace: database
spec:
  certificates:
    serverCASecret: shared-pg-server-tls
    serverTLSSecret: shared-pg-server-tls
  instances: 2
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  storage:
    storageClass: qnap-nfs
    size: 10Gi
  bootstrap:
    initdb:
      owner: app
      secret:
        name: shared-pg-credentials
      postInitSQL:
        - "CREATE ROLE grafana LOGIN;"
        - "CREATE ROLE argo LOGIN;"
        - "CREATE ROLE nextcloud LOGIN;"
        - "CREATE DATABASE grafana OWNER grafana;"
        - "CREATE DATABASE argo OWNER argo;"
        - "CREATE DATABASE nextcloud OWNER nextcloud;"
        - "CREATE ROLE seaweedfs LOGIN;"
        - "CREATE DATABASE seaweedfs OWNER seaweedfs;"
        - "CREATE ROLE horenso LOGIN;"
        - "CREATE DATABASE horenso OWNER horenso;"
  backup:
    barmanObjectStore:
      destinationPath: s3://home-cluster-backup/cnpg/
      endpointURL: https://b0832b1c20a7cada26af0ac45862ce80.r2.cloudflarestorage.com
      s3Credentials:
        accessKeyId:
          name: r2-backup-credentials
          key: credential
        secretAccessKey:
          name: r2-backup-credentials
          key: password
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "7d"
  managed:
    roles:
      - name: grafana
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        passwordSecret:
          name: grafana-pg-credentials
      - name: argo
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        passwordSecret:
          name: argo-pg-credentials
      - name: nextcloud
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        passwordSecret:
          name: nextcloud-pg-credentials
      - name: seaweedfs
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        passwordSecret:
          name: seaweedfs-pg-credentials
      - name: horenso
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        passwordSecret:
          name: horenso-pg-credentials
      - name: trading
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        passwordSecret:
          name: trading-pg-credentials

# Agent Router コントローラ。AIGatewayRoute 等を Envoy Gateway のリソースへ翻訳し
# （extension server として EG から呼ばれる）、データプレーンの Pod に extproc を
# 注入する（MutatingWebhook）。外部へは出ない。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-router-controller
  namespace: envoy-ai-gateway-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway-helm
  ingress:
    # apiserver からの admission（Pod mutator、:9443）。ここが閉じていると
    # extproc が注入されず、Envoy は AI のルートを持たないまま起動する。
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Envoy Gateway コントローラからの extension server gRPC（:1063）。
    # データプレーンではなくコントロールプレーンが呼ぶ。
    - fromEndpoints:
        - matchLabels:
            control-plane: envoy-gateway
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "1063"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

# GitHub の REST / GraphQL / git を gateway 経由で呼ぶ側のクライアントキーを、
# クラスタ内で生成・ローテーションする（#973）。
#
# **なぜ 1Password を出るか**: この鍵はクラスタの外で使えない —— gateway に届く Pod
# からしか通らないので、外部資格情報のように保管庫へ置く必然性が無い。置いたままだと
# handler を 1 本足すたびに人手で 1Password のフィールドを作ることになる。
#
# **対象は #1038 で新しく生える鍵だけ。** MCP のクライアントキー
# （github-mcp-*-client-keys）と LLM 階層の鍵は 1Password のまま動かさない ——
# あちらの Secret は ExternalSecret が `creationPolicy: Owner` で所有しており
# （`blockOwnerDeletion: true` の ownerReference を張っていることを実測）、
# ExternalSecret を消すと Secret ごと GC される。**その削除を持つ Application
# （secrets）と、作り直す hook を持つ Application（github-auth）は別で、
# ArgoCD に両者を跨ぐ順序保証は無い。** 参照先を失った SecurityPolicy は 500 直返しに
# なるので、所有権の移管は #973 で別途やる。それまでこの Gateway の SecurityPolicy は
# 1Password 由来の Secret と生成器由来の Secret を両方参照する。
#
# **github-token-rotator とは別の CronJob。** あちらは installation token（寿命 1 時間）
# を 30 分ごとに上書きするだけで状態を持たない。こちらは日次で、前回値を一世代だけ
# 残す。周期も関心も違うので混ぜない。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
---
# **鍵の一覧はここが正。** handler を足すときに触るのはこのファイルだけで、
# 1Password も gateway のマニフェストも触らない。
#
# 書式: `<client> <role> <consumer>`
#   client   … そのまま Secret のキー名になり、gateway のアクセスログに
#              `github.client` として出る。**値が重複すると SecurityPolicy 全体が
#              翻訳エラーで 500 直返し**になるが、値は毎回乱数なので衝突しない。
#              ID の重複は先勝ちで黙って無視されるので、名前は重複させないこと
#   role     … ro / rw。gateway 側のどちらの Secret に入るかを決める
#   consumer … `<ns>/<secret>/<key>`、まだ配らないなら `-`
#
# **consumer を書く行を足したら、その namespace への書き込み Role も足すこと。**
# 足し忘れると生成器が 403 で落ちる（黙って配られないのではなく落ちるので気づける）。
#
# gateway 側の Secret には前回値が `<client>-prev` として同居する。これも有効な
# 資格情報なので、アクセスログの `github.client` に `-prev` が出ている間は、
# まだ旧鍵で来ている呼び出し元が残っているということ。
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-gateway-clients
  namespace: github-auth
data:
  clients: |
    pr-review ro -
    implement rw claude-code/github-gateway-client-keys/implement
    task-executor-write rw claude-code/github-gateway-client-keys/task-executor-write
    pluto-check rw argo/github-gateway-client-keys/pluto-check
    wf-creator rw claude-code/github-gateway-client-keys/wf-creator
    wf-improver rw claude-code/github-gateway-client-keys/wf-improver
    claude-code-generic rw claude-code/github-gateway-client-keys/claude-code-generic
    horenso-verify ro claude-code/github-gateway-client-keys/horenso-verify
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
data:
  rotate.sh: |
    #!/bin/sh
    # 二重鍵の重なりは「gateway 側が今回値と前回値を同時に持つ」ことで作る。
    # 1 回の run で 新値生成 → gateway 側に新旧 → 消費側に新値 の順に書く。
    # 前回値は次の run で自然に落ちる（毎回 {新, 前} だけを書くため）。
    #
    # **順序が要件。** 消費側を先に書くと、その瞬間に gateway がまだ知らない鍵を
    # 持つ Pod が生まれて 401 になる。gateway を先に書けば、その間に起動した Pod が
    # 持つ旧鍵は前回値として有効なままなので窓が無い。
    #
    # **gateway 側と消費側で値の形が違う。** gateway は `gh` が送る
    # `Authorization: token <値>` と照合するので前置込みで持ち、消費側は `gh` が
    # 自分で前置するので生の値を持つ。
    set -eu

    WORK=/tmp/keys

    # 値を argv に載せない。Tetragon が process_exec を process.arguments 込みで
    # Loki へ export しており、この namespace も exportDenyList から外れていないので、
    # argv に載せると Grafana 読者全員に見える。ファイル経由で渡す。
    gen() {
      head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'
    }

    # gateway 側の現在値（`token <値>` の形）。まだ無ければ空を返す。
    # jsonpath のフィールド名にはハイフンが入るので、必ず [''] で引くこと。
    cur() {
      kubectl -n llm-gateway get secret "$1" -o "jsonpath={.data['$2']}" 2>/dev/null \
        | base64 -d 2>/dev/null || true
    }

    # ディレクトリ 1 つ = Secret 1 つ。ファイル名がキー、中身が値。
    # **kubectl create secret はステージしたファイルから Secret 全体を組み立てる。**
    # ここへ来る前にクライアントを 1 つでも飛ばすと、その鍵が Secret から丸ごと
    # 消えて 401 になる。表の行は必ず全部ステージすること。
    apply_dir() {
      _ns=$1
      _name=$2
      _dir=$3
      [ -d "$_dir" ] || return 0
      set --
      for _f in "$_dir"/*; do
        [ -e "$_f" ] || continue
        set -- "$@" "--from-file=$(basename "$_f")=$_f"
      done
      [ "$#" -gt 0 ] || return 0
      # --server-side なのは、client-side apply が last-applied-configuration に
      # 同じ鍵をもう 1 部書き込むため。写しを増やす理由が無い。
      kubectl create secret generic "$_name" --namespace "$_ns" "$@" \
        --dry-run=client -o yaml \
        | kubectl apply --server-side --force-conflicts -f -
    }

    secret_for() {
      case "$1" in
        ro) echo github-api-ro-client-keys ;;
        rw) echo github-api-rw-client-keys ;;
        *) echo "unknown role: $1" >&2; exit 1 ;;
      esac
    }

    rm -rf "$WORK"
    mkdir -p "$WORK"
    umask 077

    while read -r client role consumer; do
      [ -n "$client" ] || continue
      case "$client" in \#*) continue ;; esac

      name=$(secret_for "$role")
      old=$(cur "$name" "$client")

      # bootstrap は「鍵が無ければ作る」だけ。既にあるものは値を据え置く。
      # ここで回してしまうと、sync が頻繁な日に in-flight の handler が持つ鍵が
      # 1 回の run を待たずに前回値へ落ち、さらに次で消えて 401 になる。
      #
      # **据え置くのは今回値だけでは足りない。** apply_dir はステージしたファイルから
      # Secret 全体を組み直すので、前回値をステージし直さないと `<client>-prev` が
      # 消える —— 直前に回したばかりの重なりを、sync 1 回で潰すことになる。
      if [ "${MODE:-rotate}" = bootstrap ] && [ -n "$old" ]; then
        raw=${old#token }
        prev=$(cur "$name" "$client-prev")
        rotated=""
      else
        raw=$(gen)
        prev=$old
        rotated=$old
      fi

      # **2 つのエンコードを置く。** Envoy の apiKeyAuth が明示的に剥がすのは
      # `Bearer ` だけなので、`gh` が送る `Authorization: token <値>` は文字列
      # そのものが照合対象になり、curl が送る `Bearer <値>` は剥がされた生の値が
      # 照合対象になる。同じ呼び出し元が両方の作法で来るので両方を有効にする。
      # apiKeyAuth は Secret の全キーを有効な資格情報として扱うので、これで足りる。
      mkdir -p "$WORK/gw/$name"
      printf 'token %s' "$raw" > "$WORK/gw/$name/$client"
      printf '%s' "$raw" > "$WORK/gw/$name/$client-bearer"
      if [ -n "$prev" ]; then
        printf '%s' "$prev" > "$WORK/gw/$name/$client-prev"
        printf '%s' "${prev#token }" > "$WORK/gw/$name/$client-prev-bearer"
      fi

      if [ "$consumer" != "-" ]; then
        c_ns=${consumer%%/*}
        c_rest=${consumer#*/}
        c_secret=${c_rest%%/*}
        c_key=${c_rest#*/}
        # 3 つとも空でないことを見る。**空の名前空間を見逃さないこと** ——
        # 先頭が `/` の consumer は $c_ns が空になり、ステージ先が先頭 `.` の
        # ディレクトリになる。下の apply ループのグロブは先頭 `.` に一致しないので、
        # ファイルは書かれるのに apply されず、ログにも出ない。この表の
        # 書き違えは落ちて気づけることが前提なので、ここだけ黙って通してはいけない。
        if [ -z "$c_ns" ] || [ -z "$c_secret" ] || [ -z "$c_key" ] ||
           [ "$c_ns" = "$consumer" ] || [ "$c_secret" = "$c_rest" ]; then
          echo "malformed consumer for ${client}: ${consumer}" >&2
          exit 1
        fi
        # 消費側は生の値、かつ今回値だけ。前回値は gateway 側にしか要らない。
        mkdir -p "$WORK/consumer/$c_ns.$c_secret"
        printf '%s' "$raw" > "$WORK/consumer/$c_ns.$c_secret/$c_key"
      fi

      if [ -n "$rotated" ]; then
        echo "rotated: ${client} (${role})"
      else
        echo "issued: ${client} (${role})"
      fi
    done < /config/clients

    for d in "$WORK"/gw/*; do
      [ -d "$d" ] || continue
      apply_dir llm-gateway "$(basename "$d")" "$d"
      echo "wrote gateway secret: $(basename "$d")"
    done

    for d in "$WORK"/consumer/*; do
      [ -d "$d" ] || continue
      b=$(basename "$d")
      apply_dir "${b%%.*}" "${b#*.}" "$d"
      echo "wrote consumer secret: ${b%%.*}/${b#*.}"
    done

    rm -rf "$WORK"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
spec:
  # 日次。前回値を一世代だけ残すので、鍵 1 本の有効期間は約 48 時間になる。
  # handler は短命な Job なので、この重なり幅で in-flight を取りこぼさない。
  schedule: "0 17 * * *"
  # 既定（未設定）だと、コントローラが 100 回連続で開始を取りこぼした時点で
  # スケジューリング自体を諦める。期限を書くと取りこぼしはその期限内だけ拾われる。
  startingDeadlineSeconds: 600
  # 並走すると 2 つの世代が順不同で同じ Secret を上書きし、gateway 側と消費側が
  # 食い違う（＝401）。
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: github-gateway-key-rotator
        spec:
          serviceAccountName: github-gateway-key-rotator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: github-gateway-key-rotator
                defaultMode: 0555
            - name: config
              configMap:
                name: github-gateway-clients
            # readOnlyRootFilesystem なので、生成した鍵を置く先が要る。
            - name: tmp
              emptyDir: {}
          containers:
            - name: rotate
              image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
              command: [/script/rotate.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
---
# rotator が出られる先。DNS はクラスタ全体の allow-dns が持っている。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: github-gateway-key-rotator
  egress:
    # 鍵の生成は /dev/urandom で完結する。**外部へは一切出ない** ——
    # installation token を取りに行く github-token-rotator と違い、
    # この Pod は apiserver 以外に用が無い。
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# **ブートストラップ。** この生成器が持つ Secret はまだ存在しないので、CronJob の
# 初回実行を待つと、それまで参照先の無い SecurityPolicy が翻訳エラーで
# **500 直返し**になる。sync の直後に発行して、その窓を閉じる。
#
# **MODE=bootstrap は回さない。** 既にある鍵は値を据え置き、無いものだけ発行する。
# hook は sync のたびに走るので、ここで回すと sync が続いた日に in-flight の
# handler が持つ鍵が寿命を待たずに消える。回すのは CronJob の仕事。
#
# Pod spec が CronJob と重複しているのは、「CronJob を今すぐ 1 回走らせる」プリミティブが
# ArgoCD にも K8s にも無いため。スクリプトと clients 表は ConfigMap で共有しているので、
# 二重管理になるのは実行の殻だけ。
apiVersion: batch/v1
kind: Job
metadata:
  name: github-gateway-key-bootstrap
  namespace: github-auth
  annotations:
    argocd.argoproj.io/hook: PostSync
    # 成功時だけ消すと、失敗した Job が同名で残って次の sync の作成を塞ぐ
    # （Job の spec は immutable なので上書きもできない）。失敗側も消して、
    # 次の sync でやり直せるようにする。
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-gateway-key-rotator
    spec:
      serviceAccountName: github-gateway-key-rotator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: github-gateway-key-rotator
            defaultMode: 0555
        - name: config
          configMap:
            name: github-gateway-clients
        # readOnlyRootFilesystem なので、生成した鍵を置く先が要る。
        - name: tmp
          emptyDir: {}
      containers:
        - name: rotate
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:022e23ed50d5db9b1710df78b36d5137cb318ce06cb32a1a0cd87907e99515b8
          command: [/script/rotate.sh]
          env:
            - name: MODE
              value: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

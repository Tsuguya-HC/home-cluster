# GitHub の REST / GraphQL / git を gateway 経由で呼ぶ側のクライアントキーを、
# クラスタ内で生成・ローテーションする（#973）。
#
# **MCP のクライアントキーをここへ移さないこと**（移管は #973）。あちらの Secret は
# ExternalSecret が所有しており、ExternalSecret を消すと Secret ごと消える。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
---
# 書式: `<client> <role> <consumer>`
#   client   … Secret のキー名になる。**重複させないこと**（片方が黙って無視される）
#   role     … ro / rw
#   consumer … `<ns>/<secret>/<key>`、まだ配らないなら `-`
#
# **consumer を書く行を足したら、その namespace への書き込み Role も足すこと。**
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-gateway-clients
  namespace: github-auth
data:
  clients: |
    pr-review ro -
    implement rw claude-code/github-gateway-client-keys/implement
    task-executor-write rw claude-code/github-gateway-client-keys/task-executor-write
    pluto-check rw argo/github-gateway-client-keys/pluto-check
    wf-creator rw claude-code/github-gateway-client-keys/wf-creator
    wf-improver rw claude-code/github-gateway-client-keys/wf-improver
    claude-code-generic rw claude-code/github-gateway-client-keys/claude-code-generic
    horenso-verify ro claude-code/github-gateway-client-keys/horenso-verify
    taskflow-implement rw claude-code-build/github-gateway-client-keys/taskflow-implement
    taskflow-implement-parts ro claude-code-build/github-gateway-client-keys/taskflow-implement-parts
    taskflow-investigate ro claude-code-build/github-gateway-client-keys/taskflow-investigate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
data:
  rotate.sh: |
    #!/bin/sh
    # gateway 側は今回値と前回値を同時に持つ。前回値は次の run で落ちる。
    #
    # **gateway を先、消費側を後に書くこと。** 逆だと gateway がまだ知らない鍵を
    # 持つ Pod が生まれて 401 になる。
    set -eu

    WORK=/tmp/keys

    # **値を argv に載せないこと。** argv はプロセス監視のログに残る。ファイル経由で渡す。
    gen() {
      head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'
    }

    # gateway 側の現在値（`token <値>` の形）。まだ無ければ空を返す。
    # jsonpath のフィールド名にはハイフンが入るので、必ず [''] で引くこと。
    cur() {
      kubectl -n llm-gateway get secret "$1" -o "jsonpath={.data['$2']}" 2>/dev/null \
        | base64 -d 2>/dev/null || true
    }

    # ディレクトリ 1 つ = Secret 1 つ。ファイル名がキー、中身が値。
    # **kubectl create secret はステージしたファイルから Secret 全体を組み立てる。**
    # ここへ来る前にクライアントを 1 つでも飛ばすと、その鍵が Secret から丸ごと
    # 消えて 401 になる。表の行は必ず全部ステージすること。
    apply_dir() {
      _ns=$1
      _name=$2
      _dir=$3
      [ -d "$_dir" ] || return 0
      set --
      for _f in "$_dir"/*; do
        [ -e "$_f" ] || continue
        set -- "$@" "--from-file=$(basename "$_f")=$_f"
      done
      [ "$#" -gt 0 ] || return 0
      # --server-side なのは、client-side apply が last-applied-configuration に
      # 同じ鍵をもう 1 部書き込むため。写しを増やす理由が無い。
      kubectl create secret generic "$_name" --namespace "$_ns" "$@" \
        --dry-run=client -o yaml \
        | kubectl apply --server-side --force-conflicts -f -
    }

    secret_for() {
      case "$1" in
        ro) echo github-api-ro-client-keys ;;
        rw) echo github-api-rw-client-keys ;;
        *) echo "unknown role: $1" >&2; exit 1 ;;
      esac
    }

    rm -rf "$WORK"
    mkdir -p "$WORK"
    umask 077

    while read -r client role consumer; do
      [ -n "$client" ] || continue
      case "$client" in \#*) continue ;; esac

      name=$(secret_for "$role")
      old=$(cur "$name" "$client")

      # bootstrap は鍵が無いときだけ作り、既にあるものは今回値も前回値も据え置く。
      # **前回値も必ずステージし直すこと** —— apply_dir は Secret 全体を組み直すので、
      # 落とすと重なりが消えて in-flight の handler が 401 になる。
      if [ "${MODE:-rotate}" = bootstrap ] && [ -n "$old" ]; then
        raw=${old#token }
        prev=$(cur "$name" "$client-prev")
        rotated=""
      else
        raw=$(gen)
        prev=$old
        rotated=$old
      fi

      # **gateway 側には 2 つの形を置くこと**（`token <値>` と生の値）。呼ぶ側は
      # `Authorization: token <値>` と `Authorization: Bearer <値>` の両方で来る。
      mkdir -p "$WORK/gw/$name"
      printf 'token %s' "$raw" > "$WORK/gw/$name/$client"
      printf '%s' "$raw" > "$WORK/gw/$name/$client-bearer"
      if [ -n "$prev" ]; then
        printf '%s' "$prev" > "$WORK/gw/$name/$client-prev"
        printf '%s' "${prev#token }" > "$WORK/gw/$name/$client-prev-bearer"
      fi

      if [ "$consumer" != "-" ]; then
        c_ns=${consumer%%/*}
        c_rest=${consumer#*/}
        c_secret=${c_rest%%/*}
        c_key=${c_rest#*/}
        # **3 つとも空でないことを見ること。** 名前空間が空だとステージ先が先頭 `.` の
        # ディレクトリになり、下のグロブが拾わず黙って配られない。
        if [ -z "$c_ns" ] || [ -z "$c_secret" ] || [ -z "$c_key" ] ||
           [ "$c_ns" = "$consumer" ] || [ "$c_secret" = "$c_rest" ]; then
          echo "malformed consumer for ${client}: ${consumer}" >&2
          exit 1
        fi
        # 消費側は生の値、かつ今回値だけ。前回値は gateway 側にしか要らない。
        mkdir -p "$WORK/consumer/$c_ns.$c_secret"
        printf '%s' "$raw" > "$WORK/consumer/$c_ns.$c_secret/$c_key"
      fi

      if [ -n "$rotated" ]; then
        echo "rotated: ${client} (${role})"
      else
        echo "issued: ${client} (${role})"
      fi
    done < /config/clients

    for d in "$WORK"/gw/*; do
      [ -d "$d" ] || continue
      apply_dir llm-gateway "$(basename "$d")" "$d"
      echo "wrote gateway secret: $(basename "$d")"
    done

    # gw ループと違い、ここは 1 namespace の失敗で他を止めない。グロブ順は
    # ソートされる（`-` < `.`）ので、新しい namespace の書き込み Role がまだ
    # 効いていない間に走ると、それより後ろの移行済み consumer まで巻き込んで
    # 鍵更新が止まってしまう。
    fail=0
    for d in "$WORK"/consumer/*; do
      [ -d "$d" ] || continue
      b=$(basename "$d")
      if apply_dir "${b%%.*}" "${b#*.}" "$d"; then
        echo "wrote consumer secret: ${b%%.*}/${b#*.}"
      else
        echo "failed to write consumer secret: ${b%%.*}/${b#*.}" >&2
        fail=1
      fi
    done

    rm -rf "$WORK"
    [ "$fail" -eq 0 ] || exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
spec:
  # 鍵 1 本は 2 周期有効（前回値を一世代残すため）。**handler の実行時間より長く保つこと。**
  schedule: "0 17 * * *"
  # 既定（未設定）だと、コントローラが 100 回連続で開始を取りこぼした時点で
  # スケジューリング自体を諦める。期限を書くと取りこぼしはその期限内だけ拾われる。
  startingDeadlineSeconds: 600
  # 並走すると 2 つの世代が順不同で同じ Secret を上書きし、gateway 側と消費側が
  # 食い違う（＝401）。
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # rotate.sh は毎回全 client の鍵を新規生成する。リトライすると 1 consumer の
      # 失敗のたびに全員分が再ローテーションされ、「2 周期有効」の猶予が数分に縮む
      # （in-flight の handler が握る鍵が gateway から消えて 401）。リトライせず
      # 翌日の実行に委ねる。消費側に届かなかった鍵も gateway の前回値として 1 周期は有効。
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: github-gateway-key-rotator
        spec:
          serviceAccountName: github-gateway-key-rotator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: github-gateway-key-rotator
                defaultMode: 0555
            - name: config
              configMap:
                name: github-gateway-clients
            # readOnlyRootFilesystem なので、生成した鍵を置く先が要る。
            - name: tmp
              emptyDir: {}
          containers:
            - name: rotate
              image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:9e1dd7b0bf77791b3b4769b46fe93a74da5c350fe0d25d670791e5c84f69e712
              command: [/script/rotate.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
---
# rotator が出られる先。DNS はクラスタ全体の allow-dns が持っている。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-gateway-key-rotator
  namespace: github-auth
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: github-gateway-key-rotator
  egress:
    # 鍵の生成は /dev/urandom で完結する。apiserver 以外に用が無い。
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# ブートストラップ。CronJob の初回を待たずに鍵を発行する（無いと SecurityPolicy が
# 参照先を失って 500 になる）。
#
# **MODE=bootstrap のまま使うこと。** hook は sync のたびに走るので、ここで回すと
# in-flight の handler が持つ鍵が寿命を待たずに消える。
#
# Pod spec が CronJob と重複しているのは、CronJob を今すぐ 1 回走らせる手段が無いため。
apiVersion: batch/v1
kind: Job
metadata:
  name: github-gateway-key-bootstrap
  namespace: github-auth
  annotations:
    argocd.argoproj.io/hook: PostSync
    # 失敗時も消すこと。残ると同名の Job を作れず、次の sync が塞がる。
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-gateway-key-rotator
    spec:
      serviceAccountName: github-gateway-key-rotator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: github-gateway-key-rotator
            defaultMode: 0555
        - name: config
          configMap:
            name: github-gateway-clients
        # readOnlyRootFilesystem なので、生成した鍵を置く先が要る。
        - name: tmp
          emptyDir: {}
      containers:
        - name: rotate
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:9e1dd7b0bf77791b3b4769b46fe93a74da5c350fe0d25d670791e5c84f69e712
          command: [/script/rotate.sh]
          env:
            - name: MODE
              value: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

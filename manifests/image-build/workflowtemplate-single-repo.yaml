apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: single-repo-image-build
  namespace: image-build
spec:
  activeDeadlineSeconds: 1800
  serviceAccountName: image-build-executor
  entrypoint: main
  arguments:
    parameters:
      - name: repo-url
      - name: image-name
      # push 先の Harbor プロジェクト。既定値を持たせない —— tools は public なので、
      # 指定漏れが「意図せず公開」になるより、起動時に落ちるほうが安全。
      - name: project
      # 署名の保管先。private プロジェクトのイメージは、署名だけ public に置く必要がある——
      # Kyverno は --imagePullSecrets を署名取得に使わない (kyverno/kyverno#15120)。
      # 空なら従来どおりイメージと同じリポジトリに署名する。
      - name: signature-repository
        value: ""
      - name: commit-sha
        value: main
  podMetadata:
    labels:
      image-build: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  templates:
    - name: main
      steps:
        - - name: build
            template: buildkit-build
        # 署名の前に置く。イメージは既に push 済みなので「push を止める」ことはできないが、
        # Kyverno が署名を要求しているので、ここで落とせば署名されず＝クラスタで起動できない。
        # structure-test.yaml を置いていないリポジトリでは丸ごとスキップされる。
        - - name: structure-test
            template: structure-test
            when: "'{{steps.build.outputs.parameters.has-structure-test}}' == 'present'"
            arguments:
              parameters:
                - name: digest
                  value: "{{steps.build.outputs.parameters.digest}}"
                - name: config
                  value: "{{steps.build.outputs.parameters.structure-test}}"
        - - name: sign
            template: cosign-sign
            arguments:
              parameters:
                - name: digest
                  value: "{{steps.build.outputs.parameters.digest}}"

    - name: buildkit-build
      podSpecPatch: '{"runtimeClassName": "kata"}'
      metadata:
        annotations:
          io.katacontainers.config.hypervisor.virtio_fs_extra_args: '["--thread-pool-size=1", "--announce-submounts", "--xattr"]'
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        fsGroup: 0
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          emptyDir: {}
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "113765957"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: clone-repo
          image: alpine/git:v2.54.0@sha256:a299a963fbe31628ab481ca42907bcf0691d004f86734c02638abdf513691d42
          command: [sh, -c]
          args:
            - |
              GITHUB_TOKEN=$(cat /github-token/token)
              REPO_PATH="${REPO_URL#https://}"
              git config --global --add safe.directory /workspace
              git clone "https://x-access-token:${GITHUB_TOKEN}@${REPO_PATH}" /workspace
              cd /workspace && git checkout "$COMMIT_SHA"
          env:
            - name: HOME
              value: /tmp
            - name: REPO_URL
              value: "{{workflow.parameters.repo-url}}"
            - name: COMMIT_SHA
              value: "{{workflow.parameters.commit-sha}}"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: github-token
              mountPath: /github-token
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              HUB_AUTH=$(printf '%s:%s' "$HUB_USER" "$HUB_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' "$HARBOR_AUTH" "$HUB_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
            - name: HUB_USER
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: username
            - name: HUB_PASS
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: password
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
        command: [sh, -c]
        args:
          - |
            apk add --no-cache jq >/dev/null
            mkdir -p /workspace/.buildkit /workspace/.buildkit/tmp
            export BUILDKIT_TMPDIR=/workspace/.buildkit
            export TMPDIR=/workspace/.buildkit/tmp
            buildctl-daemonless.sh build \
              --frontend dockerfile.v0 \
              --local context=/workspace \
              --local dockerfile=/workspace \
              --output 'type=image,"name=registry.infra.tgy.io/{{workflow.parameters.project}}/{{workflow.parameters.image-name}}:{{workflow.parameters.commit-sha}},registry.infra.tgy.io/{{workflow.parameters.project}}/{{workflow.parameters.image-name}}:latest",push=true' \
              --metadata-file /workspace/metadata.json
            jq -r '."containerimage.digest"' /workspace/metadata.json > /workspace/digest
            # 中身は when に入れられない（複数行が式に展開されて壊れる）。
            # 判定は有無だけの 1 語で行う。
            # yes/no は式パーサにブールと解釈される余地があるので使わない。
            test -f /workspace/structure-test.yaml && echo present > /workspace/has-structure-test \
              || echo absent > /workspace/has-structure-test
        env:
          - name: DOCKER_CONFIG
            value: /docker-config
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          capabilities:
            add: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /workspace/digest
          # リポジトリに structure-test.yaml があればその中身、無ければ空。
          # ここで拾うのは clone 済みのワークスペースが手元にあるからで、
          # 後段でもう一度 clone して認証を用意する必要をなくすため。
          - name: structure-test
            valueFrom:
              path: /workspace/structure-test.yaml
              default: ""
          - name: has-structure-test
            valueFrom:
              path: /workspace/has-structure-test

    - name: structure-test
      inputs:
        parameters:
          - name: digest
          - name: config
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: docker-config
          emptyDir: {}
        - name: work
          # tarball とその展開先を両方置く。イメージ 1 個ぶん。
          emptyDir:
            sizeLimit: 8Gi
      initContainers:
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"}}}' "$HARBOR_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
        command: [sh, -c]
        args:
          - |
            set -eu
            IMAGE="registry.infra.tgy.io/{{workflow.parameters.project}}/{{workflow.parameters.image-name}}@{{inputs.parameters.digest}}"
            cat > /work/structure-test.yaml <<'STRUCTURE_TEST_EOF'
            {{inputs.parameters.config}}
            STRUCTURE_TEST_EOF
            # tar ドライバを使う。Kata の中に docker デーモンは無いし、
            # 起動せずに中身を検査できればそれで足りる。
            crane pull "$IMAGE" /work/image.tar
            container-structure-test test --driver tar --image /work/image.tar               --config /work/structure-test.yaml
        env:
          - name: HOME
            value: /work
          # tar ドライバは tarball を一時ディレクトリに展開する。既定の /tmp は
          # readOnlyRootFilesystem で書けないので、書ける方に向ける。
          - name: TMPDIR
            value: /work
          - name: DOCKER_CONFIG
            value: /docker-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
          - name: work
            mountPath: /work
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi

    - name: cosign-sign
      inputs:
        parameters:
          - name: digest
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: docker-config
          emptyDir: {}
        - name: cosign-key
          secret:
            secretName: cosign-signing-key
      initContainers:
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              HUB_AUTH=$(printf '%s:%s' "$HUB_USER" "$HUB_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' "$HARBOR_AUTH" "$HUB_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
            - name: HUB_USER
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: username
            - name: HUB_PASS
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: password
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d29e837e2601fadc50e346398e86934c9cf49b309448b89b19b867122c9bf74b
        command: [sh, -c]
        args:
          - |
            set -eu
            IMAGE="registry.infra.tgy.io/{{workflow.parameters.project}}/{{workflow.parameters.image-name}}@{{inputs.parameters.digest}}"
            # 空のまま渡すと cosign が空リポジトリを参照しようとするので落とす。
            [ -n "${COSIGN_REPOSITORY:-}" ] || unset COSIGN_REPOSITORY
            cosign sign --registry-referrers-mode=legacy --new-bundle-format=false --use-signing-config=false --key /cosign/cosign.key --yes "$IMAGE"
        env:
          - name: HOME
            value: /tmp
          - name: COSIGN_PASSWORD
            value: ""
          - name: COSIGN_REPOSITORY
            value: "{{workflow.parameters.signature-repository}}"
          - name: DOCKER_CONFIG
            value: /docker-config
          - name: HARBOR_USER
            valueFrom:
              secretKeyRef:
                name: harbor-robot-images
                key: username
          - name: HARBOR_PASS
            valueFrom:
              secretKeyRef:
                name: harbor-robot-images
                key: credential
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: cosign-key
            mountPath: /cosign
            readOnly: true
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

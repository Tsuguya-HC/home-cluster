apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-build-executor
  namespace: image-build
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-build-executor
  namespace: image-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: image-build-executor
    namespace: image-build
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-build
  namespace: image-build
spec:
  activeDeadlineSeconds: 1800
  serviceAccountName: image-build-executor
  entrypoint: main
  arguments:
    parameters:
      - name: commit-sha
      - name: before-sha
  podMetadata:
    labels:
      image-build: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  templates:
    - name: main
      steps:
        - - name: detect-changes
            template: detect-changes
        - - name: build
            template: build-image
            arguments:
              parameters:
                - name: image-dir
                  value: "{{item}}"
            withParam: "{{steps.detect-changes.outputs.parameters.changed-dirs}}"

    - name: detect-changes
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d5db59cac14b23a4ef85a456754522463267324e8ed3a84e795a2eba829c8f05
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/images"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: alpine/git:v2.54.0@sha256:4f9488b7295baec153a9953479690f835ad4699b1d9f11e3897a4485c224fc3e
        command: [sh, -c]
        args:
          - |
            GITHUB_TOKEN=$(cat /github-token/token)
            cd /tmp
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Tsuguya-HC/images.git" repo
            cd repo
            # Every directory that holds a Dockerfile is an image.
            find . -name Dockerfile -not -path './.git/*' \
              | sed 's|^./||;s|/Dockerfile$||' | sort -u > /tmp/image-dirs
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              cat /tmp/image-dirs
            else
              # Any file in one of those directories, not just its Dockerfile.
              # github-auth.sh and github-signed-commit.sh are COPYed into
              # argo-tools, so matching only */Dockerfile left the published
              # image stale against its own sources with nothing to show for it.
              git diff --name-only "$BEFORE".."$AFTER" \
                | awk -F/ 'NF > 1 { print $1 }' | sort -u \
                | while read -r d; do grep -qxF "$d" /tmp/image-dirs && echo "$d"; done
            fi | awk 'BEGIN{printf "["} NR>1{printf ","} {printf "\"%s\"",$0} END{print "]"}' > /tmp/changed-dirs
        env:
          - name: BEFORE
            value: "{{workflow.parameters.before-sha}}"
          - name: AFTER
            value: "{{workflow.parameters.commit-sha}}"
        volumeMounts:
          - name: github-token
            mountPath: /github-token
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      outputs:
        parameters:
          - name: changed-dirs
            valueFrom:
              path: /tmp/changed-dirs

    - name: build-image
      inputs:
        parameters:
          - name: image-dir
      steps:
        - - name: build
            template: buildkit-build
            arguments:
              parameters:
                - name: image-dir
                  value: "{{inputs.parameters.image-dir}}"
        - - name: sign
            template: cosign-sign
            arguments:
              parameters:
                - name: image-dir
                  value: "{{inputs.parameters.image-dir}}"
                - name: digest
                  value: "{{steps.build.outputs.parameters.digest}}"

    - name: buildkit-build
      inputs:
        parameters:
          - name: image-dir
      podSpecPatch: '{"runtimeClassName": "kata"}'
      # LLM バッチ Pod が名乗る workload-class=cpu-saturating から逃げる（同居回避の衛生策。
      # 2026-08-25 のビルド遅延の主因ではなかった — 下の workspace volume のコメント参照）。
      # preferred なので LLM が走っていなければ一番速い wn-03 を使える。requests だけでは
      # 同居を避けられない（16 スレッドに両方収まる）ので、スケジューラにはこの形で伝える。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    workload-class: cpu-saturating
                namespaceSelector: {}
                topologyKey: kubernetes.io/hostname
      metadata:
        annotations:
          io.katacontainers.config.hypervisor.virtio_fs_extra_args: '["--thread-pool-size=1", "--announce-submounts", "--xattr"]'
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        fsGroup: 0
      volumes:
        # ディスク上の emptyDir や CSI PVC は Kata VM から virtiofs 越しで、BuildKit の
        # レイヤ展開（数万の小ファイル操作）が全部往復になる。medium: Memory の emptyDir は
        # Kata が VM の中に tmpfs として作るので virtiofs を通らない（2026-08-25 実測:
        # golang:1.27 の展開 1012 秒 → 6.5 秒、Workflow 全体 76 秒。single-repo と同じ形）。
        # ゲストカーネル 6.18 の tmpfs は user xattr を持ち、レイヤ export も通る。
        # VM のメモリはコンテナの memory limit で決まるので、下の limits.memory に上乗せ。
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: 6Gi
        - name: docker-config
          emptyDir: {}
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d5db59cac14b23a4ef85a456754522463267324e8ed3a84e795a2eba829c8f05
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/images"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: clone-repo
          image: alpine/git:v2.54.0@sha256:4f9488b7295baec153a9953479690f835ad4699b1d9f11e3897a4485c224fc3e
          command: [sh, -c]
          args:
            - |
              GITHUB_TOKEN=$(cat /github-token/token)
              git config --global --add safe.directory /workspace
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Tsuguya-HC/images.git" /workspace
              cd /workspace && git checkout "$COMMIT_SHA"
          env:
            - name: HOME
              value: /tmp
            - name: COMMIT_SHA
              value: "{{workflow.parameters.commit-sha}}"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: github-token
              mountPath: /github-token
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              HUB_AUTH=$(printf '%s:%s' "$HUB_USER" "$HUB_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' "$HARBOR_AUTH" "$HUB_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
            - name: HUB_USER
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: username
            - name: HUB_PASS
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: password
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
        command: [sh, -c]
        args:
          - |
            apk add --no-cache jq >/dev/null
            mkdir -p /workspace/.buildkit /workspace/.buildkit/tmp
            export BUILDKIT_TMPDIR=/workspace/.buildkit
            export TMPDIR=/workspace/.buildkit/tmp
            buildctl-daemonless.sh build \
              --frontend dockerfile.v0 \
              --local context=/workspace/{{inputs.parameters.image-dir}} \
              --local dockerfile=/workspace/{{inputs.parameters.image-dir}} \
              --output 'type=image,"name=registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}:{{workflow.parameters.commit-sha}},registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}:latest",push=true' \
              --metadata-file /workspace/metadata.json
            jq -r '."containerimage.digest"' /workspace/metadata.json > /workspace/digest
        env:
          - name: DOCKER_CONFIG
            value: /docker-config
          # buildctl-daemonless.sh は --root を渡さず、state は既定の /var/lib/buildkit =
          # コンテナ rootfs（Kata では virtiofs 共有）に置かれる。workspace 側へ移して
          # 初めて上の tmpfs が効く。
          - name: BUILDKITD_FLAGS
            value: --root /workspace/.buildkit/root
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          capabilities:
            add: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
        resources:
          requests:
            cpu: "2"
            memory: 512Mi
          # CPU limit はこのリポジトリでは付けない規約だが、Kata は VM の vCPU 数を
          # コンテナの CPU limit（cgroup quota）から決める。limit が無いと VM は
          # default_vcpus=1 のまま — golang:1.27 の展開に 750 秒、COPY 1 回に 250 秒、
          # go build -a は 30 分に収まらない（2026-08-25 実測。ホストの CPU は半分空いていた）。
          # ここでの limit は throttling ではなく VM の大きさの指定。
          limits:
            cpu: "6"
            memory: 10Gi
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /workspace/digest

    - name: cosign-sign
      inputs:
        parameters:
          - name: image-dir
          - name: digest
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: docker-config
          emptyDir: {}
        - name: cosign-key
          secret:
            secretName: cosign-signing-key
      initContainers:
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              HUB_AUTH=$(printf '%s:%s' "$HUB_USER" "$HUB_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' "$HARBOR_AUTH" "$HUB_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
            - name: HUB_USER
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: username
            - name: HUB_PASS
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: password
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:d5db59cac14b23a4ef85a456754522463267324e8ed3a84e795a2eba829c8f05
        command: [sh, -c]
        args:
          - |
            IMAGE="registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}@{{inputs.parameters.digest}}"
            cosign sign --registry-referrers-mode=legacy --new-bundle-format=false --use-signing-config=false --key /cosign/cosign.key --yes "$IMAGE"
        env:
          - name: HOME
            value: /tmp
          - name: COSIGN_PASSWORD
            value: ""
          - name: DOCKER_CONFIG
            value: /docker-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: cosign-key
            mountPath: /cosign
            readOnly: true
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

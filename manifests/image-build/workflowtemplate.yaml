apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-build-executor
  namespace: image-build
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-build-executor
  namespace: image-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: image-build-executor
    namespace: image-build
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-build
  namespace: image-build
spec:
  # 全体の上限。heavy-build の枠の空き待ちもここで数えられるので、待ちの長さを見込んで大きく取る。
  # 走っている時間の上限は各段の activeDeadlineSeconds が持つ。
  activeDeadlineSeconds: 10800
  serviceAccountName: image-build-executor
  entrypoint: main
  arguments:
    parameters:
      # ビルドするのは常に枠を取った時点の main の先頭。この値は変わったイメージの検出
      # （before-sha との差分）とトリガーの確認にだけ使う。
      - name: commit-sha
      - name: before-sha
  podMetadata:
    labels:
      image-build: "true"
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  templates:
    - name: main
      steps:
        - - name: detect-changes
            template: detect-changes
        - - name: build
            template: build-image
            arguments:
              parameters:
                - name: image-dir
                  value: "{{item}}"
            withParam: "{{steps.detect-changes.outputs.parameters.changed-dirs}}"

    - name: detect-changes
      activeDeadlineSeconds: 300
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff:
          duration: "15s"
          factor: "2"
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:aaf50f2677b5089678e8633d7f749f9d1009321fdc1fa9ae9fb9bceaed7a6bbd
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "5008613"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/images"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: alpine/git:v2.54.0@sha256:ce84fd6a057b4dc5cf5009da2dd832f1c6d096c1984bf50496cf3c256402264d
        command: [sh, -c]
        args:
          - |
            # 無いと clone や git diff の失敗が「変更なし（[]）」として成功で終わり、何も作られない。
            set -euo pipefail
            GITHUB_TOKEN=$(cat /github-token/token)
            cd /tmp
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Tsuguya-HC/images.git" repo
            cd repo
            # Every directory that holds a Dockerfile is an image.
            find . -name Dockerfile -not -path './.git/*' \
              | sed 's|^./||;s|/Dockerfile$||' | sort -u > /tmp/image-dirs
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              cat /tmp/image-dirs
            else
              # Any file in one of those directories, not just its Dockerfile.
              # github-auth.sh and github-signed-commit.sh are COPYed into
              # argo-tools, so matching only */Dockerfile left the published
              # image stale against its own sources with nothing to show for it.
              git diff --name-only "$BEFORE".."$AFTER" \
                | awk -F/ 'NF > 1 { print $1 }' | sort -u \
                | while read -r d; do if grep -qxF "$d" /tmp/image-dirs; then echo "$d"; fi; done
            fi | awk 'BEGIN{printf "["} NR>1{printf ","} {printf "\"%s\"",$0} END{print "]"}' > /tmp/changed-dirs
        env:
          - name: BEFORE
            value: "{{workflow.parameters.before-sha}}"
          - name: AFTER
            value: "{{workflow.parameters.commit-sha}}"
        volumeMounts:
          - name: github-token
            mountPath: /github-token
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      outputs:
        parameters:
          - name: changed-dirs
            valueFrom:
              path: /tmp/changed-dirs

    # 同じイメージのビルドを 1 本ずつにする。並ぶと古い先頭のビルドが後から終わって latest を
    # 戻しうるし、前の 1 本が作り終えたか（タグと署名）を見て飛ばす判断も成り立たない。
    # mutex は heavy-build の枠と別の template に置く: 同じ template に置くと、
    # mutex 待ちのビルドが枠の待ち行列の先頭に居座り、空いた枠を他のイメージが取れない。
    - name: build-image
      inputs:
        parameters:
          - name: image-dir
      synchronization:
        mutexes:
          - name: "Tsuguya-HC/images/{{inputs.parameters.image-dir}}"
      steps:
        - - name: build
            template: heavy-build
            arguments:
              parameters:
                - name: image-dir
                  value: "{{inputs.parameters.image-dir}}"
      outputs:
        parameters:
          - name: sha
            valueFrom:
              parameter: "{{steps.build.outputs.parameters.sha}}"
          - name: action
            valueFrom:
              parameter: "{{steps.build.outputs.parameters.action}}"

    # 先頭の確認からビルド・署名までを 1 つの枠で包み、fan-out した各イメージが 1 つずつ取る。
    # 枠は single-repo-image-build と共有する（key を変えるなら両方そろえる）。
    - name: heavy-build
      inputs:
        parameters:
          - name: image-dir
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: image-build-concurrency
              key: heavy-build
      steps:
        # 枠を取ってから main の先頭を読み、それを作る。トリガーの commit を作ると、後の push が
        # このイメージの入力に触れずビルドを起こさなかったとき、古いまま残る。
        - - name: resolve-head
            template: resolve-head
            arguments:
              parameters:
                - name: repo
                  value: Tsuguya-HC/images
                - name: commit-sha
                  value: "{{workflow.parameters.commit-sha}}"
                - name: image
                  value: "registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}"
                - name: signature-repository
                  value: ""
        # 先頭が既に作られて署名済みなら作らない。飛ばしても Workflow は Succeeded で終わる。
        - - name: build-sign
            template: build-sign
            when: "'{{steps.resolve-head.outputs.parameters.action}}' == 'build'"
            arguments:
              parameters:
                - name: image-dir
                  value: "{{inputs.parameters.image-dir}}"
                - name: sha
                  value: "{{steps.resolve-head.outputs.parameters.sha}}"
      outputs:
        parameters:
          # ビルドした（build）か、前の 1 本が作り終えていたので飛ばした（skip）sha。
          # トリガーの commit-sha と違えば、枠を待つ間に main が進んで先頭に読み替えた。
          - name: sha
            valueFrom:
              parameter: "{{steps.resolve-head.outputs.parameters.sha}}"
          - name: action
            valueFrom:
              parameter: "{{steps.resolve-head.outputs.parameters.action}}"

    - name: build-sign
      inputs:
        parameters:
          - name: image-dir
          - name: sha
      steps:
        - - name: build
            template: buildkit-build
            arguments:
              parameters:
                - name: image-dir
                  value: "{{inputs.parameters.image-dir}}"
                - name: sha
                  value: "{{inputs.parameters.sha}}"
        - - name: sign
            template: cosign-sign
            arguments:
              parameters:
                - name: image-dir
                  value: "{{inputs.parameters.image-dir}}"
                - name: digest
                  value: "{{steps.build.outputs.parameters.digest}}"

    - name: resolve-head
      activeDeadlineSeconds: 300
      # GitHub API や registry の一時的な失敗で Workflow を落とさない。
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff:
          duration: "15s"
          factor: "2"
      inputs:
        parameters:
          # owner/name
          - name: repo
          - name: commit-sha
          # registry.infra.tgy.io/<project>/<image>。buildkit の段が push する先と同じ形。
          - name: image
          # 空ならイメージと同じリポジトリ。cosign-sign の COSIGN_REPOSITORY と同じ値を渡す。
          - name: signature-repository
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
        - name: docker-config
          emptyDir: {}
        - name: work
          emptyDir: {}
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:aaf50f2677b5089678e8633d7f749f9d1009321fdc1fa9ae9fb9bceaed7a6bbd
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "5008613"
            - name: GITHUB_REPO
              value: "{{inputs.parameters.repo}}"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: setup-registry-auth
          image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"}}}' "$HARBOR_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:aaf50f2677b5089678e8633d7f749f9d1009321fdc1fa9ae9fb9bceaed7a6bbd
        command: [sh, -c]
        args:
          - |
            set -eu
            if [ "$COMMIT_SHA" != main ] && ! printf '%s' "$COMMIT_SHA" | grep -qxE '[0-9a-f]{40}'; then
              echo "commit-sha must be main or a 40-digit hex sha: ${COMMIT_SHA}" >&2
              exit 1
            fi
            # token をプロセスの引数に載せない（ps や /proc から読める）。printf は組み込み。
            umask 077
            printf 'Authorization: Bearer %s\n' "$(cat /github-token/token)" > /work/github-header
            RESPONSE=$(curl -sfL --max-time 60 \
              -H @/work/github-header \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/ref/heads/main")
            HEAD_SHA=$(printf '%s' "$RESPONSE" | jq -er .object.sha)
            printf '%s' "$HEAD_SHA" | grep -qxE '[0-9a-f]{40}'
            # webhook の直後は ref の API が push 前の値を返しうる。読めた先頭がトリガーの commit を
            # 含まない（behind / diverged）なら、古い sha を作らないよう落として retry に任せる。
            if [ "$COMMIT_SHA" != main ]; then
              COMPARE=$(curl -sfL --max-time 60 \
                -H @/work/github-header \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/compare/${COMMIT_SHA}...${HEAD_SHA}")
              STATUS=$(printf '%s' "$COMPARE" | jq -er .status)
              case "$STATUS" in
                identical | ahead) ;;
                *)
                  echo "compare ${COMMIT_SHA}...${HEAD_SHA} is ${STATUS}; main may not reflect the push yet" >&2
                  exit 1
                  ;;
              esac
            fi
            rm -f /work/github-header
            printf '%s' "$HEAD_SHA" > /work/sha
            if [ "$HEAD_SHA" != "$COMMIT_SHA" ]; then
              echo "requested ${COMMIT_SHA}; main is at ${HEAD_SHA}, targeting that instead"
            fi

            # 0 = ある、1 = 無い。それ以外の失敗（認証・通信）を「無い」と読むと
            # 余計なビルドが走るだけだが、「ある」と読むと先頭が作られないので、どちらにも倒さず落とす。
            # Harbor は無いタグにも無いリポジトリにも NOT_FOUND を返す。
            exists() {
              if crane digest "$1" > /work/digest 2> /work/crane-err; then
                return 0
              fi
              if grep -qE ': (NOT_FOUND|MANIFEST_UNKNOWN|NAME_UNKNOWN): ' /work/crane-err; then
                return 1
              fi
              cat /work/crane-err >&2
              exit 1
            }
            # sha のタグだけでは足りない。前の 1 本が push 後に構造検査か署名で落ちていると、
            # 署名の無いイメージが残る。cosign-sign が legacy モードで置く署名のタグも見る。
            ACTION=build
            if exists "${IMAGE}:${HEAD_SHA}"; then
              DIGEST=$(cat /work/digest)
              if exists "${SIGNATURE_REPOSITORY:-$IMAGE}:sha256-${DIGEST#sha256:}.sig"; then
                echo "${IMAGE}:${HEAD_SHA} is already built and signed (${DIGEST}), skipping"
                ACTION=skip
              fi
            fi
            echo "$ACTION" > /work/action
        env:
          - name: REPO
            value: "{{inputs.parameters.repo}}"
          - name: COMMIT_SHA
            value: "{{inputs.parameters.commit-sha}}"
          - name: IMAGE
            value: "{{inputs.parameters.image}}"
          - name: SIGNATURE_REPOSITORY
            value: "{{inputs.parameters.signature-repository}}"
          - name: DOCKER_CONFIG
            value: /docker-config
          - name: HOME
            value: /work
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: github-token
            mountPath: /github-token
            readOnly: true
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
          - name: work
            mountPath: /work
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      outputs:
        parameters:
          # ビルドの対象。トリガーの commit ではなく、枠を取った時点の main の先頭。
          - name: sha
            valueFrom:
              path: /work/sha
          # build / skip の 1 語。yes/no は式パーサにブールと解釈される余地があるので使わない。
          - name: action
            valueFrom:
              path: /work/action

    - name: buildkit-build
      inputs:
        parameters:
          - name: image-dir
          - name: sha
      podSpecPatch: '{"runtimeClassName": "kata"}'
      activeDeadlineSeconds: 1500
      # LLM バッチ Pod が名乗る workload-class=cpu-saturating から逃げる（同居回避の衛生策。
      # 2026-08-25 のビルド遅延の主因ではなかった — 下の workspace volume のコメント参照）。
      # preferred なので LLM が走っていなければ一番速い wn-03 を使える。requests だけでは
      # 同居を避けられない（16 スレッドに両方収まる）ので、スケジューラにはこの形で伝える。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    workload-class: cpu-saturating
                namespaceSelector: {}
                topologyKey: kubernetes.io/hostname
      metadata:
        annotations:
          io.katacontainers.config.hypervisor.virtio_fs_extra_args: '["--thread-pool-size=1", "--announce-submounts", "--xattr"]'
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        fsGroup: 0
      volumes:
        # ディスク上の emptyDir や CSI PVC は Kata VM から virtiofs 越しで、BuildKit の
        # レイヤ展開（数万の小ファイル操作）が全部往復になる。medium: Memory の emptyDir は
        # Kata が VM の中に tmpfs として作るので virtiofs を通らない（2026-08-25 実測:
        # golang:1.27 の展開 1012 秒 → 6.5 秒、Workflow 全体 76 秒。single-repo と同じ形）。
        # ゲストカーネル 6.18 の tmpfs は user xattr を持ち、レイヤ export も通る。
        # VM のメモリはコンテナの memory limit で決まるので、下の limits.memory に上乗せ。
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: 6Gi
        - name: docker-config
          emptyDir: {}
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:aaf50f2677b5089678e8633d7f749f9d1009321fdc1fa9ae9fb9bceaed7a6bbd
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "5008613"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/images"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: clone-repo
          image: alpine/git:v2.54.0@sha256:ce84fd6a057b4dc5cf5009da2dd832f1c6d096c1984bf50496cf3c256402264d
          command: [sh, -c]
          args:
            - |
              GITHUB_TOKEN=$(cat /github-token/token)
              git config --global --add safe.directory /workspace
              git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/Tsuguya-HC/images.git" /workspace
              cd /workspace && git checkout "$COMMIT_SHA"
          env:
            - name: HOME
              value: /tmp
            - name: COMMIT_SHA
              value: "{{inputs.parameters.sha}}"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: github-token
              mountPath: /github-token
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: setup-registry-auth
          image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              HUB_AUTH=$(printf '%s:%s' "$HUB_USER" "$HUB_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' "$HARBOR_AUTH" "$HUB_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
            - name: HUB_USER
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: username
            - name: HUB_PASS
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: password
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
        command: [sh, -c]
        args:
          - |
            apk add --no-cache jq >/dev/null
            mkdir -p /workspace/.buildkit /workspace/.buildkit/tmp
            export BUILDKIT_TMPDIR=/workspace/.buildkit
            export TMPDIR=/workspace/.buildkit/tmp
            buildctl-daemonless.sh build \
              --frontend dockerfile.v0 \
              --local context=/workspace/{{inputs.parameters.image-dir}} \
              --local dockerfile=/workspace/{{inputs.parameters.image-dir}} \
              --output 'type=image,"name=registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}:{{inputs.parameters.sha}},registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}:latest",push=true' \
              --metadata-file /workspace/metadata.json
            jq -r '."containerimage.digest"' /workspace/metadata.json > /workspace/digest
        env:
          - name: DOCKER_CONFIG
            value: /docker-config
          # buildctl-daemonless.sh は --root を渡さず、state は既定の /var/lib/buildkit =
          # コンテナ rootfs（Kata では virtiofs 共有）に置かれる。workspace 側へ移して
          # 初めて上の tmpfs が効く。
          - name: BUILDKITD_FLAGS
            value: --root /workspace/.buildkit/root
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          capabilities:
            add: [ALL]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
        resources:
          requests:
            cpu: "2"
            memory: 512Mi
          # CPU limit はこのリポジトリでは付けない規約だが、Kata は VM の vCPU 数を
          # コンテナの CPU limit（cgroup quota）から決める。limit が無いと VM は
          # default_vcpus=1 のまま — golang:1.27 の展開に 750 秒、COPY 1 回に 250 秒、
          # go build -a は 30 分に収まらない（2026-08-25 実測。ホストの CPU は半分空いていた）。
          # ここでの limit は throttling ではなく VM の大きさの指定。
          limits:
            cpu: "6"
            memory: 10Gi
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /workspace/digest

    - name: cosign-sign
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - name: image-dir
          - name: digest
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: docker-config
          emptyDir: {}
        - name: cosign-key
          secret:
            secretName: cosign-signing-key
      initContainers:
        - name: setup-registry-auth
          image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: [sh, -c]
          args:
            - |
              HARBOR_AUTH=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASS" | base64 -w0)
              HUB_AUTH=$(printf '%s:%s' "$HUB_USER" "$HUB_PASS" | base64 -w0)
              printf '{"auths":{"registry.infra.tgy.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}' "$HARBOR_AUTH" "$HUB_AUTH" > /docker-config/config.json
          env:
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: username
            - name: HARBOR_PASS
              valueFrom:
                secretKeyRef:
                  name: harbor-robot-images
                  key: credential
            - name: HUB_USER
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: username
            - name: HUB_PASS
              valueFrom:
                secretKeyRef:
                  name: dockerhub-pull-credentials
                  key: password
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:aaf50f2677b5089678e8633d7f749f9d1009321fdc1fa9ae9fb9bceaed7a6bbd
        command: [sh, -c]
        args:
          - |
            IMAGE="registry.infra.tgy.io/tools/{{inputs.parameters.image-dir}}@{{inputs.parameters.digest}}"
            cosign sign --registry-referrers-mode=legacy --new-bundle-format=false --use-signing-config=false --key /cosign/cosign.key --yes "$IMAGE"
        env:
          - name: HOME
            value: /tmp
          - name: COSIGN_PASSWORD
            value: ""
          - name: DOCKER_CONFIG
            value: /docker-config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: cosign-key
            mountPath: /cosign
            readOnly: true
          - name: docker-config
            mountPath: /docker-config
            readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

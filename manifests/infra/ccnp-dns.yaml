apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns
spec:
  # `{}`（全 endpoint）にしないこと。このラベルで絞ると Cilium 内部の endpoint
  # （Gateway の reserved:ingress 等）が外れる。内部 endpoint まで選択すると
  # enforce_policy_on_l7lb が壊れて Gateway 経由の通信が落ちる。
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.cluster: default
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # L7 DNS ルールは制限のためではなく、Cilium の DNS プロキシを通して
          # Hubble に DNS メトリクスを出させるため（全ドメインを許可している）。
          rules:
            dns:
              - matchPattern: "*"

# 続きの判断を起こす SA には、decide 以外の flow の Task を作らせない（#1399）。
# 照合する username は SA 名から組む。SA 名を変えるときは揃える（ずれると検査が黙って外れる）。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: decide-continuation
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: claude-code-build
    resourceRules:
      - apiGroups: ["flow.tgy.io"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["tasks"]
  matchConditions:
    - name: dispatcher
      expression: request.userInfo.username == "system:serviceaccount:claude-code-build:decide-continuation"
  validations:
    - expression: object.spec.flow == "decide"
      message: decide-continuation may create only Tasks of flow decide
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: decide-continuation
spec:
  policyName: decide-continuation
  validationActions: [Deny]

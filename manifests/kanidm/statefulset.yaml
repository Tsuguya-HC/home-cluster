apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kanidm
  namespace: kanidm
  labels:
    app.kubernetes.io/name: kanidm
spec:
  serviceName: kanidm-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kanidm
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: "kanidm-tls,kanidm-repl-certs"
        configmap.reloader.stakater.com/reload: "kanidm-server-config"
      labels:
        app.kubernetes.io/name: kanidm
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - wn-02
                      - wn-03
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kanidm
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-init
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - sh
            - -c
            - |
              cp /base-config/server.toml /config/server.toml
              ORDINAL=${HOSTNAME##*-}
              cat >> /config/server.toml <<EOF

              [replication]
              origin = "repl://${HOSTNAME}.kanidm-headless.kanidm.svc.cluster.local:8444"
              bindaddress = "[::]:8444"
              EOF
              PARTNER_FILE="/repl-config/partner-${ORDINAL}.toml"
              if [ -f "$PARTNER_FILE" ]; then
                cat "$PARTNER_FILE" >> /config/server.toml
              fi
          volumeMounts:
            - name: config-out
              mountPath: /config
            - name: base-config
              mountPath: /base-config
              readOnly: true
            - name: repl-config
              mountPath: /repl-config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: kanidm
          image: docker.io/kanidm/server:1.11.1@sha256:7c3d7ed868e91f78c24a7fb9c548876563b375a4203021b730d58369b97ad154
          args:
            - kanidmd
            - server
            - -c
            - /config/server.toml
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: replication
              containerPort: 8444
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: config-out
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: certs
          secret:
            secretName: kanidm-tls
        - name: base-config
          configMap:
            name: kanidm-server-config
        - name: repl-config
          secret:
            secretName: kanidm-repl-certs
            optional: true
        - name: config-out
          emptyDir: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-storage
        resources:
          requests:
            storage: 1Gi

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        rewrite name registry.infra.tgy.io harbor.harbor.svc.cluster.local
        # GitHub を gateway 経由にする経路（#1038）。下の template が
        # *.infra.tgy.io を Gateway の LB IP に answer してしまうので、その前に
        # 名前を Service へ向ける。この行が無いと handler は公開 Gateway へ行き、
        # そこにはルートが無いので 404 になる。
        rewrite name gh-ro.infra.tgy.io github-mcp.llm-gateway.svc.cluster.local
        rewrite name gh-rw.infra.tgy.io github-mcp.llm-gateway.svc.cluster.local

        hosts {
            192.168.10.192  idm.tgy.io
            192.168.10.191  argocd.infra.tgy.io
            192.168.10.190  nc.tgy.io
            192.168.10.190  reader.tgy.io
            fallthrough
        }

        template IN A infra.tgy.io {
            match ".*\.infra\.tgy\.io\.$"
            answer "{{ .Name }} 60 IN A 192.168.10.190"
            fallthrough
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: suspicious-binary
# shell セレクタに matchBinaries を足し、「その親が該当バイナリを起動するのは設計どおり」
# という既知の定常動作だけを外す。2026-09-15 に Loki で実測
# （{namespace="kube-system",pod=~"tetragon-.*",container="export-stdout"} の
# process_kprobe.process.binary 集計。Prometheus の increase() は短命 Pod を取りこぼして
# 過小値になるため使わない）。
#
# Shell セレクタ: 発火 2,043 件/日のうち argocd-repo-server 1,032 / postgres 304 /
# busybox 288 / containerbase-cli 210 = 約90%。postgres がメジャーバージョンでパスを
# 変えるため NotPrefix にしてある（CRD 上 maxItems: 1 なので一本化）。他の3つは完全パス
# のつもりだが前方一致の副作用で /usr/bin/busybox-extras のような同名接頭辞も一緒に外れる。
# 除外後の残りは約209件/日（claude 97 件/日が最大）。
#
# Network tool セレクタ: 除外は置かない。発火 601 件/日のうち github-auth.sh 442 /
# github-signed-commit.sh 36 は argo-tools 内部スクリプト（どちらも #!/bin/sh の
# シェバンススクリプト）からの curl 経由の GitHub アクセスだが、matchBinaries は
# インタプリタにマッチしスクリプトパスにはマッチしない（Tetragon selectors.md
# 「Scripts with shebangs」節）。シェバンスクリプトの実体は /bin/sh（busybox）を
# exec しているだけなので、/usr/local/bin/github-auth.sh を matchBinaries で
# 指定しても原理的に一致しない。export に出る process.binary にはスクリプトパスが
# そのまま出るため Loki のイベントを見ると除外できそうに見えるが、それはマッチングに
# 使われる値ではない。2026-09-15 に実際この形で除外を入れたが本番で無効だった。
# Shell セレクタの除外が効くのは、対象4件がすべて ELF 実バイナリだから。
#
# 除外はセレクタ単位で効く — 同じ親でも除外対象と別の種類のバイナリを起動すれば従来どおり
# 発火する。Network tool / Package manager / Debug の3セレクタには除外が一切無く、
# 全ての親に対して無条件に発火する。policy 全体では 2,645 → 約811件/日（約69%減）で、
# Grafana の suspicious-binary パネルに出るのはこちら（tetragon_policy_events_total に
# セレクタを区別するラベルが無く hook 単位で合算されるため）。
spec:
  kprobes:
    - call: "security_bprm_check"
      syscall: false
      message: "Shell executed in container"
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - "host_ns"
          matchBinaries:
            - operator: "NotPrefix"
              values:
                - "/usr/local/bin/argocd-repo-server"
                - "/usr/local/sbin/containerbase-cli"
                - "/usr/bin/busybox"
                - "/usr/lib/postgresql/"
          matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/bin/sh"
                - "/bin/bash"
                - "/bin/dash"
                - "/bin/zsh"
                - "/usr/bin/sh"
                - "/usr/bin/bash"
                - "/usr/bin/dash"
                - "/usr/bin/zsh"
          matchActions:
            - action: Post
              rateLimit: "1m"

    - call: "security_bprm_check"
      syscall: false
      message: "Network tool executed in container"
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - "host_ns"
          matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/usr/bin/curl"
                - "/usr/bin/wget"
                - "/usr/bin/nc"
                - "/usr/bin/ncat"
                - "/usr/bin/nmap"
                - "/usr/bin/socat"
                - "/usr/bin/telnet"
                - "/usr/bin/ssh"
                - "/usr/bin/scp"
          matchActions:
            - action: Post
              rateLimit: "1m"

    - call: "security_bprm_check"
      syscall: false
      message: "Package manager executed in container"
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - "host_ns"
          matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/usr/bin/apt"
                - "/usr/bin/apt-get"
                - "/usr/bin/dpkg"
                - "/usr/bin/yum"
                - "/usr/bin/dnf"
                - "/usr/bin/rpm"
                - "/sbin/apk"
                - "/usr/bin/pip"
                - "/usr/bin/pip3"
          matchActions:
            - action: Post
              rateLimit: "1m"

    - call: "security_bprm_check"
      syscall: false
      message: "Debug/introspection tool executed in container"
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - "host_ns"
          matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/usr/bin/gdb"
                - "/usr/bin/strace"
                - "/usr/bin/ltrace"
                - "/usr/bin/tcpdump"
                - "/usr/sbin/tcpdump"
                - "/usr/bin/nsenter"
                - "/usr/bin/mount"
                - "/usr/sbin/mount"
          matchActions:
            - action: Post
              rateLimit: "1m"

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      skipBackgroundRequests: true
      verifyImages:
        - imageReferences:
            - "registry.infra.tgy.io/*"
          # 署名の置き場は 2 通り。どちらか 1 つで検証できれば通す（count: 1）。
          # 1. イメージと同じリポジトリ（public プロジェクト）
          # 2. public な tools/signatures（private プロジェクト）。Kyverno は
          #    --imagePullSecrets を署名の取得に使わない (kyverno/kyverno#15120) ため、
          #    private プロジェクトの署名はこちらに出す。署名は digest に対する署名で
          #    しかなく、公開してもイメージの中身は漏れない。
          # プロジェクトを列挙しないので、新しいプロジェクトも自動で検証対象に入る。
          # 鍵は同じなので、どちらの置き場でも受け入れる範囲は変わらない。
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                        -----BEGIN PUBLIC KEY-----
                        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEwj7kCwLmafF4470wPuk97Lhbho0
                        vEW3MUXEhm/9OLNUYmftu7R9VmlcnRl3CufXhVWRqpB/tbJXJWlYO5kV+g==
                        -----END PUBLIC KEY-----
                    signatureAlgorithm: sha256
                  signatureAlgorithm: sha256
                - keys:
                    publicKeys: |-
                        -----BEGIN PUBLIC KEY-----
                        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEwj7kCwLmafF4470wPuk97Lhbho0
                        vEW3MUXEhm/9OLNUYmftu7R9VmlcnRl3CufXhVWRqpB/tbJXJWlYO5kV+g==
                        -----END PUBLIC KEY-----
                    signatureAlgorithm: sha256
                  signatureAlgorithm: sha256
                  repository: registry.infra.tgy.io/tools/signatures
          mutateDigest: true
          required: true
          verifyDigest: true
          useCache: true

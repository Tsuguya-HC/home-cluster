apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      skipBackgroundRequests: true
      verifyImages:
        - imageReferences:
            - "registry.infra.tgy.io/*"
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEwj7kCwLmafF4470wPuk97Lhbho0
                      vEW3MUXEhm/9OLNUYmftu7R9VmlcnRl3CufXhVWRqpB/tbJXJWlYO5kV+g==
                      -----END PUBLIC KEY-----
                    signatureAlgorithm: sha256
                  signatureAlgorithm: sha256
          # trading プロジェクトは private なので、署名 (.sig) を引くのに認証が要る。
          # 認証情報は kyverno namespace の Secret から取る（pull 専用ロボット）。
          imageRegistryCredentials:
            allowInsecureRegistry: false
            secrets:
              - harbor-trading-pull
          mutateDigest: true
          required: true
          verifyDigest: true
          useCache: true

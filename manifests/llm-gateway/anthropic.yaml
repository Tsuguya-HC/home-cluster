# Max（Anthropic 直）向けの alias。issue #942 の表のうち `review` / `investigate` の 2 本、implement flow の
# Claude 版が使う `implement-claude`、手元用のモデル名ルート。
#
# handler ごとに alias を切るのは、`x-ai-eg-model` がそのまま帰属の単位になるため。
# review と investigate は今同じモデル（sonnet）・同じバックエンドに解決されるが、分けておくと
# 「どの handler が Max の枠を食っているか」がログで分かれる。
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: claude-max
  namespace: llm-gateway
spec:
  parentRefs:
    - name: llm-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
  # modelNameOverride は**固定 ID** で、WFT が使ってきた `sonnet`（浮動 alias）とは追随しない。
  # 次の Sonnet が出た日に、gateway は旧モデルを配り続ける。**沈黙して乖離する**ので、
  # モデルを上げるときはここを人が上げる。
  rules:
    # レビュー系（pr-review / adjudicator 等）。WFT は --model review、taskflow-review の handler は LLM_ALIAS（既定 review）で入る。
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: review
            # **どのクライアントがこの階層を使ってよいか。** 認証（Gateway 単位の
            # SecurityPolicy）が付ける x-llm-client を見る。呼ぶ側は偽装できない
            # （認証成功時に必ず上書きされる）。ここに無いクライアントは**どのルールにも
            # 当たらず route-not-found → 404**。鍵が無ければその手前で 401。
            # 新しい handler を足すときはここにも足す。
            - type: RegularExpression
              name: x-llm-client
              value: "^(adjudicator|alert-investigate|claude-code-agent|claude-code-generic|implement|implement-verify|pluto-check|pr-review|task-executor|task-executor-write|taskflow-review|wf-creator|wf-improver|llm-gateway-smoke)$"
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: claude-max
          modelNameOverride: claude-sonnet-5
          weight: 1
          priority: 0
      # 応答を受け切るまでの上限。thinking を含む 1 応答が数分かかるので短いと途中で切れ、
      # クライアントは retry を繰り返して何も進まない。
      timeouts:
        request: 600s
    # 障害調査系（alert-investigate 等）。将来ここだけ従量課金の
    # Anthropic API キーへフォールバックする案が #942 にある。
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: investigate
            # **どのクライアントがこの階層を使ってよいか。** 認証（Gateway 単位の
            # SecurityPolicy）が付ける x-llm-client を見る。呼ぶ側は偽装できない
            # （認証成功時に必ず上書きされる）。ここに無いクライアントは**どのルールにも
            # 当たらず route-not-found → 404**。鍵が無ければその手前で 401。
            # 新しい handler を足すときはここにも足す。
            - type: RegularExpression
              name: x-llm-client
              value: "^(adjudicator|alert-investigate|claude-code-agent|claude-code-generic|implement|implement-verify|pluto-check|pr-review|task-executor|task-executor-write|taskflow-investigate|wf-creator|wf-improver|llm-gateway-smoke)$"
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: claude-max
          modelNameOverride: claude-sonnet-5
          weight: 1
          priority: 0
      # 応答を受け切るまでの上限。thinking を含む 1 応答が数分かかるので短いと途中で切れ、
      # クライアントは retry を繰り返して何も進まない。
      timeouts:
        request: 600s
    # implement flow の Claude 版（TaskFlow implement-claude）の実装と修正。Muse 版と比べるための枠。
    # **untrusted input を実行する Pod が Max に届く口**（#942 はこれを切り離した）なので、
    # 許可は taskflow-implement-claude だけに絞り、review / investigate には入れない。
    # Muse 版の taskflow-implement をここに足さないこと。
    # review / investigate（claude-sonnet-5）と違い claude-sonnet-5-5 を指定しているのは、implement flow で Muse と比べるために選んだモデルだから。
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: implement-claude
            - type: RegularExpression
              name: x-llm-client
              value: "^(taskflow-implement-claude|llm-gateway-smoke)$"
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: claude-max
          modelNameOverride: claude-sonnet-5-5
          weight: 1
          priority: 0
      timeouts:
        request: 600s
    # モデル名そのままのルート（手元の claude 用）。handler 用の alias と違い、名前が
    # 上流のモデル ID と一致するので、何に投げているかが読めて Claude Code もモデルを認識する。
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: claude-opus-5-5
            - type: RegularExpression
              name: x-llm-client
              value: "^(local-dev)$"
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: claude-max
          weight: 1
          priority: 0
      timeouts:
        request: 600s
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: claude-sonnet-5
            - type: RegularExpression
              name: x-llm-client
              value: "^(local-dev)$"
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: claude-max
          weight: 1
          priority: 0
      timeouts:
        request: 600s
    # home-trading の LLM 比較アーム（ADR-0019）。系列はモデル名で固定されるので、
    # alias ではなくモデル名のルートにして modelNameOverride を付けない。
    # trading-arm を他のルールに足さないこと（呼べるモデルを 1 つに絞るのが目的）。
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: claude-sonnet-5-5
            - type: RegularExpression
              name: x-llm-client
              value: "^(trading-arm)$"
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: claude-max
          weight: 1
          priority: 0
      timeouts:
        request: 600s
---
# trading-arm の呼び出し数の上限（ADR-0019 決定 7）。Local なので Envoy の Pod ごとの
# メモリ上のバケットで、Envoy が再起動すると満タンに戻る。
# トークン数での上限は Global（外部の rate limit サービス + Redis）が要り、今は無い。
# Local は response 側の cost を受け付けない（CRD の CEL が拒否する）。
#
# **Gateway に付ける（ルートに付けない）。** SecurityPolicy と同じ理由で、モデルヘッダが
# 埋まる前のリクエストは catch-all ルートにいる。Gateway 単位なら配下の全ルートに配られる
# ので、どのルートで評価されても数える。clientSelectors に当たらないリクエストは
# 上限なし（既定バケットは uint32 max）。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: trading-arm-ratelimit
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - type: Exact
                  name: x-llm-client
                  value: trading-arm
                  # CRD の default。書かないと ArgoCD が OutOfSync を出し続ける
                  # （docs/known-issues.md「CRD の default 値が ArgoCD を OutOfSync にする」）。
                  invert: false
          limit:
            requests: 7500
            unit: Day
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: claude-max
  namespace: llm-gateway
spec:
  schema:
    name: Anthropic
  backendRef:
    name: claude-max
    kind: Backend
    group: gateway.envoyproxy.io
---
# **汎用の APIKey を使う（AnthropicAPIKey ではない）。**
# upstream の example は `type: AnthropicAPIKey` だが、あれは `x-api-key` を出す
# Anthropic の API キー用。Max の OAuth トークンは `Authorization: Bearer` で送る必要があり、
# それを出すのは汎用の `type: APIKey` の方（2026-09-16 実測）。取り違えると 401 になる。
#
# `anthropic-beta: oauth-2025-04-20` は不要（実測で確認済み）。Anthropic が subscription
# OAuth をゲートしているのは **Claude Code の system prompt が先頭にあるか**で、
# 無いと枠切れを装った 429（message が "Error" だけ）を返す。handler は claude CLI なので
# 条件を満たすが、**claude CLI 以外をこの alias に乗せてはいけない**。
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: claude-max
  namespace: llm-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: claude-max
  type: APIKey
  apiKey:
    secretRef:
      # group / kind は CRD の default（実測: live に group: "" / kind: Secret が入る）。
      # 実測ではこの BackendSecurityPolicy 自体は OutOfSync ではなかったが、同一 app 内の
      # SecurityPolicy と表記を揃えるため合わせて書いた（詳細: docs/known-issues.md
      # 「CRD の default 値が ArgoCD を OutOfSync にする」）。
      group: ""
      kind: Secret
      name: claude-max-apikey
      namespace: llm-gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: claude-max
  namespace: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: api.anthropic.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: claude-max
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: claude-max
  validation:
    wellKnownCACertificates: System
    hostname: api.anthropic.com

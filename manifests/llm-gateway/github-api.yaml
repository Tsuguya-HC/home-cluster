# GitHub の REST / GraphQL / git smart HTTP を gateway 経由にする経路（#1038）。
# **handler はトークンを持たず、gateway が持つ。**
#
# **ロールはホスト名で分ける。** `gh` は API のパスを呼ぶ側で選べない。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: github-api
  namespace: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: api.github.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: github-api
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: github-api
  validation:
    wellKnownCACertificates: System
    hostname: api.github.com
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: github-git
  namespace: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: github.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: github-git
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: github-git
  validation:
    wellKnownCACertificates: System
    hostname: github.com
---
# git smart HTTP のトークン注入。**REST / GraphQL とは形式が違う**（Basic）。
# 値は github-auth namespace の CronJob が上書きする。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: github-git-credential-ro
  namespace: llm-gateway
spec:
  credentialInjection:
    header: Authorization
    overwrite: true
    credential:
      valueRef:
        group: ""
        kind: Secret
        name: github-git-credential-ro
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: github-git-credential-rw
  namespace: llm-gateway
spec:
  credentialInjection:
    header: Authorization
    overwrite: true
    credential:
      valueRef:
        group: ""
        kind: Secret
        name: github-git-credential-rw
---
# 読み取り専用ロール。
#
# **URLRewrite の hostname を必ず書くこと。** 書かないと上流へ届かず、git は
# リダイレクトを追って github.com へ直行する。public リポだと匿名で成功するので気づけない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-ro
  namespace: llm-gateway
spec:
  parentRefs:
    - name: github-mcp
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-ro
  hostnames:
    - gh-ro.infra.tgy.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/graphql
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /graphql
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-ro
      backendRefs:
        # weight は CRD の既定値。書かないと apiserver が埋めた値とマニフェストが
        # 食い違い、Application が永久に OutOfSync になる。
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/v3
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-ro
      backendRefs:
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    # git smart HTTP。パスは `<owner>/<repo>.git/...` なので書き換えず、
    # ホスト名だけ github.com にする。
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: github.com
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-git-credential-ro
      backendRefs:
        - name: github-git
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
---
# 書き込みロール。
#
# **URLRewrite の hostname を必ず書くこと。** 書かないと上流へ届かず、git は
# リダイレクトを追って github.com へ直行する。public リポだと匿名で成功するので気づけない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-rw
  namespace: llm-gateway
spec:
  parentRefs:
    - name: github-mcp
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-rw
  hostnames:
    - gh-rw.infra.tgy.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/graphql
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /graphql
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-rw
      backendRefs:
        # weight は CRD の既定値。書かないと apiserver が埋めた値とマニフェストが
        # 食い違い、Application が永久に OutOfSync になる。
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/v3
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-rw
      backendRefs:
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    # git smart HTTP。パスは `<owner>/<repo>.git/...` なので書き換えず、
    # ホスト名だけ github.com にする。
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: github.com
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-git-credential-rw
      backendRefs:
        - name: github-git
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
---
# 起票ロール。App は issue の作成・追記・ラベル付けだけに使う起票専用のもの（issues:write のみ）。
# 書き込みロールと App を分けるのは、起票の後の数え直しがこの App の名義で数えるため
# （共有の App だと他の書き込みを拾う）。
#
# **通すのは POST の 3 経路だけ。** issues:write で届くラベルの削除・置き換え、他者コメントの
# 編集・削除、lock、transfer、close などを /api/v3 の丸ごと通過で開けないため、パスを正規表現で絞る。
# ラベルは足すことしかできない。どの issue に、どの名前を足したかは gateway では絞れない
# （番号も本文も見ない。存在しない名前はリポにラベルとして作られうる）ので、起票役の数え直しで確かめる。
# owner は Tsuguya-HC に固定する。呼び手が他の owner に書けない。
# それ以外のメソッド・パスはルートに当たらず 404。
# 正規表現のマッチは ReplacePrefixMatch が使えないので、書き換えは HTTPRouteFilter で行う。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: github-issues-rewrite
  namespace: llm-gateway
spec:
  urlRewrite:
    hostname:
      type: Backend
    path:
      type: ReplaceRegexMatch
      replaceRegexMatch:
        pattern: ^/api/v3(/.*)$
        substitution: \1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-issues
  namespace: llm-gateway
spec:
  parentRefs:
    - name: github-mcp
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-issues
  hostnames:
    - gh-issues.infra.tgy.io
  rules:
    - matches:
        - method: POST
          path:
            type: RegularExpression
            value: ^/api/v3/repos/Tsuguya-HC/[A-Za-z0-9_-][A-Za-z0-9._-]*/issues$
        - method: POST
          path:
            type: RegularExpression
            value: ^/api/v3/repos/Tsuguya-HC/[A-Za-z0-9_-][A-Za-z0-9._-]*/issues/[0-9]+/comments$
        - method: POST
          path:
            type: RegularExpression
            value: ^/api/v3/repos/Tsuguya-HC/[A-Za-z0-9_-][A-Za-z0-9._-]*/issues/[0-9]+/labels$
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-issues-rewrite
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-issues
      backendRefs:
        # weight は CRD の既定値。書かないと apiserver が埋めた値とマニフェストが
        # 食い違い、Application が永久に OutOfSync になる。
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
---
# **ro と rw と issues は別の Secret を参照すること。** apiKeyAuth は参照した Secret の全キーを
# 有効な資格情報として扱うので、同じ Secret を指すと ro の鍵で rw のルートも通る。
#
# sanitize: true で呼び出し元鍵は上流へ行かず、同じルートの credentialInjection が
# 実 installation token を入れ直す。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: github-ro
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-ro
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: github-api-ro-client-keys
    extractFrom:
      - headers: [Authorization]
    sanitize: true
    forwardClientIDHeader: x-github-client-id
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: github-rw
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-rw
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: github-api-rw-client-keys
    extractFrom:
      - headers: [Authorization]
    sanitize: true
    forwardClientIDHeader: x-github-client-id
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: github-issues
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-issues
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: github-api-issues-client-keys
    extractFrom:
      - headers: [Authorization]
    sanitize: true
    forwardClientIDHeader: x-github-client-id
---
# handler が TLS で来るためのサーバー証明書。DNS-01 なので外から到達可能にする必要は無い。
#
# **公開 Gateway にこのホスト名の HTTPRoute を作らないこと。** 名前は外からも引けるので、
# 作ると資格情報を注入する経路が外から叩ける。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: github-gateway-tls
  namespace: llm-gateway
spec:
  secretName: github-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - gh-ro.infra.tgy.io
    - gh-rw.infra.tgy.io
    - gh-issues.infra.tgy.io
---
# **route timeout を明示する。** 既定のままだと git の clone / push が途中で切れる。
# 効くのは「レスポンス全体を受け切るまで」で、接続の idle ではない。
# timeout と retry はこの 1 つの policy に置く（同じ route に BackendTrafficPolicy を 2 つ付けない）。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: github-timeout
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-ro
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-rw
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-issues
  timeout:
    http:
      requestTimeout: 300s
  # 送り直すのは、上流が要求を処理していないと分かる失敗だけにする。書き込みの経路も通るので、
  # reset や 5xx を足すと同じ書き込みが二度届きうる。
  retry:
    numRetries: 2
    perRetry:
      backOff:
        baseInterval: 1s
        maxInterval: 5s
    retryOn:
      triggers: [refused-stream, connect-failure, reset-before-request]

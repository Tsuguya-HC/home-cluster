# GitHub の REST / GraphQL / git smart HTTP を gateway 経由にする経路（#1038）。
# **handler はトークンを持たず、gateway が持つ。**
#
# **ロールはホスト名で分ける。** `gh` は API のパスを呼ぶ側で選べない。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: github-api
  namespace: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: api.github.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: github-api
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: github-api
  validation:
    wellKnownCACertificates: System
    hostname: api.github.com
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: github-git
  namespace: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: github.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: github-git
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: github-git
  validation:
    wellKnownCACertificates: System
    hostname: github.com
---
# git smart HTTP のトークン注入。**REST / GraphQL とは形式が違う**（Basic）。
# 値は github-auth namespace の CronJob が上書きする。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: github-git-credential-ro
  namespace: llm-gateway
spec:
  credentialInjection:
    header: Authorization
    overwrite: true
    credential:
      valueRef:
        group: ""
        kind: Secret
        name: github-git-credential-ro
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: github-git-credential-rw
  namespace: llm-gateway
spec:
  credentialInjection:
    header: Authorization
    overwrite: true
    credential:
      valueRef:
        group: ""
        kind: Secret
        name: github-git-credential-rw
---
# 読み取り専用ロール。
#
# **URLRewrite の hostname を必ず書くこと。** 書かないと上流へ届かず、git は
# リダイレクトを追って github.com へ直行する。public リポだと匿名で成功するので気づけない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-ro
  namespace: llm-gateway
spec:
  parentRefs:
    - name: github-mcp
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-ro
  hostnames:
    - gh-ro.infra.tgy.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/graphql
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /graphql
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-ro
      backendRefs:
        # weight は CRD の既定値。書かないと apiserver が埋めた値とマニフェストが
        # 食い違い、Application が永久に OutOfSync になる。
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/v3
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-ro
      backendRefs:
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    # git smart HTTP。パスは `<owner>/<repo>.git/...` なので書き換えず、
    # ホスト名だけ github.com にする。
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: github.com
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-git-credential-ro
      backendRefs:
        - name: github-git
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
---
# 書き込みロール。
#
# **URLRewrite の hostname を必ず書くこと。** 書かないと上流へ届かず、git は
# リダイレクトを追って github.com へ直行する。public リポだと匿名で成功するので気づけない。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-rw
  namespace: llm-gateway
spec:
  parentRefs:
    - name: github-mcp
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-rw
  hostnames:
    - gh-rw.infra.tgy.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/graphql
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /graphql
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-rw
      backendRefs:
        # weight は CRD の既定値。書かないと apiserver が埋めた値とマニフェストが
        # 食い違い、Application が永久に OutOfSync になる。
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/v3
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: api.github.com
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-mcp-credential-rw
      backendRefs:
        - name: github-api
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
    # git smart HTTP。パスは `<owner>/<repo>.git/...` なので書き換えず、
    # ホスト名だけ github.com にする。
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: github.com
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: github-git-credential-rw
      backendRefs:
        - name: github-git
          kind: Backend
          group: gateway.envoyproxy.io
          port: 443
          weight: 1
---
# **ro と rw は別の Secret を参照すること。** apiKeyAuth は参照した Secret の全キーを
# 有効な資格情報として扱うので、同じ Secret を指すと ro の鍵で rw のルートも通る。
#
# sanitize: true で呼び出し元鍵は上流へ行かず、同じルートの credentialInjection が
# 実 installation token を入れ直す。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: github-ro
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-ro
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: github-api-ro-client-keys
    extractFrom:
      - headers: [Authorization]
    sanitize: true
    forwardClientIDHeader: x-github-client-id
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: github-rw
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-rw
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: github-api-rw-client-keys
    extractFrom:
      - headers: [Authorization]
    sanitize: true
    forwardClientIDHeader: x-github-client-id
---
# handler が TLS で来るためのサーバー証明書。DNS-01 なので外から到達可能にする必要は無い。
#
# **公開 Gateway にこのホスト名の HTTPRoute を作らないこと。** 名前は外からも引けるので、
# 作ると資格情報を注入する経路が外から叩ける。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: github-gateway-tls
  namespace: llm-gateway
spec:
  secretName: github-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - gh-ro.infra.tgy.io
    - gh-rw.infra.tgy.io
---
# **route timeout を明示する。** 既定のままだと git の clone / push が途中で切れる。
# 効くのは「レスポンス全体を受け切るまで」で、接続の idle ではない。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: github-timeout
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-ro
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: github-rw
  timeout:
    http:
      requestTimeout: 300s

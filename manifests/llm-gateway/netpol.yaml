# Envoy データプレーン。外部 LLM への egress を持つのはここだけで、handler の
# namespace からは ClusterIP への ingress しか許可しない（issue #942）。
#
# Envoy Pod がこの namespace に立つのは helm-values/envoy-gateway/values.yaml で
# deploy.type: GatewayNamespace にしているため。既定（ControllerNamespace）だと
# envoy-gateway-system 側に立ち、この CNP は何も選択しない。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-gateway-envoy
  namespace: llm-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      # Gateway 名まで見る。これが無いと、この namespace に 2 本目の Gateway を立てたとき
      # そちらの Envoy にも同じポリシーが当たる — 分離したつもりで分離できない。
      gateway.networking.k8s.io/gateway-name: llm-gateway
  ingress:
    # handler から。alias ごとに Pod を分けないので namespace 単位で開ける。
    # 対向の egress は claude-code の全 handler、claude-code-build の taskflow-implement、
    # argo の pluto-check が持つ（issue #942）。**新しい namespace から呼ぶときはここにも
    # 足すこと** — 片側だけだとエラーは出ず、接続がただ失敗する。
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: claude-code-build
        - matchLabels:
            io.kubernetes.pod.namespace: claude-code
        # argo は claude CLI 以外のワークロード（renovate / tofu-harbor / backup …）が
        # 常駐しているので、namespace 単位では開けない。Cilium の identity は
        # ServiceAccount を持つので、gateway を呼ぶステップの SA だけに絞る。
        # **pluto-checker ではなく pluto-fixer** — 前者は全 Secret を読めるので
        # claude を走らせる ai-fix には与えていない（pluto-check.yaml の定義を参照）。
        - matchLabels:
            io.kubernetes.pod.namespace: argo
            io.cilium.k8s.policy.serviceaccount: pluto-fixer
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
    # kubelet の probe。Envoy Gateway の readiness は :19003/ready で、:19001 は
    # stats（Prometheus 用、今は誰も引いていない）。混同すると probe が落ちて
    # Pod が永久に Ready にならない。
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "19003"
              protocol: TCP
  egress:
    # xDS。Envoy Gateway コントローラから設定を受け取る。
    - toEndpoints:
        - matchLabels:
            control-plane: envoy-gateway
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    # 上流 LLM。ここが「外に出られる唯一の口」。
    - toFQDNs:
        - matchName: "openrouter.ai"
        # Max の alias（review / investigate）。#942 の第一段階では OpenRouter だけだった。
        - matchName: "api.anthropic.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# GitHub MCP 専用のデータプレーン（#983）。**llm-gateway-envoy とは別の Pod** で、
# endpointSelector の gateway-name がそれを分けている。
#
# **この分離が資格情報の境界そのもの。** こちらの Envoy は GitHub の installation
# token を持つが外部 LLM へは出られず、llm-gateway 側は LLM の API キーを持つが
# GitHub へは出られない。相乗りさせると 1 つの Pod が両方を持つことになり、
# CNP では区別できなくなる（同じ Pod なので）。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-mcp-envoy
  namespace: llm-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      gateway.networking.k8s.io/gateway-name: github-mcp
  ingress:
    # 呼ぶ側。**新しい namespace から呼ぶときはここにも足すこと** —— 片側だけだと
    # エラーは出ず、接続がただ失敗する。現時点では消費者がまだ無く、
    # claude-code / claude-code-build の handler が MCP に切り替わった時点で使われる。
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: claude-code
        - matchLabels:
            io.kubernetes.pod.namespace: claude-code-build
        # argo は gateway を呼ばないワークロードが常駐しているので namespace 単位では
        # 開けない。呼ぶステップの SA だけに絞る。
        - matchLabels:
            io.kubernetes.pod.namespace: argo
            io.cilium.k8s.policy.serviceaccount: github-mcp-smoke
        # **pluto-checker ではなく pluto-fixer**（#1038）。前者は全 Secret を読めるので
        # claude を走らせる ai-fix には与えていない。
        - matchLabels:
            io.kubernetes.pod.namespace: argo
            io.cilium.k8s.policy.serviceaccount: pluto-fixer
      toPorts:
        - ports:
            # listener 80 と 443 に対して Envoy が実際に listen する port。
            # 443 側は #1038 の REST / GraphQL / git 用で、`gh` が平文を拒むので
            # 平文のまま済ませることはできない。
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # kubelet の probe。readiness は :19003/ready（:19001 は stats）。
    # 混同すると Pod が永久に Ready にならない。
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "19003"
              protocol: TCP
  egress:
    # xDS。
    - toEndpoints:
        - matchLabels:
            control-plane: envoy-gateway
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    # 上流。MCP に加えて REST / GraphQL / git smart HTTP（#1038）。
    # **3 つとも GitHub なので、この Envoy が持つ資格情報の境界は動かない** ——
    # 分けているのは「GitHub の資格情報を持つ Envoy」と「LLM の資格情報を持つ
    # Envoy」であって、GitHub の中のプロトコルではない。
    - toFQDNs:
        - matchName: "api.githubcopilot.com"
        - matchName: "api.github.com"
        - matchName: "github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

# implement alias（issue #942）。handler は alias 名しか知らず、実モデルはここで決まる。
# `x-ai-eg-model` は Anthropic 入力の場合 body の model フィールドから gateway が埋める。
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: implement
  namespace: llm-gateway
spec:
  parentRefs:
    - name: llm-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  # これが無いと metadataKey 自体が存在せず、アクセスログの gen_ai.usage.* が空になる（#948）。
  # EnvoyProxy の telemetry.accessLog（manifests/llm-gateway/gateway.yaml）と対で機能する。
  #
  # **ただし OpenRouter 相手ではトークン数は 0 のまま出る（2026-09-17 実測）。**
  # extproc は OpenAI 仕様どおり「choices が空で usage を持つチャンク」でしか usage を
  # 拾わない（internal/translator/openai_helper.go の handleChunk）。OpenRouter は
  # **usage チャンクに choices を 1 つ入れる**仕様で（クライアントが choices[0].delta で
  # 落ちないための意図的な逸脱、同社ドキュメントに明記）、この分岐に入らない。
  # upstream 同士の非互換で、設定側の回避手段は無い（bodyMutation はリクエスト側なので効かない）。
  # llmRequestCosts 自体は残す — Anthropic / Bedrock など他の上流を足したときには効くため。
  #
  # 実測メモ: AIGatewayRoute を変えても**データプレーンの Pod は置き換わらない**。
  # filter config の Secret は同名のまま中身が更新され、extproc が 5 秒間隔で読み直す
  # （cmd/extproc/mainlib/main.go の startConfigWatcher）。反映は kubelet の volume 更新
  # （最大 1 分ほど）を待つだけで、Deployment のハッシュも Pod も動かない。
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: implement
            # **どのクライアントがこの階層を使ってよいか。** 認証（Gateway 単位の
            # SecurityPolicy）が付ける x-llm-client を見る。呼ぶ側は偽装できない
            # （認証成功時に必ず上書きされる）。ここに無いクライアントは**どのルールにも
            # 当たらず route-not-found → 404**。鍵が無ければその手前で 401。
            # 新しい handler を足すときはここにも足す。
            - type: RegularExpression
              name: x-llm-client
              value: "^(llm-gateway-smoke|taskflow-implement|tier-probe)$"
      # modelsOwnedBy / weight / priority は CRD の既定値。書かないと apiserver が埋めた値と
      # マニフェストが食い違い、**Application が永久に OutOfSync になる**（2026-09-17 実測）。
      # ignoreDifferences で隠さず明示するのは、upstream が既定値を変えたときに差分として
      # 見えるようにするため。
      modelsOwnedBy: Envoy AI Gateway
      backendRefs:
        - name: openrouter
          modelNameOverride: meta/muse-spark-1.3-contributor
          weight: 1
          priority: 0
      # 応答を受け切るまでの上限。thinking を含む 1 応答が数分かかるので短いと途中で切れ、
      # クライアントは retry を繰り返して何も進まない。
      timeouts:
        request: 600s
---
# OpenRouter は OpenAI 互換 API（/api/v1/chat/completions）。入力は Anthropic
# （/anthropic/v1/messages）で受けて gateway が変換する。
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter
  namespace: llm-gateway
spec:
  schema:
    name: OpenAI
    prefix: /api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
---
# 汎用 APIKey。Authorization: Bearer <key> を gateway が付け直す。
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openrouter
  namespace: llm-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openrouter
  type: APIKey
  apiKey:
    secretRef:
      # group / kind は CRD の default（実測: live に group: "" / kind: Secret が入る）。
      # 実測ではこの BackendSecurityPolicy 自体は OutOfSync ではなかったが、同一 app 内の
      # SecurityPolicy と表記を揃えるため合わせて書いた（詳細: docs/known-issues.md
      # 「CRD の default 値が ArgoCD を OutOfSync にする」）。
      group: ""
      kind: Secret
      name: openrouter-apikey
      namespace: llm-gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter
  namespace: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: openrouter.ai
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: openrouter
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: openrouter
  validation:
    wellKnownCACertificates: System
    hostname: openrouter.ai

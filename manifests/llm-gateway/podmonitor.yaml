# llm-gateway の Envoy データプレーンの scrape。
#
# - Envoy の stats（:19001）: 4,000 系列を超えるので、クラスタ単位の再試行と応答コードの
#   カウンタだけを残す。フォールバック（claude-api → claude-max）は再試行として数えられる。
# - extproc の /metrics（:1064）: gen_ai_* の token usage（tf_handler・モデル別）。
#
# github-mcp の Envoy は別の Gateway なので selector の gateway-name で外している。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: llm-gateway
  namespace: llm-gateway
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      gateway.networking.k8s.io/gateway-name: llm-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: envoy_cluster_upstream_rq_(retry|retry_success|xx|total)
          action: keep
        - sourceLabels: [envoy_cluster_name]
          regex: httproute/.*
          action: keep
    - port: aigw-admin
      path: /metrics
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: gen_ai_.*
          action: keep

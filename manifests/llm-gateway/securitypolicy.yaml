# 呼び出し側の認証（issue #942）。**どの handler が gateway のどの階層を呼べるか**を、
# CNP（届くかどうか）ではなく鍵の所持で決める。
#
# なぜ要るか: AIGatewayRoute のルート選択は `x-ai-eg-model`（＝リクエスト body の
# `model`）だけで、**呼ぶ側が自由に選べる**。`x-tf-handler` はアクセスログ用で認可には
# 使われない。つまり gateway に届く Pod は、どれでも `review` を名乗って個人の Max
# サブスクリプションを使える。CNP は namespace / SA の粒度までしか絞れないので、
# 「untrusted input を実行する handler だけ従量課金に閉じる」はここでしか書けない。
#
# 形: ルートごとに 1 本、別々の Secret。**認可ルールは書かない — 鍵の所持がそのまま認可。**
# Envoy の `allowClient`（ルートを跨いだクライアント制限）は Envoy Gateway v1.9.1 の
# CRD に露出していないので、階層の分離は Secret を分けることでしか表現できない。
#
# 効きかたの注意:
#   - **1 つの HTTPRoute に掛けられる SecurityPolicy は 1 本。** 2 本目は status に
#     `Conflicted` が出るだけで **黙って無視される**（apply は通る）
#   - 生成される HTTPRoute の rule に名前が無いので、`sectionName` でルール単位には
#     掛けられない。`review` と `investigate` を別鍵にしたければ AIGatewayRoute を割る
#   - Secret の参照ミス・鍵の値の重複・Secret 消失は **500 直返し**（fail-closed）。
#     設定ミスで認証が黙って外れることは無い
#   - 同じ Secret 内で**鍵の値**が重複すると翻訳エラーになる。クライアント ID の重複は
#     先勝ちで黙って無視される、という非対称があるのでローテーション時は必ず別の値を作る
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: claude-max-client-keys
  namespace: llm-gateway
spec:
  # AIGatewayRoute が生成する HTTPRoute を名前で指す。ownerReference は見られないので
  # 他者所有でも付く。AIGatewayRoute が作り直しても名前は変わらない。
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: claude-max
  apiKeyAuth:
    credentialRefs:
      - name: claude-max-client-keys
    # claude は ANTHROPIC_AUTH_TOKEN を `Authorization: Bearer <値>` として送る。
    # Envoy は `Bearer ` を明示的に剥がしてから照合するので、Secret には生の鍵を入れる。
    extractFrom:
      - headers: [Authorization]
    # 上流へ転送する前に落とす。この後 BackendSecurityPolicy が実キーを載せ直す。
    sanitize: true
    # 認証されたクライアント ID をヘッダに移す。アクセスログの llm.client がこれ。
    # **自称の x-tf-handler と並べてある** — 食い違えば偽装か設定ミス、
    # llm.client だけ空なら「認証されずに通った」＝このポリシーが当たっていない。
    forwardClientIDHeader: x-llm-client
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: implement-client-keys
  namespace: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: implement
  apiKeyAuth:
    credentialRefs:
      - name: implement-client-keys
    extractFrom:
      - headers: [Authorization]
    sanitize: true
    forwardClientIDHeader: x-llm-client

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-gateway
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/component: gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: alloy
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: canary
        - matchLabels:
            claude-code: "true"
            io.kubernetes.pod.namespace: claude-code
        # taskflow の調査フェーズは共有ラベル claude-code=true に相乗りせず専用ラベルを
        # 持つので、こちらにも並べる
        - matchLabels:
            taskflow-cnp-check: "true"
            io.kubernetes.pod.namespace: claude-code
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP

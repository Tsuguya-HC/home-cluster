apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartctl-exporter
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9633"
              protocol: TCP
  # SMART の読み取りはローカルの /dev に対して行うため egress は不要。
  # DNS は CCNP (manifests/infra/ccnp-dns.yaml) で全 Pod に共通適用済み。
  egress: []

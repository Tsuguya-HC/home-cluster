apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
    # OTLP HTTP。llm-gateway の Envoy Pod（extproc が同居）から GenAI のトレース（#991）。
    # 対向は llm-gateway-envoy の egress。**片側だけだとエラーは出ず、span がただ届かない。**
    # gateway-name まで見るのは、同じ namespace の別の Gateway（github-mcp）の Envoy を
    # 通さないため。
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llm-gateway
            app.kubernetes.io/managed-by: envoy-gateway
            gateway.networking.k8s.io/gateway-name: llm-gateway
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

# taskflow の Task が「人間が見るべき」終端に着いたら Discord に出す（home-cluster #743 で
# pr-review の Pod から notify サイドカーを外し、「framework の信号に乗せる」と決めた残り半分の配線）。
#
# 出典は design.md §5「終端の意味は flow が宣言する」と §9「人間への報告は絞る」:
# 人間が見るべき瞬間は `terminals` で `Failure` と宣言された終端、そして framework 自身の
# `TaskFailed` の 2 つだけ。`taskflow_task_outcomes_total`
# （manifests/taskflow-system/servicemonitor.yaml が既に取っている）はこの 2 つを含む終端の種類を
# 常に出すので、追加の exporter もコントローラへの変更も要らない。
#
# `TaskFailed` は 2 つの別の事態を 1 つの終端名で表す。どちらかは `outcome` label が言う:
# 作業が結論に届かなかった（`NoAnswer` = 0 個/2 個以上/時間切れ/宣言に無いディレクトリ、
# `Declined` = escalate/ 等の宣言された辺で降りた、`RunLimitReached` = maxRunsPerPhase）と、
# 定義が壊れている（`Structural`）。直す場所が違う（前者は対象・handler、後者は git の
# TaskFlow / TaskHandler）ので alert を分ける。前者は `outcome!="Structural"` で取り、
# 将来 outcome の値が増えても黙らずに作業側の alert に落ちるようにしてある。
#
# ## Task 名・理由の要点は載らない（意図的）
#
# taskflow のコントローラは flow / phase / severity / outcome の 4 label しか出さない
# （taskflow internal/metrics/metrics.go）。Task 名を label にすると、Task を作れる者が
# 実行時にカーディナリティを動かせてしまうため（`Task.spec.flow` に長さ・パターン制限が無いのと
# 同じ理由）。理由の一行（`status.history[].reason`）も同様に自由記述で、metric の label には向かない。
# なのでこの Discord 通知は「どの flow がどのフェーズで何の終端になったか」までしか言えない。
# 対象の Task と理由は `kubectl get task -A` で絞り込み、`Ready` 条件の message
# （Failure 終端では同じ本文が Warning Event `HandlerFailed` の note にも出る）を読む。
#
# ## severity label ごとに alert を分けている理由
#
# metric 自身が `severity` という label を持つが、値は taskflow の語彙（Success / Failure /
# TaskFailed / Undeclared）。Alertmanager の `severity`（critical / warning / info。
# manifests/monitoring/alertmanager-config.yaml のルーティングが見る）と同じ名前で語彙が違うので、
# 1 本の alert で `severity=~"Failure|TaskFailed"` を通してしまうと、rule 側の label が query 結果の
# 同名 label を上書きする Prometheus の挙動により、どちらの終端だったかが最終的な alert から
# 落ちる（上書きされて "warning" にしかならない）。終端ごとに 1 本ずつに分け、
# メッセージは alert 名の側で決め打ちにした。
#
# ## ルーティングは新規に書いていない
#
# `severity: warning` を付けるだけで、alertmanager-config.yaml の既定ルート（critical と
# Watchdog / InfoInhibitor 以外はすべて `continue: true` の末尾ルールで `discord` receiver に落ちる）
# に自然に乗る。alert-investigate（severity: critical 専用、根本原因調査までする重い経路）には
# 意図的に乗せていない — Task の結論を伝えるだけで、ログを読み直す調査は要らない。
#
# ## Task 単位での二重通知は起きない
#
# 1 つの Task が終端に着くとカウンタが 1 だけ増える。`increase(...[5m]) > 0` はその増分が
# 5 分ローリング窓に入っている間だけ真になり、窓を抜けると自動的に resolve するので、
# 同じ Task について repeatInterval（4h）まで鳴り続けることはない。
#
# handler の Pod は人間に通知しない（pr-review は #743 で Pod 内通知を全廃）。
# この rule が唯一の通知経路。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskflow
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskflow
      rules:
        - alert: TaskFlowTaskFailure
          expr: |
            increase(taskflow_task_outcomes_total{severity="Failure"}[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "taskflow: {{ $labels.flow }} が Failure 終端（{{ $labels.phase }}）"
            description: "{{ $labels.flow }} の Task がフェーズ {{ $labels.phase }} で flow 宣言の Failure 終端に着いた（= 指摘・要修正あり）。対象は `kubectl get task -A` で Ready=False のものを探す。理由は対象 Task の Ready 条件の message、または同じ内容の Warning Event（reason HandlerFailed）で分かる。"
        - alert: TaskFlowTaskFailed
          expr: |
            increase(taskflow_task_outcomes_total{severity="TaskFailed", outcome!="Structural"}[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "taskflow: {{ $labels.flow }} が TaskFailed（{{ $labels.outcome }}）"
            description: "{{ $labels.flow }} の Task が TaskFailed に着いた（outcome {{ $labels.outcome }}: 作業が結論に届かなかった）。NoAnswer は 0 個/2 個以上の宣言ディレクトリ・時間切れ・宣言に無いディレクトリのいずれかで、途中で死んだか時間切れの疑いが濃い。Declined は handler が escalate/ 等に理由を書いて降りた。RunLimitReached は maxRunsPerPhase に当たった。対象は `kubectl get task -A` で Ready=False のものを探す。理由は対象 Task の Ready 条件（reason は outcome と同じ）の message で分かる。"
        - alert: TaskFlowDefinitionBroken
          expr: |
            increase(taskflow_task_outcomes_total{severity="TaskFailed", outcome="Structural"}[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "taskflow: {{ $labels.flow }} の定義が壊れていて TaskFailed"
            description: "{{ $labels.flow }} の Task が定義の破損で TaskFailed に着いた（outcome Structural）。束縛の無いフェーズ・同じディレクトリを指す 2 ステータス・開始時に handler が無い・定義の写しが収まらない／消された等で、作業ではなく git の TaskFlow / TaskHandler を直す。flow が <unresolved> なら参照先の TaskFlow が存在しないか写しが消された。対象は `kubectl get task -A` で Ready=False のものを探し、Ready 条件の reason（FlowBroken / DefinitionsLost 等）と message を読む。"

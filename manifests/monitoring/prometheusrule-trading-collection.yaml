apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trading-collection
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: trading-collection
      rules:
        # 収集対象は後から取得できない（その時点のアナリスト予想、その日の上場一覧）。
        # 止まっている間の分は永久に失われるので、静かな失敗が一番痛い。
        #
        # 「Job が失敗した」ではなく「成功した実行が無い」で見るのは、
        # そもそも起動しなかった場合（スケジューラ異常・ノード逼迫・suspend）も拾うため。
        #
        # **閾値を CronJob 名で書き分けない。** 名前で絞ると、Stale に名前を足し忘れた
        # CronJob は「一度成功した後に静かに止まる」を誰にも見られないまま通る（#1039）。
        # 期待間隔は kube-state-metrics が cron 式から計算した次回予定との差で出す
        # （next_schedule_time = cron.Next(last_schedule_time)）ので、「平日のみ」も
        # 「月次」もここに既に入っている。
        #
        # **max_over_time は省けない。** この差は実行のたびに次の周期の値へ飛ぶ。1 日に
        # 複数回スケジュールされる CronJob では、次の 1 本までの間隔が前回からの間隔より
        # 短くなるので、瞬間値を閾値にすると健全な実行の直後に必ず一度発火する。
        # 窓は週跨ぎの間隔を含められる長さが要る。
        #
        # 猶予 6h はジョブ自体の実行時間と遅延の分。日次に当てると 30h になり、
        # 名前で書き分けていた頃の手当ての値と一致する。
        #
        # **右辺は窓の分だけ過去を引きずる。** suspend すると next_schedule_time は消えるが
        # （2026-09-21 実測）、窓に残った値で右辺は生き続けるので suspend 中も鳴り、窓を
        # 抜けてから黙る。cron 式を短い周期へ変えたときも、古い長い間隔が窓を抜けるまで
        # 閾値は緩いままになる。
        - alert: TradingCollectionStale
          expr: |
            (
              time() - max by (cronjob) (kube_cronjob_status_last_successful_time{namespace="trading"})
            )
            > on (cronjob)
            (
              max_over_time(
                (
                  max by (cronjob) (kube_cronjob_next_schedule_time{namespace="trading"})
                  - max by (cronjob) (kube_cronjob_status_last_schedule_time{namespace="trading"})
                )[7d:5m]
              ) + 6 * 3600
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "収集が期待間隔を超えて成功していない ({{ $labels.cronjob }})"
            description: "trading/{{ $labels.cronjob }} の最後の成功から {{ $value | humanizeDuration }} 経過。CronJob の cron 式から導いた実行間隔 + 6h を超えている。収集対象は遡れないため、その間のデータは失われる。"

        # **`== 0` では一度も発火しない。** kube-state-metrics は
        # `.status.lastSuccessfulTime` が未設定の間このメトリクスを値 0 としてではなく
        # シリーズごと出さないので、比較する相手が存在しない。左辺から成功記録のある
        # ものを引くと、スケジュールはされたが成功が無いものだけが残る。
        #
        # `absent()` もここでは使えない。あれはセレクタ全体が空かどうかしか見ないので、
        # 複数ある CronJob の 1 本だけ成功記録が無い状態を拾えない
        # （2026-09-21、陽性対照を作って実測）。
        #
        # 左辺に `kube_cronjob_info` は使わない。CronJob オブジェクトが作られた瞬間
        # から該当してしまい、`for: 2h` が日次・週次・月次いずれの実行間隔より短いため、
        # 新規追加した CronJob が初回実行のチャンスを迎える前に必ず発火する。
        # `kube_cronjob_status_last_schedule_time` は CronJob controller が最初の
        # Job を実際に作った時点で初めて出るので、「まだ一度もスケジュールされていない」
        # ものは自然に外れる（「スケジュール済みだが last_schedule_time が無い」状態は、
        # 現時点のクラスタにはその状態の CronJob が無く実測できていない。上記の
        # 「値0ではなくシリーズごと出さない」という、同じ kube-state-metrics で
        # 既に実測済みの挙動からの推論）。
        - alert: TradingCollectionNeverSucceeded
          expr: |
            kube_cronjob_status_last_schedule_time{namespace="trading"}
              unless on(cronjob) kube_cronjob_status_last_successful_time{namespace="trading"}
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "収集が一度も成功していない ({{ $labels.cronjob }})"
            description: "trading/{{ $labels.cronjob }} はスケジュールされたが成功実行の記録が無い。初回から失敗し続けている。"

        - alert: TradingCollectionJobFailing
          expr: |
            sum by (namespace) (kube_job_status_failed{namespace="trading"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "収集ジョブが失敗している (trading)"
            description: "失敗した Job が {{ $value }} 件。失敗の内訳は Loki の構造化ログ（collector フィールド）に出ている。"

        # suspend したまま忘れると、収集が静かに欠け続ける。
        - alert: TradingCollectionSuspended
          expr: |
            max by (cronjob) (kube_cronjob_spec_suspend{namespace="trading"}) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "収集が suspend されている ({{ $labels.cronjob }})"
            description: "trading/{{ $labels.cronjob }} が suspend 状態。意図的でなければ解除する。"

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rss-fetcher
  namespace: rss
spec:
  endpointSelector:
    matchLabels:
      core.spinkube.dev/app-name: rss-fetcher
  ingress:
    - fromEndpoints:
        - matchLabels:
            rss-cron: "true"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: rss-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---

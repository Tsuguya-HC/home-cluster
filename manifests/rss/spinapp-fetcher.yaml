apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: rss-fetcher
  namespace: rss
  annotations:
    # After the schema migration in wave 1. Starting the components
    # against an empty database is what left every request returning
    # `relation "feeds" does not exist`.
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: ghcr.io/tsuguya/home-rss-fetcher:v0.1.4@sha256:a57933dafaa7294c43cf6f0499d5276e2fb0d21e67a85a84111b657c3d7c2671
  replicas: 1
  executor: containerd-shim-spin
  imagePullSecrets:
    - name: ghcr-pull
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  variables:
    - name: db_url
      valueFrom:
        secretKeyRef:
          name: rss-pg-credentials
          key: uri
    # The component refuses to connect in the clear once this is set, so the
    # CA is what actually enforces TLS — not the URL, which CNPG generates
    # without an sslmode at all. Comes from the CNPG-managed CA secret so a
    # rotation does not need a rebuild.
    - name: db_ca_root
      valueFrom:
        secretKeyRef:
          name: rss-pg-ca
          key: ca.crt

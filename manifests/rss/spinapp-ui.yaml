apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: rss-ui
  namespace: rss
  annotations:
    # After the schema migration in wave 1. Starting the components
    # against an empty database is what left every request returning
    # `relation "feeds" does not exist`.
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: ghcr.io/tsuguya/home-rss-ui:v0.1.3@sha256:1ac83bca17b753f14a2105edb405240d29b078b474feb9a5f47086d9cd85ad3b
  replicas: 1
  executor: containerd-shim-spin
  imagePullSecrets:
    - name: ghcr-pull
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

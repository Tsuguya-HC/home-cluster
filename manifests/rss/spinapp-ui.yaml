apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: rss-ui
  namespace: rss
  annotations:
    # After the schema migration in wave 1. Starting the components
    # against an empty database is what left every request returning
    # `relation "feeds" does not exist`.
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: ghcr.io/tsuguya-hc/home-rss-ui:v0.1.5@sha256:243d13d77d3fa07738b892748e5f76821455ac3a7fcf45c082a3922709b11562
  replicas: 1
  executor: containerd-shim-spin
  imagePullSecrets:
    - name: ghcr-pull
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

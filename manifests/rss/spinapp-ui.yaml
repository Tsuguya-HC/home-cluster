apiVersion: core.spinkube.dev/v1alpha1
kind: SpinApp
metadata:
  name: rss-ui
  namespace: rss
  annotations:
    # After the schema migration in wave 1. Starting the components
    # against an empty database is what left every request returning
    # `relation "feeds" does not exist`.
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: ghcr.io/tsuguya-hc/home-rss-ui:v0.1.7@sha256:abd2fd93d45509ff4d3c0a981790614a783500a9e459742a4b55b512233c0992
  replicas: 1
  executor: containerd-shim-spin
  imagePullSecrets:
    - name: ghcr-pull
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seaweedfs-filer
  namespace: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/component: filer
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: single-binary
            io.kubernetes.pod.namespace: monitoring
        - matchLabels:
            app.kubernetes.io/name: tempo
            io.kubernetes.pod.namespace: monitoring
        - matchExpressions:
            - key: workflows.argoproj.io/workflow
              operator: Exists
          matchLabels:
            io.kubernetes.pod.namespace: argo
        - matchExpressions:
            - key: workflows.argoproj.io/workflow
              operator: Exists
          matchLabels:
            io.kubernetes.pod.namespace: talos-build
        - matchExpressions:
            - key: workflows.argoproj.io/workflow
              operator: Exists
          matchLabels:
            io.kubernetes.pod.namespace: image-build
        - matchExpressions:
            - key: workflows.argoproj.io/workflow
              operator: Exists
          matchLabels:
            io.kubernetes.pod.namespace: claude-code
        - matchLabels:
            app.kubernetes.io/name: argo-workflows-server
            io.kubernetes.pod.namespace: argo
        - matchLabels:
            app.kubernetes.io/name: nextcloud
            io.kubernetes.pod.namespace: nextcloud
        - matchLabels:
            app: harbor
            component: registry
            io.kubernetes.pod.namespace: harbor
        # 収集ジョブが生データを書き込む。namespace 全体ではなく collector だけを許す。
        - matchLabels:
            io.kubernetes.pod.namespace: trading
            trading: collector
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: master
        - matchLabels:
            batch.kubernetes.io/job-name: seaweedfs-bucket-hook
        - matchLabels:
            app.kubernetes.io/instance: oauth2-proxy-seaweedfs
            io.kubernetes.pod.namespace: oauth2-proxy
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
            - port: "18888"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9327"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: master
      toPorts:
        - ports:
            - port: "9333"
              protocol: TCP
            - port: "19333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: volume
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "18080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
            - port: "18888"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: shared-pg
            io.kubernetes.pod.namespace: database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

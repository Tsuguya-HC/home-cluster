apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-github-webhook
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agents-github-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The EventSource reads `credential`; the 1Password item is a plain Password item.
    - secretKey: credential
      remoteRef:
        key: agents-github-webhook
        property: password

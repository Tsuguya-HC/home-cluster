# aqua-checksum commits aqua-checksums.json onto Renovate branches through the
# Git Data API, which needs contents:write. Installed on every repository
# because any of them may grow an aqua.yaml; the workflow exits early where
# there is none. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aqua-checksum-github-app-private-key
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: aqua-checksum-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-aqua-checksum-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

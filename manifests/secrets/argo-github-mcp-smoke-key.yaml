# GitHub MCP gateway の境界を毎日確かめる smoke（#983）が使うクライアントキー。
#
# **読み取り専用ロールの鍵しか配らない。** smoke が確かめたいのは「ro の鍵が rw の
# ルートに届かないこと」で、rw の鍵を持たせるとその検査が成立しない。
#
# Secret のキー名がそのままクライアント ID になり、gateway のアクセスログに
# `github.client` として出る。
#
# 1Password の item は `github-mcp-client-keys`。property はフィールドのラベル。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-ro-client-keys
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-ro-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github-mcp-smoke
      remoteRef:
        key: github-mcp-client-keys
        property: github-mcp-smoke

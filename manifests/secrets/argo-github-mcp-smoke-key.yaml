# GitHub MCP gateway の境界を毎日確かめる smoke（#983）が使うクライアントキー。
#
# **配るのは ro と issues（起票ロール、#1081）の smoke 専用鍵だけ。rw の鍵は配らない。**
# rw は contents・pull requests を書ける鍵なので smoke の Pod には置かない。ro・issues の
# 鍵はそれぞれ自分のルート以外に届かないはずの鍵で、ロールの取り違えを検知する往復に使う。
# rw ロールについては、この往復（rw の鍵で他のルートに入れないこと）を確かめていない。
#
# Secret のキー名がそのままクライアント ID になり、gateway のアクセスログに
# `github.client` として出る。
#
# 1Password の item は `github-mcp-client-keys`。property はフィールドのラベル。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-ro-client-keys
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-ro-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github-mcp-smoke
      remoteRef:
        key: github-mcp-client-keys
        property: github-mcp-smoke
---
# 起票ロール（#1081）版。issues の鍵が ro/rw のルートに届かないことを確かめる
# ためだけに使う。smoke 専用の ID にする理由は、本物の起票 handler の ID を借りると
# gateway のアクセスログで区別が付かなくなり、smoke 側から鍵が漏れれば本番鍵の漏洩に
# なってしまうから。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-issues-client-keys
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-issues-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github-mcp-smoke-issues
      remoteRef:
        key: github-mcp-client-keys
        property: github-mcp-smoke-issues

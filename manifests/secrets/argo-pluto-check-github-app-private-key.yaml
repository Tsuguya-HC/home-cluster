# pluto-check opens a pull request against home-cluster when it finds a
# deprecated API, so it needs contents:write for the branch and commit and
# pull_requests:write for the pull request -- on that one repository. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pluto-check-github-app-private-key
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pluto-check-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-pluto-check-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

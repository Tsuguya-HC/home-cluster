# Renovate runs as an App of its own rather than sharing tgy-cluster-bot, so
# that the token it needs -- workflows:write across every repository, to keep
# action SHA pins current -- stops riding along with the agent handlers. See
# #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app-private-key
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-renovate-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

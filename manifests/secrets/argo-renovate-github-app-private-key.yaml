# Keeping action SHA pins current means rewriting .github/workflows, so Renovate
# is the one consumer that needs workflows:write, and needs it on every
# repository. Its own App is what keeps that permission out of every other
# token. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app-private-key
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-renovate-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

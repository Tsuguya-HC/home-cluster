apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-secrets
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: talos-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The `talosctl gen secrets` bundle, kept as a 1Password Document (home-infra
    # renders machine configs from it; nothing secret lives in that repo).
    - secretKey: secrets.yaml
      remoteRef:
        key: talos-secrets-bundle
        property: secrets.yaml

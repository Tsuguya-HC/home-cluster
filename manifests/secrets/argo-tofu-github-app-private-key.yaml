# The tofu gates plan and merge pull requests in the three OpenTofu
# repositories, and do nothing else. Their own App is granted contents:read,
# pull_requests:write and statuses:write on exactly those three, so the key
# mounted beside a `tofu apply` cannot reach anything further. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-github-app-private-key
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tofu-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-tofu-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

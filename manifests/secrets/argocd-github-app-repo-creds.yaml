# ArgoCD reads every repository it syncs through an App of its own, granted
# nothing but contents:read. It is also the one consumer that never mints a
# token per run -- it holds the key and refreshes on its own schedule -- so
# narrowing what a token carries cannot reach it, and giving it its own App is
# the only way to bound it. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-app-repo-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        url: "https://github.com/Tsuguya-HC"
        type: "git"
        githubAppID: "5008293"
        githubAppInstallationID: "163178709"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - secretKey: privateKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-argocd-github-app-private-key
        property: private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

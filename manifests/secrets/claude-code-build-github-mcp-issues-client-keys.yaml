# GitHub MCP gateway の /issues ルートを呼ぶ側のクライアントキー（#1081 の起票フェーズ）。
# **GitHub の資格情報ではない** — gateway が installation token に付け替える。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-issues-client-keys
  namespace: claude-code-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-issues-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: taskflow-file-issues
      remoteRef:
        key: github-mcp-client-keys
        property: taskflow-file-issues

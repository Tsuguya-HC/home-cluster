apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code-build-harbor-agents-pull
  namespace: claude-code-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harbor-agents-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"registry.infra.tgy.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    # robot$agents+pull: read-only on the private agents project.
    - secretKey: username
      remoteRef:
        key: harbor-robot-agents-pull
        property: username
    - secretKey: password
      remoteRef:
        key: harbor-robot-agents-pull
        property: password

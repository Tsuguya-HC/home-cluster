# implement flow の観点出し（#1081）が Jev（OpenRouter の decisions API）を呼ぶ鍵。
# decisions API は LLM のスキーマではなく llm-gateway の AIGatewayRoute に載らないので、
# gateway を通さず観点出しの Pod が直接持つ。観点出しはスクリプトだけでエージェントを
# 動かさない — エージェントを足すなら、先に鍵を gateway 側へ移すこと。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code-build-jev-openrouter
  namespace: claude-code-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jev-openrouter
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: apiKey
      remoteRef:
        key: openrouter-coding-agent
        property: 認証情報

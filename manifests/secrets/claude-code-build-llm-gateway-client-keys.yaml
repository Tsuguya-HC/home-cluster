# gateway のクライアントキー（issue #942）。**LLM の資格情報ではない。**
#
# 実キー（Max の OAuth トークン / OpenRouter の API キー）は gateway だけが持ち、
# ここにあるのは「どの handler が gateway のどの階層を呼んでよいか」を示す鍵。
# SecurityPolicy の apiKeyAuth が `Authorization` から読んで照合する。
#
# 性質が違うので置き場の要件も違う:
#   - 実キー: 漏れたらアカウントごと。クラスタの外からでも使える
#   - この鍵: 漏れても llm-gateway に届く Pod からしか使えない（CNP の内側）。
#     provider のアカウントに触らず handler 単位で revoke できる
#
# **Secret のキー名がそのままクライアント ID** で、gateway のアクセスログに
# `llm.client` として出る。自称の `x-tf-handler` と並べてあるので、食い違えば偽装の兆候。
#
# 1Password の item は `llm-gateway-client-keys`。property はフィールドの**ラベル**。
# 将来クラスタ内で自動ローテーションする構想（Refs: home-cluster の #942 フォローアップ）。
# `taskflow-implement` は従量課金（implement）ルート、`taskflow-investigate` は Max の investigate ルート。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code-build-llm-gateway-client-keys
  namespace: claude-code-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: llm-gateway-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: taskflow-implement
      remoteRef:
        key: llm-gateway-client-keys
        property: taskflow-implement
    - secretKey: taskflow-investigate
      remoteRef:
        key: llm-gateway-client-keys
        property: taskflow-investigate

# OpenRouter の API キー。実行系 handler を Claude の週次枠から外すための供給元で、
# 1Password 側は API_CREDENTIAL なので取り出せるキーは credential 1 本。
# claude-code-token とは別の item にしてある（失効の粒度を分けるため。片方を revoke しても
# 対話セッションとクラスタが巻き添えにならない）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-token
  namespace: claude-code-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openrouter-token
    creationPolicy: Owner
    deletionPolicy: Retain
  # dataFrom.extract は item の全フィールドをキーにするので使えない。この item は
  # API_CREDENTIAL カテゴリで、1Password UI の言語に従ってラベルが日本語（ユーザ名 /
  # 認証情報 / 有効期限 ...）になっており、K8s の Secret キー規則 ([-._a-zA-Z0-9]+) に落ちる。
  #
  # property はフィールドの **ラベル** で照合される（id ではない。`op item get` が出す
  # id=credential を書くと "expected one 1Password ItemField matching: 'credential', got 0"）。
  # ラベルが UI の言語に依存するので、item を作り直すならラベル自体を英字にする方が堅い。
  data:
    - secretKey: credential
      remoteRef:
        key: openrouter-coding-agent
        property: 認証情報

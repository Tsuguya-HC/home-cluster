# gateway のクライアントキー（issue #942）。**LLM の資格情報ではない。**
#
# 実キー（Max の OAuth トークン / OpenRouter の API キー）は gateway だけが持ち、
# ここにあるのは「どの handler が gateway のどの階層を呼んでよいか」を示す鍵。
# SecurityPolicy の apiKeyAuth が `Authorization` から読んで照合する。
#
# 性質が違うので置き場の要件も違う:
#   - 実キー: 漏れたらアカウントごと。クラスタの外からでも使える
#   - この鍵: 漏れても llm-gateway に届く Pod からしか使えない（CNP の内側）。
#     provider のアカウントに触らず handler 単位で revoke できる
#
# **Secret のキー名がそのままクライアント ID** で、gateway のアクセスログに
# `llm.client` として出る。自称の `x-tf-handler` と並べてあるので、食い違えば偽装の兆候。
#
# 1Password の item は `llm-gateway-client-keys`。property はフィールドの**ラベル**。
# 将来クラスタ内で自動ローテーションする構想（Refs: home-cluster の #942 フォローアップ）。
# この namespace の handler ぶん。`llm-gateway-smoke` は alias を入力で変えられるが、
# 認証は Gateway 単位で 1 本なので鍵も 1 本でよい（階層の分離はルートのマッチ側）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-code-llm-gateway-client-keys
  namespace: claude-code
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: llm-gateway-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: adjudicator
      remoteRef:
        key: llm-gateway-client-keys
        property: adjudicator
    - secretKey: alert-investigate
      remoteRef:
        key: llm-gateway-client-keys
        property: alert-investigate
    - secretKey: claude-code-agent
      remoteRef:
        key: llm-gateway-client-keys
        property: claude-code-agent
    - secretKey: claude-code-generic
      remoteRef:
        key: llm-gateway-client-keys
        property: claude-code-generic
    - secretKey: implement
      remoteRef:
        key: llm-gateway-client-keys
        property: implement
    - secretKey: implement-verify
      remoteRef:
        key: llm-gateway-client-keys
        property: implement-verify
    - secretKey: pr-review
      remoteRef:
        key: llm-gateway-client-keys
        property: pr-review
    - secretKey: task-executor
      remoteRef:
        key: llm-gateway-client-keys
        property: task-executor
    - secretKey: task-executor-write
      remoteRef:
        key: llm-gateway-client-keys
        property: task-executor-write
    - secretKey: wf-creator
      remoteRef:
        key: llm-gateway-client-keys
        property: wf-creator
    - secretKey: wf-improver
      remoteRef:
        key: llm-gateway-client-keys
        property: wf-improver
    - secretKey: llm-gateway-smoke
      remoteRef:
        key: llm-gateway-client-keys
        property: llm-gateway-smoke
    # 階層分離の否定側チェック用（従量課金だけ許可されている）。smoke が使う。
    - secretKey: tier-probe
      remoteRef:
        key: llm-gateway-client-keys
        property: tier-probe

# The implementing handlers branch, commit, open a pull request and wait on its
# checks, reading the issue they were pointed at. Which repository they work in
# comes from a parameter, so the installation cannot be the bound -- that is what
# scoping the token at mint time is for. What it does drop is workflows:write and
# packages:write, neither of which any of them ever used. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tf-coder-github-app-private-key
  namespace: claude-code
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tf-coder-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-tf-coder-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

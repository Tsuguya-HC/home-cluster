# The review handlers read a pull request and write nothing back, so their App
# is granted contents:read and issues:read and no more. They are the handlers
# that take in content nobody here wrote -- an upstream changelog arriving in a
# Renovate pull request, an issue opened on a public repository -- so a key that
# cannot write is worth more here than anywhere else. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tf-reviewer-github-app-private-key
  namespace: claude-code
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tf-reviewer-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-tf-reviewer-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

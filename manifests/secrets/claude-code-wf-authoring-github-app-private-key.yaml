# wf-creator and wf-improver write workflow definitions into home-cluster, which
# is the repository that decides what the cluster runs. Their App is installed
# there and nowhere else, rather than sharing the coder's reach across every
# repository. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wf-authoring-github-app-private-key
  namespace: claude-code
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wf-authoring-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-wf-authoring-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

# Agent Router の MCP セッション暗号鍵の seed。チャートに作らせると render のたびに
# 値が変わる（lookup が効かない）ので、クラスタ内で一度だけ生成して existingSecret で渡す。
# seed を知っていれば MCP セッション ID を復号・偽造できる。
#
# CreatedOnce: 再 sync・ESO の再起動では再生成しない。再生成されるのは Secret が消えるか
# 書き換えられたとき、この ExternalSecret が作り直されたときで、既存の MCP セッションは全部切れる。
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-session-encryption-seed
  namespace: envoy-ai-gateway-system
spec:
  length: 64
  symbols: 0
  noUpper: false
  # 数字の既定は長さの 25%（16 文字）で数字の種類（10）を超えるので、重複を許さないと生成に失敗する。
  allowRepeat: true
  secretKeys:
    - seed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-session-encryption
  namespace: envoy-ai-gateway-system
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ai-gateway-mcp-session-encryption
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-session-encryption-seed

# write ロールの App 鍵（tgy-hc-tf-coder、contents:write + PR:write + checks:read + issues:read）。
# claude-code namespace にも同じ item から配られているが、#983 のプロキシ層が
# 入った後は handler 側が要らなくなる見込み。移行が済むまで両方に存在する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tf-coder-github-app-private-key
  namespace: github-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tf-coder-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-tf-coder-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

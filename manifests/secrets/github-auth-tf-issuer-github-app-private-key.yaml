# 起票ロールの App 鍵（tgy-hc-tf-issuer、issues:write のみ）。implement flow の起票フェーズ
# （#1081）が MCP の /issues ルートで使うトークンを rotator がここから mint する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tf-issuer-github-app-private-key
  namespace: github-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tf-issuer-github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-tf-issuer-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-tofu-credentials
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harbor-tofu-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Harbor's /system and /configurations endpoints are admin-only, so the
    # tofu workflow authenticates as admin rather than as a robot.
    - secretKey: admin_password
      remoteRef:
        key: harbor-admin-credentials
        property: HARBOR_ADMIN_PASSWORD
    # The robot secrets are write-only inputs: OpenTofu pushes them into Harbor
    # so the value here stays authoritative, and never reads them back.
    - secretKey: robot_tools_secret
      remoteRef:
        key: harbor-robot-images
        property: credential
    - secretKey: robot_renovate_secret
      remoteRef:
        key: harbor-robot-renovate
        property: password
    - secretKey: robot_trading_pull_secret
      remoteRef:
        key: harbor-robot-trading-pull
        property: password

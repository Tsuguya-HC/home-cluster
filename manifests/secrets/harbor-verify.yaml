apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-verify
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harbor-verify
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"registry.infra.tgy.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    # robot$verify: read-only on every private project. Kyverno can be
    # given one credential per registry host in practice, so it gets the one that reads
    # them all; the kubelet keeps per-project pull robots.
    - secretKey: username
      remoteRef:
        key: harbor-robot-verify
        property: username
    - secretKey: password
      remoteRef:
        key: harbor-robot-verify
        property: password

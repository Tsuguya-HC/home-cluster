apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-verify
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harbor-verify
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Replace
      data:
        .dockerconfigjson: |
          {"auths":{"registry.infra.tgy.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    # Kyverno takes one credential per registry host, so this one must read every
    # private project referenced by tag.
    - secretKey: username
      remoteRef:
        key: harbor-robot-verify
        property: username
    - secretKey: password
      remoteRef:
        key: harbor-robot-verify
        property: password

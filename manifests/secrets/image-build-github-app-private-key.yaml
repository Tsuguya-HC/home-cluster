# image-build only clones. Its own App is granted contents:read on the
# repositories images are built from, so the key sitting beside a build that
# runs a repository's own Dockerfile cannot write anywhere. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-private-key
  namespace: image-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-image-build-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

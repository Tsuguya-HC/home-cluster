# Max の OAuth トークン。gateway だけが持ち、呼び出し側の Pod には渡らない（issue #942）。
# BackendSecurityPolicy が参照するキー名は `apiKey` 固定なので、Secret のキーもそれに合わせる。
#
# **1Password の `claude-code-token` item を引く ExternalSecret はこれ 1 本だけ**（2026-09-18）。
# claude-code の `claude-code-token` と argo の `argo-claude-code-token` は、どちらも消費者が
# gateway 経由へ移って不要になったので削除した。Max のトークンを持つのは gateway だけ、が不変条件。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-claude-max-apikey
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-max-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
  # property はフィールドの**ラベル**で照合される（キー名でも item 名でもない）。
  # この item でトークンが入っているフィールドのラベルが `credential`。
  # 外すと ESO が ExternalSecret の status にエラーを出す（静かには壊れない）。
  data:
    - secretKey: apiKey
      remoteRef:
        key: claude-code-token
        property: credential

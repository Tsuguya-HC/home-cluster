# Max の OAuth トークン。gateway だけが持ち、handler 側の Pod には渡らない（issue #942）。
# BackendSecurityPolicy が参照するキー名は `apiKey` 固定なので、claude-code namespace の
# claude-code-token（dataFrom.extract で `credential` になる）とは別名で取り直す。
#
# 同じ 1Password item を claude-code の ExternalSecret も引いている。切り替えが済むまでは
# 両方が要る。対象は claude-code namespace の 12 本。`manifests/argo/pluto-check.yaml` も
# `key: credential` で引いているが、あれは argo namespace の CronWorkflow で参照先も別 Secret
# （argo-claude-code-token）なので、この移行の対象外。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-claude-max-apikey
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-max-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
  # property はフィールドの**ラベル**で照合される。claude-code-token.yaml の
  # dataFrom.extract が `credential` というキーの Secret を作っている（WFT が
  # `key: credential` で引いている）ので、このラベルは `credential`。
  # 外すと ESO が ExternalSecret の status にエラーを出す（静かには壊れない）。
  data:
    - secretKey: apiKey
      remoteRef:
        key: claude-code-token
        property: credential

# Max の OAuth トークン。gateway だけが持ち、handler 側の Pod には渡らない（issue #942）。
# BackendSecurityPolicy が参照するキー名は `apiKey` 固定なので、claude-code namespace の
# claude-code-token（dataFrom.extract で `credential` になる）とは別名で取り直す。
#
# claude-code namespace 側の ExternalSecret は 2026-09-18 に削除した（handler が全て gateway
# 経由になり、消費者がゼロになったため）。同じ 1Password item を引くのは、ここと argo の
# `argo-claude-code-token` の 2 本だけ。後者は `manifests/argo/pluto-check.yaml` が
# `key: credential` で使っており、あれはまだ Anthropic に直行している（未切り替え）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-claude-max-apikey
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-max-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
  # property はフィールドの**ラベル**で照合される。同じ 1Password item を引く
  # argo-claude-code-token.yaml の dataFrom.extract が `credential` というキーの
  # Secret を作っている（pluto-check が `key: credential` で引いている）ので、
  # このラベルは `credential`。
  # 外すと ESO が ExternalSecret の status にエラーを出す（静かには壊れない）。
  data:
    - secretKey: apiKey
      remoteRef:
        key: claude-code-token
        property: credential

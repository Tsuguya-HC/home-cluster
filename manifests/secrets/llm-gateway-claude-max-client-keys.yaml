# SecurityPolicy の apiKeyAuth が照合するクライアントキー（issue #942）。
# **Secret のキー名がそのままクライアント ID** で、認証を通ると
# `forwardClientIDHeader` でヘッダに移り、アクセスログの `llm.client` に出る。
#
# 配る側（handler の namespace）は manifests/secrets/*-llm-gateway-client-keys.yaml。
# 同じ 1Password item から、こちらは gateway が照合する全クライアントぶんを引く。
#
# **鍵の値が重複すると SecurityPolicy 全体が翻訳エラー（500 直返し）になる。**
# クライアント ID の重複は先勝ちで黙って無視されるという非対称があるので、
# ローテーションで鍵を足すときは必ず別の値を生成すること。
# Max の階層（claude-max ルート = review / investigate）を呼べるクライアント。
# ここに無い鍵で review を名乗っても 401 になる。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-claude-max-client-keys
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: claude-max-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: adjudicator
      remoteRef:
        key: llm-gateway-client-keys
        property: adjudicator
    - secretKey: alert-investigate
      remoteRef:
        key: llm-gateway-client-keys
        property: alert-investigate
    - secretKey: claude-code-agent
      remoteRef:
        key: llm-gateway-client-keys
        property: claude-code-agent
    - secretKey: claude-code-generic
      remoteRef:
        key: llm-gateway-client-keys
        property: claude-code-generic
    - secretKey: cnp-planner
      remoteRef:
        key: llm-gateway-client-keys
        property: cnp-planner
    - secretKey: cnp-reporter
      remoteRef:
        key: llm-gateway-client-keys
        property: cnp-reporter
    - secretKey: implement
      remoteRef:
        key: llm-gateway-client-keys
        property: implement
    - secretKey: implement-verify
      remoteRef:
        key: llm-gateway-client-keys
        property: implement-verify
    - secretKey: pluto-check
      remoteRef:
        key: llm-gateway-client-keys
        property: pluto-check
    - secretKey: pr-review
      remoteRef:
        key: llm-gateway-client-keys
        property: pr-review
    - secretKey: task-executor
      remoteRef:
        key: llm-gateway-client-keys
        property: task-executor
    - secretKey: task-executor-write
      remoteRef:
        key: llm-gateway-client-keys
        property: task-executor-write
    - secretKey: wf-creator
      remoteRef:
        key: llm-gateway-client-keys
        property: wf-creator
    - secretKey: wf-improver
      remoteRef:
        key: llm-gateway-client-keys
        property: wf-improver
    - secretKey: llm-gateway-smoke
      remoteRef:
        key: llm-gateway-client-keys
        property: llm-gateway-smoke-max

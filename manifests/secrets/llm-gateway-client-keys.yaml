# SecurityPolicy の apiKeyAuth が照合するクライアントキー（issue #942）。
# **Secret のキー名がそのままクライアント ID** で、認証を通ると forwardClientIDHeader が
# `x-llm-client` としてリクエストヘッダに載せ、アクセスログの `llm.client` に出る。
#
# **階層（Max / 従量課金）でここを分けない。** 分けてルートごとにポリシーを掛ける形は
# 成立しなかった（#971 → #978）。認証はルートが決まる前に走るので、ルートに付けた
# ポリシーは評価されない。今は Gateway 単位に 1 本掛けて全リクエストを認証し、
# **階層の分離は AIGatewayRoute のルールが `x-llm-client` をマッチすることで行う**。
# そちらは extproc の ClearRouteCache 後のルート再計算で評価されるので、
# 認証の結果を見られる。
#
# 配る側（handler の namespace）は manifests/secrets/*-llm-gateway-client-keys.yaml。
# **鍵の値が重複すると SecurityPolicy 全体が翻訳エラー（500 直返し）になる。**
# クライアント ID の重複は先勝ちで黙って無視されるという非対称があるので、
# ローテーションで鍵を足すときは必ず別の値を生成すること。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-client-keys
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: llm-gateway-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: adjudicator
      remoteRef:
        key: llm-gateway-client-keys
        property: adjudicator
    - secretKey: alert-investigate
      remoteRef:
        key: llm-gateway-client-keys
        property: alert-investigate
    - secretKey: claude-code-agent
      remoteRef:
        key: llm-gateway-client-keys
        property: claude-code-agent
    - secretKey: claude-code-generic
      remoteRef:
        key: llm-gateway-client-keys
        property: claude-code-generic
    - secretKey: implement
      remoteRef:
        key: llm-gateway-client-keys
        property: implement
    - secretKey: implement-verify
      remoteRef:
        key: llm-gateway-client-keys
        property: implement-verify
    - secretKey: pluto-check
      remoteRef:
        key: llm-gateway-client-keys
        property: pluto-check
    - secretKey: pr-review
      remoteRef:
        key: llm-gateway-client-keys
        property: pr-review
    - secretKey: task-executor
      remoteRef:
        key: llm-gateway-client-keys
        property: task-executor
    - secretKey: task-executor-write
      remoteRef:
        key: llm-gateway-client-keys
        property: task-executor-write
    - secretKey: wf-creator
      remoteRef:
        key: llm-gateway-client-keys
        property: wf-creator
    - secretKey: wf-improver
      remoteRef:
        key: llm-gateway-client-keys
        property: wf-improver
    - secretKey: llm-gateway-smoke
      remoteRef:
        key: llm-gateway-client-keys
        property: llm-gateway-smoke
    - secretKey: taskflow-implement
      remoteRef:
        key: llm-gateway-client-keys
        property: taskflow-implement
    # implement flow の調査フェーズ（#939）。Max の investigate ルートだけ。
    - secretKey: taskflow-investigate
      remoteRef:
        key: llm-gateway-client-keys
        property: taskflow-investigate
    # implement flow のレビュー（#1081）。観点ごとの枝と仕分けが共有する。Max の review ルートだけ。
    - secretKey: taskflow-review
      remoteRef:
        key: llm-gateway-client-keys
        property: taskflow-review
    # 階層分離の否定側チェック用。**認証は通るが Max ルートには入れない**
    # （openrouter.yaml のクライアント条件にだけ入れてある）。
    # taskflow-llm-gateway-smoke がこの鍵で review を要求し、404 を確かめる。
    - secretKey: tier-probe
      remoteRef:
        key: llm-gateway-client-keys
        property: tier-probe
    # 手元の claude CLI（port-forward 経由）用。使えるのはモデル名のルート
    # （anthropic.yaml の claude-*、openrouter.yaml の openrouter-models）だけ。
    - secretKey: local-dev
      remoteRef:
        key: llm-gateway-client-keys
        property: local-dev

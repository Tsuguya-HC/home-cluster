# GitHub MCP gateway（#983）を呼ぶ側のクライアントキー。**Secret のキー名がそのまま
# クライアント ID** で、認証を通ると forwardClientIDHeader が `x-github-client-id` として
# 載せる。llm-gateway-client-keys と同じ仕組みだが、**別の Secret・別の Gateway** にして
# あるのが要点で、LLM の鍵で GitHub は開かないし逆も開かない。
#
# **ロール別に Secret 自体を分けている。** apiKeyAuth は credentialRefs で参照した
# Secret の**全キー**を有効な資格情報として扱い、キー単位で絞るフィールドは無い。
# 1 つの Secret に ro/rw 両方の鍵を入れると、ro 用 SecurityPolicy が rw の鍵も
# 有効として通してしまいロール分離が消える。1Password 側の item 名
# （github-mcp-client-keys）と property 名（pr-review / implement）はそのまま
# 流用し、**K8s の Secret だけをロールごとに分ける**。
# 両ロールが要る client が今後出た場合も、Secret を統合せずその client の鍵を
# 両方の Secret に別の値で入れる。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-ro-client-keys
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-ro-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: pr-review
      remoteRef:
        key: github-mcp-client-keys
        property: pr-review
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-rw-client-keys
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-rw-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: implement
      remoteRef:
        key: github-mcp-client-keys
        property: implement
---
# backstop 専用。**この Secret を参照するのは Gateway 単位の SecurityPolicy だけ**で、
# ロール別のポリシーとは別 Secret にしてある。同じ Secret に入れると、backstop を
# 引くつもりの無いポリシーにも鍵が増えていく。
#
# **`unissued-backstop` は誰にも配らない鍵。** Gateway 単位の SecurityPolicy に
# これだけを持たせてある。ロール別の SecurityPolicy はルート側に付いていて、
# Envoy は「ルート側に既にあればそちら優先」
# （securitypolicy.go の `if r.Security != nil { continue }`）で動くので、この鍵が
# 使われる経路は普段は存在しない。**ルート側のポリシーが付き損ねたときだけ**
# 配下に配られ、誰も持っていない鍵なので全部 401 になる ―― 沈黙ではなく 401 で
# 壊れるようにするための仕掛け。値そのものは本物の鍵なので、漏れれば
# 「ポリシーが外れているときに通れる」意味を持つ。ローテーション対象に含めること。
#
# **backstop はロール別 Secret の取り違え（ro/rw に同じ Secret を指定する等）を
# 検知できない。** ポリシーは両ルートに正しく「付いている」ので発火せず、
# 捕まえるのは「付き損ね」だけ。
#
# 鍵の値が重複すると SecurityPolicy 全体が翻訳エラー（500 直返し）になる。
# クライアント ID の重複は先勝ちで黙って無視されるという非対称があるので、
# 鍵を足すときは必ず別の値を生成すること。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-mcp-backstop-key
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-mcp-backstop-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: unissued-backstop
      remoteRef:
        key: github-mcp-client-keys
        property: unissued-backstop

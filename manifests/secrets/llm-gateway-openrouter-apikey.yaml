# Agent Router が OpenRouter へ出すときの鍵（issue #942）。gateway だけが持ち、
# handler 側の Pod には渡らない。BackendSecurityPolicy が参照するキー名は `apiKey` 固定。
# 同じ 1Password item を claude-code / claude-code-build の 2 本の ExternalSecret も
# 引いている。落とし切る対象は claude-code-build 側（openrouter-broker サイドカー）で、
# 切り替えが済むまでは両方が必要。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-openrouter-apikey
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openrouter-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: apiKey
      remoteRef:
        key: openrouter-coding-agent
        property: 認証情報

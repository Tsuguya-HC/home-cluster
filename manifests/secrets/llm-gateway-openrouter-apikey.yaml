# Agent Router が OpenRouter へ出すときの鍵（issue #942）。gateway だけが持ち、
# handler 側の Pod には渡らない。BackendSecurityPolicy が参照するキー名は `apiKey` 固定。
# claude-code-build 側の ExternalSecret（openrouter-broker サイドカー用）は 2026-09-18 に
# 削除した。同じ 1Password item を引いて残っているのは claude-code の `openrouter-token` で、
# `taskflow-openrouter-smoke`（gateway を通さない直行経路の smoke）だけが使っている。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-openrouter-apikey
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openrouter-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: apiKey
      remoteRef:
        key: openrouter-coding-agent
        property: 認証情報

# OpenRouter の API キー。実行系 handler を Claude の週次枠から外すための供給元で、
# 1Password 側は API_CREDENTIAL なので取り出せるキーは credential 1 本。
# claude-code-token とは別の item にしてある（失効の粒度を分けるため。片方を revoke しても
# 対話セッションとクラスタが巻き添えにならない）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-token
  namespace: claude-code
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openrouter-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: openrouter-coding-agent
        metadataPolicy: None
        nullBytePolicy: Ignore

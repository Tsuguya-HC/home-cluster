# talos-build edits releases on talos-custom-build and touches nothing else.
# contents:write is what a release needs; the installation covers that one
# repository. See #925.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-private-key
  namespace: talos-build
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-app-private-key
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: tgy-hc-talos-build-github-app-private-key
        metadataPolicy: None
        nullBytePolicy: Ignore

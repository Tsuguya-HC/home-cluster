# LLM 比較アーム（ADR-0019）の資料一式を組む既存の Pod 用。アームの Pod には渡さない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trading-arm-materials-credentials
  namespace: trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: trading-arm-materials-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key
      remoteRef:
        key: trading-arm-materials-credentials
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: trading-arm-materials-credentials
        property: secret-key

# LLM 比較アーム（ADR-0019）の writer コンテナだけが読む。claude を走らせるコンテナには渡さない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trading-arm-records-credentials
  namespace: trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: trading-arm-records-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key
      remoteRef:
        key: trading-arm-records-credentials
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: trading-arm-records-credentials
        property: secret-key

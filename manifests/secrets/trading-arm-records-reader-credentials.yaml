# LLM 比較アーム（ADR-0019）の評価器（arm-evaluate）だけが読む。identity は Read:trading-arm-records のみ。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trading-arm-records-reader-credentials
  namespace: trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: trading-arm-records-reader-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key
      remoteRef:
        key: trading-arm-records-reader-credentials
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: trading-arm-records-reader-credentials
        property: secret-key

# gateway のクライアントキー（issue #942）。**LLM の資格情報ではない。**
#
# 実キー（Max の OAuth トークン）は gateway だけが持ち、ここにあるのは
# 「どのクライアントが gateway のどのルートを呼んでよいか」を示す鍵。
# **Secret のキー名がそのままクライアント ID** で、gateway のアクセスログに `llm.client` として出る。
#
# 1Password の item は `llm-gateway-client-keys`。property はフィールドの**ラベル**。
# LLM 比較アーム（ADR-0019）の relay コンテナだけが読む。claude を走らせるコンテナには渡さない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trading-llm-gateway-client-keys
  namespace: trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: llm-gateway-client-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: trading-arm
      remoteRef:
        key: llm-gateway-client-keys
        property: trading-arm

apiVersion: v1
kind: ConfigMap
metadata:
  name: talos-build-scripts
  namespace: talos-build
data:
  plan-build.sh: |
    #!/bin/sh
    # 前回成功した run と入力が同じなら焼かない。
    #
    # このワークフローは ArgoCD が talos-build アプリを同期するたびに走る。同期は
    # manifests/talos-build/ が変われば起きるので、argo-tools の digest bump のように
    # イメージの中身と何の関係も無い変更でも、16 分×2 のビルドが丸ごと走り直して
    # installer:<version> が同じタグに上書きされていた。上書きするとイメージの created が
    # 動き、home-infra の cluster.yaml の talosVersion を追う Renovate は minimumReleaseAge をそこから
    # 測るので、無関係な変更が 3 日より短い間隔で入る限り Talos の更新 PR が出てこない。
    #
    # 判定材料は「前回成功した run 自身」から取る。Argo は run ごとに参照先 WorkflowTemplate
    # の全テンプレートを status.storedWorkflowTemplateSpec に凍結して持っており、そこに
    # imager へ渡す引数——拡張の digest とカーネル引数——がそのまま残っている。だから
    # レジストリに目印を足す必要も、指紋を持ち回る必要もない。
    #
    # **`status.storedTemplates` ではない。** そちらはコントローラが解決したテンプレートを
    # 順に足していく器で、このステップが走る時点（2 番目）では build 系がまだ入っていない。
    # 完了した run を見ると全部入っているので揃っているように見えるが、それは完了後の姿。
    # 2026-09-07 に実際に storedTemplates で書いて本番に出し、今回の run の imager 入力を
    # 取り出せず build 側へ倒れて 1 回余分に焼いた。storedWorkflowTemplateSpec は
    # setStoredWfSpec が run の最初に一度だけ書くので、どのステップから見ても揃っている。
    #
    # 判定に要るものが 1 つでも取れなければ焼く。初回・Argo が古い run を GC した後・
    # apiserver 不通は全部そちらに倒れる。逆に倒すと「焼くべきものを焼かないまま緑」になる。
    #
    # 見ないもの（判定材料——版・imager 引数——が変わらないので、前回成功 run と一致して
    # skip される）:
    #   * 署名鍵のローテーション —— 前回 run の spec は同じままなので差が出ない。しかも
    #     ローテーションは manifests/secrets/（app: secrets）の変更で、このワークフローを
    #     叩く talos-build app とは別 app（reconcile が隔離）のため、自動では sync も
    #     再判定も起きない
    #   * 同じ版のまま CI が installer-base / imager を焼き直した場合
    set -euo pipefail

    build() {
      echo "=> build: $1" >&2
      printf 'true' > /tmp/build.txt
      exit 0
    }

    [ -n "${VERSION:-}" ] || build "VERSION が空"
    [ -n "${WORKFLOW_NAME:-}" ] || build "WORKFLOW_NAME が空"

    # imager を使う initContainer だけを名前順に取る。同じファイルに載っている
    # argo-tools や alpine の digest は入らない——そこが「無関係な変更で焼き直さない」の要。
    SEL='[.status.storedWorkflowTemplateSpec.templates[]? | .initContainers[]?
          | select(.image | test("ghcr\\.io/tsuguya-hc/imager")) | {name, image, args}]
         | sort_by(.name)'

    # `--request-timeout` は付けない。**このフラグは kubectl の in-cluster 設定の解決を
    # 壊す** —— 付けると kubeconfig も SA トークンも env も揃っているのに localhost:8080 へ
    # フォールバックして必ず失敗する（2026-09-07 に実 Argo Pod で A/B 確認。フラグ以外は
    # 同一の呼び出しで、無ければ workflow を一覧でき、有れば connection refused）。
    # このスクリプトはそれで毎回 build 側へ倒れ、仕掛けが本番で 2 回空振りした。
    #
    # クライアント側のタイムアウトはそもそも要らない。このテンプレートには
    # activeDeadlineSeconds が付いていて、`maxDuration` を設定していないので 1 試行ごとに
    # 効く。kubectl が何をしようと Pod が切られるので、mutex を握り続ける窓は retry 込みで
    # 数分に収まる。**同じ懸念に二重に手当てして、片方が機構を殺していた。**
    ALL=$(kubectl -n talos-build get workflow -o json) \
      || build "Workflow を一覧できなかった"

    # 前回成功した run。version はその run の resolve-version が出力した値。
    #
    # **「直近の成功 run」ではなく「材料が揃っている直近の成功 run」を選ぶ。** 同じ
    # WorkflowTemplate を entrypoint 指定で部分実行すると（診断で実際にやった）、
    # resolve-version を通らないので版を持たない Succeeded な run がラベル付きで残る。
    # 単に最新を取ると、その 1 件が居るだけで比較が成立しなくなり、GC されるまで
    # 焼き続ける。materials が揃っているものだけに絞ってから最新を取る。
    LAST=$(printf '%s' "$ALL" | jq -c "
      [ .items[]
        | select(.status.phase == \"Succeeded\")
        | select(.metadata.labels[\"workflows.argoproj.io/workflow-template\"] == \"talos-secureboot-build\")
        | select(.metadata.name != \"${WORKFLOW_NAME}\")
        | { finishedAt: .status.finishedAt
          , version: ([ .status.nodes[]?
                        | select(.templateName == \"resolve-version\")
                        | .outputs.parameters[]? | select(.name == \"version\") | .value ] | first)
          , imager: ($SEL) }
        | select(.version != null and (.imager | length) > 0)
      ]
      | sort_by(.finishedAt) | last
      | if . == null then null else { version: .version, imager: .imager } end") \
      || build "前回の run を読めなかった"

    case "$LAST" in ''|null) build "材料の揃った成功 run が無い" ;; esac

    # 今回の run。焼くのはこの凍結 spec なので、比較もこれで行う。
    NOW=$(printf '%s' "$ALL" | jq -c "
      [ .items[] | select(.metadata.name == \"${WORKFLOW_NAME}\") ] | first
      | if . == null then null else { version: \"${VERSION}\", imager: ($SEL) } end") \
      || build "今回の run を読めなかった"

    case "$NOW" in ''|null) build "今回の run を読めなかった" ;; esac
    printf '%s' "$NOW" | jq -e '(.imager | length) > 0' >/dev/null \
      || build "今回の run から imager 入力を取り出せなかった"

    if [ "$LAST" = "$NOW" ]; then
      echo "=> skip: 前回成功した run と版・imager 入力が同じ" >&2
      printf 'false' > /tmp/build.txt
      exit 0
    fi
    build "版か imager 入力が前回と違う"

  push-installer.sh: |
    #!/bin/sh
    set -euo pipefail
    wget -qO /tmp/crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v0.20.7/go-containerregistry_Linux_x86_64.tar.gz"
    tar xzf /tmp/crane.tar.gz -C /tmp crane
    chmod +x /tmp/crane
    export PATH="/tmp:$PATH"
    INSTALLER_TAR=$(find /build -name '*.tar' | head -1)
    echo "=== Pushing SecureBoot installer: ${INSTALLER_TAR} ==="
    crane auth login ghcr.io -u tsuguya -p "${GHCR_TOKEN}"
    crane push "${INSTALLER_TAR}" "ghcr.io/tsuguya-hc/installer:${VERSION}"
    echo "=== Done ==="

  push-iso.sh: |
    #!/bin/sh
    set -euo pipefail
    GITHUB_TOKEN="$(cat /github-token/token)"
    export GITHUB_TOKEN
    export GH_TOKEN="$GITHUB_TOKEN"

    wget -qO /tmp/jq "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64"
    chmod +x /tmp/jq
    wget -qO /tmp/gh.tar.gz "https://github.com/cli/cli/releases/download/v2.74.1/gh_2.74.1_linux_amd64.tar.gz"
    tar xzf /tmp/gh.tar.gz -C /tmp gh_2.74.1_linux_amd64/bin/gh --strip-components=2
    chmod +x /tmp/gh
    export PATH="/tmp:$PATH"

    _apk=/tmp/apk; mkdir -p $_apk/etc/apk; cp -r /etc/apk/keys $_apk/etc/apk/
    apk add --root $_apk --initdb --usermode --no-cache \
      --repositories-file /etc/apk/repositories 7zip > /dev/null
    export PATH="$_apk/usr/bin:$PATH" LD_LIBRARY_PATH="$_apk/usr/lib:$_apk/lib"

    SB_ISO=$(find /build-sb-iso -name '*.iso' | head -1)
    ISO=$(find /build-iso -name '*.iso' | head -1)

    echo "=== Extracting PXE assets from: ${ISO} ==="
    7z x "${ISO}" -o/tmp/pxe boot/vmlinuz boot/initramfs.xz
    mv /tmp/pxe/boot/vmlinuz /tmp/vmlinuz-amd64
    mv /tmp/pxe/boot/initramfs.xz /tmp/initramfs-amd64.xz

    echo "=== Uploading artifacts to GitHub Release ${VERSION} ==="
    gh release upload "${VERSION}" \
      "${SB_ISO}" \
      /tmp/vmlinuz-amd64 \
      /tmp/initramfs-amd64.xz \
      --repo Tsuguya-HC/talos-custom-build \
      --clobber
    echo "=== Done ==="

  finalize-release.sh: |
    #!/bin/sh
    set -euo pipefail
    GH_TOKEN="$(cat /github-token/token)"
    export GH_TOKEN
    wget -qO /tmp/gh.tar.gz "https://github.com/cli/cli/releases/download/v2.74.1/gh_2.74.1_linux_amd64.tar.gz"
    tar xzf /tmp/gh.tar.gz -C /tmp gh_2.74.1_linux_amd64/bin/gh --strip-components=2
    chmod +x /tmp/gh
    export PATH="/tmp:$PATH"

    gh release edit "${VERSION}" \
      --repo Tsuguya-HC/talos-custom-build \
      --prerelease=false \
      --notes "Custom Talos build with UFS + SecureBoot.

    - Talos: ${VERSION}
    - SecureBoot: Signed UKI + auto-enrollment ISO
    - System extensions: iscsi-tools, spin, kata-containers"
    echo "=== Release finalized ==="

apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-build-executor
  namespace: talos-build
automountServiceAccountToken: true
imagePullSecrets:
  - name: dockerhub-pull-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-build-executor
  namespace: talos-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-edit
subjects:
  - kind: ServiceAccount
    name: talos-build-executor
    namespace: talos-build
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: talos-secureboot-build
  namespace: talos-build
spec:
  # ビルドテンプレートは最大3回まで再試行するので、その最悪ケースを収める
  activeDeadlineSeconds: 7200
  # plan-build が見ている前回成功 run は Succeeded の Workflow CR そのものなので、それが GC
  # されると比較できずに焼く側へ倒れる（fail-safe だが機能が空振りする）。実際の変更間隔は
  # 1〜6日・2日が最頻なので、クラスタ既定の secondsAfterSuccess: 86400（24h）だと大半が
  # 比較不能になる。守りたい帯（3日より短い間隔での焼き直し）を十分に覆う 30日に伸ばす。
  # secondsAfterFailure はクラスタ既定のまま——失敗は見えるうちに消えてよい。
  ttlStrategy:
    secondsAfterSuccess: 2592000
  synchronization:
    mutexes:
      - name: talos-secureboot-build
  serviceAccountName: talos-build-executor
  entrypoint: main
  arguments:
    parameters:
      - name: version
  podMetadata:
    labels:
      talos-build: "true"
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: secureboot-keys
      secret:
        secretName: secureboot-signing-keys
    - name: scripts
      configMap:
        name: talos-build-scripts
        defaultMode: 0755
    - name: github-token
      emptyDir: {}
    - name: github-app-secret
      secret:
        secretName: github-app-private-key
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - wn-03
  templates:
    - name: main
      steps:
        - - name: resolve-version
            template: resolve-version
            arguments:
              parameters:
                - name: version
                  value: "{{workflow.parameters.version}}"
        - - name: plan-build
            template: plan-build
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
        # 前回成功した run と入力が同じなら焼かない。`!= 'false'` にしてあるのは、
        # 出力が空や想定外の値になったときも焼く側へ倒すため（`== 'true'` だと
        # 空文字が「skip」と評価されて、何も焼かずに緑で終わる）。
        # finalize-release はゲートしない。`gh release edit` は冪等で、
        # 前回そこだけ落ちていた回をここで拾い直せる。
        - - name: build-and-push-installer
            template: build-and-push-installer
            when: "'{{steps.plan-build.outputs.parameters.build}}' != 'false'"
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
          - name: build-and-push-iso
            template: build-and-push-iso
            when: "'{{steps.plan-build.outputs.parameters.build}}' != 'false'"
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
        - - name: finalize-release
            template: finalize-release
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"

    - name: resolve-version
      retryStrategy:
        limit: 3
        retryPolicy: Always
        backoff:
          duration: 10s
          factor: 2
      inputs:
        parameters:
          - name: version
      outputs:
        parameters:
          - name: version
            valueFrom:
              path: /tmp/version.txt
      volumes:
        - name: tmp
          emptyDir: {}
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
        command: [sh, -c]
        args:
          - |
            set -u
            VERSION="{{inputs.parameters.version}}"
            if [ -z "$VERSION" ]; then
              RESPONSE=$(curl -sf -m 10 https://api.github.com/repos/Tsuguya-HC/talos-custom-build/releases/latest) || {
                echo "ERROR: GitHub API request failed" >&2
                exit 1
              }
              VERSION=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
            fi
            if [ -z "$VERSION" ]; then
              echo "ERROR: could not resolve Talos version (tag_name missing)" >&2
              exit 1
            fi
            echo "Resolved version: $VERSION" >&2
            printf '%s' "$VERSION" > /tmp/version.txt
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    - name: plan-build
      # kubectl は 1 回呼ぶだけで、結果を jq で 2 回（前回 run・今回 run の抽出）使い回して
      # いる。ここでハングすると spec.synchronization.mutexes を握ったまま後続の run を
      # 全部詰まらせるので、workflow 全体の 7200 秒ではなく短い上限を自前で持つ。
      #
      # **クライアント側のタイムアウトはここが代わりに担っている。** `maxDuration` を
      # 設定していないのでこの deadline は 1 試行ごとに効き、kubectl が何をしようと Pod が
      # 60 秒で切られる。kubectl に `--request-timeout` を足してはいけない —— あれは
      # in-cluster 設定の解決を壊し、必ず localhost:8080 へ落ちる（scripts.yaml 側に実測）。
      #
      # apiserver への依存はこのステップで新設したもの。apiserver に到達できないと
      # build 側へ倒れて焼き直すだけで壊れはしないが、retry を使い切って Failed になると
      # build-and-push-* だけでなく finalize-release まで実行されずワークフロー全体が
      # 止まる（`gh release edit` が冪等なので再トリガーで復旧はする）。
      activeDeadlineSeconds: 60
      retryStrategy:
        limit: 3
        retryPolicy: Always
        backoff:
          duration: 10s
          factor: 2
      inputs:
        parameters:
          - name: version
      outputs:
        parameters:
          - name: build
            valueFrom:
              path: /tmp/build.txt
      volumes:
        - name: tmp
          emptyDir: {}
      container:
        image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
        command: [sh, /scripts/plan-build.sh]
        env:
          - name: VERSION
            value: "{{inputs.parameters.version}}"
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          # readOnlyRootFilesystem なので kubectl の既定のキャッシュ先が書けない。
          - name: HOME
            value: /tmp
          - name: KUBECACHEDIR
            value: /tmp/kubecache
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: scripts
            mountPath: /scripts
            readOnly: true
          - name: tmp
            mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    - name: build-and-push-installer
      # ghcr.io からの extension pull が HTTP/2 PROTOCOL_ERROR で落ちることがある。
      # ハングを 30 分で打ち切って（正常時は約 16 分）作り直す。
      activeDeadlineSeconds: 1800
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff:
          duration: 1m
          factor: 2
          maxDuration: 5m
      inputs:
        parameters:
          - name: version
      volumes:
        - name: docker-config
          emptyDir: {}
        - name: build
          emptyDir: {}
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/talos-custom-build"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              GITHUB_TOKEN=$(cat /github-token/token)
              # base64 は 76 文字ごとに改行を入れる。"x-access-token:" + GitHub App トークンは
              # ちょうどその境界付近の長さで、トークンが数文字長いと config.json の文字列リテラルに
              # 改行が混入して imager が "invalid character '\n' in string literal" で落ちる。
              # BusyBox の base64 に -w オプションは無いので tr で除去する。
              AUTH=$(printf '%s:%s' x-access-token "$GITHUB_TOKEN" | base64 | tr -d '\n')
              printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > /docker-config/config.json
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
            - name: github-token
              mountPath: /github-token
              readOnly: true
        - name: build
          image: "ghcr.io/tsuguya-hc/imager:{{inputs.parameters.version}}"
          command: [/bin/imager]
          args:
            - secureboot-installer
            - --arch
            - amd64
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/iscsi-tools
            - ghcr.io/siderolabs/iscsi-tools:v0.2.0@sha256:3a121a4451e746fe50eaee4089429814fdc199ad90758fd11958b3340c70e8f9
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/spin
            - ghcr.io/siderolabs/spin:v0.25.1@sha256:926d24df1d61fd0e9492106f8f11ee94b9cab5da99709b7fbc274f8a9555e937
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/kata-containers
            - ghcr.io/siderolabs/kata-containers:3.32.0@sha256:287e3cee744f3258a98818a5a3370265255d104ecacb4efa0eed38c77de323fa
            - --base-installer-image
            - "ghcr.io/tsuguya-hc/installer-base:{{inputs.parameters.version}}"
            - --extra-kernel-arg
            - "-lockdown"
            - --extra-kernel-arg
            - "lockdown=integrity"
            - --output
            - /build
          env:
            - name: DOCKER_CONFIG
              value: /docker-config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: secureboot-keys
              mountPath: /secureboot
              readOnly: true
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
            - name: build
              mountPath: /build
      container:
        image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command: [sh, /scripts/push-installer.sh]
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
        env:
          - name: VERSION
            value: "{{inputs.parameters.version}}"
          - name: DOCKER_CONFIG
            value: /tmp
          - name: GHCR_TOKEN
            valueFrom:
              secretKeyRef:
                name: ghcr-pat
                key: token
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
            readOnly: true
          - name: build
            mountPath: /build
            readOnly: true

    - name: build-and-push-iso
      # ghcr.io からの extension pull が HTTP/2 PROTOCOL_ERROR で落ちることがある。
      # ハングを 30 分で打ち切って（正常時は約 16 分）作り直す。
      activeDeadlineSeconds: 1800
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff:
          duration: 1m
          factor: 2
          maxDuration: 5m
      inputs:
        parameters:
          - name: version
      volumes:
        - name: docker-config
          emptyDir: {}
        - name: build-sb-iso
          emptyDir: {}
        - name: build-iso
          emptyDir: {}
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/talos-custom-build"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: setup-registry-auth
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: [sh, -c]
          args:
            - |
              GITHUB_TOKEN=$(cat /github-token/token)
              # base64 は 76 文字ごとに改行を入れる。"x-access-token:" + GitHub App トークンは
              # ちょうどその境界付近の長さで、トークンが数文字長いと config.json の文字列リテラルに
              # 改行が混入して imager が "invalid character '\n' in string literal" で落ちる。
              # BusyBox の base64 に -w オプションは無いので tr で除去する。
              AUTH=$(printf '%s:%s' x-access-token "$GITHUB_TOKEN" | base64 | tr -d '\n')
              printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > /docker-config/config.json
          volumeMounts:
            - name: docker-config
              mountPath: /docker-config
            - name: github-token
              mountPath: /github-token
              readOnly: true
        - name: build-secureboot-iso
          image: "ghcr.io/tsuguya-hc/imager:{{inputs.parameters.version}}"
          command: [/bin/imager]
          args:
            - secureboot-iso
            - --arch
            - amd64
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/iscsi-tools
            - ghcr.io/siderolabs/iscsi-tools:v0.2.0@sha256:3a121a4451e746fe50eaee4089429814fdc199ad90758fd11958b3340c70e8f9
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/spin
            - ghcr.io/siderolabs/spin:v0.25.1@sha256:926d24df1d61fd0e9492106f8f11ee94b9cab5da99709b7fbc274f8a9555e937
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/kata-containers
            - ghcr.io/siderolabs/kata-containers:3.32.0@sha256:287e3cee744f3258a98818a5a3370265255d104ecacb4efa0eed38c77de323fa
            - --base-installer-image
            - "ghcr.io/tsuguya-hc/installer-base:{{inputs.parameters.version}}"
            - --extra-kernel-arg
            - "-lockdown"
            - --extra-kernel-arg
            - "lockdown=integrity"
            - --output
            - /build-sb-iso
          env:
            - name: DOCKER_CONFIG
              value: /docker-config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: secureboot-keys
              mountPath: /secureboot
              readOnly: true
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
            - name: build-sb-iso
              mountPath: /build-sb-iso
        - name: build-iso
          image: "ghcr.io/tsuguya-hc/imager:{{inputs.parameters.version}}"
          command: [/bin/imager]
          args:
            - iso
            - --arch
            - amd64
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/iscsi-tools
            - ghcr.io/siderolabs/iscsi-tools:v0.2.0@sha256:3a121a4451e746fe50eaee4089429814fdc199ad90758fd11958b3340c70e8f9
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/spin
            - ghcr.io/siderolabs/spin:v0.25.1@sha256:926d24df1d61fd0e9492106f8f11ee94b9cab5da99709b7fbc274f8a9555e937
            - --system-extension-image
            # renovate: datasource=docker depName=ghcr.io/siderolabs/kata-containers
            - ghcr.io/siderolabs/kata-containers:3.32.0@sha256:287e3cee744f3258a98818a5a3370265255d104ecacb4efa0eed38c77de323fa
            - --base-installer-image
            - "ghcr.io/tsuguya-hc/installer-base:{{inputs.parameters.version}}"
            - --extra-kernel-arg
            - "-lockdown"
            - --extra-kernel-arg
            - "lockdown=integrity"
            - --output
            - /build-iso
          env:
            - name: DOCKER_CONFIG
              value: /docker-config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: secureboot-keys
              mountPath: /secureboot
              readOnly: true
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
            - name: build-iso
              mountPath: /build-iso
      container:
        image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command: [sh, /scripts/push-iso.sh]
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
        env:
          - name: VERSION
            value: "{{inputs.parameters.version}}"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
            readOnly: true
          - name: github-token
            mountPath: /github-token
            readOnly: true
          - name: build-sb-iso
            mountPath: /build-sb-iso
            readOnly: true
          - name: build-iso
            mountPath: /build-iso
            readOnly: true

    - name: finalize-release
      retryStrategy:
        limit: 3
        retryPolicy: Always
        backoff:
          duration: 10s
          factor: 2
      inputs:
        parameters:
          - name: version
      volumes:
        - name: github-token
          emptyDir: {}
        - name: github-app-secret
          secret:
            secretName: github-app-private-key
      initContainers:
        - name: github-auth
          image: registry.infra.tgy.io/tools/argo-tools:latest@sha256:0b658d03cee98b3118622d47d07950b5dc5dd8ef73689bab68ff28c00299f296
          command: [github-auth.sh]
          env:
            - name: GITHUB_APP_ID
              value: "2998228"
            - name: GITHUB_REPO
              value: "Tsuguya-HC/talos-custom-build"
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-app-secret
              mountPath: /github-app
              readOnly: true
            - name: github-token
              mountPath: /github-token
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      container:
        image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        command: [sh, /scripts/finalize-release.sh]
        securityContext:
          runAsUser: 65532
          runAsNonRoot: true
        env:
          - name: VERSION
            value: "{{inputs.parameters.version}}"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
            readOnly: true
          - name: github-token
            mountPath: /github-token
            readOnly: true

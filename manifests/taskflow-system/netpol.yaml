apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: taskflow-controller
  namespace: taskflow-system
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: taskflow
  ingress:
    # kubelet の liveness / readiness probe（:8081）
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # apiserver からの admission リクエスト（:9443）。TaskFlow の構造検査 webhook は
    # failurePolicy: Fail なので、ここが開いていないと apiserver が webhook に届かず
    # **TaskFlow の作成・更新が全部拒否される**（ArgoCD の sync が通らなくなる）。
    #
    # kube-apiserver / host / remote-node の 3 つを並べるのは、このクラスタの他の
    # admission webhook（kyverno / cnpg / spin-operator、いずれも 9443）と同じ書き方に
    # 揃えているため。
    #
    # **この 3 つのうち実際に届くのは remote-node だけ**（2026-09-07 実測、taskflow #107）。
    # kube-apiserver だけに絞ると drop されて書き込みが落ちる。remote-node が
    # この行を支えていて、kube-apiserver はその部分集合（hostNetwork の apiserver が
    # CP ノードの cilium_host に SNAT され、kube-apiserver ラベルが落ちる）。
    # 絞って測るときは Pod を入れ替えて接続を張り直させること。apiserver の
    # 張り済み TCP はそのまま通り続けるので、絞った直後に通っても許可の証拠にならない。
    # `host` は Pod が CP に乗る場合のための行だが、CP には control-plane taint があり
    # このコントローラに toleration が無いので現状は効いていない。
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Prometheus からの metrics スクレイプ（:8443、HTTPS + authn/authz）。
    # ここを開けないと ServiceMonitor があっても取れない。
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    # コントローラが話す相手は apiserver だけ。Job を作り、Pod の status を読むのみで、
    # ワークスペースにも store にも触らない（設計 §6「2 ホップ」）。DNS は CCNP で共通適用済み。
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

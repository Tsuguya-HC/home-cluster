apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    # レジストリへの egress は要らない。イメージを引くのは scan job
    # (netpol-trivy-scan-jobs) で、operator 自身はレジストリに出ない
    # （2026-09-20 実測: `cilium-dbg endpoint get <id>` の
    # allowed-egress-identities が null）。
    #
    # **推測でレジストリの FQDN を足さないこと。** 2026-02 に「digest 解決に要る」
    # という推測で 10 ホスト足され、うち 1 つは CDN 名を綴り誤ったまま
    # 7 か月気づかれなかった（#947）。綴り誤りは kubeconform も CI も緑で通る。
    # 本当に要るなら `hubble observe --verdict DROPPED` に出るので、そこで実測してから足す。
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: trivy-server
      toPorts:
        - ports:
            - port: "4954"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
